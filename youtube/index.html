<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--surface:#181818;--surface2:#272727;--text:#f1f1f1;--muted:#aaa;--line:#303030;--red:#f03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,"Noto Sans JP",sans-serif}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #8ab4f8;outline-offset:2px}
.top{height:60px;position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:20px;padding:0 20px}.brand{display:flex;align-items:center;gap:8px;min-width:200px;font-size:20px;font-weight:800;letter-spacing:-.7px}.ytlogo{background:var(--red);width:31px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}.round{border:0;background:transparent;border-radius:50%;width:40px;height:40px;font-size:20px}.round:hover,.nav:hover{background:var(--surface2)}.search{display:flex;flex:1;max-width:650px;margin:auto}.search input{flex:1;min-width:0;height:40px;border:1px solid #333;background:#121212;border-radius:22px 0 0 22px;padding:0 18px;color:#fff}.search button{width:65px;border:1px solid #333;border-left:0;border-radius:0 22px 22px 0;background:#222;font-size:18px}.topright{display:flex;align-items:center;gap:10px}.pill{border:0;background:var(--surface2);border-radius:20px;padding:10px 15px;font-weight:700}.avatar{width:35px;height:35px;border:0;border-radius:50%;display:grid;place-items:center;background:#7e57c2;color:#fff;font-weight:700;font-size:16px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.shell{display:flex}.sidebar{position:fixed;top:60px;bottom:0;left:0;width:230px;overflow:auto;padding:12px 12px 24px;background:var(--bg);z-index:5}.nav{display:flex;align-items:center;gap:22px;padding:11px 14px;border-radius:10px;margin-bottom:3px;color:var(--text);text-decoration:none;cursor:pointer}.nav.active{background:var(--surface2);font-weight:700}.navicon{width:22px;text-align:center;font-size:20px}.sep{border:0;border-top:1px solid var(--line);margin:13px 4px}.navheading{font-weight:700;padding:9px 14px}.main{margin-left:230px;width:calc(100% - 230px);padding:18px 24px 45px}.chips{display:flex;gap:10px;overflow:auto;padding:0 0 22px;scrollbar-width:none}.chip{white-space:nowrap;border:0;border-radius:8px;background:#272727;padding:8px 13px;font-weight:600}.chip.active{background:#f1f1f1;color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px}.card{min-width:0;cursor:pointer}.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;background:#272727;overflow:hidden;display:grid;place-items:center}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb .fileicon{font-size:48px}.duration{position:absolute;right:7px;bottom:7px;background:#000c;border-radius:4px;padding:2px 5px;font-size:12px}.meta{display:flex;gap:12px;padding-top:12px}.chavatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#393939;display:grid;place-items:center;overflow:hidden;font-size:17px}.chavatar img{width:100%;height:100%;object-fit:cover}.details{min-width:0;flex:1}.vtitle{font-size:15px;font-weight:700;line-height:1.4;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.channelname,.stats{color:var(--muted);font-size:13px}.more{border:0;background:none;color:var(--muted);font-size:20px;align-self:flex-start}.empty{padding:90px 18px;text-align:center;color:var(--muted)}.empty .big{font-size:42px;margin-bottom:14px}.empty h2{font-size:20px;color:var(--text);margin:0 0 8px}.empty p{max-width:520px;margin:0 auto 18px}.pagehead{display:flex;align-items:center;gap:20px;margin:6px 0 25px}.pagehead h1{font-size:25px;margin:0}.profilehero{display:flex;align-items:center;gap:20px;margin:12px 0 25px}.profilebig{width:112px;height:112px;border-radius:50%;background:#6750a4;display:grid;place-items:center;font-size:40px;overflow:hidden;flex:0 0 auto}.profilebig img{width:100%;height:100%;object-fit:cover}.profilehero h1{margin:0 0 6px;font-size:26px}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.primary{background:#f1f1f1;color:#111;border:0;border-radius:22px;padding:10px 17px;font-weight:700}.secondary{background:var(--surface2);border:0;border-radius:22px;padding:10px 17px;font-weight:700}.modalbg{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modalbg.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#212121;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:21px;margin:0}.close{border:0;background:transparent;font-size:26px;border-radius:50%;width:38px;height:38px}.field{display:block;margin:14px 0}.field span{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #555;background:#121212;color:#fff;border-radius:9px;padding:11px}.field textarea{min-height:90px;resize:vertical}.hint{color:var(--muted);font-size:12px}.modalbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.playerbg{position:fixed;inset:0;background:#000e;z-index:25;display:none;overflow:auto;padding:25px}.playerbg.show{display:block}.watch{max-width:1100px;margin:0 auto}.watchtop{display:flex;justify-content:flex-end;margin-bottom:10px}.watchvideo{width:100%;max-height:70vh;background:#000;border-radius:12px}.watchtitle{font-size:22px;margin:16px 0 8px}.watchmeta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.watchchannel{display:flex;align-items:center;gap:12px}.description{background:#222;border-radius:12px;padding:14px;margin-top:18px;white-space:pre-wrap}.librarytabs{display:flex;gap:10px;overflow:auto;margin:18px 0 25px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#eee;color:#111;border-radius:10px;padding:12px 18px;z-index:50;display:none;box-shadow:0 5px 30px #0008}.toast.show{display:block}.smallnote{font-size:12px;color:#888;margin-top:30px}
@media(max-width:1150px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:78px}.nav{justify-content:center;padding:13px 4px;flex-direction:column;gap:3px;font-size:10px}.nav span:last-child,.navheading,.sep{display:none}.main{margin-left:78px;width:calc(100% - 78px)}.brand{min-width:auto}.brandtext{display:none}}
@media(max-width:650px){.top{height:56px;padding:0 9px;gap:9px}.brand{min-width:auto}.brandtext{display:inline;font-size:17px}.ytlogo{width:27px;height:20px}.search{margin:0}.search input{padding:0 10px}.search button{width:42px}.top .round{display:none}.topright{gap:4px}.topright .pill{padding:9px;font-size:12px}.sidebar{top:56px;width:100%;height:65px;bottom:auto;display:flex;overflow-x:auto;padding:4px 7px;background:var(--bg)}.nav{flex:0 0 63px;padding:4px 2px;margin:0;font-size:10px}.main{margin:121px 0 0;width:100%;padding:13px 12px 30px}.grid{grid-template-columns:1fr;gap:26px}.thumb{border-radius:10px}.profilehero{align-items:flex-start}.profilebig{width:76px;height:76px;font-size:30px}.profilehero h1{font-size:22px}.playerbg{padding:8px}.watchvideo{margin-top:20px}.watchtitle{font-size:19px}}
</style>
</head>
<body>
<header class="top">
 <button class="round" id="menuBtn" aria-label="メニュー">☰</button>
 <div class="brand"><span class="ytlogo">▶</span><span class="brandtext">YouTube</span></div>
 <form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="検索" aria-label="検索"><button aria-label="検索">⌕</button></form>
 <div class="topright"><button class="pill" id="createBtn">＋ 作成</button><button class="round" id="notificationsBtn" aria-label="通知">🔔</button><button class="round" id="profileBtn" aria-label="プロフィール">♙</button><button class="avatar" id="avatarBtn" aria-label="チャンネルプロフィール">T</button></div>
</header>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <a class="nav active" data-page="home"><span class="navicon">🏠</span><span>ホーム</span></a>
 <a class="nav" data-page="shorts"><span class="navicon">🎬</span><span>ショート</span></a>
 <a class="nav" data-page="subscriptions"><span class="navicon">📺</span><span>登録チャンネル</span></a>
 <hr class="sep">
 <div class="navheading">👤 自分のページ　›</div>
 <a class="nav" data-page="history"><span class="navicon">🕘</span><span>履歴</span></a>
 <a class="nav" data-page="playlists"><span class="navicon">📚</span><span>再生リスト</span></a>
 <a class="nav" data-page="watchlater"><span class="navicon">⏰</span><span>後で見る</span></a>
 <a class="nav" data-page="liked"><span class="navicon">👍</span><span>高く評価した動画</span></a>
 <hr class="sep">
 <hr class="sep"><div class="navheading">探索</div><a class="nav" data-explore="人気"><span class="navicon">🔥</span><span>人気</span></a><a class="nav" data-explore="音楽"><span class="navicon">🎵</span><span>音楽</span></a><a class="nav" data-explore="ゲーム"><span class="navicon">🎮</span><span>ゲーム</span></a><a class="nav" data-explore="ニュース"><span class="navicon">📰</span><span>ニュース</span></a><a class="nav" data-explore="スポーツ"><span class="navicon">⚽</span><span>スポーツ</span></a><a class="nav" data-explore="ライブ"><span class="navicon">🔴</span><span>ライブ</span></a><a class="nav" data-page="channel"><span class="navicon">👤</span><span>マイチャンネル</span></a>
 <a class="nav" data-page="library"><span class="navicon">🗂️</span><span>ライブラリ</span></a><a class="nav" data-page="posts"><span class="navicon">✍️</span><span>投稿</span></a>
</aside>
<main class="main" id="main"></main>
</div>
<div class="modalbg" id="modalBg"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2 id="modalTitle">作成</h2><button class="close" id="modalClose">×</button></div><div id="modalBody"></div><div class="modalbuttons" id="modalButtons"></div></section></div>
<div class="playerbg" id="playerBg"><div class="watch"><div class="watchtop"><button class="round" id="watchClose">✕</button></div><video class="watchvideo" id="watchVideo" controls playsinline></video><h1 class="watchtitle" id="watchTitle"></h1><div class="watchmeta"><div class="watchchannel" id="watchChannel"></div><div class="actions"><button class="secondary" id="likeBtn">♡ 高く評価</button><button class="secondary" id="laterBtn">◷ 後で見る</button></div></div><div class="description" id="watchDescription"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME="youtube_local_app",DB_VERSION=1,STORE="videos";
let db=null, currentPage="home", category="すべて", query="", currentVideoId=null, toastTimer=null;
const $=id=>document.getElementById(id);
const state={posts:[],notifications:[],channel:{name:"マイチャンネル",handle:"@mychannel",description:"チャンネルの説明を追加しましょう。",avatar:"",created:false},videos:[],history:[],watchlater:[],liked:[],playlists:[]};
function loadState(){try{const s=JSON.parse(localStorage.getItem("yt_local_state")||"{}");Object.assign(state,s);state.channel=Object.assign({name:"マイチャンネル",handle:"@mychannel",description:"チャンネルの説明を追加しましょう。",avatar:"",created:false},state.channel||{});for(const k of ["videos","posts","notifications","history","watchlater","liked","playlists"])if(!Array.isArray(state[k]))state[k]=[]}catch(e){}}
function saveState(){localStorage.setItem("yt_local_state",JSON.stringify(state))}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function dbPut(video){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(video);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function dbGet(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbDelete(id){return new Promise(resolve=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=resolve})}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
function avatarHTML(size="chavatar"){return `<div class="${size}">${state.channel.avatar?`<img src="${esc(state.channel.avatar)}" alt="">`:esc((state.channel.name||"T").trim().charAt(0)||"T")}</div>`}
function getVideo(id){return state.videos.find(v=>v.id===id)}
function setPage(page){currentPage=page;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));render()}
function navTitle(page){return ({home:"ホーム",shorts:"ショート",subscriptions:"登録チャンネル",history:"履歴",playlists:"再生リスト",watchlater:"後で見る",liked:"高く評価した動画",channel:"マイチャンネル",library:"ライブラリ",explore:"探索",live:"ライブ配信",posts:"投稿"})[page]||"YouTube"}
function card(v){const thumb=v.thumb?`<img src="${esc(v.thumb)}" alt="">`:`<span class="fileicon">▶</span>`;return `<article class="card" tabindex="0" role="button" data-video="${esc(v.id)}"><div class="thumb">${thumb}${v.duration?`<span class="duration">${esc(v.duration)}</span>`:""}</div><div class="meta">${avatarHTML("chavatar")}<div class="details"><h3 class="vtitle">${esc(v.title)}</h3><div class="channelname">${esc(v.channelName||state.channel.name)}</div><div class="stats">${Number(v.views||0).toLocaleString()} 回視聴 ・ ${esc(v.date||"たった今")}</div></div><button class="more" data-more="${esc(v.id)}" aria-label="その他">⋮</button></div></article>`}
function empty(title,description,button="動画をアップロード"){return `<div class="empty"><div class="big">▣</div><h2>${esc(title)}</h2><p>${esc(description)}</p>${button?`<button class="primary" id="emptyAction">${esc(button)}</button>`:""}</div>`}
function render(){
 const main=$("main");let list=state.videos.slice().sort((a,b)=>b.createdAt-a.createdAt);const q=query.trim().toLowerCase();
 if(q)list=list.filter(v=>(v.title+" "+v.description+" "+v.channelName).toLowerCase().includes(q));
 if(currentPage==="history")list=state.history.map(getVideo).filter(Boolean).map(v=>v);
 else if(currentPage==="watchlater")list=state.watchlater.map(getVideo).filter(Boolean);
 else if(currentPage==="liked")list=state.liked.map(getVideo).filter(Boolean);
 else if(currentPage==="subscriptions")list=state.videos.filter(v=>v.channelName===state.channel.name);
 else if(currentPage==="shorts")list=list.filter(v=>v.isShort);
 else if(currentPage==="playlists"){main.innerHTML=`<div class="pagehead"><h1>再生リスト</h1><button class="secondary" id="newPlaylist">＋ 新しい再生リスト</button></div>${state.playlists.length?state.playlists.map(p=>`<div class="pagehead"><div><h2>${esc(p.name)}</h2><div class="muted">${p.ids.length} 本の動画</div></div><button class="secondary" data-playlist="${esc(p.id)}">開く</button></div>`).join(""):empty("再生リストはありません","動画をまとめる再生リストを作成できます。","再生リストを作成")}`;bindMain();return}
 else if(currentPage==="channel"){renderChannel(main);bindMain();return}
 else if(currentPage==="library"){main.innerHTML=`<div class="pagehead"><h1>ライブラリ</h1></div><div class="librarytabs"><button class="secondary" data-goto="history">◷ 履歴 (${state.history.length})</button><button class="secondary" data-goto="watchlater">後で見る (${state.watchlater.length})</button><button class="secondary" data-goto="liked">高く評価 (${state.liked.length})</button><button class="secondary" data-goto="playlists">再生リスト (${state.playlists.length})</button></div><p class="muted">この端末に保存された履歴・リストを管理できます。</p>`;bindMain();return}
 if(currentPage==="home"){main.innerHTML=`<div class="chips">${["すべて","音楽","ゲーム","ライブ","ニュース","スポーツ","学習","テクノロジー","料理","旅行","コメディ","映画とアニメ","科学と技術","ペット","美容","ファッション","自動車","ビジネス","健康","自然","キッズ"].map(c=>`<button class="chip ${category===c?"active":""}" data-category="${c}">${c}</button>`).join("")}</div><section class="grid">${list.filter(v=>category==="すべて"||v.category===category).map(card).join("")}</section>${list.filter(v=>category==="すべて"||v.category===category).length?"":empty("動画はまだありません","動画をアップロードすると、ここに表示されます。","動画をアップロード")}`}
 else {main.innerHTML=`<div class="pagehead"><h1>${navTitle(currentPage)}</h1>${currentPage==="history"?`<button class="secondary" id="clearHistory">履歴を削除</button>`:""}</div><section class="grid">${list.map(card).join("")}</section>${list.length?"":empty(currentPage==="watchlater"?"後で見る動画はありません":currentPage==="liked"?"高く評価した動画はありません":currentPage==="subscriptions"?"登録チャンネルの動画はありません":currentPage==="shorts"?"ショート動画はありません":"履歴はありません","動画を視聴したり、保存したりすると、ここに表示されます。",currentPage==="subscriptions"?"チャンネルを開く": "")}`}
 bindMain()
}
function renderChannel(main){const mine=state.videos.filter(v=>v.channelName===state.channel.name);main.innerHTML=`<div class="profilehero">${state.channel.avatar?`<div class="profilebig"><img src="${esc(state.channel.avatar)}" alt=""></div>`:`<div class="profilebig">${esc(state.channel.name.trim().charAt(0)||"T")}</div>`}<div><h1>${esc(state.channel.name)}</h1><div class="muted">${esc(state.channel.handle)} ・ 登録者 ${state.channel.created?1:0} 人 ・ ${mine.length} 本の動画</div><p class="muted">${esc(state.channel.description)}</p><div class="actions"><button class="primary" id="editProfile">チャンネルをカスタマイズ</button><button class="secondary" id="profileUpload">動画をアップロード</button></div></div></div><hr class="sep"><div class="pagehead"><h1>動画</h1></div><section class="grid">${mine.map(card).join("")}</section>${mine.length?"":empty("動画がありません","投稿した動画はここに表示されます。","動画をアップロード")}` }
function bindMain(){
 $("main").querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});
 $("main").querySelectorAll("[data-video]").forEach(el=>{el.onclick=e=>{if(e.target.closest("[data-more]")){e.stopPropagation();showVideoMenu(el.dataset.video);return}watch(el.dataset.video)};el.onkeydown=e=>{if(e.key==="Enter")watch(el.dataset.video)}});
 $("main").querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
 const emptyAction=$("emptyAction");if(emptyAction)emptyAction.onclick=()=>currentPage==="playlists"?newPlaylist():openUpload();
 ["createBtn","profileUpload"].forEach(x=>{const el=$(x);if(el)el.onclick=openUpload});
 const edit=$("editProfile");if(edit)edit.onclick=editChannel;
 const np=$("newPlaylist");if(np)np.onclick=newPlaylist;
 const clear=$("clearHistory");if(clear)clear.onclick=()=>{state.history=[];saveState();render()};
 $("main").querySelectorAll("[data-playlist]").forEach(b=>b.onclick=()=>{const p=state.playlists.find(p=>p.id===b.dataset.playlist);if(!p)return;const vids=p.ids.map(getVideo).filter(Boolean);$("main").innerHTML=`<div class="pagehead"><button class="round" id="backPlaylists">←</button><h1>${esc(p.name)}</h1></div><section class="grid">${vids.map(card).join("")}</section>${vids.length?"":empty("この再生リストは空です","動画メニューから追加できます。","")}`;bindMain();$("backPlaylists").onclick=()=>setPage("playlists")});
}
function modalOpen(title,body,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modalButtons").innerHTML=buttons;$("modalBg").classList.add("show")}
function modalClose(){$("modalBg").classList.remove("show")}
$("modalClose").onclick=modalClose;$("modalBg").addEventListener("click",e=>{if(e.target===$("modalBg"))modalClose()});
function openUpload(){modalOpen("動画をアップロード",`<form id="uploadForm"><label class="field"><span>動画ファイル</span><input type="file" id="videoFile" accept="video/*" required><small class="hint">選んだ動画はこの端末のブラウザ内に保存されます。公開サイトへは送信されません。</small></label><label class="field"><span>タイトル</span><input id="uploadTitle" maxlength="100" required placeholder="動画のタイトル"></label><label class="field"><span>説明</span><textarea id="uploadDesc" maxlength="5000" placeholder="動画について説明しましょう"></textarea></label><label class="field"><span>サムネイル画像（任意）</span><input type="file" id="thumbFile" accept="image/*"></label><label class="field"><span>カテゴリ</span><select id="uploadCategory"><option>すべて</option><option>ゲーム</option><option>音楽</option><option>テクノロジー</option><option>学習</option><option>エンタメ</option></select></label></form>`,`<button class="secondary" id="cancelModal">キャンセル</button><button class="primary" id="publishBtn">投稿する</button>`);$("cancelModal").onclick=modalClose;$("publishBtn").onclick=publishVideo}
async function publishVideo(){const file=$("videoFile").files[0];if(!file){toast("動画ファイルを選択してください");return}if(!file.type.startsWith("video/")){toast("動画ファイルを選択してください");return}const title=$("uploadTitle").value.trim();if(!title){toast("タイトルを入力してください");return}const thumbFile=$("thumbFile").files[0];let thumb="";if(thumbFile){if(thumbFile.size>2*1024*1024){toast("サムネイルは2MB以下にしてください");return}thumb=await fileToDataURL(thumbFile)}

 if(topRight&&!$("modeToggle")){const b=document.createElement("button");b.className="pill";b.id="modeToggle";b.textContent="📱 モバイル";topRight.insertBefore(b,$("createBtn"));b.onclick=()=>{const mobile=!document.body.classList.contains("mobile-forced");document.body.classList.toggle("mobile-forced",mobile);b.textContent=mobile?"🖥️ PCモード":"📱 モバイル";localStorage.setItem("yt_display_mode",mobile?"mobile":"pc");toast(mobile?"モバイル表示に切り替えました":"PC表示に切り替えました")};if(localStorage.getItem("yt_display_mode")==="mobile"){document.body.classList.add("mobile-forced");b.textContent="🖥️ PCモード"}}
 const sidebar=$("sidebar");
 if(sidebar&&!sidebar.querySelector('[data-page="analytics"]')){const a=document.createElement("a");a.className="nav";a.dataset.page="analytics";a.innerHTML='<span class="navicon">📊</span><span>チャンネル分析</span>';sidebar.appendChild(a)}
 const watch=$("watchDescription");
 if(watch&&!$("watchActionsExtra")){const box=document.createElement("div");box.id="watchActionsExtra";box.className="watchactions";box.innerHTML='<button class="secondary" id="dislikeBtn">👎 低く評価</button><button class="secondary" id="shareBtn">🔗 共有</button><button class="secondary" id="loopBtn">🔁 ループ OFF</button><button class="secondary" id="saveBtn">📥 保存</button>';watch.after(box);
  const comments=document.createElement("section");comments.id="commentsPanel";comments.className="commentpanel";comments.innerHTML='<h2 id="commentCount">💬 コメント</h2><form class="commentform" id="commentForm"><input id="commentInput" maxlength="1000" placeholder="コメントを追加..." aria-label="コメント"><button class="primary">コメント</button></form><div id="commentsList"></div>';box.after(comments);
  $("dislikeBtn").onclick=()=>{if(!currentVideoId)return;toggleEngagement("disliked",currentVideoId);renderComments();syncExtraButtons()};
  $("shareBtn").onclick=async()=>{if(!currentVideoId)return;const url=location.href.split("#")[0]+"#video="+encodeURIComponent(currentVideoId);try{if(navigator.share)await navigator.share({title:getVideo(currentVideoId)?.title||"YouTube",url});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);toast("共有リンクをコピーしました")}else{prompt("共有リンクをコピーしてください",url)}}catch(e){}};
  $("loopBtn").onclick=()=>{const v=$("watchVideo");v.loop=!v.loop;$("loopBtn").textContent=v.loop?"🔁 ループ ON":"🔁 ループ OFF";toast(v.loop?"ループ再生をオンにしました":"ループ再生をオフにしました")};
  $("saveBtn").onclick=()=>{if(!currentVideoId)return;const v=getVideo(currentVideoId);if(!v)return;try{const a=document.createElement("a");a.href=$("watchVideo").src;a.download=(v.title||"video").replace(/[\\/:*?"<>|]/g,"_")+".mp4";a.click();toast("保存を開始しました（ブラウザの制限により失敗する場合があります）")}catch(e){toast("この動画を保存できませんでした")}};
  $("commentForm").onsubmit=e=>{e.preventDefault();if(!currentVideoId)return;const text=$("commentInput").value.trim();if(!text)return;state.comments=state.comments||{};state.comments[currentVideoId]=state.comments[currentVideoId]||[];state.comments[currentVideoId].unshift({id:id(),author:state.channel.name,handle:state.channel.handle,text,likes:0,dislikes:0,replies:[],ai:false,date:"たった今"});$("commentInput").value="";saveState();renderComments();toast("コメントを追加しました")};
 }
 const priorLoad=loadState;
 loadState=function(){priorLoad();state.disliked=Array.isArray(state.disliked)?state.disliked:[];state.comments=state.comments&&typeof state.comments==="object"?state.comments:{};state.aiAccounts=Array.isArray(state.aiAccounts)?state.aiAccounts:[];state.aiEvents=Array.isArray(state.aiEvents)?state.aiEvents:[];if(!state.aiAccounts.length){state.aiAccounts=[{name:"ゲーム好きのユウ",handle:"@yu_gamer",avatar:"🎮"},{name:"音楽のある暮らし",handle:"@music_days",avatar:"🎧"},{name:"ねこ動画研究所",handle:"@cat_lab",avatar:"🐱"},{name:"テック観察日記",handle:"@tech_watch",avatar:"🤖"},{name:"毎日ショート",handle:"@daily_short",avatar:"✨"},{name:"のんびり視聴者",handle:"@slow_viewer",avatar:"🌱"}];saveState()}};
 loadState();
 const priorRender=render;
 render=function(){if(currentPage==="analytics"){renderAnalytics();return}priorRender()};
 function toggleEngagement(key,vid){state[key]=Array.isArray(state[key])?state[key]:[];const i=state[key].indexOf(vid);if(i>=0)state[key].splice(i,1);else{state[key]=state[key].filter(x=>x!==vid);state[key].unshift(vid)}saveState();toast(i>=0?"評価を取り消しました":key==="disliked"?"低く評価しました":"高く評価しました")}
 function syncExtraButtons(){if(!currentVideoId)return;$("dislikeBtn").classList.toggle("primary",(state.disliked||[]).includes(currentVideoId));$("dislikeBtn").textContent=(state.disliked||[]).includes(currentVideoId)?"👎 低評価済み":"👎 低く評価"}
 function renderComments(){if(!currentVideoId||!$("commentsList"))return;const arr=(state.comments||{})[currentVideoId]||[];$("commentCount").textContent="💬 コメント "+arr.length; $("commentsList").innerHTML=arr.map(c=>'<div class="comment"><div class="chavatar">'+esc(c.ai?(c.avatar||"🤖"):(c.author||"👤").slice(0,1))+'</div><div class="commentbody"><strong>'+esc(c.author||"ユーザー")+'</strong><span class="muted"> '+esc(c.handle||"")+'</span>'+(c.ai?'<span class="ai-badge">AIアカウント</span>':"")+'<p>'+esc(c.text)+'</p><div class="commenttools"><button data-clike="'+esc(c.id)+'">👍 '+Number(c.likes||0)+'</button><button data-cdislike="'+esc(c.id)+'">👎 '+Number(c.dislikes||0)+'</button><button data-reply="'+esc(c.id)+'">↩️ 返信</button></div>'+(c.replies||[]).map(r=>'<div class="comment"><div class="chavatar">↳</div><div class="commentbody"><strong>'+esc(r.author)+'</strong><p>'+esc(r.text)+'</p></div></div>').join("")+'</div></div>').join("")||'<p class="muted">まだコメントはありません。最初のコメントを書いてみよう！</p>';
  $("commentsList").querySelectorAll("[data-clike]").forEach(b=>b.onclick=()=>changeComment(b.dataset.clike,"likes"));$("commentsList").querySelectorAll("[data-cdislike]").forEach(b=>b.onclick=()=>changeComment(b.dataset.cdislike,"dislikes"));$("commentsList").querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>{const t=prompt("返信を入力してください");if(!t||!t.trim())return;const c=arr.find(x=>x.id===b.dataset.reply);if(c){c.replies=c.replies||[];c.replies.push({author:state.channel.name,text:t.trim()});saveState();renderComments()}})}
 function changeComment(cid,key){const arr=state.comments[currentVideoId]||[];const c=arr.find(x=>x.id===cid);if(c){c[key]=(c[key]||0)+1;saveState();renderComments()}}
 const priorWatch=watch;
 watch=async function(vid){await priorWatch(vid);if(currentVideoId){renderComments();syncExtraButtons();const v=$("watchVideo");$("loopBtn").textContent=v.loop?"🔁 ループ ON":"🔁 ループ OFF"}};
 function renderAnalytics(){const mine=state.videos.filter(v=>v.channelName===state.channel.name);const views=mine.reduce((n,v)=>n+Number(v.views||0),0);const likes=mine.reduce((n,v)=>n+(state.liked.includes(v.id)?1:0),0);const dislikes=(state.disliked||[]).filter(id=>mine.some(v=>v.id===id)).length;const comments=mine.reduce((n,v)=>n+(((state.comments||{})[v.id]||[]).length),0);const max=Math.max(1,...mine.map(v=>Number(v.views||0)));$("main").innerHTML='<div class="pagehead"><h1>📊 チャンネル アナリティクス</h1><button class="secondary" id="analyticsBack">← チャンネルへ</button></div><p class="muted">このブラウザ内で記録された数値です。実際のYouTube Studioのデータではありません。</p><div class="analyticsgrid"><div class="metric">視聴回数<strong>'+views.toLocaleString()+'</strong></div><div class="metric">投稿動画<strong>'+mine.length+'</strong></div><div class="metric">コメント数<strong>'+comments+'</strong></div><div class="metric">高評価（自分の評価）<strong>'+likes+'</strong></div><div class="metric">低評価（自分の評価）<strong>'+dislikes+'</strong></div><div class="metric">AIアカウント<strong>'+state.aiAccounts.length+'</strong></div></div><div class="chartbox"><h2>動画ごとの視聴回数</h2>'+(mine.length?mine.map(v=>'<div class="barrow"><span>'+esc(v.title.slice(0,25))+'</span><div class="bar"><span style="width:'+Math.max(2,Number(v.views||0)/max*100)+'%"></span></div><strong>'+Number(v.views||0)+'</strong></div>').join(""):'<p class="muted">動画を投稿すると、ここに分析が表示されます。</p>')+'</div><div class="chartbox"><h2>AIアカウントの最近の活動</h2>'+(state.aiEvents.length?state.aiEvents.slice(0,12).map(e=>'<p>🤖 '+esc(e.text)+' <span class="muted">'+esc(e.date)+'</span></p>').join(""):'<p class="muted">動画を投稿すると、AIアカウントが視聴・評価・コメントすることがあります。</p>')+'</div>'; $("analyticsBack").onclick=()=>setPage("channel")}
 function aiActivity(){if(!state.videos.length)return;const v=state.videos[Math.floor(Math.random()*state.videos.length)];const ai=state.aiAccounts[Math.floor(Math.random()*state.aiAccounts.length)];if(!v||!ai)return;const action=Math.random();if(action<.48){v.views=(v.views||0)+1;logAI(ai.name+" が「"+v.title+"」を視聴")}else if(action<.70){if(!state.liked.includes(v.id)&&!state.disliked.includes(v.id))state.liked.push(v.id);logAI(ai.name+" が「"+v.title+"」を高評価")}else if(action<.80){if(!state.disliked.includes(v.id)&&!state.liked.includes(v.id))state.disliked.push(v.id);logAI(ai.name+" が「"+v.title+"」を低評価")}else{const texts=["この動画おもしろい！","次の動画も楽しみにしています！","編集がいいですね👏","これは知らなかった！","最後まで見ちゃった！","おすすめに出てきたので見ました！","いい情報ありがとう！","このチャンネル応援してます！"];state.comments[v.id]=state.comments[v.id]||[];if(!state.comments[v.id].some(c=>c.ai&&c.author===ai.name)){state.comments[v.id].unshift({id:id(),author:ai.name,handle:ai.handle,avatar:ai.avatar,text:texts[Math.floor(Math.random()*texts.length)],likes:Math.floor(Math.random()*4),dislikes:0,replies:[],ai:true,date:new Date().toLocaleString("ja-JP")});logAI(ai.name+" が「"+v.title+"」にコメント")}}saveState();if(currentPage==="analytics")renderAnalytics();if(currentVideoId===v.id)renderComments()}
 function logAI(text){state.aiEvents.unshift({text,date:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})});state.aiEvents=state.aiEvents.slice(0,100)}
 const nav=sidebar; if(nav)nav.addEventListener("click",e=>{const a=e.target.closest('[data-page="analytics"]');if(a){e.preventDefault();setPage("analytics")}});
 setInterval(aiActivity,18000);
 window.addEventListener("hashchange",()=>{const m=location.hash.match(/video=([^&]+)/);if(m)watch(decodeURIComponent(m[1]))});
 if(location.hash.includes("video=")){const m=location.hash.match(/video=([^&]+)/);if(m)setTimeout(()=>watch(decodeURIComponent(m[1])),700)}
})();

</script>
