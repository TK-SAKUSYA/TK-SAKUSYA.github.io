const state={posts:[],notifications:[],channel:{name:"マイチャンネル",handle:"@mychannel",description:"チャンネルの説明を追加しましょう。",avatar:"",created:false},videos:[],history:[],watchlater:[],liked:[],playlists:[]};
function loadState(){try{const s=JSON.parse(localStorage.getItem("yt_local_state")||"{}");Object.assign(state,s);state.channel=Object.assign({name:"マイチャンネル",handle:"@mychannel",description:"チャンネルの説明を追加しましょう。",avatar:"",created:false},state.channel||{});for(const k of ["videos","posts","notifications","history","watchlater","liked","playlists"])if(!Array.isArray(state[k]))state[k]=[]}catch(e){}}
function saveState(){localStorage.setItem("yt_local_state",JSON.stringify(state))}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function dbPut(video){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(video);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function dbGet(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbDelete(id){return new Promise(resolve=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=resolve})}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hashtagHTML(s=""){return esc(s).replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu,'$1<a class="hashtag" href="#" data-hashtag="$2">$2</a>')}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
function avatarHTML(size="chavatar"){return `<div class="${size}">${state.channel.avatar?`<img src="${esc(state.channel.avatar)}" alt="">`:esc((state.channel.name||"T").trim().charAt(0)||"T")}</div>`}
function getVideo(id){return state.videos.find(v=>v.id===id)}
function setPage(page){currentPage=page;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));render()}
function navTitle(page){return ({home:"ホーム",shorts:"ショート",subscriptions:"登録チャンネル",history:"履歴",playlists:"再生リスト",watchlater:"後で見る",liked:"高く評価した動画",channel:"マイチャンネル",library:"ライブラリ",explore:"探索",live:"ライブ配信",posts:"投稿"})[page]||"YouTube"}
function card(v){const thumb=v.thumb?`<img src="${esc(v.thumb)}" alt="">`:`<span class="fileicon">▶</span>`;return `<article class="card" tabindex="0" role="button" data-video="${esc(v.id)}"><div class="thumb">${thumb}${v.duration?`<span class="duration">${esc(v.duration)}</span>`:""}</div><div class="meta">${avatarHTML("chavatar")}<div class="details"><h3 class="vtitle">${hashtagHTML(v.title)}</h3><div class="channelname">${esc(v.channelName||state.channel.name)}</div><div class="stats">${Number(v.views||0).toLocaleString()} 回視聴 ・ ${esc(v.date||"たった今")}</div></div><button class="more" data-more="${esc(v.id)}" aria-label="その他">⋮</button></div></article>`}
function empty(title,description,button="動画をアップロード"){return `<div class="empty"><div class="big">▣</div><h2>${esc(title)}</h2><p>${esc(description)}</p>${button?`<button class="primary" id="emptyAction">${esc(button)}</button>`:""}</div>`}
function render(){
 const main=$("main");let list=state.videos.slice().sort((a,b)=>b.createdAt-a.createdAt);const q=query.trim().toLowerCase();
 if(q)list=list.filter(v=>(v.title+" "+v.description+" "+v.channelName).toLowerCase().includes(q));
 if(currentPage==="history")list=state.history.map(getVideo).filter(Boolean).map(v=>v);
 else if(currentPage==="watchlater")list=state.watchlater.map(getVideo).filter(Boolean);
 else if(currentPage==="liked")list=state.liked.map(getVideo).filter(Boolean);
 else if(currentPage==="subscriptions")list=state.videos.filter(v=>v.channelName===state.channel.name);
 else if(currentPage==="shorts")list=list.filter(v=>v.isShort);
 else if(currentPage==="playlists"){main.innerHTML=`<div class="pagehead"><h1>再生リスト</h1><button class="secondary" id="newPlaylist">＋ 新しい再生リスト</button></div>${state.playlists.length?state.playlists.map(p=>`<div class="pagehead"><div><h2>${esc(p.name)}</h2><div class="muted">${p.ids.length} 本の動画</div></div><button class="secondary" data-playlist="${esc(p.id)}">開く</button></div>`).join(""):empty("再生リストはありません","動画をまとめる再生リストを作成できます。","再生リストを作成")}`;bindMain();return}
 else if(currentPage==="channel"){renderChannel(main);bindMain();return}
 else if(currentPage==="library"){main.innerHTML=`<div class="pagehead"><h1>ライブラリ</h1></div><div class="librarytabs"><button class="secondary" data-goto="history">🕒 履歴 (${state.history.length})</button><button class="secondary" data-goto="watchlater">後で見る (${state.watchlater.length})</button><button class="secondary" data-goto="liked">高く評価 (${state.liked.length})</button><button class="secondary" data-goto="playlists">再生リスト (${state.playlists.length})</button></div><p class="muted">この端末に保存された履歴・リストを管理できます。</p>`;bindMain();return}
 if(currentPage==="home"){main.innerHTML=`<div class="chips">${["すべて","音楽","ゲーム","ライブ","ニュース","スポーツ","学習","テクノロジー","料理","旅行","コメディ","映画とアニメ","科学と技術","ペット","美容","ファッション","自動車","ビジネス","健康","自然","キッズ"].map(c=>`<button class="chip ${category===c?"active":""}" data-category="${c}">${c}</button>${c==="すべて"?`<button class="compass-btn" id="compassBtn" type="button" aria-label="ナビゲーションを開く" aria-expanded="false" title="ナビゲーション">🧭</button>`:""}`).join("")}</div><section class="grid">${list.filter(v=>category==="すべて"||v.category===category).map(card).join("")}</section>${list.filter(v=>category==="すべて"||v.category===category).length?"":empty("動画はまだありません","動画をアップロードすると、ここに表示されます。","動画をアップロード")}`}
 else {main.innerHTML=`<div class="pagehead"><h1>${navTitle(currentPage)}</h1>${currentPage==="history"?`<button class="secondary" id="clearHistory">履歴を削除</button>`:""}</div><section class="grid">${list.map(card).join("")}</section>${list.length?"":empty(currentPage==="watchlater"?"後で見る動画はありません":currentPage==="liked"?"高く評価した動画はありません":currentPage==="subscriptions"?"登録チャンネルの動画はありません":currentPage==="shorts"?"ショート動画はありません":"履歴はありません","動画を視聴したり、保存したりすると、ここに表示されます。",currentPage==="subscriptions"?"チャンネルを開く": "")}`}
 bindMain()
}
function renderChannel(main){const mine=state.videos.filter(v=>v.channelName===state.channel.name);main.innerHTML=`<div class="profilehero">${state.channel.avatar?`<div class="profilebig"><img src="${esc(state.channel.avatar)}" alt=""></div>`:`<div class="profilebig">${esc(state.channel.name.trim().charAt(0)||"T")}</div>`}<div><h1>${esc(state.channel.name)}</h1><div class="muted">${esc(state.channel.handle)} ・ 登録者 ${state.channel.created?1:0} 人 ・ ${mine.length} 本の動画</div><p class="muted">${esc(state.channel.description)}</p><div class="actions"><button class="primary" id="editProfile">チャンネルをカスタマイズ</button><button class="secondary" id="profileUpload">動画をアップロード</button></div></div></div><hr class="sep"><div class="pagehead"><h1>動画</h1></div><section class="grid">${mine.map(card).join("")}</section>${mine.length?"":empty("動画がありません","投稿した動画はここに表示されます。","動画をアップロード")}` }
function bindMain(){
 $("main").querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});$("main").querySelectorAll("[data-hashtag]").forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();query=a.dataset.hashtag;$("searchInput").value=query;saveSearchTerm(query);hideSearchHistory();setPage("home")});
 $("main").querySelectorAll("[data-video]").forEach(el=>{el.onclick=e=>{if(e.target.closest("[data-more]")){e.stopPropagation();showVideoMenu(el.dataset.video);return}watch(el.dataset.video)};el.onkeydown=e=>{if(e.key==="Enter")watch(el.dataset.video)}});
 $("main").querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
 const emptyAction=$("emptyAction");if(emptyAction)emptyAction.onclick=()=>currentPage==="playlists"?newPlaylist():openUpload();
 ["createBtn","profileUpload"].forEach(x=>{const el=$(x);if(el)el.onclick=openUpload});
 const edit=$("editProfile");if(edit)edit.onclick=editChannel;
 const np=$("newPlaylist");if(np)np.onclick=newPlaylist;
 const clear=$("clearHistory");if(clear)clear.onclick=()=>{state.history=[];saveState();render()};
 $("main").querySelectorAll("[data-playlist]").forEach(b=>b.onclick=()=>{const p=state.playlists.find(p=>p.id===b.dataset.playlist);if(!p)return;const vids=p.ids.map(getVideo).filter(Boolean);$("main").innerHTML=`<div class="pagehead"><button class="round" id="backPlaylists">←</button><h1>${esc(p.name)}</h1></div><section class="grid">${vids.map(card).join("")}</section>${vids.length?"":empty("この再生リストは空です","動画メニューから追加できます。","")}`;bindMain();$("backPlaylists").onclick=()=>setPage("playlists")});
}
function modalOpen(title,body,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modalButtons").innerHTML=buttons;$("modalBg").classList.add("show")}
function modalClose(){$("modalBg").classList.remove("show")}
$("modalClose").onclick=modalClose;$("modalBg").addEventListener("click",e=>{if(e.target===$("modalBg"))modalClose()});
function openUpload(){modalOpen("動画をアップロード",`<form id="uploadForm"><label class="field"><span>動画ファイル</span><input type="file" id="videoFile" accept="video/*" required><small class="hint">選んだ動画はこの端末のブラウザ内に保存されます。公開サイトへは送信されません。</small></label><label class="field"><span>タイトル</span><input id="uploadTitle" maxlength="100" required placeholder="動画のタイトル"></label><label class="field"><span>説明</span><textarea id="uploadDesc" maxlength="5000" placeholder="動画について説明しましょう"></textarea></label><label class="field"><span>サムネイル画像（任意）</span><input type="file" id="thumbFile" accept="image/*"></label><label class="field"><span>カテゴリ</span><select id="uploadCategory"><option>なし</option><option>すべて</option><option>ゲーム</option><option>音楽</option><option>テクノロジー</option><option>学習</option><option>エンタメ</option></select></label></form>`,`<button class="secondary" id="cancelModal">キャンセル</button><button class="primary" id="publishBtn">投稿する</button>`);$("cancelModal").onclick=modalClose;$("publishBtn").onclick=publishVideo}
async function publishVideo(){const file=$("videoFile").files[0];if(!file){toast("動画ファイルを選択してください");return}if(!file.type.startsWith("video/")){toast("動画ファイルを選択してください");return}const title=$("uploadTitle").value.trim();if(!title){toast("タイトルを入力してください");return}const thumbFile=$("thumbFile").files[0];let thumb="";if(thumbFile){thumb=await imageFileToDataURL(thumbFile)}
 const v={id:id(),title,description:$("uploadDesc").value.trim(),category:$("uploadCategory").value,channelName:state.channel.name,channelHandle:state.channel.handle,thumb,fileName:file.name,mime:file.type,size:file.size,createdAt:Date.now(),date:"たった今",views:0,isShort:file.type.startsWith("video/")&&file.size<8*1024*1024,duration:""};try{await dbPut({...v,blob:file});state.videos.unshift(v);saveState();modalClose();currentPage="channel";render();toast("動画をこの端末に保存しました")}catch(e){toast("保存できませんでした。ブラウザの空き容量を確認してください")}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function imageFileToDataURL(file){if(!file||!file.type.startsWith("image/"))return Promise.reject(new Error("画像ファイルではありません"));if(file.size<=2*1024*1024)return fileToDataURL(file);return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL("image/jpeg",.82);if(data.length>1.8*1024*1024)data=canvas.toDataURL("image/jpeg",.68);URL.revokeObjectURL(url);resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("画像を読み込めませんでした"))};img.src=url})}
function editChannel(){modalOpen("チャンネルプロフィール",`<form id="channelForm"><label class="field"><span>チャンネル名</span><input id="channelName" maxlength="60" value="${esc(state.channel.name)}" required></label><label class="field"><span>ハンドル</span><input id="channelHandle" maxlength="30" value="${esc(state.channel.handle)}" placeholder="@channel"></label><label class="field"><span>説明</span><textarea id="channelDesc" maxlength="1000">${esc(state.channel.description)}</textarea></label><label class="field"><span>プロフィール画像</span><input id="channelAvatar" type="file" accept="image/*"><small class="hint">2MBを超える画像もアップロードできます。大きい画像は自動で圧縮します。</small></label></form>`,`<button class="secondary" id="cancelModal">キャンセル</button><button class="primary" id="saveProfile">保存</button>`);$("cancelModal").onclick=modalClose;$("saveProfile").onclick=async()=>{const name=$("channelName").value.trim();if(!name){toast("チャンネル名を入力してください");return}state.channel.name=name;state.channel.handle=$("channelHandle").value.trim()||"@channel";if(!state.channel.handle.startsWith("@"))state.channel.handle="@"+state.channel.handle;state.channel.description=$("channelDesc").value.trim();const f=$("channelAvatar").files[0];if(f){state.channel.avatar=await imageFileToDataURL(f)}state.channel.created=true;state.videos.forEach(v=>{if(v.channelHandle==="@mychannel"||v.channelName==="マイチャンネル"){v.channelName=name;v.channelHandle=state.channel.handle}});saveState();$("avatarBtn").innerHTML=state.channel.avatar?`<img src="${state.channel.avatar}">`:esc(name.charAt(0));modalClose();render();toast("チャンネルプロフィールを保存しました")}}
function showVideoMenu(videoId){const v=getVideo(videoId);if(!v)return;modalOpen("動画のメニュー",`<p>${esc(v.title)}</p><button class="secondary" id="menuLater">🕒 後で見るに保存</button> <button class="secondary" id="menuLike">❤️ 高く評価</button><button class="secondary" id="menuPlaylist">＋ 再生リストに追加</button>${v.channelName===state.channel.name?`<button class="secondary" id="deleteVideo">削除</button>`:""}`,`<button class="primary" id="menuDone">閉じる</button>`);$("menuDone").onclick=modalClose;$("menuLater").onclick=()=>{toggleId("watchlater",videoId);modalClose()};$("menuLike").onclick=()=>{toggleId("liked",videoId);modalClose()};$("menuPlaylist").onclick=()=>{modalClose();addToPlaylist(videoId)};const del=$("deleteVideo");if(del)del.onclick=async()=>{if(!confirm("この動画を削除しますか？"))return;state.videos=state.videos.filter(x=>x.id!==videoId);state.history=state.history.filter(x=>x!==videoId);state.watchlater=state.watchlater.filter(x=>x!==videoId);state.liked=state.liked.filter(x=>x!==videoId);await dbDelete(videoId);saveState();modalClose();render();toast("動画を削除しました")}}
function toggleId(key,videoId){const i=state[key].indexOf(videoId);if(i>=0)state[key].splice(i,1);else state[key].unshift(videoId);saveState();toast(i>=0?"保存を解除しました":"保存しました");if(currentVideoId===videoId&&key==="liked")$("likeBtn").classList.toggle("primary",i<0);render()}
function newPlaylist(){modalOpen("再生リストを作成",`<label class="field"><span>名前</span><input id="playlistName" maxlength="100" placeholder="再生リスト名"></label><label class="field"><span>公開設定</span><select id="playlistPrivacy"><option>非公開</option><option>限定公開</option><option>公開</option></select><small class="hint">このアプリ内での表示設定です。ウェブに公開されるわけではありません。</small></label>`,`<button class="secondary" id="cancelModal">キャンセル</button><button class="primary" id="savePlaylist">作成</button>`);$("cancelModal").onclick=modalClose;$("savePlaylist").onclick=()=>{const name=$("playlistName").value.trim();if(!name){toast("名前を入力してください");return}state.playlists.push({id:id(),name,privacy:$("playlistPrivacy").value,ids:[]});saveState();modalClose();setPage("playlists");toast("再生リストを作成しました")}}
function addToPlaylist(videoId){if(!state.playlists.length){newPlaylist();return}modalOpen("再生リストに追加",state.playlists.map(p=>`<label class="field"><input type="checkbox" data-pl="${p.id}"> ${esc(p.name)}</label>`).join(""),`<button class="secondary" id="cancelModal">キャンセル</button><button class="primary" id="addPl">保存</button>`);$("cancelModal").onclick=modalClose;$("addPl").onclick=()=>{document.querySelectorAll("[data-pl]:checked").forEach(cb=>{const p=state.playlists.find(p=>p.id===cb.dataset.pl);if(p&&!p.ids.includes(videoId))p.ids.push(videoId)});saveState();modalClose();toast("再生リストを更新しました")}}
async function watch(videoId){const v=getVideo(videoId);if(!v)return;currentVideoId=videoId;$("playerBg").classList.remove("mini");const item=await dbGet(videoId);if(!item||!item.blob){toast("動画ファイルが見つかりません。もう一度投稿してください");return}const video=$("watchVideo");if(video.src.startsWith("blob:"))URL.revokeObjectURL(video.src);video.src=URL.createObjectURL(item.blob);$("watchTitle").innerHTML=hashtagHTML(v.title);$("watchDescription").innerHTML=hashtagHTML(v.description||"説明はありません。");$("watchChannel").innerHTML=`${avatarHTML("chavatar")}<div><strong>${esc(v.channelName)}</strong><div class="muted">${esc(v.channelHandle||"")}</div></div>`;$("playerBg").classList.add("show");state.history=[videoId,...state.history.filter(x=>x!==videoId)].slice(0,300);v.views=(v.views||0)+1;saveState();syncWatchButtons();video.play().catch(()=>{});render()}
function syncWatchButtons(){$("likeBtn").classList.toggle("primary",state.liked.includes(currentVideoId));$("likeBtn").textContent=state.liked.includes(currentVideoId)?"♥ 高く評価済み":"❤️ 高く評価";$("laterBtn").classList.toggle("primary",state.watchlater.includes(currentVideoId));$("laterBtn").textContent=state.watchlater.includes(currentVideoId)?"✓ 保存済み":"🕒 後で見る"}
$("likeBtn").onclick=()=>{if(currentVideoId){toggleId("liked",currentVideoId);syncWatchButtons()}};$("laterBtn").onclick=()=>{if(currentVideoId){toggleId("watchlater",currentVideoId);syncWatchButtons()}};
function closeWatch(){const v=$("watchVideo");$("playerBg").classList.remove("mini");v.pause();if(v.src.startsWith("blob:"))URL.revokeObjectURL(v.src);v.removeAttribute("src");v.load();$("playerBg").classList.remove("show");currentVideoId=null}
$("watchClose").onclick=closeWatch;$("miniPlayerBtn").onclick=()=>{$("playerBg").classList.add("mini");};$("miniRestoreBtn").onclick=()=>{$("playerBg").classList.remove("mini");};
$("searchForm").onsubmit=e=>{e.preventDefault();const term=$("searchInput").value.trim();if(term){saveSearchTerm(term);query=term;hideSearchHistory();setPage("home")}};$("searchInput").addEventListener("focus",showSearchHistory);$("searchInput").addEventListener("input",()=>{query=$("searchInput").value;if(currentPage==="home")render();showSearchHistory()});
function getSearchHistory(){try{const x=JSON.parse(localStorage.getItem("yt_search_history")||"[]");return Array.isArray(x)?x.filter(v=>typeof v==="string"):[]}catch(e){return []}}
function saveSearchTerm(term){term=String(term||"").trim();if(!term)return;const list=[term,...getSearchHistory().filter(x=>x.toLowerCase()!==term.toLowerCase())].slice(0,12);localStorage.setItem("yt_search_history",JSON.stringify(list))}
function hideSearchHistory(){$("searchHistory")?.classList.remove("show")}
function positionSearchHistory(){const box=$("searchHistory"),form=$("searchForm");if(!box||!form)return;const r=form.getBoundingClientRect(),w=Math.min(420,Math.max(0,innerWidth-20));const mobile=innerWidth<=650||r.width<180;const left=mobile?10:Math.max(10,Math.min(r.left,innerWidth-w-10));const top=Math.max(60,Math.min(r.bottom+6,innerHeight-140));box.style.left=left+"px";box.style.width=(mobile?Math.max(0,innerWidth-20):w)+"px";box.style.top=top+"px";box.style.maxHeight=Math.max(120,innerHeight-top-12)+"px"}
function showSearchHistory(){const box=$("searchHistory"),input=$("searchInput");if(!box||!input)return;const typed=input.value.trim().toLowerCase();const list=getSearchHistory().filter(x=>!typed||x.toLowerCase().includes(typed));box.innerHTML=list.length?'<div class="search-history-head"><span>🕘 検索履歴</span><button type="button" class="history-remove" id="clearSearchHistory">すべて削除</button></div>'+list.map(term=>'<div class="search-history-item" role="option"><span>🕘</span><button type="button" class="history-text" data-search-term="'+esc(term)+'">'+esc(term)+'</button><button type="button" class="history-remove" data-remove-search="'+esc(term)+'" aria-label="履歴を削除">×</button></div>').join(""):'<div class="search-history-head">🕘 検索履歴はありません</div>';box.classList.add("show");positionSearchHistory();const clear=$("clearSearchHistory");if(clear)clear.onclick=()=>{localStorage.removeItem("yt_search_history");showSearchHistory()};box.querySelectorAll("[data-search-term]").forEach(b=>b.onclick=()=>{input.value=b.dataset.searchTerm;query=b.dataset.searchTerm;hideSearchHistory();setPage("home");input.blur()});box.querySelectorAll("[data-remove-search]").forEach(b=>b.onclick=()=>{const term=b.dataset.removeSearch;localStorage.setItem("yt_search_history",JSON.stringify(getSearchHistory().filter(x=>x!==term)));showSearchHistory()})}
window.addEventListener("resize",()=>{if($("searchHistory")?.classList.contains("show"))positionSearchHistory()});window.addEventListener("scroll",()=>{if($("searchHistory")?.classList.contains("show"))positionSearchHistory()},true);

   button.setAttribute("aria-expanded",String(opened));
  }else{
   const hidden=getComputedStyle(sidebar).display==="none";
   sidebar.style.display=hidden?"":"none";button.setAttribute("aria-expanded",String(hidden));
  }
 }
 document.addEventListener("click",function(e){const button=e.target.closest("#compassBtn");if(!button)return;e.preventDefault();e.stopPropagation();toggleMenu(button)},true);
 backdrop.addEventListener("click",closeMenu);
 sidebar.addEventListener("click",e=>{if(e.target.closest("[data-page],[data-explore]")&&window.matchMedia("(max-width:650px)").matches)closeMenu()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
 window.addEventListener("resize",()=>{if(!window.matchMedia("(max-width:650px)").matches){closeMenu();sidebar.style.display=""}});
})();
</script>
</body>
</html>
