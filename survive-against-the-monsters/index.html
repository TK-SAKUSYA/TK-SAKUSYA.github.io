<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>House Explorer - 3F HOME</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;color:#fff}canvas{display:block}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#top{position:absolute;top:14px;left:14px;display:flex;gap:9px;flex-wrap:wrap}.chip{background:#101923c9;border:1px solid #ffffff24;border-radius:12px;padding:8px 12px;font-size:13px;backdrop-filter:blur(8px)}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#101923cc;padding:9px 14px;border-radius:12px;font-size:13px;white-space:nowrap;text-align:center}#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border:1px solid #fff9;border-radius:50%}#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#ffe6a3}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#08111bd9,#05080df2);z-index:5;padding:20px}#panel{width:min(540px,100%);background:#111b25ed;border:1px solid #ffffff24;border-radius:22px;padding:26px;box-shadow:0 20px 80px #0009}h1{font-size:clamp(25px,6vw,40px);line-height:1.08;margin:0 0 10px}p{color:#c4d0dc;line-height:1.7}button{border:0;border-radius:13px;background:#d6e7ff;color:#142231;font-weight:800;padding:13px 20px;font-size:16px;cursor:pointer}button:active{transform:scale(.98)}#mobile{display:none;position:fixed;inset:auto 12px 22px;z-index:3;pointer-events:none;justify-content:space-between;align-items:end}#pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}#pad button,#actions button{background:#172433c9;color:white;border:1px solid #ffffff44;padding:0;font-size:18px;touch-action:none}#actions{display:flex;gap:8px;pointer-events:auto}#actions button{width:58px;height:52px;font-size:12px}#look{position:fixed;right:0;top:0;width:55vw;height:65vh;z-index:1;touch-action:none}#toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#101923e8;border:1px solid #ffffff33;border-radius:12px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}@media(max-width:800px),(pointer:coarse){#mobile{display:flex}#hint{bottom:145px;font-size:11px;white-space:normal;width:90%}#cross{width:6px;height:6px}}
</style>
</head>
<body>
<div id="game"></div><div id="look"></div>
<div id="hud"><div id="top"><div class="chip" id="floor">🏠 1F</div><div class="chip" id="status">探索中</div><div class="chip" id="objective">目的：家を自由に探索</div></div><div id="cross"></div><div id="prompt"></div><div id="hint">WASD：移動　マウス：視点　E：調べる　Shift：走る</div></div>
<div id="mobile"><div id="pad"><span></span><button data-key="KeyW">▲</button><span></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div id="actions"><button id="run">走る</button><button id="use">調べる</button></div></div>
<div id="toast"></div>
<div id="overlay"><div id="panel"><h1>House Explorer<br><span style="color:#d6e7ff">3F HOME</span></h1><p>広くなった3階建ての家を自由に探索しよう。リビング、キッチン、寝室、書斎、浴室など、たくさんの部屋と家具を追加！</p><p>PC：WASDで移動／マウスで視点操作／Eで調べる／Shiftで走る<br>スマホ：左のボタンで移動／右側をスワイプして視点操作</p><button id="start">探索を開始する</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'), overlay=document.querySelector('#overlay'),toastEl=document.querySelector('#toast');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87939a);scene.fog=new THREE.Fog(0x87939a,22,72);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.08,120);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcbd9e8,0x33291f,1.15));
const sun=new THREE.DirectionalLight(0xffe2bd,2.0);sun.position.set(-12,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mats={wall:new THREE.MeshStandardMaterial({color:0xd8d0c2,roughness:.96}),floor:new THREE.MeshStandardMaterial({color:0x8b6747,roughness:.82}),wood:new THREE.MeshStandardMaterial({color:0x62432d,roughness:.78}),white:new THREE.MeshStandardMaterial({color:0xe8e3d8,roughness:.88}),dark:new THREE.MeshStandardMaterial({color:0x242a2e,roughness:.9}),glass:new THREE.MeshPhysicalMaterial({color:0x9cc9dc,roughness:.12,metalness:.15,transparent:true,opacity:.55}),metal:new THREE.MeshStandardMaterial({color:0x727b80,roughness:.32,metalness:.72}),lamp:new THREE.MeshStandardMaterial({color:0xffe3b0,emissive:0xffc36c,emissiveIntensity:1.8}),fabric:new THREE.MeshStandardMaterial({color:0x536b79,roughness:.98}),cream:new THREE.MeshStandardMaterial({color:0xc9b79c,roughness:.98}),green:new THREE.MeshStandardMaterial({color:0x42664b,roughness:.98}),tile:new THREE.MeshStandardMaterial({color:0xb9b8b0,roughness:.55})};
const colliders=[],interactables=[];
const player={x:0,y:1.65,z:14,yaw:Math.PI,pitch:0,speed:4.4};camera.position.set(player.x,player.y,player.z);
const keys={};let started=false,locked=false,run=false,toastTimer=0,last=performance.now();
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function floorIndex(){return Math.max(0,Math.min(2,Math.round(player.y/4.2)))}
function blocked(x,z){for(const c of colliders){if(Math.abs(x-c.x)<c.w/2+.42&&Math.abs(z-c.z)<c.d/2+.42)return true}return false}
function interact(){let best=null,dist=2.7;for(const it of interactables){if(!it.mesh.visible||it.mesh.userData.found||it.mesh.userData.open)continue;const p=it.mesh.position;const d=Math.hypot(p.x-player.x,p.z-player.z);if(d<dist){dist=d;best=it}}if(best)best.action();else toast('近くに調べられるものはない')}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='ShiftLeft'||e.code==='ShiftRight')run=true});
document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')run=false});
renderer.domElement.addEventListener('click',()=>{if(started&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.0022))}});
let touchStart=null;const look=document.querySelector('#look');look.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(touchStart){player.yaw-=(e.clientX-touchStart.x)*.006;player.pitch=Math.max(-1.25,Math.min(1.25,player.pitch-(e.clientY-touchStart.y)*.006));touchStart={x:e.clientX,y:e.clientY}}});look.addEventListener('pointerup',()=>touchStart=null);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.querySelector('#run').addEventListener('pointerdown',()=>run=true);['pointerup','pointerleave','pointercancel'].forEach(ev=>document.querySelector('#run').addEventListener(ev,()=>run=false));document.querySelector('#use').addEventListener('click',interact);
document.querySelector('#start').onclick=()=>{overlay.style.display='none';started=true;toast('探索開始！広い家を見て回ろう');};
function update(dt){if(!started)return;
 const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);const sp=player.speed*(run?1.55:1);const dx=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*sp*dt,dz=(Math.cos(player.yaw)*forward-Math.sin(player.yaw)*side)*sp*dt;
 if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;
 // stair zones connect the floors
 if(player.x>15.2&&player.x<21.2&&player.z>-1&&player.z<12){const climb=(forward>0||side!==0)?1:-1;player.y=Math.max(1.65,Math.min(10.05,player.y+climb*dt*1.25))}
 camera.position.set(player.x,player.y,player.z);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');
 document.querySelector('#floor').textContent='🏠 '+(floorIndex()+1)+'F';
 const near=interactables.some(it=>it.mesh.visible&&!it.mesh.userData.found&&!it.mesh.userData.open&&Math.hypot(it.mesh.position.x-player.x,it.mesh.position.z-player.z)<2.7);document.querySelector('#prompt').textContent=near?'[ E ] 調べる':'';
 document.querySelector('#status').textContent='自由探索';
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
