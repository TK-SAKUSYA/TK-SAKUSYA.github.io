<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube_Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f1f1f1;font:14px Arial,"Noto Sans JP",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}header{position:fixed;inset:0 0 auto;height:58px;background:#0f0f0f;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:3}.brand{font-size:20px;font-weight:bold;white-space:nowrap;cursor:pointer}.logo{background:#f03;padding:4px 8px;border-radius:7px;margin-right:5px}.search{display:flex;flex:1;max-width:600px;margin:auto}.search input{flex:1;min-width:0;padding:11px 15px;background:#111;border:1px solid #444;border-radius:22px 0 0 22px;color:white}.search button,.pill{background:#272727;padding:10px 15px;border-radius:0 22px 22px 0}.pill{border-radius:22px}.side{position:fixed;top:58px;bottom:0;width:215px;overflow:auto;padding:12px}.nav{display:flex;gap:16px;align-items:center;text-align:left;width:100%;padding:12px;background:transparent;border-radius:10px}.nav:hover,.nav.active{background:#272727}.nav span:first-child{font-size:19px;width:24px;text-align:center}main{margin:58px 0 0 215px;padding:18px 22px}.chips{display:flex;gap:10px;overflow:auto;padding-bottom:20px}.chip{background:#272727;padding:9px 14px;border-radius:8px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}.card{cursor:pointer;min-width:0}.thumb{aspect-ratio:16/9;background:#222;border-radius:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.info{display:flex;gap:10px;padding-top:10px}.avatar{width:36px;height:36px;flex:none;border-radius:50%;background:#405a8b;display:grid;place-items:center}.title{font-size:15px;font-weight:600;line-height:1.4}.meta,.note{color:#aaa;line-height:1.6;margin-top:5px}.hidden{display:none!important}.playerlayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.description{background:#272727;padding:14px;border-radius:12px;line-height:1.6}.recs{display:flex;flex-direction:column;gap:12px}.rec{display:grid;grid-template-columns:130px 1fr;gap:10px;cursor:pointer}.rec img{width:100%;border-radius:8px}.upload{max-width:560px;background:#202020;padding:22px;border-radius:14px}.upload input{display:block;width:100%;padding:12px;margin:8px 0 16px;background:#111;border:1px solid #444;border-radius:8px;color:white}.upload button{background:#eee;color:#111;padding:10px 16px;border-radius:20px}@media(max-width:1000px){.side{width:76px;padding:8px 4px}.nav{height:62px;display:flex;flex-direction:column;gap:4px;justify-content:center;padding:3px;font-size:10px}.nav span:last-child{font-size:10px}main{margin-left:76px;padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.playerlayout{grid-template-columns:1fr}.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header{gap:8px;padding:0 8px}.brand{font-size:0}.brand .logo{font-size:16px}.side{display:none}main{margin-left:0;padding:12px 0}.chips{padding:0 10px 15px}.grid{grid-template-columns:1fr;gap:22px}.thumb{border-radius:0}.info{padding:8px 12px}.search input{width:60px}.player{border-radius:0}.playerlayout>section>h2,.actions,.description{margin-left:12px;margin-right:12px}.recs{display:flex;padding:0 12px}}
</style></head><body>
<header><button class="pill" id="menu">☰</button><div class="brand" id="home"><span class="logo">▶</span>YouTube</div><form class="search" id="search"><input id="q" placeholder="検索" aria-label="検索"><button>⌕</button></form><button class="pill" id="create">＋ 作成</button></header>
<aside class="side" id="side"><button class="nav active" data-page="home"><span>🏠</span><span>ホーム</span></button><button class="nav" data-page="shorts"><span>🎬</span><span>ショート</span></button><button class="nav" data-page="subscriptions"><span>📺</span><span>登録チャンネル</span></button><hr><button class="nav" data-page="history"><span>🕘</span><span>履歴</span></button><button class="nav" data-page="playlists"><span>📋</span><span>再生リスト</span></button><button class="nav" data-page="later"><span>🕒</span><span>後で見る</span></button><button class="nav" data-page="liked"><span>👍</span><span>高く評価した動画</span></button><hr><button class="nav" data-category="音楽"><span>🎵</span><span>音楽</span></button><button class="nav" data-category="ゲーム"><span>🎮</span><span>ゲーム</span></button><button class="nav" data-category="ニュース"><span>📰</span><span>ニュース</span></button><button class="nav" data-page="settings"><span>⚙️</span><span>設定</span></button><button class="nav" data-page="help"><span>ℹ️</span><span>ヘルプ</span></button></aside>
<main><section id="homePage"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section><section id="other" class="hidden"></section><section id="playerPage" class="hidden"></section><section id="uploadPage" class="hidden"></section></main>
<script>
const videos=[
{id:"jNQXAC9IVRw",title:"Me at the zoo",channel:"jawed",category:"ミックス",desc:"YouTubeに投稿された最初の動画のひとつ。"},
{id:"dQw4w9WgXcQ",title:"Rick Astley - Never Gonna Give You Up",channel:"Rick Astley",category:"音楽",desc:"Official music video."},
{id:"aqz-KE-bpKQ",title:"Big Buck Bunny - Official Trailer",channel:"Blender",category:"アニメ",desc:"オープンなアニメーション作品。"},
{id:"M7lc1UVf-VE",title:"YouTube Developers Live",channel:"Google for Developers",category:"プログラミング",desc:"YouTube開発者向けの動画。"},
{id:"L_jWHffIx5E",title:"Smash Mouth - All Star",channel:"Smash Mouth",category:"音楽",desc:"Official music video."},
{id:"kJQP7kiw5Fk",title:"Luis Fonsi - Despacito",channel:"Luis Fonsi",category:"音楽",desc:"Official music video."},
{id:"e-ORhEE9VVg",title:"Taylor Swift - Blank Space",channel:"Taylor Swift",category:"音楽",desc:"Official music video."},
{id:"CevxZvSJLk8",title:"Katy Perry - Roar",channel:"Katy Perry",category:"音楽",desc:"Official music video."},
{id:"hT_nvWreIhg",title:"OneRepublic - Counting Stars",channel:"OneRepublic",category:"音楽",desc:"Official music video."},
{id:"9bZkp7q19f0",title:"PSY - GANGNAM STYLE",channel:"officialpsy",category:"音楽",desc:"Official music video."}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let category="すべて",query="",current=null,history=[],liked=new Set(),later=new Set(),subscribed=new Set(),playlists=[];
const cats=["すべて","音楽","ゲーム","ニュース","アニメ","プログラミング"];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hide(){["homePage","other","playerPage","uploadPage"].forEach(id=>$("#"+id).classList.add("hidden"))}
function home(){hide();$("#homePage").classList.remove("hidden");$("#chips").innerHTML=cats.map(c=>'<button class="chip '+(c===category?"active":"")+'" data-chip="'+c+'">'+c+'</button>').join("");grid();$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page==="home"))}
function grid(){let list=videos.filter(v=>(category==="すべて"||v.category===category)&&(v.title+" "+v.channel).toLowerCase().includes(query.toLowerCase()));$("#grid").innerHTML=list.map(v=>'<article class="card" data-video="'+v.id+'"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg"></div><div class="info"><div class="avatar">'+esc(v.channel[0])+'</div><div><div class="title">'+esc(v.title)+'</div><div class="meta">'+esc(v.channel)+'<br>動画デモ</div></div></div></article>').join("")||"<p>動画が見つかりませんでした。</p>";$$("[data-video]").forEach(el=>el.onclick=()=>openVideo(el.dataset.video))}
function other(title,body){hide();$("#other").classList.remove("hidden");$("#other").innerHTML="<h2>"+esc(title)+"</h2>"+body}
function openVideo(id){current=videos.find(v=>v.id===id);if(!current)return;history.unshift(id);history=[...new Set(history)];hide();$("#playerPage").classList.remove("hidden");player();window.scrollTo(0,0)}
function player(){let v=current;$("#playerPage").innerHTML='<div class="playerlayout"><section><button class="pill" id="back">← ホームに戻る</button><div class="player"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&rel=0" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><h2>'+esc(v.title)+'</h2><div class="actions"><b>'+esc(v.channel)+'</b><button class="pill" id="sub">'+(subscribed.has(v.channel)?"登録済み":"チャンネル登録")+'</button><button class="pill" id="like">'+(liked.has(v.id)?"👍 高評価済み":"👍 高評価")+'</button><button class="pill" id="later">🕒 後で見る</button><button class="pill" id="share">↗ 共有</button></div><div class="description"><p>'+esc(v.desc)+'</p><small>※ 個人制作のデモです。YouTube公式サービスではありません。</small></div></section><aside class="recs">'+videos.filter(x=>x.id!==v.id).map(x=>'<article class="rec" data-rec="'+x.id+'"><img src="https://i.ytimg.com/vi/'+x.id+'/hqdefault.jpg"><div><b>'+esc(x.title)+'</b><div class="meta">'+esc(x.channel)+'</div></div></article>').join("")+'</aside></div>';$("#back").onclick=home;$("#sub").onclick=()=>{subscribed.has(v.channel)?subscribed.delete(v.channel):subscribed.add(v.channel);player()};$("#like").onclick=()=>{liked.has(v.id)?liked.delete(v.id):liked.add(v.id);player()};$("#later").onclick=()=>{later.add(v.id);alert("後で見るに保存しました")};$("#share").onclick=()=>prompt("共有リンク",location.href.split("#")[0]+"#video="+v.id);$$("[data-rec]").forEach(el=>el.onclick=()=>openVideo(el.dataset.rec))}
function upload(){hide();$("#uploadPage").classList.remove("hidden");$("#uploadPage").innerHTML='<div class="upload"><h2>動画を一覧に追加</h2><p class="note">このデモでは実際の動画ファイルをアップロードできません。YouTube動画IDを登録できます。</p><form id="up"><label>動画タイトル<input id="title" required maxlength="100"></label><label>YouTube動画ID<input id="id" required placeholder="jNQXAC9IVRw"></label><label>チャンネル名<input id="channel"></label><button>一覧に追加</button></form></div>';$("#up").onsubmit=e=>{e.preventDefault();let id=$("#id").value.trim().match(/[\w-]{11}/)?.[0];if(!id||videos.some(v=>v.id===id)){alert("動画IDを確認してください");return}videos.unshift({id,title:$("#title").value.trim(),channel:$("#channel").value.trim()||"あなたのチャンネル",category:"ミックス",desc:"追加した動画"});category="すべて";query="";home();alert("動画を追加しました")}}
$("#search").onsubmit=e=>{e.preventDefault();query=$("#q").value.trim();home()};$("#q").oninput=()=>{query=$("#q").value.trim();if(!$("#homePage").classList.contains("hidden"))grid()};$("#chips").onclick=e=>{let b=e.target.closest("[data-chip]");if(b){category=b.dataset.chip;home()}};$("#create").onclick=upload;$("#home").onclick=home;$("#menu").onclick=()=>{$("#side").style.display=$("#side").style.display==="none"?"block":""};
$$("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;home()});
$$("[data-page]").forEach(b=>b.onclick=()=>{let p=b.dataset.page;if(p==="home")return home();if(p==="shorts")return other("ショート",'<div class="grid">'+videos.slice(0,6).map(v=>'<article class="card" data-video="'+v.id+'"><div class="thumb"><img src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg"></div><p>'+esc(v.title)+'</p></article>').join("")+'</div>');if(p==="history")return other("履歴",history.map(id=>{let v=videos.find(x=>x.id===id);return v?'<p><a href="#" data-open="'+id+'">'+esc(v.title)+'</a></p>':""}).join("")||"履歴はまだありません");if(p==="liked")return other("高く評価した動画",[...liked].map(id=>{let v=videos.find(x=>x.id===id);return v?'<p><a href="#" data-open="'+id+'">'+esc(v.title)+'</a></p>':""}).join("")||"まだありません");if(p==="later")return other("後で見る",[...later].map(id=>{let v=videos.find(x=>x.id===id);return v?'<p><a href="#" data-open="'+id+'">'+esc(v.title)+'</a></p>':""}).join("")||"保存した動画はありません");if(p==="subscriptions")return other("登録チャンネル",[...subscribed].map(esc).join("、")||"まだ登録していません");if(p==="playlists")return other("再生リスト",'<form id="pl"><input id="plname" placeholder="新しい再生リスト名" required><button class="pill">作成</button></form>'+playlists.map(p=>"<h3>"+esc(p)+"</h3>").join(""));if(p==="settings")return other("設定","このデモはダークテーマです。");if(p==="help")return other("ヘルプ","動画を選ぶと再生ページが開きます。")});
$("#other").onclick=e=>{let a=e.target.closest("[data-open]");if(a){e.preventDefault();openVideo(a.dataset.open)}let c=e.target.closest("[data-video]");if(c)openVideo(c.dataset.video)};
$("#other").onsubmit=e=>{if(e.target.id==="pl"){e.preventDefault();let n=$("#plname").value.trim();if(n){playlists.push(n);other("再生リスト",'<form id="pl"><input id="plname" placeholder="新しい再生リスト名" required><button class="pill">作成</button></form>'+playlists.map(p=>"<h3>"+esc(p)+"</h3>").join(""))}}};
home();let h=location.hash.match(/video=([\w-]{11})/);if(h)openVideo(h[1]);
</script></body></html>
