ng:0 0 22px;position:sticky;top:58px;background:var(--bg);z-index:3}.chip{background:#272727;padding:9px 14px;border-radius:8px;white-space:nowrap;font-weight:600}.chip:hover{background:#3b3b3b}.chip.active{background:#f1f1f1;color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 16px}.card{cursor:pointer;min-width:0}.thumb{aspect-ratio:16/9;background:#222;border-radius:13px;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:7px;bottom:7px;background:#000c;padding:3px 5px;border-radius:4px;font-size:12px}.localthumb{height:100%;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#202b3c,#171717)}.localthumb img{width:100%;height:100%;object-fit:cover}.info{display:flex;gap:11px;padding-top:11px}.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:#405a8b;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.title{font-size:15px;font-weight:650;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta,.note{color:var(--muted);line-height:1.6;margin-top:5px}.hidden{display:none!important}.playerlayout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;max-width:1600px;margin:auto}.player{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.player iframe,.player video{width:100%;height:100%;border:0;background:#000}.player video{object-fit:contain}.playerTitle{font-size:21px;line-height:1.4;margin:14px 0}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.action{background:#272727;padding:10px 15px;border-radius:22px;font-weight:600}.action:hover{background:#3b3b3b}.description{background:#272727;padding:14px;border-radius:12px;line-height:1.6;white-space:pre-wrap}.recs{display:flex;flex-direction:column;gap:12px}.rec{display:grid;grid-template-columns:165px 1fr;gap:10px;cursor:pointer}.rec img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px}.panel{max-width:760px;background:#202020;padding:24px;border-radius:16px;margin:12px auto}.panel input,.panel select,.panel textarea{display:block;width:100%;padding:12px;margin:8px 0 18px;background:#111;border:1px solid #444;border-radius:9px;color:white}.panel input[type=file]{padding:10px}.panel button.primary,.primary{background:#f1f1f1;color:#111;padding:11px 18px;border-radius:22px;font-weight:700}.secondary{background:#333;padding:11px 18px;border-radius:22px}.profile-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#405a8b;display:grid;place-items:center;font-size:28px}.commentbox{display:flex;gap:10px;margin:18px 0}.commentbox input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid #555;padding:10px;color:white}.comment{padding:12px 0;border-bottom:1px solid #292929}.comment b{margin-right:8px}.seg{display:flex;gap:8px;margin:12px 0 18px}.seg button{padding:10px 16px;border-radius:22px;background:#333}.seg button.active{background:#f1f1f1;color:#111}.sortbar{display:flex;gap:8px;align-items:center;margin:0 0 18px}.sortbar button{background:#272727;padding:8px 12px;border-radius:18px}.empty{padding:50px 12px;text-align:center;color:#aaa}.shortsgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.shortcard{cursor:pointer}.shortcard .thumb{aspect-ratio:9/16}.shortcard .thumb img{object-fit:cover}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:12px 18px;border-radius:25px;z-index:20;box-shadow:0 4px 20px #0008}.small{font-size:12px;color:#aaa}

/* YouTube_Player major UI refresh */
:root{--bg:#0f0f0f;--panel:#212121;--hover:#383838;--muted:#aaa;--line:#303030;--accent:#3ea6ff}
header{box-shadow:0 1px 0 #ffffff0d}
.brand{letter-spacing:-.8px}
.logo{border-radius:7px;background:#f00}
.side{border-right:1px solid #ffffff08}
.nav{font-weight:550;transition:background .15s}
.nav.active{font-weight:750}
.chips{padding-top:4px}
.chip{border-radius:8px;transition:background .15s}
.grid{gap:38px 17px}
.thumb{border-radius:14px;transition:border-radius .2s}
.card:hover .thumb{border-radius:8px}
.card:hover .title{color:#fff}
.info .avatar{background:#3b3b3b}
.player{border-radius:13px}
.playerTitle{font-size:22px;font-weight:750}
.action{transition:background .15s}
.action.primary-action{background:#f1f1f1;color:#111}
.sortbar{flex-wrap:wrap}
.sortbar button.active{background:#f1f1f1;color:#111}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.queue-item{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:10px;border-bottom:1px solid #333}
.queue-item img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.queue-item button{background:#333;border-radius:18px;padding:7px 12px}
.player-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.player-tools select{background:#272727;color:white;border:1px solid #444;border-radius:18px;padding:8px 12px}
#miniPlayer{position:fixed;right:22px;bottom:22px;width:min(360px,calc(100vw - 28px));background:#181818;border:1px solid #444;border-radius:14px;box-shadow:0 10px 40px #000b;z-index:30;overflow:hidden}
#miniPlayer video{width:100%;display:block;background:#000;max-height:205px}
#miniPlayer .mini-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
#miniPlayer button{background:#333;border-radius:18px;padding:6px 10px}
body.light-theme{--bg:#f9f9f9;--panel:#fff;--hover:#e9e9e9;--muted:#606060;--line:#ddd;color:#0f0f0f}
body.light-theme header,body.light-theme .side,body.light-theme .chips{background:#f9f9f9}
body.light-theme .search input{background:#fff;color:#111;border-color:#ccc}
body.light-theme .search button,body.light-theme .chip,body.light-theme .action,body.light-theme .panel,body.light-theme .description{background:#eee;color:#111}
body.light-theme .nav:hover,body.light-theme .nav.active{background:#e5e5e5}
body.light-theme .sortbar button{background:#e5e5e5;color:#111}
body.light-theme .sortbar button.active{background:#111;color:#fff}
body.light-theme .panel input,body.light-theme .panel select,body.light-theme .panel textarea{background:#fff;color:#111;border-color:#ccc}
@media(max-width:700px){.queue-item{grid-template-columns:88px 1fr}.queue-item img{width:88px}.queue-item button{grid-column:2;justify-self:start}#miniPlayer{right:10px;bottom:10px}}

</style></head>
<body>
<header><button class="iconbtn" id="menu" title="メニュー">☰</button><div class="brand" id="home"><span class="logo">▶</span>YouTube</div>
<form class="search" id="search"><input id="q" placeholder="検索" aria-label="検索"><button aria-label="検索">⌕</button></form>
<div class="headright"><button class="create" id="create">＋ 作成</button><button class="pill" id="account" title="アカウント">👤</button></div></header>
<aside class="side" id="side">
<button class="nav active" data-page="home"><span class="ico">🏠</span><span>ホーム</span></button>
<button class="nav" data-page="shorts"><span class="ico">🎬</span><span>ショート</span></button>

<button class="nav" data-page="queue"><span class="ico">▶️</span><span>再生キュー</span></button>
<button class="nav" data-page="liked"><span class="ico">👍</span><span>高く評価した動画</span></button><hr>
<button class="nav" data-category="音楽"><span class="ico">🎵</span><span>音楽</span></button>

</aside>
<main id="main"><section id="homePage"><div class="chips" id="chips"></div><div class="sortbar"><span class="note">動画一覧</span><button id="sortRecent" class="active">新しい順</button><button id="sortPopular">人気順</button><button id="sortTitle">タイトル順</button><button id="openQueue">▶ 再生キュー</button></div><div class="grid" id="grid"></div></section>
<section id="other" class="hidden"></section><section id="playerPage" class="hidden"></section><section id="uploadPage" class="hidden"></section></main>
<script>
const SAVE_KEY="youtube_player_official_save_v1",DB_NAME="YouTubePlayerMediaDB",STORE="videos";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function loadSaved(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")}catch(e){return {}}}
const saved=loadSaved(),videos=Array.isArray(saved.videos)?saved.videos:[];
let category="すべて",query="",current=null,sortMode="recent",db=null,localUrls={},queue=Array.isArray(saved.queue)?saved.queue:[],themeMode=saved.themeMode||"dark",
history=Array.isArray(saved.history)?saved.history:[],liked=new Set(saved.liked||[]),later=new Set(saved.later||[]),subscribed=new Set(saved.subscribed||[]),playlists=Array.isArray(saved.playlists)?saved.playlists:[],playlistItems=saved.playlistItems&&typeof saved.playlistItems==="object"?saved.playlistItems:{},comments=saved.comments||{},
accountName=saved.accountName||"",profileImage=saved.profileImage||"",channelDescription=saved.channelDescription||"";
const cats=["すべて","音楽","ゲーム","ニュース","アニメ","プログラミング","コメディ","エンタメ","映画","ドラマ","スポーツ","サッカー","野球","バスケ","料理","グルメ","旅行","自然","動物","科学","宇宙","歴史","学習","教育","英語","数学","テクノロジー","ガジェット","レビュー","DIY","工作","アート","イラスト","ファッション","美容","健康","フィットネス","ダンス","カラオケ","ポップ","ロック","ゲーム実況","攻略","配信","ライブ","ニュース解説","ドキュメンタリー","Vlog","ASMR","睡眠・リラックス","キッズ","乗り物","車","鉄道","アウトドア","釣り","ボードゲーム","eスポーツ","アプリ","開発","ミックス"];
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function saveAll(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({videos,history,liked:[...liked],later:[...later],subscribed:[...subscribed],playlists,playlistItems,comments,accountName,profileImage,channelDescription,queue,themeMode}));return true}catch(e){toast("⚠️ 保存容量がいっぱいです");return false}}
function toast(msg){let n=document.createElement("div");n.className="toast";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2300)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function putMedia(id,blob){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(blob,id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function getMedia(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function deleteMedia(id){return new Promise(resolve=>{let t=db.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=resolve;t.onerror=resolve})}
async function localURL(v){if(localUrls[v.id])return localUrls[v.id];let blob=await getMedia(v.id);if(!blob)return null;return localUrls[v.id]=URL.createObjectURL(blob)}
function readImageFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{try{const scale=Math.min(1,960/img.width,540/img.height),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",0.82))}catch(e){reject(e)}};img.onerror=()=>reject(new Error("画像を読み込めません"));img.src=String(r.result)};r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function randomVideoFrame(blob){return new Promise(resolve=>{const url=URL.createObjectURL(blob),video=document.createElement("video");video.muted=true;video.preload="auto";video.playsInline=true;let finished=false;const done=value=>{if(finished)return;finished=true;URL.revokeObjectURL(url);video.removeAttribute("src");video.load();resolve(value||"")};video.onerror=()=>done("");video.onloadedmetadata=()=>{const duration=Number.isFinite(video.duration)?video.duration:0;if(duration<=0){done("");return}const min=Math.min(0.5,duration/10),max=Math.max(min,duration-0.5);video.currentTime=min+Math.random()*(max-min)};video.onseeked=()=>{try{const canvas=document.createElement("canvas");canvas.width=480;canvas.height=270;const ctx=canvas.getContext("2d");const scale=Math.max(canvas.width/video.videoWidth,canvas.height/video.videoHeight),w=video.videoWidth*scale,h=video.videoHeight*scale;ctx.drawImage(video,(canvas.width-w)/2,(canvas.height-h)/2,w,h);done(canvas.toDataURL("image/jpeg",0.78))}catch(e){done("")}};video.src=url;video.load()})}
function avatarHTML(){return profileImage?'<img src="'+esc(profileImage)+'">':'👤'}
function hide(){["homePage","other","playerPage","uploadPage"].forEach(id=>$("#"+id).classList.add("hidden"))}
function setNav(page){$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function home(){hide();$("#homePage").classList.remove("hidden");$("#chips").innerHTML=cats.map(c=>'<button class="chip '+(c===category?"active":"")+'" data-chip="'+esc(c)+'">'+esc(c)+'</button>').join("");grid();setNav("home");window.scrollTo(0,0)}
function thumb(v){if(v.thumbnail)return '<img loading="lazy" src="'+esc(v.thumbnail)+'" alt="サムネイル">';return v.source==="device"?'<div class="localthumb">'+(v.autoThumbnail?'<img loading="lazy" src="'+esc(v.autoThumbnail)+'" alt="自動サムネイル">':'▶<small> DEVICE</small>')+'</div>':'<img loading="lazy" src="https://i.ytimg.com/vi/'+esc(v.id)+'/hqdefault.jpg" alt="">'}
function grid(){let list=videos.filter(v=>(category==="すべて"||v.category===category||(v.tags||[]).includes(category))&&(v.title+" "+v.channel+" "+(v.desc||"")).toLowerCase().includes(query.toLowerCase()));if(sortMode==="title")list.sort((a,b)=>a.title.localeCompare(b.title,"ja"));else if(sortMode==="popular")list.sort((a,b)=>(b.views||0)-(a.views||0));else list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$("#grid").innerHTML=list.map(v=>'<article class="card" data-video="'+esc(v.id)+'"><div class="thumb">'+thumb(v)+'</div><div class="info"><div class="avatar">'+(v.profileImage?'<img src="'+esc(v.profileImage)+'">':esc((v.channel||"？")[0]))+'</div><div><div class="title">'+esc(v.title)+'</div><div class="meta">'+esc(v.channel||"チャンネル")+'<br>'+esc(v.views||0)+' 回視聴 ・ '+new Date(v.createdAt||Date.now()).toLocaleDateString("ja-JP")+'</div></div></div></article>').join("")||'<div class="empty">📺<h3>動画がありません</h3><p>「＋ 作成」からデバイス内の動画またはURL動画を追加できます。</p></div>';$$("[data-video]").forEach(el=>el.onclick=()=>openVideo(el.dataset.video))}
function other(title,body){hide();$("#other").classList.remove("hidden");$("#other").innerHTML="<h2>"+esc(title)+"</h2>"+body;window.scrollTo(0,0)}

function playNext(){
  while(queue.length){
    const id=queue.shift();saveAll();
    if(videos.some(v=>v.id===id)){openVideo(id);return}
  }
  toast("再生キューは空です");
}

$$("[data-page]").forEach(b=>b.onclick=()=>{let p=b.dataset.page;setNav(p);if(p==="home")return home();if(p==="shorts"){let arr=videos.filter(v=>v.source==="url");other("ショート",arr.length?'<div class="shortsgrid">'+arr.map(v=>'<article class="shortcard" data-video="'+esc(v.id)+'"><div class="thumb">'+thumb(v)+'</div><p>'+esc(v.title)+'</p></article>').join("")+'</div>':'<div class="empty">ショート動画はまだありません</div>');return}if(p==="history")return listPage("履歴",history);if(p==="liked")return listPage("高く評価した動画",[...liked]);if(p==="saved")return renderSavedPage();if(p==="queue")return renderQueue();if(p==="subscriptions"){let arr=videos.filter(v=>subscribed.has(v.channel));return listPage("登録チャンネル",arr.map(v=>v.id))}if(p==="playlists")return other("再生リスト",'<div class="panel"><form id="pl"><input id="plname" placeholder="新しい再生リスト名" required><button class="primary">作成</button></form>'+playlists.map(n=>'<button class="action" data-open-playlist="'+esc(n)+'" style="display:block;width:100%;text-align:left;margin:10px 0">📂 '+esc(n)+'</button>').join("")+'</div>');if(p==="settings")return other("設定",'<div class="panel"><h3>表示設定</h3><label>テーマ<select id="themeSelect"><option value="dark">ダーク</option><option value="light">ライト</option></select></label><p class="note">動画・履歴・プロフィールなどはこのブラウザ内に保存されます。</p><button class="secondary" id="clearHistory">履歴を消去</button> <button class="secondary" id="clearLiked">高評価一覧を消去</button></div>');if(p==="help")return other("ヘルプ",'<div class="panel"><h3>YouTube_Playerについて</h3><p>動画ファイルはIndexedDB、その他の設定や一覧はlocalStorageに保存されます。</p><p>デバイス内動画はこのブラウザでのみ再生できます。ブラウザデータを消去すると失われる場合があります。</p><p>URL動画はYouTubeの埋め込み再生を利用します。このアプリはYouTube公式サービスではありません。</p></div>')});

$("#other").onchange=e=>{if(e.target.id==="themeSelect"){themeMode=e.target.value;document.body.classList.toggle("light-theme",themeMode==="light");saveAll();toast("テーマを変更しました")}};$("#other").onsubmit=async e=>{if(e.target.id==="editVideoForm"){e.preventDefault();if(!current)return;current.title=$("#editTitle").value.trim();current.category=$("#editCategory").value;current.desc=$("#editDesc").value.trim();const imageFile=$("#editThumbnail").files[0];if(imageFile){if(!imageFile.type.startsWith("image/")){toast("画像ファイルを選択してください");return}current.thumbnail=await readImageFile(imageFile)}saveAll();hide();$("#playerPage").classList.remove("hidden");player();toast("動画情報を更新しました");return}if(e.target.id==="accountForm"){e.preventDefault();accountName=$("#accountNameInput").value.trim();profileImage=$("#profileImageInput").value.trim();channelDescription=$("#channelDescriptionInput").value.trim();saveAll();account();toast("プロフィールを保存しました");return}if(e.target.id==="pl"){e.preventDefault();let n=$("#plname").value.trim();if(n&&!playlists.includes(n)){playlists.push(n);playlistItems[n]??=[];saveAll();other("再生リスト",'<div class="panel"><form id="pl"><input id="plname" placeholder="新しい再生リスト名" required><button class="primary">作成</button></form>'+playlists.map(x=>'<button class="action" data-open-playlist="'+esc(x)+'" style="display:block;width:100%;text-align:left;margin:10px 0">📂 '+esc(x)+'</button>').join("")+'</div>')}}};
(async()=>{document.body.classList.toggle("light-theme",themeMode==="light");try{await openDB()}catch(e){console.warn("IndexedDB unavailable",e);toast("デバイス動画の保存機能を利用できません")}home();let h=location.hash.match(/video=([^&]+)/);if(h)openVideo(decodeURIComponent(h[1]))})();
</script></body></html>
