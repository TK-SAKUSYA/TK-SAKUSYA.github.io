<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101522"><meta name="description" content="ワンタップで攻撃、タイミングよく回避。連続ボス撃破に挑む2Dアクションゲーム。"><link rel="manifest" href="manifest.webmanifest"><title>ONE TAP BOSS</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1a2435;--line:#33445d;--cyan:#57e5ed;--red:#ff6475;--gold:#ffd166;--muted:#9aabc1}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overscroll-behavior:none}body{min-height:100svh;display:flex;justify-content:center;align-items:stretch;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.app{width:min(100%,520px);min-height:100svh;display:flex;flex-direction:column;gap:10px;padding:12px 0}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:1000;letter-spacing:.07em;font-size:clamp(20px,6vw,27px)}.logo span{color:var(--cyan)}.mini{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.arena,.controls,.bottom{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:8px;text-align:center}.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:11px}.arena{position:relative;flex:1;min-height:280px;max-height:48svh;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#263d5c 0,#17263c 45%,#101a2a 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 14px 10px}.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 95%,#ffffff0c 96%);background-size:100% 28px;pointer-events:none}.boss-info,.player-info{width:100%;z-index:1}.barline{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px}.bar{height:10px;background:#080d17;border:1px solid #52647c;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5369,#ff9a72);transition:width .15s}.boss{z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s}.boss-face{width:clamp(105px,30vw,150px);aspect-ratio:1;border-radius:28%;display:grid;place-items:center;font-size:clamp(62px,18vw,92px);background:linear-gradient(145deg,#526b8e,#263c5e);border:4px solid #8ba4c5;box-shadow:0 12px 0 #0c1525,0 0 35px #60d6ff22;position:relative}.boss-face:after{content:"";position:absolute;inset:10px;border:2px solid #ffffff22;border-radius:24%}.boss-name{font-weight:900;font-size:18px}.boss-sub{font-size:11px;color:#bdcce0}.boss.hit{animation:hit .18s}.boss.attack{animation:attack .42s}.boss.dead{opacity:.2;transform:scale(.7) rotate(12deg)}@keyframes hit{50%{transform:translateX(8px);filter:brightness(2)}}@keyframes attack{50%{transform:translateY(16px) scale(1.08);filter:brightness(1.7)}}.warning{z-index:2;min-height:26px;font-weight:900;color:var(--gold);font-size:14px;text-align:center;text-shadow:0 2px 8px #000}.player-info .fill{background:linear-gradient(90deg,#30d9a2,#72f0c5)}.controls{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;border-radius:13px;min-height:78px;color:#08121c;font-weight:1000;font-size:clamp(18px,5vw,23px);touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:inset 0 -5px #0002;cursor:pointer}.action small{display:block;font-size:11px;font-weight:700;opacity:.75}.attack-btn{background:linear-gradient(145deg,#71f2f2,#25c6d2)}.dodge-btn{background:linear-gradient(145deg,#ffe08b,#ffb83d)}.action:active{transform:translateY(3px);box-shadow:inset 0 -2px #0002}.action:disabled{filter:grayscale(.8);opacity:.45}.bottom{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.hint{font-size:11px;color:var(--muted);line-height:1.5}.secondary{border:1px solid #53657c;border-radius:9px;background:#25354a;color:#fff;padding:9px 12px;font-weight:700}.overlay{position:absolute;inset:0;z-index:5;background:#08101ddd;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}.dialog{width:100%;max-width:340px;background:#1c2b40;border:1px solid #58708d;border-radius:18px;padding:22px 18px;box-shadow:0 15px 50px #0008}.dialog h1{font-size:27px;margin:0 0 8px}.dialog p{color:#c2d0e2;line-height:1.65;font-size:13px}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:var(--cyan);color:#07151b;font-weight:1000;font-size:17px;margin-top:8px}.hidden{display:none!important}@media(min-height:760px){.arena{max-height:50svh}.app{padding-top:18px;gap:12px}.action{min-height:88px}}@media(max-height:620px){.app{gap:6px;padding:6px 0}.arena{min-height:220px;max-height:42svh}.boss-face{width:95px}.action{min-height:62px}.stat{padding:5px}.stat b{font-size:17px}}
</style></head><body><main class="app"><header><div class="logo">ONE TAP <span>BOSS</span></div><div class="mini">BOSS RUSH · 2D ACTION</div></header>
<section class="stats"><div class="stat"><small>撃破数</small><b id="kills">0</b></div><div class="stat"><small>スコア</small><b id="score">0</b></div><div class="stat"><small>最高記録</small><b id="best">0</b></div></section>
<section class="arena" id="arena"><div class="boss-info"><div class="barline"><strong id="bossLabel">BOSS 1</strong><span id="bossHpText">HP 90 / 90</span></div><div class="bar"><div class="fill" id="bossHp"></div></div></div><div class="boss" id="boss"><div class="boss-face" id="bossFace">👹</div><div class="boss-name" id="bossName">赤鬼</div><div class="boss-sub" id="bossDesc">正面から突進してくる！</div></div><div class="warning" id="warning" aria-live="polite">攻撃ボタンで戦闘開始！</div><div class="player-info"><div class="barline"><strong>PLAYER</strong><span id="playerHpText">HP 100 / 100</span></div><div class="bar"><div class="fill" id="playerHp"></div></div></div><div class="overlay" id="overlay"><div class="dialog"><h1>ONE TAP BOSS</h1><p>攻撃でボスにダメージ！<br>敵の予告が出たら回避！<br>ボスを連続撃破して記録を伸ばそう。</p><p>操作：攻撃 / 回避（PCは A / Space）</p><button class="primary" id="startBtn">ゲームスタート</button></div></div></section>
<section class="controls"><button class="action attack-btn" id="attackBtn">⚔️ 攻撃<small>タップして攻撃</small></button><button class="action dodge-btn" id="dodgeBtn">💨 回避<small>予告中にタップ</small></button></section><section class="bottom"><div class="hint" id="status">ボスの攻撃予告を見逃すな！<br>回避成功でノーダメージ。</div><button class="secondary" id="soundBtn" aria-pressed="true">🔊 音 ON</button><button class="secondary" id="resetBtn">↻ 最初から</button></section></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);const bosses=[{name:'赤鬼',face:'👹',desc:'一直線に突進！',pattern:'charge',hp:90,damage:18},{name:'スライム王',face:'🟢',desc:'上から大ジャンプ！',pattern:'jump',hp:125,damage:22},{name:'機械竜',face:'🐲',desc:'連続で火球を放つ！',pattern:'fire',hp:155,damage:15},{name:'影の騎士',face:'🗡️',desc:'一瞬で斬り込む！',pattern:'slash',hp:190,damage:28},{name:'雷帝',face:'⚡',desc:'落雷を呼び寄せる！',pattern:'thunder',hp:230,damage:32},{name:'深淵の王',face:'👾',desc:'強烈な波動を放つ！',pattern:'pulse',hp:280,damage:38}];let state='title',playerHp=100,bossHp=90,maxBossHp=90,kills=0,score=0,best=0,attackReady=true,warning=false,dodged=false,sound=true,attackTimer=null,resolveTimer=null,audio=null;try{best=Number(localStorage.getItem('otb-best')||0)}catch(e){}const update=()=>{$('kills').textContent=kills;$('score').textContent=score;$('best').textContent=best;$('bossHp').style.width=Math.max(0,bossHp/maxBossHp*100)+'%';$('bossHpText').textContent='HP '+Math.max(0,bossHp)+' / '+maxBossHp;$('playerHp').style.width=Math.max(0,playerHp)+'%';$('playerHpText').textContent='HP '+playerHp+' / 100'};const beep=(f=440,d=.07,t='sine')=>{if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}};const currentBoss=()=>bosses[kills%bosses.length];const setBoss=()=>{const b=currentBoss();maxBossHp=Math.round(b.hp*(1+Math.floor(kills/bosses.length)*.22));bossHp=maxBossHp;$('bossFace').textContent=b.face;$('bossName').textContent=b.name;$('bossDesc').textContent=b.desc;$('boss').className='boss';$('warning').textContent='攻撃ボタンで攻撃！';update()};const buttons=on=>{$('attackBtn').disabled=!on;$('dodgeBtn').disabled=!on};const clearTimers=()=>{clearTimeout(attackTimer);clearTimeout(resolveTimer);attackTimer=resolveTimer=null};const start=()=>{clearTimers();state='playing';playerHp=100;kills=0;score=0;attackReady=true;warning=false;dodged=false;$('overlay').classList.add('hidden');buttons(true);$('status').innerHTML='攻撃を当ててボスを倒そう！<br>予告が出たら回避！';setBoss();scheduleAttack()};const scheduleAttack=()=>{if(state!=='playing')return;clearTimeout(attackTimer);attackTimer=setTimeout(enemyTelegraph,Math.max(1250,2350-kills*55))};const enemyTelegraph=()=>{if(state!=='playing')return;warning=true;dodged=false;const p=currentBoss().pattern;$('warning').textContent='⚠ '+({charge:'突進が来る！ 回避！',jump:'ジャンプ攻撃！ 回避！',fire:'火球連射！ 回避！',slash:'斬撃が来る！ 回避！',thunder:'落雷注意！ 回避！',pulse:'波動が来る！ 回避！'}[p]);$('status').textContent='今だ！ 回避ボタンをタップ！';$('boss').classList.remove('hit');$('boss').classList.add('attack');beep(260,.2,'triangle');const windows={charge:1150,jump:850,fire:1350,slash:650,thunder:1000,pulse:1500};resolveTimer=setTimeout(resolveAttack,windows[p]||1050)};const resolveAttack=()=>{if(state!=='playing'||!warning)return;warning=false;$('boss').classList.remove('attack');if(dodged){$('warning').textContent='回避成功！';$('status').textContent='ナイス回避！ 反撃しよう！';score+=25;beep(760,.1)}else{const dmg=currentBoss().damage;playerHp=Math.max(0,playerHp-dmg);$('warning').textContent='攻撃を受けた！ -'+dmg+' HP';$('status').textContent='攻撃を受けた！ 次はタイミングよく回避！';beep(110,.2,'sawtooth');if(playerHp<=0){update();gameOver();return}}update();scheduleAttack()};const attack=()=>{if(state==='title'){start();return}if(state!=='playing'||!attackReady)return;attackReady=false;const damage=18+Math.min(12,Math.floor(kills/3)*2);bossHp=Math.max(0,bossHp-damage);score+=10;$('boss').classList.remove('hit');void $('boss').offsetWidth;$('boss').classList.add('hit');$('warning').textContent='ヒット！ -'+damage;$('status').textContent='連打OK！ 敵の予告中は回避を優先！';beep(540,.06,'square');update();setTimeout(()=>{attackReady=true},210);if(bossHp<=0)bossDefeated()};const dodge=()=>{if(state!=='playing'||!warning||dodged)return;dodged=true;$('warning').textContent='💨 回避！';$('status').textContent='成功！ 攻撃チャンス！';beep(900,.08)};const bossDefeated=()=>{state='transition';warning=false;clearTimers();kills++;score+=100+kills*20;if(kills>best){best=kills;try{localStorage.setItem('otb-best',String(best))}catch(e){}}$('boss').classList.add('dead');$('warning').textContent='BOSS DOWN!';$('status').textContent='撃破ボーナス獲得！ 次のボスが来る…';buttons(false);update();beep(660,.18);setTimeout(()=>{if(state!=='transition')return;setBoss();state='playing';buttons(true);scheduleAttack()},1100)};const gameOver=()=>{state='over';clearTimers();buttons(false);$('warning').textContent='GAME OVER';$('status').textContent='撃破数 '+kills+' / スコア '+score;$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').innerHTML='撃破数：<b>'+kills+'</b><br>スコア：<b>'+score+'</b><br>最高記録：<b>'+best+'</b>';$('startBtn').textContent='もう一度プレイ'};$('startBtn').addEventListener('click',start);$('attackBtn').addEventListener('click',attack);$('dodgeBtn').addEventListener('click',dodge);$('resetBtn').addEventListener('click',start);$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 音 ON':'🔇 音 OFF';$('soundBtn').setAttribute('aria-pressed',String(sound));if(sound)beep(500)});document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='KeyA'||e.code==='Enter')attack();if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();dodge()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){warning=false;clearTimeout(resolveTimer);$('warning').textContent='画面に戻ったら戦闘再開';scheduleAttack()}});$('best').textContent=best;buttons(false);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();</script></body></html>
