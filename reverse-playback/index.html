<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逆再生アプリ</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--line:#2d3a5c;--accent:#8b7cff;--muted:#aab6d3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#26376a,transparent 65%),var(--bg);color:#f4f7ff;font-family:system-ui,sans-serif}main{width:min(900px,100%);margin:auto;padding:22px 14px 40px}header{text-align:center;padding:12px 0 20px}h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 8px}.muted,.status{color:var(--muted)}.card{background:linear-gradient(145deg,var(--panel),#11182a);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.drop{border:2px dashed #59688f;border-radius:15px;padding:24px 12px;text-align:center;background:#0d1427}.drop strong{display:block;font-size:1.1rem;margin-bottom:8px}button,.filelabel{border:0;border-radius:11px;background:var(--accent);color:white;padding:12px 15px;font:inherit;font-weight:750;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:8px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#1d2944;border:1px solid var(--line)}.green{background:#087d61}input[type=file]{display:none}video,canvas{display:block;width:100%;max-height:440px;object-fit:contain;background:#05070d;border-radius:12px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.controls button{flex:1;min-width:130px}.hidden{display:none!important}.line{height:9px;background:#0a1020;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6f61ff,#64e6b1)}.status{font-size:.9rem;margin-top:7px;min-height:1.3em}input[type=range]{width:100%;accent-color:var(--accent)}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}.notice{font-size:.9rem;line-height:1.7;color:var(--muted)}@media(max-width:520px){main{padding:10px}.card{padding:12px}.controls button{min-width:100px;flex:1 1 40%}}
</style></head><body><main><header><h1>⏪ 逆再生アプリ</h1><p class="muted">動画を読み込んで、逆再生プレビュー＆保存！</p></header>
<section class="card"><div class="drop" id="drop"><strong>🎬 動画ファイルを読み込もう</strong><p class="muted">ファイルをドラッグ＆ドロップ、または選択</p><label class="filelabel" for="picker">📁 動画を選択</label><input id="picker" type="file" accept="video/*"><p class="muted">処理はブラウザ内で行われ、動画は外部送信されません。</p></div></section>
<section class="card hidden" id="editor"><video id="source" playsinline preload="metadata" controls></video><p class="muted" id="meta"></p><div class="controls"><button id="prepare">🔄 逆再生データを作成</button><button class="secondary" id="reset">✖ 動画を外す</button></div><div class="line hidden" id="progress"><div class="bar" id="bar"></div></div><div class="status" id="status"></div></section>
<section class="card hidden" id="result"><h2>⏪ 逆再生プレビュー</h2><canvas id="screen" width="640" height="360"></canvas><div class="time"><span>再生位置</span><span id="time">0:00 / 0:00</span></div><input id="seek" type="range" min="0" max="1000" value="1000"><div class="controls"><button id="play">▶ 逆再生</button><button class="secondary" id="pause">⏸ 一時停止</button><button class="green" id="export">💾 動画を保存</button></div><div class="line hidden" id="exportProgress"><div class="bar" id="exportBar"></div></div><div class="status" id="exportStatus"></div><p class="notice">保存形式はWebMです。長い動画はメモリ不足になる場合があります。まずは10〜20秒程度の短い動画で試してください。</p></section>
<section class="card"><b>使い方</b><p class="notice">①動画を選択 → ②逆再生データを作成 → ③プレビュー → ④動画を保存。短い動画での利用をおすすめします。</p></section><footer class="muted" style="text-align:center;font-size:.8rem">逆再生アプリ · 単一HTML · 外部ライブラリ不使用</footer></main>
<script>
(function(){
var $=function(id){return document.getElementById(id)},picker=$('picker'),source=$('source'),editor=$('editor'),result=$('result'),screen=$('screen'),ctx=screen.getContext('2d'),file=null,url=null,frames=[],duration=0,playingTimer=null,pos=0,exporting=false;
function fmt(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
function clearPlay(){if(playingTimer)clearInterval(playingTimer);playingTimer=null;$('play').textContent='▶ 逆再生'}
function cleanup(){clearPlay();if(url)URL.revokeObjectURL(url);url=null;file=null;frames=[];duration=0;source.removeAttribute('src');source.load();editor.classList.add('hidden');result.classList.add('hidden');$('progress').classList.add('hidden');$('exportProgress').classList.add('hidden');picker.value=''}
function load(f){if(!f)return;if(!f.type.startsWith('video/')){alert('動画ファイルを選んでね！');return}cleanup();file=f;url=URL.createObjectURL(f);source.src=url;editor.classList.remove('hidden');source.onloadedmetadata=function(){duration=source.duration;$('meta').textContent='ファイル：'+file.name+' · 長さ：'+fmt(duration)}}
picker.addEventListener('change',function(e){load(e.target.files[0])});$('reset').onclick=cleanup;
$('drop').addEventListener('dragover',function(e){e.preventDefault()});$('drop').addEventListener('drop',function(e){e.preventDefault();load(e.dataTransfer.files[0])});
function seek(t){return new Promise(function(resolve,reject){var done=function(){source.removeEventListener('seeked',done);resolve()},fail=function(){source.removeEventListener('error',fail);reject(Error('動画を読み込めませんでした'))};source.addEventListener('seeked',done,{once:true});source.addEventListener('error',fail,{once:true});source.currentTime=Math.max(0,Math.min(duration-.02,t));setTimeout(done,1800)})}
$('prepare').onclick=async function(){if(!file||!duration){alert('先に動画を読み込んでね');return}if(duration>45&&!confirm('45秒以上の動画です。メモリ不足になる可能性があります。続けますか？'))return;var btn=$('prepare'),old=source.currentTime;btn.disabled=true;$('reset').disabled=true;$('progress').classList.remove('hidden');result.classList.add('hidden');frames=[];try{var ratio=Math.min(1,640/Math.max(source.videoWidth,source.videoHeight));screen.width=Math.max(2,Math.round(source.videoWidth*ratio));screen.height=Math.max(2,Math.round(source.videoHeight*ratio));var fps=duration<=12?15:duration<=25?10:6,total=Math.max(2,Math.ceil(duration*fps));for(var i=0;i<total;i++){await seek(Math.min(duration-.025,i/fps));var c=document.createElement('canvas');c.width=screen.width;c.height=screen.height;c.getContext('2d',{alpha:false}).drawImage(source,0,0,c.width,c.height);frames.push(c);if(i%2===0||i===total-1){$('status').textContent='フレーム読み込み中 '+(i+1)+' / '+total;$('bar').style.width=Math.round((i+1)/total*100)+'%';await new Promise(function(r){setTimeout(r,0)})}}pos=duration;draw(pos);result.classList.remove('hidden');$('status').textContent='完了！ '+frames.length+' フレームを準備しました'}catch(e){frames=[];alert('処理できませんでした。短い動画で試してください。')}finally{try{await seek(old)}catch(e){}btn.disabled=false;$('reset').disabled=false}};
function draw(t){if(!frames.length)return;var i=Math.max(0,Math.min(frames.length-1,Math.floor(t/duration*(frames.length-1))));ctx.drawImage(frames[i],0,0,screen.width,screen.height);$('time').textContent=fmt(t)+' / '+fmt(duration);$('seek').value=Math.round(t/duration*1000)}
$('play').onclick=function(){if(!frames.length)return;clearPlay();if(pos<=0)pos=duration;var last=performance.now();$('play').textContent='⏪ 再生中…';playingTimer=setInterval(function(){var now=performance.now();pos-=(now-last)/1000;last=now;if(pos<=0){pos=duration;clearPlay()}draw(pos)},33)};
$('pause').onclick=clearPlay;$('seek').oninput=function(){clearPlay();pos=duration*Number(this.value)/1000;draw(pos)};
$('export').onclick=async function(){if(!frames.length||exporting)return;if(!window.MediaRecorder||!screen.captureStream){alert('このブラウザは動画保存に対応していません。ChromeまたはEdgeを試してください。');return}exporting=true;$('export').disabled=true;$('exportProgress').classList.remove('hidden');var stream=screen.captureStream(20),chunks=[];try{var mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(function(x){return MediaRecorder.isTypeSupported(x)})||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),stopped=new Promise(function(resolve){rec.onstop=resolve});rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.start(200);for(var i=frames.length-1;i>=0;i--){ctx.drawImage(frames[i],0,0,screen.width,screen.height);$('exportBar').style.width=Math.round((frames.length-i)/frames.length*100)+'%';$('exportStatus').textContent='動画を書き出し中 '+(frames.length-i)+' / '+frames.length;await new Promise(function(r){setTimeout(r,50)})}await new Promise(function(r){setTimeout(r,250)});rec.stop();await stopped;var blob=new Blob(chunks,{type:rec.mimeType||'video/webm'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(file.name.replace(/\.[^.]+$/,'')||'reverse')+'-reverse.webm';a.click();setTimeout(function(){URL.revokeObjectURL(u)},30000);$('exportStatus').textContent='保存完了！ '+(blob.size/1048576).toFixed(1)+' MB'}catch(e){alert('保存に失敗しました。ChromeまたはEdgeで試してください。')}finally{stream.getTracks().forEach(function(t){t.stop()});exporting=false;$('export').disabled=false}};
window.addEventListener('beforeunload',function(){if(url)URL.revokeObjectURL(url)});
})();
</script></body></html>
