<script>
const search=document.getElementById('search'),cards=[...document.querySelectorAll('.game')],filters=[...document.querySelectorAll('.filter')],empty=document.getElementById('empty');let category='all';
function apply(){let n=0;const q=search.value.trim().toLowerCase();cards.forEach(c=>{const show=(category==='all'||c.dataset.cat===category)&&c.innerText.toLowerCase().includes(q);c.hidden=!show;if(show)n++});empty.style.display=n?'none':'block'}
search.addEventListener('input',apply);filters.forEach(b=>b.addEventListener('click',()=>{category=b.dataset.filter;filters.forEach(x=>x.classList.toggle('active',x===b));apply()}));
const modal=document.getElementById('modal'),close=()=>{modal.classList.remove('open');document.body.style.overflow=''};cards.forEach(c=>c.addEventListener('click',()=>{document.getElementById('modalMeta').textContent='©tk_corporation · '+c.querySelector('.num').textContent;document.getElementById('modalEmoji').textContent=c.dataset.emoji;document.getElementById('modalTitle').textContent=c.dataset.name;document.getElementById('modalDesc').textContent=c.dataset.desc;document.getElementById('modalGenre').textContent=c.dataset.genre;modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus()}));document.getElementById('close').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
