<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>アリーナ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d9f5;touch-action:none}canvas{display:block}#mobile{position:fixed;inset:0;display:none;pointer-events:none}.pad{position:absolute;left:18px;bottom:22px;display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px}.key{pointer-events:auto;border:1px solid #ffffff70;background:#203b35a8;color:white;border-radius:15px;font-size:22px;font-weight:800;touch-action:none;backdrop-filter:blur(5px)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.jump{position:absolute;right:25px;bottom:30px;width:76px;height:76px;border-radius:50%;font-size:14px;background:#247fbaad}.look{position:absolute;right:0;top:0;width:45%;height:100%;pointer-events:auto}
@media(pointer:coarse),(max-width:760px){#mobile{display:block}}
</style></head><body>
<div id="mobile"><div class="pad"><button class="key up" data-key="forward">▲</button><button class="key left" data-key="left">◀</button><button class="key down" data-key="back">▼</button><button class="key right" data-key="right">▶</button></div><button class="key jump" data-key="jump">JUMP</button><div class="look" id="look"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9d9f5);scene.fog=new THREE.Fog(0xa9d9f5,100,330);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f8ff,0x54734b,2.0));const sun=new THREE.DirectionalLight(0xfff4d9,2.1);sun.position.set(-45,85,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
const grassMat=new THREE.MeshStandardMaterial({color:0x65bd58,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
// Endless grass detail tiles: repositioned around the player, with no visible boundary.
const detailGroup=new THREE.Group();scene.add(detailGroup);const detailMat=new THREE.MeshStandardMaterial({color:0x3d9b45,roughness:1});
const flowerMats=[0xfff4d1,0xffdf75,0xffffff,0xf6a6b8].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const tiles=[];const tileSize=100,grid=5;
for(let tx=0;tx<grid;tx++)for(let tz=0;tz<grid;tz++){const g=new THREE.Group();const positions=[];for(let i=0;i<160;i++){const x=(Math.random()-.5)*tileSize,z=(Math.random()-.5)*tileSize,h=.18+Math.random()*.32;positions.push({x,z,h})}for(const p of positions){const blade=new THREE.Mesh(new THREE.ConeGeometry(.045,p.h,3),detailMat);blade.position.set(p.x,p.h/2,p.z);blade.castShadow=false;g.add(blade);if(Math.random()<.045){const flower=new THREE.Mesh(new THREE.SphereGeometry(.10,5,4),flowerMats[Math.floor(Math.random()*flowerMats.length)]);flower.position.set(p.x,p.h+.05,p.z);g.add(flower)}}detailGroup.add(g);tiles.push(g)}
function updateTiles(){const cx=Math.floor(player.position.x/tileSize),cz=Math.floor(player.position.z/tileSize);let n=0;for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++){tiles[n].position.set((cx+x)*tileSize,0,(cz+z)*tileSize);n++}}
const player=new THREE.Group();scene.add(player);
const skin=new THREE.MeshStandardMaterial({color:0xffc99c,roughness:.85}),shirt=new THREE.MeshStandardMaterial({color:0x258fe0,roughness:.85}),pants=new THREE.MeshStandardMaterial({color:0x263d60,roughness:.9}),hair=new THREE.MeshStandardMaterial({color:0x382a22,roughness:1}),eyeMat=new THREE.MeshStandardMaterial({color:0x172333});
function part(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;player.add(o);return o}
part(1.05,1.25,.62,shirt,0,1.45,0);part(.88,.88,.88,skin,0,2.55,0);part(.94,.24,.94,hair,0,3.08,0);part(.12,.12,.06,eyeMat,-.2,2.62,.45);part(.12,.12,.06,eyeMat,.2,2.62,.45);const legs=[part(.38,.85,.42,pants,-.28,.43,0),part(.38,.85,.42,pants,.28,.43,0)];const arms=[part(.32,1,.38,skin,-.72,1.5,0),part(.32,1,.38,skin,.72,1.5,0)];
player.position.set(0,0,0);
let yaw=0,pitch=-.18,velY=0,onGround=true,keys={},touch={},last=performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0024;pitch=clamp(pitch-e.movementY*.0018,-.8,.35)}});
renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>touch[k]=false)});
let lastX=0,lastY=0,dragging=false;const look=document.querySelector('#look');look.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.006;pitch=clamp(pitch-(e.clientY-lastY)*.004,-.8,.35);lastX=e.clientX;lastY=e.clientY});for(const ev of ['pointerup','pointercancel','lostpointercapture'])look.addEventListener(ev,()=>dragging=false);
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;const f=Number(keys.KeyW||keys.ArrowUp||touch.forward)-Number(keys.KeyS||keys.ArrowDown||touch.back),r=Number(keys.KeyD||keys.ArrowRight||touch.right)-Number(keys.KeyA||keys.ArrowLeft||touch.left);const moving=f!==0||r!==0;const dx=Math.sin(yaw)*f+Math.cos(yaw)*r,dz=Math.cos(yaw)*f-Math.sin(yaw)*r,len=Math.hypot(dx,dz)||1;const speed=(keys.ShiftLeft||keys.ShiftRight?12:7.5)*dt;player.position.x+=dx/len*speed;player.position.z+=dz/len*speed;
if((keys.Space||touch.jump)&&onGround){velY=9.5;onGround=false}velY-=23*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;onGround=true}
if(moving){player.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(now*.012)*.55;legs[0].rotation.x=swing;legs[1].rotation.x=-swing;arms[0].rotation.x=-swing;arms[1].rotation.x=swing}else{for(const p of [...legs,...arms])p.rotation.x=0}
updateTiles();ground.position.x=player.position.x;ground.position.z=player.position.z;const target=new THREE.Vector3(player.position.x,player.position.y+1.65,player.position.z);const distance=8.5;camera.position.set(target.x-Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance+1.0,target.z-Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);renderer.render(scene,camera)}
updateTiles();requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
