<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>アリーナ — 3D WORLD</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2d;color:#fff;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand,.hint,.counter{background:#101b30d9;border:1px solid #ffffff28;border-radius:14px;padding:10px 14px;backdrop-filter:blur(10px);box-shadow:0 5px 20px #0004}.brand{font-size:20px;font-weight:1000;letter-spacing:.08em}.brand small{display:block;font-size:10px;letter-spacing:.22em;color:#67e8f9}.right{display:flex;gap:8px;align-items:center}.counter{font-weight:800;color:#a5f3fc}.hint{font-size:12px;color:#dbeafe;line-height:1.5;text-align:right}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:26px;border-radius:24px;background:linear-gradient(145deg,#1e3554f5,#101a2ff5);border:1px solid #ffffff35;text-align:center;box-shadow:0 25px 80px #0009;pointer-events:auto}.center h1{font-size:clamp(36px,9vw,58px);margin:0;letter-spacing:-.06em}.center h1 span{color:#67e8f9}.center p{color:#c4d7ee;line-height:1.7;font-size:14px}.btn{border:0;border-radius:13px;padding:13px 20px;font-weight:950;font-size:15px;background:linear-gradient(135deg,#67e8f9,#38bdf8);color:#082033;cursor:pointer;box-shadow:0 5px 0 #087eaa;width:100%;margin-top:8px}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #087eaa}.hide{display:none}.crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1.5px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}.mobile{position:absolute;bottom:18px;left:16px;right:16px;display:none;justify-content:space-between;align-items:end}.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:5px}.touch{pointer-events:auto;border:1px solid #ffffff55;border-radius:15px;background:#152944c9;color:white;font-size:22px;font-weight:900;backdrop-filter:blur(8px);touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.jump{width:76px;height:76px;border-radius:50%;background:#087eaaee;font-size:16px}.toast{position:absolute;top:82px;left:50%;transform:translateX(-50%);background:#0c172be8;border:1px solid #67e8f9;border-radius:99px;padding:9px 16px;font-weight:850;opacity:0;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}@media(pointer:coarse),(max-width:760px){.mobile{display:flex}.hint{display:none}.brand{font-size:16px}.center{padding:20px}.counter{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<div id="ui">
 <div class="top"><div class="brand">ARENA <small>3D BLOCK WORLD</small></div><div class="right"><div class="counter">⭐ <span id="score">0</span> pts</div><div class="hint">WASD / 矢印キー：移動<br>マウス：視点　Space：ジャンプ<br>Shift：ダッシュ　Esc：解除</div></div></div>
 <div class="crosshair" id="cross"></div><div class="toast" id="toast"></div>
 <div class="center" id="start"><h1>アリ<span>ーナ</span></h1><p>広大なブロック型3D空間を自由に探索しよう！<br>ジャンプ台や浮遊島、巨大ゲートが待っている。</p><button class="btn" id="play">プレイ開始 ▶</button><p style="font-size:11px">PC：WASD＋マウス / スマホ：画面タッチ操作</p></div>
 <div class="mobile" id="mobile"><div class="pad"><button class="touch up" data-key="forward">▲</button><button class="touch left" data-key="left">◀</button><button class="touch down" data-key="back">▼</button><button class="touch right" data-key="right">▶</button></div><button class="touch jump" data-key="jump">JUMP</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bdcf4);scene.fog=new THREE.Fog(0x9bdcf4,65,210);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff6ff,0x456080,2.1));const sun=new THREE.DirectionalLight(0xfff4d6,2.2);sun.position.set(-35,65,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x55b978),side=mat(0x397c64),stone=mat(0x8299ae),dark=mat(0x344d68),gold=mat(0xffcf63),cyan=mat(0x36d6e8),white=mat(0xf1f7ff);
function block(x,y,z,w,h,d,m,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
block(0,-1,0,150,2,150,grass);for(let i=0;i<90;i++){const x=(Math.random()-.5)*140,z=(Math.random()-.5)*140;if(Math.abs(x)<12&&Math.abs(z)<12)continue;const h=1+Math.random()*5;block(x,h/2,z,1.5+Math.random()*2,h,1.5+Math.random()*2,i%3?side:stone)}
// Arena walls and signature structures
for(let i=-1;i<=1;i+=2){block(i*73,8,0,3,18,150,dark);block(0,8,i*73,150,18,3,dark)}
// central plaza
block(0,.2,0,22,.4,22,stone);block(0,1.4,-10,18,2,1,gold);block(0,1.4,10,18,2,1,gold);
for(let i=0;i<8;i++){const a=i*Math.PI/4;const x=Math.cos(a)*24,z=Math.sin(a)*24;block(x,2,z,5,4,5,i%2?cyan:gold)}
// floating platforms + stepping stones
const platforms=[];for(let i=0;i<12;i++){const a=i*.72,r=23+i*2.4,x=Math.cos(a)*r,z=Math.sin(a)*r,y=5+(i%4)*2;const p=block(x,y,z,7,1.2,7,i%3===0?gold:i%3===1?cyan:stone);platforms.push(p);block(x,y-1.3,z,5,.8,5,dark)}
// towers and gate
for(let i=0;i<4;i++){const x=i%2?48:-48,z=i<2?-48:48;block(x,8,z,8,16,8,i%2?cyan:gold);block(x,17,z,10,2,10,dark)}
block(0,8,-62,24,16,3,dark);block(-10,8,-62,3,16,3,gold);block(10,8,-62,3,16,3,gold);block(0,17,-62,23,3,3,gold);
// trees
for(let i=0;i<35;i++){const x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.abs(x)<20&&Math.abs(z)<20)continue;block(x,2,z,1.4,4,1.4,mat(0x80583c));const crown=block(x,5,z,5,4,5,mat(i%2?0x27a66b:0x3bba78));crown.castShadow=true}
// collectible stars
const pickups=[];for(let i=0;i<24;i++){const a=i*2.4,x=Math.cos(a)*(18+(i%5)*8),z=Math.sin(a)*(18+(i%5)*8),y=2.5+(i%3)*2;const s=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);s.position.set(x,y,z);scene.add(s);pickups.push(s)}
// Player block avatar
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.3,.7),mat(0x36a8ed));body.position.y=1.45;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),mat(0xffc99b));head.position.y=2.55;head.castShadow=true;player.add(head);const hair=new THREE.Mesh(new THREE.BoxGeometry(.96,.25,.96),mat(0x26344a));hair.position.y=3.05;player.add(hair);for(const x of [-.22,.22]){const eye=new THREE.Mesh(new THREE.BoxGeometry(.1,.13,.05),dark);eye.position.set(x,2.6,.48);player.add(eye)}for(const x of [-.38,.38]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.38,.85,.42),dark);leg.position.set(x,.43,0);leg.castShadow=true;player.add(leg)}
player.position.set(0,0,5);scene.add(player);
let yaw=0,pitch=-.22,velY=0,onGround=true,score=0,playing=false,keys={},touch={},last=performance.now();const scoreEl=document.querySelector('#score'),toastEl=document.querySelector('#toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1400)}
function start(){playing=true;document.querySelector('#start').classList.add('hide');if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()}
document.querySelector('#play').addEventListener('click',start);
document.addEventListener('pointerlockchange',()=>{document.querySelector('#cross').style.opacity=document.pointerLockElement?'1':'.25'});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.0,Math.min(.55,pitch-e.movementY*.002))}});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&playing)document.querySelector('#start').classList.remove('hide')});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>touch[k]=false)});
renderer.domElement.addEventListener('click',()=>{if(playing&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;const t=now*.001;
for(const p of pickups){p.rotation.y+=dt*1.6;p.position.y=2.5+Math.sin(t*2+p.position.x)*.35;if(player.position.distanceTo(p.position)<2.2){scene.remove(p);pickups.splice(pickups.indexOf(p),1);score+=10;scoreEl.textContent=score;toast('⭐ +10 POINTS!');break}}
if(playing){const f=Number(keys.KeyW||keys.ArrowUp||touch.forward)-Number(keys.KeyS||keys.ArrowDown||touch.back),r=Number(keys.KeyD||keys.ArrowRight||touch.right)-Number(keys.KeyA||keys.ArrowLeft||touch.left);const speed=(keys.ShiftLeft||keys.ShiftRight?15:9)*dt;const dx=Math.sin(yaw)*f+Math.cos(yaw)*r,dz=Math.cos(yaw)*f-Math.sin(yaw)*r;const len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*speed;player.position.z+=dz/len*speed;player.position.x=THREE.MathUtils.clamp(player.position.x,-69,69);player.position.z=THREE.MathUtils.clamp(player.position.z,-69,69);if((keys.Space||touch.jump)&&onGround){velY=10;onGround=false}velY-=24*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;onGround=true}if(f||r)player.rotation.y=Math.atan2(dx,dz);
}
const target=new THREE.Vector3(player.position.x,player.position.y+1.6,player.position.z);const dist=matchMedia('(pointer:coarse)').matches?9:8;camera.position.set(target.x-Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z-Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target);renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
