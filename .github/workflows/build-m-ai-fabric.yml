name: Build M-AI Fabric Mod

on:
  push:
    paths:
      - 'M-AI/fabric-mod/**'
      - 'M-AI/src/**'
      - 'M-AI/package.json'
      - '.github/workflows/build-m-ai-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check M-AI JavaScript
        working-directory: M-AI
        run: npm run check

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build Fabric mod
        working-directory: M-AI/fabric-mod
        run: gradle build --no-daemon

      - name: Prepare installation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find M-AI/fabric-mod/build/libs -maxdepth 1 -type f -name 'm-ai-fabric-*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one remapped M-AI mod JAR, found ${#jars[@]}."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          cp "${jars[0]}" dist/M-AI-Fabric-26.3.jar
          cp M-AI/fabric-mod/README.md dist/INSTALLATION.txt
          sha256sum dist/M-AI-Fabric-26.3.jar > dist/SHA256SUMS.txt
          {
            echo "M-AI Fabric Mod for Minecraft Java 26.3"
            echo
            echo "Install Fabric Loader for Minecraft 26.3 and Fabric API for 26.3."
            echo "Copy M-AI-Fabric-26.3.jar into the Minecraft instance mods folder."
            echo "The client sends position, health, dimension and main-hand item observations, and forwards ordinary player chat, to 127.0.0.1:25580."
            echo "Run npm run bridge and npm run bridge:think in separate terminals to enable two-way local Ollama chat in Minecraft."
            echo "The mod displays AI replies but does not yet control player movement or spawn a separate AI player."
          } > dist/QUICK-START.txt

      - name: Upload ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: M-AI-Fabric-26.3
          path: dist/*
          if-no-files-found: error
          retention-days: 30
