name: Build M-AI Fabric Mod

on:
  push:
    paths:
      - 'M-AI/fabric-mod/**'
      - 'M-AI/src/**'
      - 'M-AI/package.json'
      - '.github/workflows/build-m-ai-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check M-AI JavaScript
        working-directory: M-AI
        run: npm run check

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Diagnose build environment
        run: |
          echo "Runner: $RUNNER_OS"
          node --version
          npm --version
          java -version
          gradle --version
          echo "Minecraft: 26.3"
          echo "Fabric Loader: 0.20.1"
          echo "Fabric API: 0.166.2+26.3"

      - name: Build Fabric mod
        working-directory: M-AI/fabric-mod
        run: gradle build --no-daemon

      - name: Prepare installation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find M-AI/fabric-mod/build/libs -maxdepth 1 -type f -name 'm-ai-fabric-*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one built M-AI mod JAR, found ${#jars[@]}."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          cp "${jars[0]}" dist/M-AI-Fabric-26.3.jar
          cp M-AI/fabric-mod/README.md dist/INSTALLATION.txt
          cp M-AI/start-bridge.bat dist/start-bridge.bat
          cp M-AI/config.example.json dist/config.example.json
          sha256sum dist/M-AI-Fabric-26.3.jar > dist/SHA256SUMS.txt
          {
            echo "M-AI Minecraft 26.3 chat-only playtest"
            echo
            echo "1. Install Fabric Loader for Minecraft Java 26.3 and Fabric API for 26.3."
            echo "2. Copy M-AI-Fabric-26.3.jar into your Minecraft instance mods folder."
            echo "3. Keep Ollama running locally with the model named in config.example.json."
            echo "4. Extract M-AI-Chat-Playtest.zip into a folder on your PC."
            echo "5. Double-click start-bridge.bat. Keep both terminal windows open."
            echo "6. Start Minecraft with the Fabric 26.3 profile and enter a single-player world."
            echo "7. Send a normal chat message. The local AI reply should appear with [M-AI]."
            echo
            echo "This playtest supports chat only. It does not move, mine, build, or spawn an AI player."
            echo "Requires Windows, Node.js 22+, Ollama, Fabric Loader/API, and Minecraft Java 26.3."
          } > dist/QUICK-START.txt
          mkdir -p dist/playtest/src
          cp M-AI/start-bridge.bat dist/playtest/
          cp M-AI/config.example.json dist/playtest/
          cp M-AI/src/bridge-server.js dist/playtest/src/
          cp M-AI/src/bridge-brain.js dist/playtest/src/
          cp M-AI/src/memory.js dist/playtest/src/
          cp dist/M-AI-Fabric-26.3.jar dist/playtest/
          cp dist/QUICK-START.txt dist/playtest/
          (cd dist && zip -qr M-AI-Chat-Playtest.zip playtest)
          rm -rf dist/playtest

      - name: Upload ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: M-AI-Fabric-26.3
          path: dist/*
          if-no-files-found: error
          retention-days: 30
