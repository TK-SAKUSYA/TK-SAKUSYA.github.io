name: Build M-AI Fabric Mod

on:
  push:
    paths:
      - 'M-AI/fabric-mod/**'
      - '.github/workflows/build-m-ai-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build Fabric mod
        working-directory: M-AI/fabric-mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: m-ai-fabric-mod-26.3
          path: M-AI/fabric-mod/build/libs/*.jar
          if-no-files-found: error
