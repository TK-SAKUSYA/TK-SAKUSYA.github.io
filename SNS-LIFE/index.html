<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7057e8"><title>SNS LIFE - あなたのSNSを育てよう</title>
<style>
:root{--bg:#f5f6fb;--panel:#fff;--text:#202235;--muted:#85879a;--line:#e9eaf1;--accent:#7057e8;--soft:#f0edff;--green:#16a477;--red:#e45d70;--shadow:0 8px 30px #2520440a}
[data-theme=dark]{--bg:#14151d;--panel:#20212c;--text:#f2f2fa;--muted:#a2a3b5;--line:#333441;--accent:#a18cff;--soft:#302a48;--shadow:0 8px 30px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0} .app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;padding:26px 18px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{font-size:23px;font-weight:900;letter-spacing:-1px;margin:0 10px 28px}.brand span{color:var(--accent)}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:13px;font-weight:650}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent)}.side-bottom{margin-top:auto}.main{margin-left:235px;max-width:1150px;padding:28px 34px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.topbar h1{font-size:25px;margin:0}.pill{background:var(--soft);color:var(--accent);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:750}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.composer{padding:17px;margin-bottom:16px}.compose-row{display:flex;gap:12px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:23px;flex:none}.compose-row textarea{width:100%;border:0;outline:0;resize:vertical;min-height:62px;background:transparent;color:var(--text)}.compose-actions{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.muted{color:var(--muted)}.primary{background:var(--accent);color:white;padding:10px 17px;border-radius:12px;font-weight:750}.secondary{background:var(--soft);color:var(--accent);padding:9px 13px;border-radius:11px;font-weight:700}.post{padding:17px;margin-bottom:13px}.post-head{display:flex;gap:11px;align-items:center}.post-name{font-weight:800}.handle{color:var(--muted);font-size:12px}.post-time{margin-left:auto;color:var(--muted);font-size:12px}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}.post-stats{display:flex;gap:20px;border-top:1px solid var(--line);padding-top:11px;color:var(--muted);font-size:13px}.post-stats button{background:transparent;color:inherit;padding:0}.post-stats button.liked{color:var(--red)}.comment-list{margin-top:10px;padding-left:12px;border-left:2px solid var(--line);font-size:13px}.rightcol{display:grid;gap:15px;align-content:start}.widget{padding:17px}.widget h3{margin:0 0 13px;font-size:15px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--bg);border-radius:13px;padding:12px}.stat strong{display:block;font-size:20px}.stat small{color:var(--muted)}.trend{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.trend:last-child{border:0}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:17px}.metric{padding:17px}.metric strong{font-size:23px;display:block}.metric span{font-size:12px;color:var(--muted)}.section{padding:19px;margin-bottom:15px}.section h2{font-size:17px;margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text);width:100%;outline-color:var(--accent)}.field textarea{min-height:80px}.profile-head{display:flex;align-items:center;gap:16px}.bigavatar{width:72px;height:72px;font-size:36px}.profile-head h2{margin:0}.profile-stats{display:flex;gap:24px;margin-top:18px}.profile-stats b{display:block;font-size:19px}.profile-stats span{font-size:12px;color:var(--muted)}.listitem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.listitem:last-child{border:0}.listitem .grow{flex:1}.badge{font-size:11px;background:var(--soft);color:var(--accent);padding:4px 8px;border-radius:99px}.notice{padding:12px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.notice small{display:block;color:var(--muted);margin-top:3px}.chatbox{height:55vh;min-height:350px;display:flex;flex-direction:column}.chatmessages{flex:1;overflow:auto;padding:15px}.bubble{background:var(--bg);padding:10px 13px;border-radius:13px;margin:7px 0;max-width:80%;width:max-content}.bubble.me{margin-left:auto;background:var(--soft)}.chatinput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chatinput input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text)}.empty{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#252437;color:white;padding:12px 18px;border-radius:13px;z-index:20;box-shadow:var(--shadow);max-width:90vw}.modalback{position:fixed;inset:0;background:#10101a99;display:grid;place-items:center;z-index:30;padding:18px}.modal{width:min(440px,100%);background:var(--panel);padding:23px;border-radius:20px}.emoji-pick{display:flex;gap:8px;flex-wrap:wrap}.emoji-pick button{font-size:23px;background:var(--bg);padding:8px;border-radius:10px}.bottomnav{display:none}.danger{color:var(--red)}.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}@media(max-width:850px){.sidebar{width:190px}.main{margin-left:190px;padding:22px 18px}.layout{grid-template-columns:1fr}.rightcol{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:620px){.sidebar{display:none}.main{margin:0;padding:17px 13px 90px}.topbar{margin-bottom:16px}.topbar h1{font-size:22px}.layout{display:block}.rightcol{display:none}.cards{gap:8px}.metric{padding:12px}.metric strong{font-size:19px}.bottomnav{position:fixed;display:flex;inset:auto 0 0;background:var(--panel);border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottomnav button{background:transparent;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center;min-width:0;padding:4px}.bottomnav button span{font-size:20px}.bottomnav button.active{color:var(--accent)}.profile-stats{gap:15px}.post{padding:14px}.post-stats{gap:13px}.chatbox{height:62vh}.section{padding:15px}}
</style></head>
<body><div class="app" id="app">
<aside class="sidebar"><div class="brand">SNS <span>LIFE</span></div><nav class="nav" id="sideNav"></nav><div class="side-bottom muted" id="sidePlayer"></div></aside>
<main class="main"><header class="topbar"><h1 id="pageTitle">ホーム</h1><div><span class="pill" id="rankPill">一般人</span></div></header>
<div id="homePage" class="page active"><div class="layout"><section><div class="panel composer"><div class="compose-row"><div class="avatar" id="composeAvatar">🙂</div><textarea id="postInput" maxlength="500" placeholder="いま何してる？"></textarea></div><div class="compose-actions"><small class="muted">最大500文字</small><button class="primary" id="postBtn">投稿する ↗</button></div></div><div id="feed"></div></section><aside class="rightcol"><div class="panel widget"><h3>📊 あなたの現在地</h3><div class="stat-grid" id="quickStats"></div></div><div class="panel widget"><h3>🔥 トレンド</h3><div id="trendMini"></div></div><div class="panel widget"><h3>🏆 次のランク</h3><div id="rankProgress"></div></div></aside></div></div>
<div id="explorePage" class="page"><div class="panel section"><h2>🔥 いま話題のトレンド</h2><div id="trendList"></div></div><div class="panel section"><h2>🏆 人気投稿ランキング</h2><div id="popularList"></div></div><div class="panel section"><h2>👥 おすすめユーザー</h2><div id="suggestList"></div></div></div>
<div id="notificationsPage" class="page"><div class="panel section"><h2>🔔 通知</h2><div id="noticeList"></div></div></div>
<div id="dmPage" class="page"><div class="panel section"><h2>✉️ メッセージ</h2><div id="dmList"></div><div class="chatbox" id="chatbox" hidden><div class="chatmessages" id="chatMessages"></div><div class="chatinput"><input id="chatInput" placeholder="メッセージを入力"><button class="primary" id="sendDM">送信</button></div></div></div></div>
<div id="profilePage" class="page"><div class="panel section" id="profileCard"></div><div class="panel section"><h2>📝 あなたの投稿</h2><div id="myPosts"></div></div></div>
<div id="analyticsPage" class="page"><div class="cards" id="analyticsCards"></div><div class="panel section"><h2>📈 アカウント分析</h2><div id="analyticsDetails"></div></div><div class="panel section"><h2>💰 収益履歴</h2><div id="incomeHistory"></div></div></div>
<div id="settingsPage" class="page"><div class="panel section"><h2>⚙️ アカウント設定</h2><div class="field"><label>プレイヤー名</label><input id="setName" maxlength="24"></div><div class="field"><label>ユーザーID（英数字・_）</label><input id="setHandle" maxlength="18"></div><div class="field"><label>自己紹介</label><textarea id="setBio" maxlength="120"></textarea></div><div class="field"><label>プロフィール画像</label><div class="emoji-pick" id="avatarPicker"></div></div><button class="primary" id="saveProfile">プロフィールを保存</button></div><div class="panel section"><h2>🎨 表示設定</h2><button class="secondary" id="themeBtn">🌙 ダークモードに切り替え</button></div><div class="panel section"><h2>💾 セーブデータ</h2><p class="muted">この端末のブラウザに自動保存されます。</p><button class="secondary" id="exportSave">セーブデータを書き出す</button> <button class="secondary" id="importSave">読み込む</button><input type="file" id="saveFile" accept="application/json" hidden><p><button class="secondary danger" id="resetGame">ゲームを最初からやり直す</button></p></div></div>
</main><nav class="bottomnav" id="bottomNav"></nav></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{"use strict";
const KEY="sns-life-save-v1", icons={home:"🏠",explore:"🔎",notifications:"🔔",dm:"✉️",profile:"👤",analytics:"📊",settings:"⚙️"};
const navs=[["home","ホーム"],["explore","検索・トレンド"],["notifications","通知"],["dm","DM"],["profile","プロフィール"],["analytics","分析"],["settings","設定"]];
const npcSeeds=[
["ゆき","yuki_days","🌷","一般ユーザー","カフェと日常の写真が好き。"],["ガジェット太郎","gadget_taro","📱","インフルエンサー","新製品を正直レビュー！"],["速報トピックス","sokuho_now","📰","ニュース","今日の話題をわかりやすく。"],["ねこまる","nekomaru","🐈","ネタ職人","ねこが世界を救う。たぶん。"],["企業広報ミライ","mirai_pr","🏢","企業","新しいサービスをお届けします。"],["通りすがりA","user_482","🧢","アンチ","思ったことをそのまま言う。"],["あおい","ao_i_08","🫧","ファン","好きなものを全力で応援！"],["ゲーム研究所","game_lab","🎮","インフルエンサー","ゲームの攻略と小ネタ。"],["毎日ラップ","rap_daily","🎤","一般ユーザー","今日も韻を踏む。"],["おもしろ速報","omoshiro","🤣","ネタ職人","ネットのおもしろを集める。"],["トレンドウォッチ","trend_watch","📈","ニュース","急上昇ワードをチェック。"],["星野プロモーション","hoshino_pr","✨","企業","クリエイターとのコラボ募集中。"],["ましろ","mashiro_22","🌙","ファン","あなたの投稿を見ています！"],["辛口レビュー","karakuchi","🧐","アンチ","評価は厳しめ。"],["旅するケン","tabi_ken","🧳","一般ユーザー","週末はどこかへ。"]];
const npcPosts=["今日の小さな幸せ、見つけた☀️","これ知ってた？意外と知られてない豆知識！","新しいことに挑戦する日。","みんなはどう思う？コメントで教えて！","今日のトレンド、すごいことになってる🔥","好きなものについて語る時間が一番楽しい。","これは何度見ても笑う🤣","お昼休み！午後もがんばろう〜","最近ハマってるものを教えて！","まさかの展開でびっくりした…！","今日も投稿チェックありがとう！","この話題、もっと広まってほしい。"];
const comments=["わかる！！","これはいいね👏","初めて知った！","めっちゃ面白い🤣","応援してるよ！","次の投稿も楽しみ！","それはすごい…！","自分もそう思う！","参考になった！","いいセンスしてる✨","話題になりそう！","なるほどね〜"];
const trends=["#今日の出来事","#ゲーム","#ガジェット","#日常","#音楽","#話題のニュース","#おもしろ","#SNSLIFE","#おすすめ"];
const rand=a=>a[Math.floor(Math.random()*a.length)],uid=()=>Math.random().toString(36).slice(2,10),fmt=n=>Math.floor(n).toLocaleString("ja-JP"),ago=t=>{let m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?"たった今":m<60?m+"分前":m<1440?Math.floor(m/60)+"時間前":Math.floor(m/1440)+"日前"};
function fresh(){let npcs=npcSeeds.map((s,i)=>({id:"n"+i,name:s[0],handle:s[1],avatar:s[2],type:s[3],bio:s[4],followers:Math.floor(30+Math.random()*9000),following:Math.floor(20+Math.random()*600),followed:false,personality:i%3}));return {profile:{name:"あなた",handle:"my_account",avatar:"🙂",bio:"SNS LIFEを始めました！"},followers:12,following:4,posts:[],npcs,notifications:[],dms:{},income:0,totalIncome:0,incomeLog:[],day:1,theme:"light",events:[],history:{likes:0,views:0,followers:12},created:Date.now(),lastTick:Date.now(),rank:"一般人",unlocked:[],setup:false,trendBoost:0};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast("保存できません。空き容量を確認してください。")}}
function toast(s){let root=document.getElementById("toastRoot");root.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>root.innerHTML="",2500)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function user(id){return id==="me"?state.profile:state.npcs.find(n=>n.id===id)||state.profile}
function notify(text,kind="info"){state.notifications.unshift({id:uid(),text,kind,time:Date.now(),read:false});state.notifications=state.notifications.slice(0,80);save()}
function rank(){let f=state.followers;return f>=1000000?"伝説":f>=100000?"超有名人":f>=10000?"インフルエンサー":f>=1000?"人気者":f>=100?"注目ユーザー":"一般人"}
const thresholds=[0,100,1000,10000,100000,1000000],rankNames=["一般人","注目ユーザー","人気者","インフルエンサー","超有名人","伝説"];
function updateRank(){let r=rank();if(r!==state.rank){state.rank=r;notify("🎉 ランクアップ！「"+r+"」になりました！","rank");toast("ランクアップ！ "+r+" 🎉")}}
function post(text,owner="me"){if(!text.trim())return;let p={id:uid(),owner,text:text.trim().slice(0,500),time:Date.now(),likes:0,comments:[],views:Math.floor(Math.random()*8),liked:false};state.posts.unshift(p);if(owner==="me"){notify("投稿を公開しました！");state.posts=state.posts.slice(0,250)}save();render()}
function npcReact(p){let pool=state.npcs.filter(n=>n.id!==p.owner);let count=Math.floor(Math.random()*4);for(let i=0;i<count;i++){let n=rand(pool);if(!n)continue;p.likes++;if(Math.random()<.28)p.comments.push({by:n.id,text:rand(comments),time:Date.now()});if(Math.random()<.18&&!n.followed){n.followed=true;state.followers+=1;notify(n.name+"さんがあなたをフォローしました！","follow")}}state.history.likes+=p.likes;state.history.views+=p.views}
function tick(){let now=Date.now(),elapsed=Math.min(12,Math.floor((now-state.lastTick)/20000));if(elapsed<1)return;for(let t=0;t<elapsed;t++){state.day+=.014;let npc=rand(state.npcs);let p={id:uid(),owner:npc.id,text:rand(npcPosts),time:now-(elapsed-t)*20000,likes:Math.floor(Math.random()*100),comments:[],views:Math.floor(Math.random()*500)};state.posts.unshift(p);if(state.posts.length>250)state.posts.pop();let own=state.posts.filter(x=>x.owner==="me");own.forEach(x=>{x.views+=Math.floor(2+Math.random()*20);if(Math.random()<.48){let n=rand(state.npcs);x.likes++;state.history.likes++;if(Math.random()<.22)x.comments.push({by:n.id,text:rand(comments),time:now});if(Math.random()<.025&&!n.followed){n.followed=true;state.followers+=1;notify(n.name+"さんがあなたをフォローしました！","follow")}}});if(Math.random()<.2)state.followers=Math.max(0,state.followers+(Math.random()<.72?1:-1));if(Math.random()<.055)eventRoll();if(Math.random()<.012)offerDeal();if(Math.random()<.018){let postMine=rand(own);if(postMine){let gain=Math.floor(5+postMine.likes*.4+Math.random()*20);state.income+=gain;state.totalIncome+=gain;state.incomeLog.unshift({amount:gain,reason:"広告収益",time:now})}}}
state.lastTick=now;updateRank();save();render()}
function eventRoll(){let e=rand(["バズ","炎上","トレンド入り","有名人の反応","フォロワー急増","フォロワー減少"]);let own=state.posts.filter(p=>p.owner==="me");let p=rand(own);if(e==="バズ"&&p){let n=Math.floor(40+Math.random()*500);p.likes+=n;p.views+=n*20;state.followers+=Math.floor(n*.4);notify("🔥 投稿がバズった！ "+fmt(n)+"いいねを獲得！","event")}else if(e==="炎上"&&p){state.followers=Math.max(0,state.followers-Math.floor(2+Math.random()*20));notify("⚠️ 投稿に批判的な反応が集まっています。冷静に対応しよう。","event")}else if(e==="トレンド入り"&&p){state.trendBoost=3;state.followers+=Math.floor(10+Math.random()*60);notify("📈 あなたの投稿がトレンド入り！","event")}else if(e==="有名人の反応"&&p){let n=rand(state.npcs.filter(x=>x.type==="インフルエンサー"));p.likes+=30;notify("🌟 "+n.name+"さんがあなたの投稿に反応しました！","event")}else if(e==="フォロワー急増"){let n=Math.floor(5+Math.random()*40);state.followers+=n;notify("🎉 話題になりフォロワーが"+n+"人増えました！","event")}else{state.followers=Math.max(0,state.followers-Math.floor(1+Math.random()*8));notify("フォロワーが少し減少しました。次の投稿で巻き返そう！","event")}}
function offerDeal(){if(state.followers<50)return;let amount=Math.floor(80+state.followers*.18);state.income+=amount;state.totalIncome+=amount;state.incomeLog.unshift({amount,reason:"企業案件：ミライ企画",time:Date.now()});notify("💼 企業案件が成立！ "+fmt(amount)+"コインを獲得！","money")}
function follow(id){let n=user(id);if(!n||id==="me")return;n.followed=!n.followed;state.following+=n.followed?1:-1;if(n.followed)notify(n.name+"さんをフォローしました");save();render()}
function nav(key){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(key+"Page").classList.add("active");document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===key));document.getElementById("pageTitle").textContent=navs.find(x=>x[0]===key)[1];if(key==="notifications"){state.notifications.forEach(n=>n.read=true);save()}renderPage(key)}
function postCard(p){let u=user(p.owner),mine=p.owner==="me";return '<article class="panel post"><div class="post-head"><div class="avatar">'+esc(u.avatar)+'</div><div><div class="post-name">'+esc(u.name)+(mine?' <span class="badge">あなた</span>':'')+'</div><div class="handle">@'+esc(u.handle)+' · '+esc(u.type||"")+'</div></div><span class="post-time">'+ago(p.time)+'</span>'+(mine?'<button class="muted" data-delete="'+p.id+'" title="削除">•••</button>':'')+'</div><div class="post-body">'+esc(p.text)+'</div><div class="post-stats"><button data-like="'+p.id+'" class="'+(p.liked?"liked":"")+'">♥ '+fmt(p.likes)+'</button><span>💬 '+p.comments.length+'</span><span>◉ '+fmt(p.views)+'</span></div>'+(p.comments.length?'<div class="comment-list">'+p.comments.slice(-2).map(c=>'<div><b>'+esc(user(c.by).name)+'</b> '+esc(c.text)+'</div>').join("")+'</div>':'')+'</article>'}
function renderFeed(){let feed=document.getElementById("feed"),posts=state.posts.filter(p=>p.owner==="me"||Math.random()>.08).slice(0,40);feed.innerHTML=posts.length?posts.map(postCard).join(""):'<div class="panel empty">まだ投稿がありません。最初の投稿をしてみよう！ ✨</div>'}
function renderStats(){document.getElementById("rankPill").textContent=state.rank;document.getElementById("composeAvatar").textContent=state.profile.avatar;document.getElementById("quickStats").innerHTML=[["フォロワー",fmt(state.followers)],["フォロー",fmt(state.following)],["投稿数",fmt(state.posts.filter(p=>p.owner==="me").length)],["収益",fmt(state.income)+" 🪙"]].map(x=>'<div class="stat"><strong>'+x[1]+'</strong><small>'+x[0]+'</small></div>').join("");let idx=rankNames.indexOf(state.rank),next=thresholds[Math.min(5,idx+1)],prev=thresholds[idx],pct=Math.min(100,(state.followers-prev)/(next-prev)*100);document.getElementById("rankProgress").innerHTML='<b>'+state.rank+'</b><p class="muted">次は '+(rankNames[idx+1]||"最高ランク")+' · '+fmt(next)+'人</p><div class="progress"><i style="width:'+pct+'%"></i></div><small class="muted">'+fmt(state.followers)+' / '+fmt(next)+'</small>'}
function renderTrends(){let trend=trends.map(t=>({t,n:Math.floor(100+Math.random()*5000)})).sort((a,b)=>b.n-a.n);let h=trend.slice(0,6).map((x,i)=>'<div class="trend"><span><b>'+(i+1)+'.</b> '+x.t+'</span><small class="muted">'+fmt(x.n)+'件</small></div>').join("");document.getElementById("trendMini").innerHTML=h;document.getElementById("trendList").innerHTML=h;let popular=[...state.posts].sort((a,b)=>(b.likes+b.views/10)-(a.likes+a.views/10)).slice(0,8);document.getElementById("popularList").innerHTML=popular.length?popular.map((p,i)=>'<div class="listitem"><b>'+(i+1)+'</b><div class="grow">'+esc(user(p.owner).name)+'：'+esc(p.text.slice(0,65))+'<small class="muted"> ♥ '+fmt(p.likes)+' · ◉ '+fmt(p.views)+'</small></div></div>').join(""):'<div class="empty">投稿が集まるとランキングが表示されます。</div>';document.getElementById("suggestList").innerHTML=state.npcs.filter(n=>!n.followed).slice(0,8).map(n=>'<div class="listitem"><div class="avatar">'+n.avatar+'</div><div class="grow"><b>'+esc(n.name)+'</b><small class="muted" style="display:block">@'+n.handle+' · '+fmt(n.followers)+'人</small></div><button class="secondary" data-follow="'+n.id+'">フォロー</button></div>').join("")}
function renderNotifications(){document.getElementById("noticeList").innerHTML=state.notifications.length?state.notifications.map(n=>'<div class="notice">'+(n.read?'':'🔵 ')+esc(n.text)+'<small>'+ago(n.time)+'</small></div>').join(""):'<div class="empty">まだ通知はありません 🔔</div>'}
let activeDM=null;
function renderDM(){let list=document.getElementById("dmList");list.innerHTML=state.npcs.slice(0,8).map(n=>'<div class="listitem" data-chat="'+n.id+'"><div class="avatar">'+n.avatar+'</div><div class="grow"><b>'+esc(n.name)+'</b><small class="muted" style="display:block">@'+n.handle+'</small></div><span>›</span></div>').join("");if(activeDM){document.getElementById("chatbox").hidden=false;let msgs=state.dms[activeDM]||[];document.getElementById("chatMessages").innerHTML=msgs.map(m=>'<div class="bubble '+(m.me?'me':'')+'">'+esc(m.text)+'</div>').join("");}}
function renderProfile(){let p=state.profile;document.getElementById("profileCard").innerHTML='<div class="profile-head"><div class="avatar bigavatar">'+p.avatar+'</div><div><h2>'+esc(p.name)+'</h2><div class="muted">@'+esc(p.handle)+'</div><div class="muted">'+esc(p.bio)+'</div></div></div><div class="profile-stats"><div><b>'+fmt(state.followers)+'</b><span>フォロワー</span></div><div><b>'+fmt(state.following)+'</b><span>フォロー</span></div><div><b>'+state.posts.filter(x=>x.owner==="me").length+'</b><span>投稿</span></div><div><b>'+fmt(state.income)+'</b><span>コイン</span></div></div><p><span class="pill">'+state.rank+'</span></p>';let mine=state.posts.filter(x=>x.owner==="me");document.getElementById("myPosts").innerHTML=mine.length?mine.map(postCard).join(""):'<div class="empty">あなたの投稿はまだありません。</div>'}
function renderAnalytics(){let mine=state.posts.filter(p=>p.owner==="me"),likes=mine.reduce((a,p)=>a+p.likes,0),views=mine.reduce((a,p)=>a+p.views,0);document.getElementById("analyticsCards").innerHTML=[["総閲覧数",fmt(views)],["総いいね",fmt(likes)],["フォロワー",fmt(state.followers)],["累計収益",fmt(state.totalIncome)+" 🪙"]].map(x=>'<div class="panel metric"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join("");document.getElementById("analyticsDetails").innerHTML='<p>投稿数：<b>'+mine.length+'</b></p><p>平均いいね数：<b>'+fmt(mine.length?likes/mine.length:0)+'</b></p><p>平均閲覧数：<b>'+fmt(mine.length?views/mine.length:0)+'</b></p><p>フォロー中：<b>'+fmt(state.following)+'</b></p><p>現在のランク：<b>'+state.rank+'</b></p>';document.getElementById("incomeHistory").innerHTML=state.incomeLog.length?state.incomeLog.slice(0,30).map(x=>'<div class="listitem"><div class="grow">'+esc(x.reason)+'<small class="muted" style="display:block">'+ago(x.time)+'</small></div><b style="color:var(--green)">+'+fmt(x.amount)+' 🪙</b></div>').join(""):'<div class="empty">収益履歴はまだありません。</div>'}
function renderSettings(){document.getElementById("setName").value=state.profile.name;document.getElementById("setHandle").value=state.profile.handle;document.getElementById("setBio").value=state.profile.bio;document.getElementById("avatarPicker").innerHTML=["🙂","😎","🐱","🐶","🦊","🐸","👾","🤖","🌟","🎮","🎤","🚀"].map(e=>'<button data-avatar="'+e+'">'+e+'</button>').join("");document.getElementById("themeBtn").textContent=state.theme==="dark"?"☀️ ライトモードに切り替え":"🌙 ダークモードに切り替え"}
function renderPage(k){if(k==="explore")renderTrends();if(k==="notifications")renderNotifications();if(k==="dm")renderDM();if(k==="profile")renderProfile();if(k==="analytics")renderAnalytics();if(k==="settings")renderSettings()}
function render(){renderStats();renderFeed();renderTrends();renderPage(document.querySelector(".page.active")?.id.replace("Page","")||"home");document.documentElement.dataset.theme=state.theme;document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===(document.querySelector(".page.active")?.id.replace("Page","")||"home")))}
function setup(){if(state.setup)return;document.getElementById("modalRoot").innerHTML='<div class="modalback"><div class="modal"><h2>🎉 SNS LIFEへようこそ！</h2><p class="muted">あなたのSNSアカウントを作成しよう。</p><div class="field"><label>プレイヤー名</label><input id="newName" maxlength="24" placeholder="例：TK"></div><div class="field"><label>ユーザーID</label><input id="newHandle" maxlength="18" placeholder="例：tk_creator"></div><div class="field"><label>プロフィール画像</label><div class="emoji-pick" id="newAvatars">'+["🙂","😎","🐱","🤖","🎮","🎤"].map(e=>'<button data-newavatar="'+e+'">'+e+'</button>').join("")+'</div></div><button class="primary" id="startGame" style="width:100%">SNS LIFEを始める！</button></div></div>'}
document.addEventListener("click",e=>{let t=e.target.closest("button,[data-chat]");if(!t)return;if(t.dataset.nav){nav(t.dataset.nav);return}if(t.dataset.like){let p=state.posts.find(x=>x.id===t.dataset.like);if(p){p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()}return}if(t.dataset.delete){if(confirm("この投稿を削除しますか？")){state.posts=state.posts.filter(p=>p.id!==t.dataset.delete);save();render()}return}if(t.dataset.follow){follow(t.dataset.follow);return}if(t.dataset.avatar){state.profile.avatar=t.dataset.avatar;save();renderSettings();return}if(t.dataset.newavatar){document.querySelectorAll("[data-newavatar]").forEach(b=>b.style.outline="");t.style.outline="3px solid var(--accent)";window.chosenAvatar=t.dataset.newavatar;return}if(t.dataset.chat){activeDM=t.dataset.chat;renderDM();return}});
document.getElementById("postBtn").onclick=()=>{let v=document.getElementById("postInput");if(!v.value.trim())return toast("投稿内容を入力してね");post(v.value);v.value="";};
document.getElementById("saveProfile").onclick=()=>{let name=document.getElementById("setName").value.trim(),handle=document.getElementById("setHandle").value.trim().replace(/[^a-zA-Z0-9_]/g,""),bio=document.getElementById("setBio").value.trim();if(!name||!handle)return toast("名前とIDを入力してください");state.profile={...state.profile,name,handle,bio};save();render();toast("プロフィールを保存しました！")};
document.getElementById("themeBtn").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();render()};
document.getElementById("sendDM").onclick=()=>{let v=document.getElementById("chatInput"),s=v.value.trim();if(!s||!activeDM)return;(state.dms[activeDM]??=[]).push({me:true,text:s});v.value="";renderDM();if(Math.random()<.8)setTimeout(()=>{(state.dms[activeDM]??=[]).push({me:false,text:rand(["メッセージありがとう！","投稿見たよ！","それ面白いね！","また話そう！","わかる〜！"])});renderDM();save()},800);save()};
document.getElementById("exportSave").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sns-life-save.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("importSave").onclick=()=>document.getElementById("saveFile").click();
document.getElementById("saveFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.profile||!Array.isArray(s.posts)||!Array.isArray(s.npcs))throw Error();state=s;save();render();toast("セーブデータを読み込みました")}catch(_){toast("このファイルは読み込めません")}};r.readAsText(f)};
document.getElementById("resetGame").onclick=()=>{if(confirm("セーブデータをすべて削除します。本当によろしいですか？")){state=fresh();save();location.reload()}};
document.getElementById("startGame").onclick=()=>{let n=document.getElementById("newName").value.trim(),h=document.getElementById("newHandle").value.trim().replace(/[^a-zA-Z0-9_]/g,"");if(!n||!h)return toast("名前とIDを入力してね");state.profile.name=n;state.profile.handle=h;state.profile.avatar=window.chosenAvatar||"🙂";state.setup=true;save();document.getElementById("modalRoot").innerHTML="";render();toast("アカウント開設完了！ 🚀")};
document.getElementById("sideNav").innerHTML=navs.map(([k,l])=>'<button data-nav="'+k+'">'+icons[k]+'　'+l+'</button>').join("");document.getElementById("bottomNav").innerHTML=navs.slice(0,5).map(([k,l])=>'<button data-nav="'+k+'"><span>'+icons[k]+'</span>'+l+'</button>').join("");
document.getElementById("sidePlayer").innerHTML="🪙 "+fmt(state.income)+" コイン";
state.npcs=state.npcs?.length?state.npcs:fresh().npcs;state.notifications??=[];state.dms??={};state.incomeLog??=[];state.rank??=rank();state.profile??=fresh().profile;state.followers??=12;state.following??=4;state.history??={likes:0,views:0,followers:state.followers};save();render();setup();setInterval(()=>{tick();document.getElementById("sidePlayer").innerHTML="🪙 "+fmt(state.income)+" コイン"},20000);window.addEventListener("beforeunload",save);
})();
</script></body></html>
