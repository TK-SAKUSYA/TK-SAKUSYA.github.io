<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5865f2">
<title>みんなでチャットしよう！ — CENTI</title>
<style>
:root{color-scheme:dark;--bg:#17191f;--panel:#20232b;--panel2:#292d36;--line:#343945;--text:#f2f3f5;--muted:#a5abb7;--accent:#5865f2;--accent2:#7983ff;--green:#35c78a;--bubble:#303540;--mine:#4654d8;--danger:#ed626c}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--panel2:#edf0f7;--line:#dce1ec;--text:#202432;--muted:#687286;--accent:#5264dc;--accent2:#7180f0;--green:#159c69;--bubble:#edf0f7;--mine:#5264dc;--danger:#d84c59}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}#app{height:100dvh;display:grid;grid-template-columns:70px 280px minmax(0,1fr);overflow:hidden}.rail{position:relative;z-index:2;pointer-events:auto;background:var(--bg);border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:13px;padding:16px 10px}.railbtn,.iconbtn{position:relative;z-index:3;pointer-events:auto;touch-action:manipulation}.brand{width:46px;height:46px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-weight:900;font-size:20px;color:white;box-shadow:0 6px 18px #5865f244;margin-bottom:14px}.railbtn{width:46px;height:46px;border:0;border-radius:15px;background:transparent;color:var(--muted);font-size:20px}.railbtn:hover,.railbtn.active{background:var(--panel2);color:var(--text)}.railbtn.active{box-shadow:inset 3px 0 var(--accent)}.railbottom{margin-top:auto}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}.iconbtn{border:0;background:var(--panel2);width:36px;height:36px;border-radius:12px;font-size:18px}.search{padding:14px}.search input,.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px 13px;border-radius:11px;outline:none}.search input:focus,.field:focus,textarea:focus{border-color:var(--accent)}.listlabel{padding:8px 16px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}.list{overflow:auto;padding:0 8px 12px}.person{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px;margin:2px 0}.person:hover,.person.active{background:var(--panel2)}.avatar{width:42px;height:42px;border-radius:50%;background:var(--avatar,#6574d8);display:grid;place-items:center;color:white;font-weight:800;flex:none;position:relative}.dot{position:absolute;width:11px;height:11px;border:2px solid var(--panel);border-radius:50%;right:0;bottom:0;background:#777}.dot.online{background:var(--green)}.personmeta{min-width:0;flex:1}.personname{font-weight:700;font-size:14px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.time{font-size:10px;color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:68px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}.topinfo{min-width:0;flex:1}.topname{font-weight:800}.topstatus{font-size:12px;color:var(--muted);margin-top:3px}.topactions{display:flex;gap:7px}.messages{flex:1;overflow:auto;padding:22px clamp(14px,4vw,52px);display:flex;flex-direction:column;gap:15px}.dayline{text-align:center;color:var(--muted);font-size:11px;margin:8px}.msgrow{display:flex;gap:9px;align-items:flex-end;max-width:min(78%,650px)}.msgrow.mine{align-self:flex-end;flex-direction:row-reverse}.msgavatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px;flex:none}.msgcontent{min-width:0}.msgname{font-size:11px;color:var(--muted);margin:0 0 5px 4px}.bubble{background:var(--bubble);padding:11px 14px;border-radius:16px 16px 16px 5px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:var(--mine);color:white;border-radius:16px 16px 5px 16px}.msgmeta{font-size:10px;color:var(--muted);margin:5px 3px 0}.mine .msgmeta{text-align:right}.readlink{color:var(--accent2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;border:0;background:none;padding:0;font-size:10px}.composer{padding:13px 20px max(14px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.composebox{display:flex;align-items:flex-end;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:8px}.composebox textarea{flex:1;min-height:40px;max-height:130px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:9px}.send{width:42px;height:42px;border:0;border-radius:12px;background:var(--accent);color:white;font-size:18px}.hint{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.empty .big{font-size:48px;margin-bottom:12px}.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.emoji-choice{border:0;background:var(--panel2);border-radius:10px;min-height:42px;font-size:23px}.emoji-choice:hover{background:var(--line)}.view{display:none;flex:1;min-height:0;overflow:auto;padding:25px}.view.active{display:block}.card{max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin:0 0 15px}.card h2{margin:0 0 8px;font-size:19px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.primary{border:0;border-radius:11px;background:var(--accent);color:white;padding:11px 15px;font-weight:750}.secondary{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px 14px}.formrow{display:flex;gap:9px;margin-top:13px}.formrow .field{flex:1;min-width:0}.notice{border:1px solid #d6a84a55;background:#d6a84a12;color:var(--text);padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.6;margin:14px 0}.tag{font-size:10px;padding:4px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalback.open{display:flex}.modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 25px 80px #0005}.modal h3{margin:0 0 14px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobileback{display:none}
@media(max-width:760px){#app{grid-template-columns:58px minmax(0,1fr)}.rail{padding:12px 6px}.brand,.railbtn{width:42px;height:42px}.sidebar{grid-column:2;grid-row:1}.main{display:none;grid-column:2;grid-row:1}.main.show{display:flex}.sidebar.hide{display:none}.mobileback{display:inline-grid}.sidehead{height:60px}.topbar{height:60px;padding:0 12px}.messages{padding:16px 12px}.msgrow{max-width:90%}.view{padding:15px}.composer{padding:10px}.topactions .optional{display:none}}
@media(min-width:761px) and (max-width:1050px){#app{grid-template-columns:62px 235px minmax(0,1fr)}.messages{padding:18px}}
</style>
</head>
<body>
<div id="app">
 <nav class="rail" aria-label="メインメニュー">
  <div class="brand" title="CENTI">C</div>
  <button class="railbtn active" data-view="chats" title="チャット">💬</button>
  <button class="railbtn" data-view="friends" title="友達">👥</button>
  <button class="railbtn" data-view="groups" title="グループ">▦</button>
  <div class="railbottom"></div>
  <button class="railbtn" data-view="settings" title="設定">⚙️</button>
 </nav>
 <aside class="sidebar" id="sidebar">
  <div class="sidehead"><span id="sideTitle">メッセージ</span><button class="iconbtn" id="newBtn" title="新しく作成">＋</button></div>
  <div class="search"><input id="search" placeholder="友達・メッセージを検索"></div>
  <div class="listlabel">最近のチャット</div>
  <div class="list" id="chatList"></div>
 </aside>
 <main class="main" id="main">
  <header class="topbar" id="topbar"><button class="iconbtn mobileback" id="backBtn">‹</button><div class="avatar" id="topAvatar">💬</div><div class="topinfo"><div class="topname" id="topName">CENTIへようこそ</div><div class="topstatus" id="topStatus">友達との会話を始めよう</div></div><div class="topactions"><button class="secondary optional" id="profileBtn">プロフィール</button></div></header>
  <section class="messages" id="messages"><div class="empty"><div class="big">💬</div><b>みんなでチャットしよう！</b><p>友達を選ぶと会話がここに表示されるよ。</p></div></section>
  <div class="composer" id="composer" hidden><div class="composebox"><button class="iconbtn" id="emojiBtn" title="絵文字">☺</button><textarea id="messageInput" rows="1" placeholder="メッセージを入力…"></textarea><button class="send" id="sendBtn" title="送信">➤</button></div><div class="hint">Enterで送信・Shift + Enterで改行</div></div>
  <section class="view" id="view-friends"></section><section class="view" id="view-groups"></section><section class="view" id="view-settings"></section>
 </main>
</div>
<div class="modalback" id="modalback"><div class="modal" role="dialog" aria-modal="true"><h3 id="modalTitle">CENTI</h3><div id="modalBody"></div><div class="modalactions"><button class="secondary" id="modalCancel">キャンセル</button><button class="primary" id="modalOK">決定</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), KEY='centi-prototype-v1';
const seed={me:{name:'あなた',id:'you',emoji:'🙂'},friends:[],groups:[],active:null,messages:{},theme:'system'};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed}catch{data=seed}
// 以前の試作用サンプル人物だけを移行時に除去
if(data.friends?.some(f=>['taro','yuki','kenta'].includes(f.id))){data.friends=data.friends.filter(f=>!['taro','yuki','kenta'].includes(f.id));delete data.messages?.taro;delete data.messages?.yuki;delete data.messages?.kenta;data.groups=(data.groups||[]).filter(g=>g.id!=='grp1');if(['taro','yuki','kenta'].includes(data.active))data.active=null;save();}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function theme(){let t=data.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):data.theme;document.documentElement.dataset.theme=t}
theme();matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(data.theme==='system')theme()});
let activeView='chats';
function showView(v){activeView=v;document.querySelectorAll('.railbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('main').querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('messages').style.display=v==='chats'?'flex':'none';$('composer').hidden=v!=='chats'||!data.active;$('topbar').style.display=v==='chats'?'flex':'none';$('sideTitle').textContent=({chats:'メッセージ',friends:'友達',groups:'グループ',settings:'設定'})[v];if(innerWidth<=760){if(v==='chats'){$('sidebar').classList.remove('hide');$('main').classList.remove('show')}else{$('sidebar').classList.add('hide');$('main').classList.add('show')}}if(v==='friends')renderFriends();if(v==='groups')renderGroups();if(v==='settings')renderSettings();renderList()}
function selectFriend(id){data.active=id;save();renderList();renderChat();if(innerWidth<=760){$('sidebar').classList.add('hide');$('main').classList.add('show')}}
function renderList(){let q=$('search').value.toLowerCase();$('chatList').innerHTML=data.friends.filter(f=>(f.name+' '+f.id).toLowerCase().includes(q)).map(f=>{let ms=data.messages[f.id]||[],last=ms[ms.length-1];return '<button class="person '+(data.active===f.id?'active':'')+'" data-id="'+esc(f.id)+'"><div class="avatar">'+esc(f.emoji)+'<i class="dot '+(f.online?'online':'')+'"></i></div><div class="personmeta"><div class="personname">'+esc(f.name)+'</div><div class="preview">'+esc(last?last.text:f.online?'オンライン':'オフライン')+'</div></div><span class="time">'+esc(last?last.time:f.last||'')+'</span></button>'}).join('')||(data.friends.length?'<div class="empty">友達が見つかりません</div>':'<div class="empty"><div class="big">👋</div><b>まだ友達がいません</b><p>＋ボタンから友達を追加しよう！</p></div>');document.querySelectorAll('.person').forEach(b=>b.onclick=()=>selectFriend(b.dataset.id))}
function renderChat(){let f=data.friends.find(x=>x.id===data.active);if(!f){$('topName').textContent='CENTIへようこそ';$('topStatus').textContent='友達との会話を始めよう';$('topAvatar').textContent='💬';$('messages').innerHTML='<div class="empty"><div class="big">💬</div><b>みんなでチャットしよう！</b><p>友達を選ぶと会話がここに表示されるよ。</p></div>';$('composer').hidden=true;return}
$('topName').textContent=f.name;$('topStatus').innerHTML='<span style="color:'+(f.online?'var(--green)':'var(--muted)')+'">● '+(f.online?'オンライン':'オフライン')+'</span>';$('topAvatar').textContent=f.emoji;$('composer').hidden=false;
let ms=data.messages[f.id]||[];$('messages').innerHTML=(ms.length?ms.map(m=>{let mine=m.from==='you';return '<div class="msgrow '+(mine?'mine':'')+'"><div class="msgavatar">'+(mine?'🙂':esc(f.emoji))+'</div><div class="msgcontent">'+(!mine?'<div class="msgname">'+esc(f.name)+'</div>':'')+'<div class="bubble">'+esc(m.text)+'</div><div class="msgmeta">'+esc(m.time)+(mine?'　'+(m.read?'<button class="readlink" data-msg="'+m.id+'">既読</button>':'未読'):'')+'</div></div></div>'}).join(''):'<div class="empty"><div class="big">👋</div><b>'+esc(f.name)+'とのチャット</b><p>最初のメッセージを送ってみよう！</p></div>');$('messages').scrollTop=$('messages').scrollHeight;document.querySelectorAll('.readlink').forEach(b=>b.onclick=()=>readDetail(b.dataset.msg))}
function readDetail(id){let f=data.friends.find(x=>x.id===data.active),m=(data.messages[data.active]||[]).find(x=>String(x.id)===String(id));if(!m)return;openModal('既読情報','<div class="muted">送信時刻：'+esc(m.time)+'</div><div style="margin-top:14px;font-weight:750">既読した人</div><p>👤 '+esc(f.name)+'　'+(m.read?'既読 '+esc(m.readAt||'時刻不明'):'未読')+'</p>','閉じる')}
function send(){let text=$('messageInput').value.trim();if(!text||!data.active)return;let ms=data.messages[data.active]||(data.messages[data.active]=[]);ms.push({id:Date.now(),from:'you',text,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),read:false});$('messageInput').value='';save();renderChat();renderList()}
function renderFriends(){$('view-friends').innerHTML='<div class="card"><h2>友達</h2><p class="muted">CENTIの友達一覧。友達は承認制にする設計だよ。</p><div class="formrow"><input class="field" id="friendName" placeholder="友達の表示名（試作）"><button class="primary" id="addFriend">追加</button></div><div class="notice">試作版では、ここで追加した友達はこの端末内にだけ保存されます。相手の端末には通知されません。</div></div><div class="card"><h2>友達リスト</h2>'+data.friends.map(f=>'<div class="person"><div class="avatar">'+esc(f.emoji)+'<i class="dot '+(f.online?'online':'')+'"></i></div><div class="personmeta"><div class="personname">'+esc(f.name)+'</div><div class="preview">'+(f.online?'オンライン':'オフライン')+'</div></div><button class="secondary" data-chat="'+esc(f.id)+'">チャット</button></div>').join('')+'</div>';const addFriend=()=>{const input=$('friendName');let n=input?.value.trim();if(!n){input?.focus();return}let id='local'+Date.now();data.friends.push({id,name:n,emoji:'🙂',online:false,last:'—'});data.messages[id]=[];save();renderFriends();renderList();$('friendName')?.focus()};$('addFriend').addEventListener('click',addFriend);$('friendName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addFriend()}});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{showView('chats');selectFriend(b.dataset.chat)})}
function renderGroups(){$('view-groups').innerHTML='<div class="card"><h2>グループ</h2><p class="muted">友達同士のグループチャットを作る画面。</p><button class="primary" id="createGroup">＋ グループを作成</button><div class="notice">試作版のグループはこの端末内だけに保存されます。</div></div><div class="card"><h2>グループ一覧</h2>'+data.groups.map(g=>'<div class="person"><div class="avatar">👥</div><div class="personmeta"><div class="personname">'+esc(g.name)+'</div><div class="preview">'+g.members.length+'人</div></div></div>').join('')+'</div>';$('createGroup').onclick=()=>{let n=prompt('グループ名を入力');if(n&&n.trim()){data.groups.push({id:'g'+Date.now(),name:n.trim(),members:[]});save();renderGroups()}}}
function renderSettings(){$('view-settings').innerHTML='<div class="card"><h2>設定</h2><p class="muted">テーマ</p><select class="field" id="themeSelect"><option value="system">デバイスに合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select><div class="notice">オンライン表示・既読時刻・友達申請などのサーバー機能は、バックエンド接続後に有効になります。</div><button class="secondary" id="resetDemo">試作データを初期状態に戻す</button></div><div class="card"><h2>アカウント</h2><p class="muted">ログイン機能はまだ接続されていません。</p></div>';$('themeSelect').value=data.theme;$('themeSelect').onchange=e=>{data.theme=e.target.value;save();theme()};$('resetDemo').onclick=()=>{if(confirm('この端末のCENTI試作データを初期化しますか？')){localStorage.removeItem(KEY);location.reload()}}}
function openModal(title,body,ok='OK'){ $('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalOK').textContent=ok;$('modalback').classList.add('open');$('modalCancel').style.display='none';$('modalOK').onclick=closeModal}
function closeModal(){$('modalback').classList.remove('open');$('modalCancel').style.display=''}
// ナビゲーション操作を明示的に登録（＋・設定を含む）
document.querySelectorAll('.railbtn[data-view]').forEach(b=>{b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showView(b.dataset.view)})});
$('newBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showView('friends');requestAnimationFrame(()=>{$('friendName')?.focus()})});
$('sendBtn').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('search').oninput=renderList;$('backBtn').onclick=()=>{$('main').classList.remove('show');$('sidebar').classList.remove('hide')};$('emojiBtn').onclick=()=>{const emojis=['😀','😃','😄','😁','😆','😅','😂','🤣','🥲','😊','😍','🥰','😘','😎','🤔','🙄','😴','😭','😡','🤯','🥳','🤩','😇','👍','👎','👏','🙌','🙏','🤝','💪','❤️','🧡','💛','💚','💙','💜','🖤','🤍','💯','🔥','✨','🎉','🎮','⚽','🏸','🍕','🍔','🐱','🐶','🌈','⭐'];openModal('絵文字を選択','<div class=\"emoji-grid\">'+emojis.map(e=>'<button type=\"button\" class=\"emoji-choice\" data-emoji=\"'+e+'\">'+e+'</button>').join('')+'</div>','閉じる');document.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{$('messageInput').value+=$( 'messageInput').value.endsWith(' ')?b.dataset.emoji:' '+b.dataset.emoji;$('messageInput').focus();closeModal()})};$('profileBtn').onclick=()=>openModal('プロフィール','<p>表示名：'+esc(data.me.name)+'</p><p class="muted">プロフィール編集はバックエンド接続後に追加予定です。</p>');$('modalCancel').onclick=closeModal;
renderList();renderChat();showView('chats');
})();
</script>
</body></html>
