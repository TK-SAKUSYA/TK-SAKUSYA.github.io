<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>TK_SITE</title>
  <style>
    :root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--text:#20242b;--muted:#68717e;--line:#e7e9ed;--accent:#315efb}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(900px,calc(100% - 36px));margin:auto}
    header{background:var(--surface);border-bottom:1px solid var(--line)}
    .nav{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{font-size:20px;font-weight:800;letter-spacing:-.5px}
    nav{display:flex;gap:20px;font-size:14px;color:var(--muted)}
    nav a:hover{color:var(--accent)}
    main{padding:64px 0 80px}
    .hero{padding:48px 0 54px}
    .eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1.5px}
    h1{font-size:clamp(42px,8vw,68px);line-height:1.12;letter-spacing:-2px;margin:12px 0}
    .lead{max-width:560px;color:var(--muted);font-size:17px;margin:16px 0 0}
    section{padding:30px 0}
    h2{font-size:23px;letter-spacing:-.5px;margin:0 0 16px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
    .profile{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center}
    .avatar{width:112px;height:112px;border-radius:24px;background:#edf1ff;color:var(--accent);display:grid;place-items:center;font-size:42px;font-weight:800}
    .muted{color:var(--muted);margin:0}
    .tags{display:flex;flex-wrap:wrap;gap:9px}
    .tag{padding:7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:14px}
    .works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .work{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;font-weight:700}
    .work small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
    footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
    @media(max-width:600px){.nav{align-items:flex-start;flex-direction:column;padding:14px 0}.nav nav{gap:15px;flex-wrap:wrap}.hero{padding:42px 0}.profile{grid-template-columns:1fr}.avatar{width:76px;height:76px;border-radius:18px;font-size:30px}.works{grid-template-columns:1fr}main{padding-top:28px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="#">TK_SITE</a>
      <nav aria-label="メインメニュー">
        <a href="#about">プロフィール</a>
        <a href="#likes">好きなもの</a>
        <a href="#works">制作物</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="hero">
      <div class="eyebrow">WELCOME</div>
      <h1>こんにちは、TKです。</h1>
      <p class="lead">ここは、TKのプロフィールや好きなもの、制作物をまとめた個人サイトです。</p>
    </div>

    <section id="about">
      <h2>プロフィール</h2>
      <div class="panel profile">
        <div class="avatar" aria-hidden="true">TK</div>
        <div>
          <h3 style="margin:0 0 6px;font-size:21px">TK</h3>
          <p class="muted">AIやゲームが好き。いろいろなアイデアを形にするため、ゲームやアプリなどを制作しています。</p>
        </div>
      </div>
    </section>

    <section id="likes">
      <h2>好きなもの</h2>
      <div class="tags">
        <span class="tag">🤖 AI</span>
        <span class="tag">🎮 ゲーム</span>
        <span class="tag">💻 ガジェット</span>
        <span class="tag">🎤 ラップ</span>
        <span class="tag">📺 YouTube</span>
      </div>
    </section>

    <section id="works">
      <h2>制作物</h2>
      <div class="works">
        <div class="work">Genesis Utopia<small>ゲーム</small></div>
        <div class="work">フロストサバイバル<small>ゲーム</small></div>
        <div class="work">AI-SMASH<small>ゲーム</small></div>
        <div class="work">NEXT MONEY<small>Webアプリ</small></div>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap">© TK_SITE</div>
  </footer>
</body>
</html>
