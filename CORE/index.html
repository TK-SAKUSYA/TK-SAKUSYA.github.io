<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dce5ff"><title>CORE</title><style>
:root{--bg:#e9edfa;--s:#f7f8ff;--s2:#dce3f5;--ink:#171b27;--muted:#626a7b;--a:#5369b5;--line:#cbd2e5}*{box-sizing:border-box}body{margin:0;background:#101522;font-family:system-ui,"Noto Sans JP",sans-serif;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,430px);height:min(100dvh,920px);min-height:600px;background:var(--bg);position:relative;overflow:hidden;border-radius:30px;box-shadow:0 0 0 7px #252b38}@media(max-width:500px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100dvh;min-height:0;border-radius:0;box-shadow:none}}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#f9d7e7,transparent 42%),radial-gradient(ellipse at 80% 75%,#a9c5ed,transparent 46%),linear-gradient(145deg,#c5d7f5,#e8d9ef 55%,#c8d9ed)}.status{height:38px;position:absolute;z-index:20;top:0;left:0;right:0;padding:9px 20px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#263047}.home{position:absolute;inset:38px 0 0;padding:28px 22px 12px;display:flex;flex-direction:column}.date{font-size:14px;font-weight:600}.bigclock{font-size:64px;font-weight:300;letter-spacing:-4px;margin-top:8px}.widget{margin:20px 0 auto;padding:16px;border-radius:24px;background:#ffffff75;backdrop-filter:blur(16px)}.widget p{font-size:12px;color:#50596c}.icons,.dock,.gridapps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 7px}.dock{padding:14px 8px;border-radius:24px;background:#ffffff75}.appicon{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer}.glyph{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:#f9f9ff;box-shadow:0 3px 8px #28345318}.nav{height:27px;display:flex;justify-content:center;align-items:center}.nav:after{content:"";width:108px;height:4px;border-radius:9px;background:#35405a88}.panel{position:absolute;z-index:25;inset:0;background:var(--s);display:none;fle </style></head><body><main class="phone" id="phone"><div class="wall" id="wall"></div><div class="status" id="status"><span id="st">--:--</span><span>● ▮▮ ▰</span></div><section class="home" id="home"><div class="date" id="date"></div><div class="bigclock" id="clock"></div><div>CORE • Your space, your rules.</div><div class="widget"><b>COREへようこそ</b><p>自分だけのスマートフォン環境。</p></div><div class="icons" id="homeIcons"></div><div style="text-align:center;padding:8px">● ○ ○</div><div class="dock" id="dock"></div><div class="nav" id="nav"></div></section><section class="panel" id="panel"><header class="apphead"><button class="back" id="back">‹</button><div class="apptitle" id="appTitle">CORE</div><button class="back" id="more">⋮</button></header><div class="appbody" id="body"></div></section><section class="drawer" id="drawer"><div class="drawerbox"><div class="row"><b style="font-size:20px">アプリ</b><button class="btn secondary" id="closeDrawer">閉じる</button></div><input class="field" id="search" placeholder="アプリを検索"><div class="gridapps" id="allApps"></div></div></section><section class="quick" id="quick"><div class="row"><b style="font-size:24px">クイック設定</b><button class="btn secondary" id="closeQuick">閉じる</button></div><p id="qdate"></p><div class="tiles"><button class="tile active">◉ Wi-Fi（表示のみ）</button><button class="tile active">ᛒ Bluetooth（表示のみ）</button><button class="tile" id="darkQuick">◐ ダークテーマ</button><button class="tile" id="airplane">✈ 機内モード表示</button></div><div class="card">明るさ <input type="range" min="40" max="100" value="100" id="brightness" style="width:100%"></div><p class="muted">無線機能はブラウザから制御できません。</p></section><section class="lock" id="lock"><div class="locktime" id="locktime"></div><div id="lockdate"></div><p>CORE</p><button class="btn secondary" id="unlock">タップして解除</button></section></main><script>
(function(){
const $=s=>document.querySelector(s), key='core-v1';
const base=[['calculator','電卓','🧮'],['memo','メモ帳','📝'],['files','ファイル','📁'],['clock','時計','⏰'],['calendar','カレンダー','🗓️'],['drawing','お絵描き','🎨'],['music','音楽プレイヤー','🎵'],['settings','設定','⚙️'],['store','CORE Store','🛍️'],['browser','ブラウザ','🌐']];
let S;try{S=Object.assign({installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]},JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){S={installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]}}
let current='',calc='',sw=0,swStart=0,swOn=false,interval=null,files=[];

function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function apps(){return base.filter(x=>S.installed.includes(x[0])).map(x=>({id:x[0],name:x[1],icon:x[2]})).concat((S.custom||[]).filter(x=>S.installed.includes(x.id)))}
function tile(a){return '<button class="appicon" data-open="'+a.id+'"><span class="glyph">'+a.icon+'</span>'+esc(a.name)+'</button>'}

function tick(){let d=new Date(),t=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('#clock').textContent=$('#st').textContent=$('#locktime').textContent=t;$('#date').textContent=$('#qdate').textContent=$('#lockdate').textContent=d.toLocaleDateString('ja-JP',{dateStyle:'full'})}
function open(id){let a=apps().find(x=>x.id===id);if(!a)return;current=id;$('#home').classList.add('hide');$('#panel').classList.add('show');$('#appTitle').textContent=a.name;draw(id)}

function draw(id){let b=$('#body');b.innerHTML='';
if(id==='calculator'){b.innerHTML='<div class="card" style="text-align:right"><small id="prev">計算</small><div id="out" style="font-size:36px;min-height:48px">'+(calc||'0')+'</div></div><div class="kbd">'+['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','履歴','0','.','='].map(x=>'<button data-c="'+x+'">'+x+'</button>').join('')+'</div><button class="btn secondary" id="copy">結果をコピー</button><div id="ch" class="muted"></div>'}
if(id==='memo'){let m=S.data.memos||[];b.innerHTML='<button class="btn" id="new">＋ 新しいメモ</button><div>'+m.map((x,i)=>'<div class="card"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div><div class="row"><button class="btn secondary" data-edit="'+i+'">編集</button><button class="btn danger" data-del="'+i+'">削除</button></div></div>').join('')+'</div>'}
if(id==='files'){b.innerHTML='<p class="muted">ファイルはこの端末内で選択して閲覧・保存できます。</p><input type="file" id="pick" multiple class="field"><div id="fl"></div>'}
if(id==='clock'){b.innerHTML='<div class="card"><div class="muted">現在時刻</div><div style="font-size:38px" id="now"></div></div><h3>ストップウォッチ</h3><div id="sw" style="font-size:32px">00:00.0</div><div class="row"><button class="btn" id="swbtn">開始</button><button class="btn secondary" id="swreset">リセット</button></div><h3>タイマー</h3><div class="row"><input class="field" id="mins" type="number" placeholder="分"><input class="field" id="secs" type="number" placeholder="秒"></div><div id="timer" class="card">停止中</div><button class="btn" id="timerstart">開始</button><h3>アラーム</h3><input class="field" id="alarm" type="time"><button class="btn" id="alarmadd">追加</button><div id="alarms"></div><p class="muted">アラームはCOREを開いている間のみ動作します。</p>';$('#now').textContent=new Date().toLocaleTimeString('ja-JP')}
if(id==='calendar'){let d=new Date(),date=d.toISOString().slice(0,10),ev=S.data.events||[];b.innerHTML='<h2>'+d.getFullYear()+'年 '+(d.getMonth()+1)+'月</h2><div class="card">今日：'+date+'</div><input class="field" type="date" id="edate" value="'+date+'"><input class="field" id="etitle" placeholder="予定のタイトル"><textarea class="field" id="enote" placeholder="メモ"></textarea><button class="btn" id="addEvent">予定を追加</button><h3>予定一覧</h3>'+ev.map((x,i)=>'<div class="listitem"><span><b>'+esc(x.date)+'</b><br>'+esc(x.title)+'<br><small>'+esc(x.note)+'</small></span><button class="btn danger" data-evdel="'+i+'">削除</button></div>').join('')}
if(id==='drawing'){b.innerHTML='<div class="row"><input type="color" id="color" value="#222222"><select id="size"><option>3</option><option>6</option><option>12</option><option>20</option></select><button class="btn secondary" id="eraser">消しゴム</button></div><canvas id="paint" width="900" height="650"></canvas><div class="row"><button class="btn secondary" id="clear">全消去</button><button class="btn" id="png">PNG保存</button></div>';let c=$('#paint'),ctx=c.getContext('2d'),drawing=false,erase=false;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p[0],p[1])};c.onpointermove=e=>{if(!drawing)return;let p=point(e);ctx.strokeStyle=erase?'white':$('#color').value;ctx.lineWidth=Number($('#size').value)*c.width/c.clientWidth;ctx.lineCap='round';ctx.lineTo(p[0],p[1]);ctx.stroke()};c.onpointerup=()=>drawing=false;$('#eraser').onclick=()=>erase=!erase;$('#clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('#png').onclick=()=>{let a=document.createElement('a');a.download='CORE-drawing.png';a.href=c.toDataURL();a.click()}}
if(id==='music'){b.innerHTML='<input type="file" id="musicfile" accept="audio/*" class="field"><div class="card" id="musicname">音声ファイルを選択</div><audio id="player" controls style="width:100%"></audio><p class="muted">端末内の音声ファイルを再生します。</p>'}
if(id==='settings'){b.innerHTML='<h3>壁紙</h3><div class="row"><button class="btn secondary" data-wall="0">1</button><button class="btn secondary" data-wall="1">2</button><button class="btn secondary" data-wall="2">3</button></div><h3>テーマ</h3><button class="btn secondary" id="theme">'+(S.dark?'ライト':'ダーク')+'テーマ</button><h3>インストール済みアプリ</h3><div id="manageApps">'+apps().map(x=>'<div class="listitem"><span>'+x.icon+' '+esc(x.name)+'<br><small class="muted">'+esc(x.id)+'</small></span>'+(!base.some(z=>z[0]===x.id)?'<button class="btn danger" data-uninstall="'+x.id+'">削除</button>':'<small class="muted">標準</small>')+'</div>').join('')+'</div><h3>データ</h3><div class="row"><button class="btn secondary" id="backup">バックアップ</button><label class="btn secondary">復元<input type="file" id="restore" accept="application/json" hidden></label></div><button class="btn danger" id="reset" style="margin-top:16px">データ初期化</button>'}
if(id==='store'){
 const catalog=[
 {id:'battle-intelligence',name:'Battle＆Intelligence',icon:'⚔️',version:'Web',desc:'対戦・知能ゲーム',url:'https://tk-sakusya.github.io/ai-smash-game/'},
 {id:'next-money',name:'NEXT MONEY',icon:'💰',version:'Web',desc:'お金の管理アプリ',url:'https://tk-sakusya.github.io/next-money/'},
 {id:'endless-stages',name:'ENDLESS STAGEs',icon:'🎮',version:'Web',desc:'エンドレスステージゲーム',url:'https://tk-sakusya.github.io/'},
 {id:'youtube',name:'YouTube',icon:'▶️',version:'Web',desc:'動画サイト風アプリ',url:'https://tk-sakusya.github.io/youtube/'},
 {id:'shukudai-notice',name:'宿題のお知らせ',icon:'📚',version:'Web',desc:'宿題・学習管理アプリ',url:'https://tk-sakusya.github.io/shukudai-notice.html'},
 {id:'photo',name:'フォト',icon:'🖼️',version:'Web',desc:'写真管理アプリ',url:'https://tk-sakusya.github.io/Photo.html'},
 {id:'you-must-not',name:'You must not',icon:'👁️',version:'Web',desc:'ホラー演出の作品',url:'https://tk-sakusya.github.io/you-must-not-look/'},
 {id:'reverse-playback',name:'逆再生アプリ',icon:'⏪',version:'Web',desc:'動画・音声の逆再生アプリ',url:'https://tk-sakusya.github.io/reverse-playback/'}
 ];
 S.catalog=catalog;
 b.innerHTML='<div class="card"><h3>🛍️ CORE Store</h3><p class="muted">TK制作アプリ 8作品 · 公式URLから起動</p><div class="muted">インストールするとホーム画面・アプリ一覧に追加されます。</div></div><input class="field" id="storesearch" placeholder="アプリを検索">'+catalog.map(x=>{
 const installed=S.installed.includes(x.id);
 return '<div class="card" data-store-card="'+x.id+'"><div class="row" style="align-items:center"><span style="font-size:30px">'+x.icon+'</span><span style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><br><small class="muted">Webアプリ · '+x.version+'</small></span><button class="btn" data-install="'+x.id+'">'+(installed?'起動':'インストール')+'</button></div><p>'+esc(x.desc)+'</p><small class="muted" style="overflow-wrap:anywhere">'+esc(x.url)+'</small><div class="row" style="margin-top:8px"><button class="btn secondary" data-store-open="'+x.id+'">起動</button><button class="btn danger" data-store-uninstall="'+x.id+'" '+(!installed?'disabled':'')+'>アンインストール</button></div></div>'
 }).join('')+'<p class="muted">外部サイトをCORE内のフレームで表示します。サイト側の埋め込み制限やブラウザ仕様により、アプリによっては別タブ起動が必要です。</p>';
}
if(id==='browser'){b.innerHTML='<div class="row"><input class="field" id="url" placeholder="https://example.com"><button class="btn" id="go">移動</button></div><div class="row"><button class="btn secondary" id="bookmark">保存</button><button class="btn secondary" id="bookmarks">ブックマーク</button><button class="btn secondary" id="hist">履歴</button></div><div id="notice" class="muted">サイトによっては埋め込み表示が拒否されます。</div><iframe id="web"></iframe><div id="bl"></div>'}
let custom=(S.custom||[]).find(x=>x.id===id);if(custom){if(custom.url){b.innerHTML='<div class="muted" style="margin-bottom:8px">🌐 '+esc(custom.url)+'</div><iframe title="'+esc(custom.name)+'" allow="fullscreen; autoplay; clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups" src="'+esc(custom.url)+'" style="width:100%;height:calc(100vh - 190px);min-height:480px;border:0;border-radius:14px;background:white"></iframe><p class="muted">表示できない場合は <a href="'+esc(custom.url)+'" target="_blank" rel="noopener">別タブで開く</a></p>'}else b.innerHTML='<iframe sandbox="allow-scripts allow-forms allow-downloads" srcdoc="'+esc(custom.html)+'"></iframe>'}
}
function click(e){let t=e.target.closest('[data-uninstall]');if(t){uninstall(t.dataset.uninstall);return}t=e.target.closest('[data-open]');if(t){$('#drawer').classList.remove('show');open(t.dataset.open);return}t=e.target.closest('[data-c]');if(t){calcPress(t.dataset.c);return}t=e.target.closest('[data-wall]');if(t){S.wall=+t.dataset.wall;save();wall();return}t=e.target.closest('[data-store-uninstall]');if(t){uninstall(t.dataset.storeUninstall);return}t=e.target.closest('[data-store-open]');if(t){if(!S.installed.includes(t.dataset.storeOpen))return alert('先にインストールしてください');open(t.dataset.storeOpen);return}t=e.target.closest('[data-install]');if(t){install(t.dataset.install);return}t=e.target.closest('[data-del]');if(t){let a=S.data.memos||[];a.splice(+t.dataset.del,1);S.data.memos=a;save();draw('memo');return}t=e.target.closest('[data-edit]');if(t){let a=S.data.memos||[],i=+t.dataset.edit,x=a[i],title=prompt('タイトル',x.title),text=prompt('内容',x.text);if(title!==null&&text!==null){a[i]={title,text};S.data.memos=a;save();draw('memo')}return}t=e.target.closest('[data-evdel]');if(t){let a=S.data.events||[];a.splice(+t.dataset.evdel,1);S.data.events=a;save();draw('calendar')}}
function calcPress(x){if(x==='AC')calc='';else if(x==='⌫')calc=calc.slice(0,-1);else if(x==='='){try{let s=calc.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().% -]+$/.test(s))throw 0;let n=Function('"use strict";return ('+s+')')();if(!Number.isFinite(n))throw 0;$('#prev').textContent=calc+' =';calc=String(n);S.data.calc=(S.data.calc||[]);S.data.calc.unshift($('#prev').textContent+' '+calc);S.data.calc=S.data.calc.slice(0,15);save()}catch(e){$('#out').textContent='エラー';return}}else calc+=x;$('#out').textContent=calc||'0';$('#ch').textContent=(S.data.calc||[]).slice(0,5).join(' / ')}
function install(id){let x=(S.catalog||[]).find(a=>a.id===id);if(!x)return;if(S.installed.includes(id)){open(id);return}S.custom=S.custom||[];let saved=S.custom.find(a=>a.id===id);if(!saved)S.custom.push({...x});else Object.assign(saved,x);S.installed.push(id);save();render();if(current==='store')draw('store');else draw(id)}
function uninstall(id){if(base.some(x=>x[0]===id))return alert('標準アプリは削除できません');let a=apps().find(x=>x.id===id);if(!a||!confirm(a.name+' をアンインストールしますか？'))return;S.installed=S.installed.filter(x=>x!==id);if(current===id)close();save();render();if(current==='settings')draw('settings');else if(current==='store')draw('store')}
document.addEventListener('click',click);
$('#back').onclick=close;$('#more').onclick=()=>alert('CORE • '+current);
$('#nav').onclick=()=>{notice.classList.remove('show');recents.classList.remove('show');$('#quick').classList.remove('show');$('#drawer').classList.add('show')};
$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('show');
$('#status').onclick=e=>{if(e.target.closest('#statusActions'))return;notice.classList.remove('show');recents.classList.remove('show');$('#drawer').classList.remove('show');$('#quick').classList.add('show')};

/* CORE v6: app usage dashboard */
S.usage=S.usage||{};
let usageCurrent='',usageStarted=0,usageLastSaved=0;
function usageCommit(){
 if(!usageCurrent||!usageStarted)return;
 const now=Date.now(),delta=Math.max(0,Math.floor((now-usageStarted)/1000));
 if(delta>0){S.usage[usageCurrent]=(Number(S.usage[usageCurrent])||0)+delta;usageStarted=now;save()}
}
const usageBaseOpen=open;
open=function(id){
 if(usageCurrent!==id){usageCommit();usageCurrent=id;usageStarted=Date.now()}
 usageBaseOpen(id);
};
const usageBaseClose=close;
close=function(){usageCommit();usageCurrent='';usageStarted=0;usageBaseClose()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)usageCommit();else if(usageCurrent)usageStarted=Date.now()});
function usageDuration(sec){
 sec=Math.max(0,Math.floor(Number(sec)||0));
 const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 return h? h+'時間'+m+'分' : m? m+'分'+s+'秒' : s+'秒';
}
function usageDashboard(){
 const el=$('#coreUsageDashboard');if(!el)return;
 const list=apps().map(a=>({id:a.id,name:a.name,icon:a.icon,sec:(Number(S.usage[a.id])||0)+(usageCurrent===a.id&&usageStarted?Math.floor((Date.now()-usageStarted)/1000):0)})).sort((a,b)=>b.sec-a.sec);
 const max=Math.max(1,...list.map(x=>x.sec));
 el.innerHTML=list.length?list.map(x=>'<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>'+x.icon+' '+esc(x.name)+'</span><b>'+usageDuration(x.sec)+'</b></div><div style="height:8px;border-radius:9px;background:var(--s2);overflow:hidden;margin-top:6px"><div style="height:100%;width:'+Math.round(x.sec/max*100)+'%;background:var(--a);border-radius:9px"></div></div></div>').join(''):'<p class="muted">利用データはありません。</p>';
}

/* CORE IndexedDB foundation: safe additive storage and legacy wallpaper migration */
const CORE_DB_NAME='core-os-storage';
const CORE_DB_VERSION=1;
let coreDBPromise=null;
function coreOpenDB(){
 if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB非対応'));
 if(coreDBPromise)return coreDBPromise;
 coreDBPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(CORE_DB_NAME,CORE_DB_VERSION);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('blobs'))db.createObjectStore('blobs')};
  req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>{db.close();coreDBPromise=null};resolve(db)};
  req.onerror=()=>{coreDBPromise=null;reject(req.error||new Error('DBを開けません'))};
  req.onblocked=()=>{coreDBPromise=null;reject(new Error('別タブがデータベース更新を妨げています'))};
 });
 return coreDBPromise;
}
async function coreDBAction(mode,key,value){
 const db=await coreOpenDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('blobs','readwrite'),store=tx.objectStore('blobs');
  let req;
  try{req=mode==='get'?store.get(key):mode==='delete'?store.delete(key):store.put(value,key)}
  catch(e){reject(e);return}
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('保存処理に失敗'));
  tx.onabort=()=>reject(tx.error||new Error('保存処理が中断'));
 });
}
window.CORE=window.CORE||{};
window.CORE.storage={
 get:key=>coreDBAction('get',String(key)),
 set:(key,value)=>coreDBAction('set',String(key),value),
 delete:key=>coreDBAction('delete',String(key)),
 ready:()=>coreOpenDB()
};
async function coreMigrateLegacyWallpaper(){
 if(!S.customWallpaper)return {status:'not-needed'};
 try{
  const existing=await coreDBAction('get','customWallpaper');
  if(!existing)await coreDBAction('set','customWallpaper',{data:S.customWallpaper,migratedAt:new Date().toISOString(),source:'core-v1-localStorage'});
  return {status:'copied'};
 }catch(e){return {status:'error',message:String(e.message||e)}}
}
async function coreStorageStatus(){
 const el=$('#coreStorageStatus');if(!el)return;
 try{
  await coreOpenDB();
  const saved=await coreDBAction('get','customWallpaper');
  el.textContent='IndexedDB：利用可能 · '+(saved?'カスタム壁紙の複製を保存済み':'追加データなし')+'。旧データはそのまま保持中。';
  el.dataset.state='ready';
 }catch(e){
  el.textContent='IndexedDB：利用不可（'+String(e.message||e)+'）。従来の保存方式で動作します。';
  el.dataset.state='fallback';
 }
}

/* Persistent home pages and dock. Long press an icon to move it. */
S.homePages=Array.isArray(S.homePages)?S.homePages:[];
S.dockOrder=Array.isArray(S.dockOrder)?S.dockOrder:['browser','memo','store','settings'];
let homePage=Math.max(0,Math.min(Number(S.homePage)||0,Math.max(0,S.homePages.length-1)));
function coreEnsurePages(){
 let ids=apps().filter(a=>!['settings','store','browser','memo'].includes(a.id)).map(a=>a.id);if(S.homeOrder)ids.sort((x,y)=>{const i=S.homeOrder.indexOf(x),j=S.homeOrder.indexOf(y);return(i<0?999:i)-(j<0?999:j)});
 if(!S.homePages.length)S.homePages=[ids.slice()];
 const known=new Set(S.homePages.flat());
 ids.forEach(id=>{if(!known.has(id))S.homePages[0].push(id)});
 S.homePages=S.homePages.filter(p=>Array.isArray(p));
 if(!S.homePages.length)S.homePages=[[]];
 homePage=Math.min(homePage,S.homePages.length-1);
 S.dockOrder=S.dockOrder.filter(id=>apps().some(a=>a.id===id));
 ['browser','memo','store','settings'].forEach(id=>{if(apps().some(a=>a.id===id)&&!S.dockOrder.includes(id))S.dockOrder.push(id)});
}
function coreHomeTile(id,zone){
 if(id.startsWith('folder:')){const ix=Number(id.slice(7)),f=(S.folders||[])[ix];return f?'<button class="appicon" data-folder="'+ix+'" data-zone="'+zone+'"><span class="glyph">📁</span>'+esc(f.name)+'</button>':''}
 const a=apps().find(x=>x.id===id);return a?tile(a).replace('data-open="'+id+'"','data-open="'+id+'" data-zone="'+zone+'"'):'';
}
function coreRenderPlacement(){
 coreEnsurePages();
 $('#allApps').innerHTML=apps().map(tile).join('');
 $('#homeIcons').innerHTML=(S.homePages[homePage]||[]).map(id=>coreHomeTile(id,'home')).join('');
 $('#dock').innerHTML=S.dockOrder.map(id=>coreHomeTile(id,'dock')).join('');
 let dots=document.getElementById('corePageDots');
 if(!dots){dots=document.createElement('div');dots.id='corePageDots';$('#homeIcons').insertAdjacentElement('afterend',dots)}
 dots.innerHTML=S.homePages.map((p,i)=>'<button type="button" data-page="'+i+'" class="'+(i===homePage?'active':'')+'" aria-label="ホームページ '+(i+1)+'"></button>').join('')+'<button type="button" data-page-add="1" aria-label="ページ追加" style="width:18px;height:18px;background:transparent;color:var(--muted)">＋</button>';
 if(!document.getElementById('corePageHint')){const hint=document.createElement('div');hint.id='corePageHint';hint.className='muted';hint.style.cssText='text-align:center;font-size:10px';dots.after(hint)}
 $('#corePageHint').textContent='長押しして移動 · '+(homePage+1)+' / '+S.homePages.length;
}
const coreOldRenderV101=render;
render=function(){coreOldRenderV101();coreRenderPlacement()};
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-page]');if(p){homePage=Number(p.dataset.page);S.homePage=homePage;save();coreRenderPlacement();return}
 if(e.target.closest('[data-page-add]')){S.homePages.push([]);homePage=S.homePages.length-1;S.homePage=homePage;save();coreRenderPlacement();return}
});
let coreHold=null,coreDrag=null,coreSuppressClick=false;
document.addEventListener('click',e=>{if(coreSuppressClick&&e.target.closest('#homeIcons .appicon,#dock .appicon')){e.preventDefault();e.stopImmediatePropagation();coreSuppressClick=false}},true);
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('#homeIcons .appicon[data-open],#dock .appicon[data-open]');
 if(!el||e.button>0)return;
 const id=el.dataset.open,zone=el.dataset.zone||(el.closest('#dock')?'dock':'home');
 coreHold={id,zone,el,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{coreDrag={id,zone};el.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(18)},420)};
},{passive:true});
document.addEventListener('pointermove',e=>{
 if(!coreHold)return;
 if(Math.hypot(e.clientX-coreHold.x,e.clientY-coreHold.y)>18&&!coreDrag){clearTimeout(coreHold.timer);coreHold=null}
 if(coreDrag){const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('#homeIcons .appicon,#dock .appicon');document.querySelectorAll('.dropTarget').forEach(x=>x.classList.remove('dropTarget'));if(under)under.classList.add('dropTarget')}
},{passive:true});
document.addEventListener('pointerup',e=>{
 if(coreHold)clearTimeout(coreHold.timer);
 if(!coreDrag){coreHold=null;return}
 coreSuppressClick=true;setTimeout(()=>coreSuppressClick=false,650);
 const source=coreDrag,target=document.elementFromPoint(e.clientX,e.clientY);
 const targetIcon=target?.closest('#homeIcons .appicon[data-open],#dock .appicon[data-open]');
 const inDock=!!target?.closest('#dock'),inHome=!!target?.closest('#homeIcons');
 document.querySelectorAll('.dragging,.dropTarget').forEach(x=>x.classList.remove('dragging','dropTarget'));
 const removeFrom=(arr,id)=>{const i=arr.indexOf(id);if(i>=0)arr.splice(i,1)};
 const targetPageEl=target?.closest('[data-page]');
 if(targetPageEl&&source.zone==='home'){const nextPage=Number(targetPageEl.dataset.page);if(nextPage!==homePage&&S.homePages[nextPage]){removeFrom(S.homePages[homePage],source.id);if(!S.homePages[nextPage].includes(source.id))S.homePages[nextPage].push(source.id)}}
 else if(targetIcon&&targetIcon.dataset.open!==source.id&&source.zone==='home'&&inHome){
  const a=targetIcon.dataset.open;S.folders=S.folders||[];S.folders.push({name:'フォルダ',ids:[source.id,a]});
  const fi=S.folders.length-1,pg=S.homePages[homePage];removeFrom(pg,source.id);removeFrom(pg,a);pg.push('folder:'+fi);
 }else if(inDock&&source.zone!=='dock'){
  S.homePages.forEach(p=>removeFrom(p,source.id));if(!S.dockOrder.includes(source.id))S.dockOrder.push(source.id);
 }else if(inHome&&source.zone==='dock'){
  removeFrom(S.dockOrder,source.id);if(!S.homePages[homePage].includes(source.id))S.homePages[homePage].push(source.id);
 }else if(targetIcon&&source.zone===targetIcon.dataset.zone){
  const arr=source.zone==='dock'?S.dockOrder:S.homePages[homePage],from=arr.indexOf(source.id),to=arr.indexOf(targetIcon.dataset.open);
  if(from>=0&&to>=0){arr.splice(from,1);arr.splice(to,0,source.id)}
 }
 S.homePage=homePage;save();coreRenderPlacement();coreHold=null;coreDrag=null;
});
document.addEventListener('pointercancel',()=>{if(coreHold)clearTimeout(coreHold.timer);coreHold=null;coreDrag=null;document.querySelectorAll('.dragging,.dropTarget').forEach(x=>x.classList.remove('dragging','dropTarget'))});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-wall]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();S.wall=Number(b.dataset.wall)||0;delete S.customWallpaper;window.coreWallpaperAppliedBlob=null;try{await window.CORE.storage.delete('customWallpaperBlob')}catch(_){}save();wall()},true);

/* Store: add user-registered web apps and ChatAI */
const coreChatCatalog={id:'chatai',name:'ChatAI',icon:'🤖',version:'1.0',desc:'バックエンド接続式の日本語AIチャット',backendRequired:true};
const coreStoreDrawBefore=draw;

 coreStoreDrawBefore(id);
 if(id==='store'){
  S.storeApps=Array.isArray(S.storeApps)?S.storeApps:[];
  S.catalog=[...(S.catalog||[]),coreChatCatalog,...S.storeApps.filter(x=>x.id!=='chatai')];
  const extra=S.catalog.filter(x=>x.id==='chatai'||S.storeApps.some(y=>y.id===x.id));
  const area=document.createElement('div');area.innerHTML='<div class="card" id="coreRegister"><h3>＋ Webアプリを登録</h3><input class="field" id="coreAppName" placeholder="アプリ名"><input class="field" id="coreAppUrl" type="url" placeholder="https://example.com"><input class="field" id="coreAppIcon" maxlength="4" placeholder="アイコン（例：🚀）"><button class="btn" id="coreRegisterApp">登録する</button><p class="muted">HTTPSの公開URLを登録できます。登録後にインストールするとホーム画面から起動できます。</p></div>';
  $('#body').append(area);
  extra.forEach(x=>{const installed=S.installed.includes(x.id),card=document.createElement('div');card.className='card';card.innerHTML='<div class="row"><span style="font-size:30px">'+x.icon+'</span><span style="flex:1"><b>'+esc(x.name)+'</b><br><small class="muted">'+esc(x.desc)+'</small></span><button class="btn" data-install="'+esc(x.id)+'">'+(installed?'起動':'インストール')+'</button></div>';$('#coreRegister').before(card)});
  $('#coreRegisterApp').onclick=()=>{
   const name=$('#coreAppName').value.trim(),url=$('#coreAppUrl').value.trim(),icon=$('#coreAppIcon').value.trim()||'🌐';
   if(!name||!url)return alert('アプリ名とURLを入力してください');
   let parsed;try{parsed=new URL(url)}catch(e){return alert('URLの形式を確認してください')}
   if(parsed.protocol!=='https:')return alert('安全のためHTTPSのURLのみ登録できます');
   const id='user-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36);
   const app={id,name,icon,version:'User',desc:'ユーザー登録アプリ',url:parsed.href};
   S.storeApps.push(app);S.catalog.push(app);save();draw('store');
  };
 }
};

/* ChatAI: calls a real configured backend; never generates fake replies */
function coreChatHistory(){S.chatHistory=Array.isArray(S.chatHistory)?S.chatHistory:[];if(!S.activeChatId||!S.chatHistory.some(c=>c.id===S.activeChatId)){const c={id:'chat-'+Date.now(),title:'新しい会話',messages:[]};S.chatHistory.unshift(c);S.activeChatId=c.id;save()}return S.chatHistory.find(c=>c.id===S.activeChatId)}
function coreChatRender(){const chat=coreChatHistory(),el=$('#chatMessages');if(!el)return;el.innerHTML=chat.messages.map(m=>'<div class="chatBubble '+(m.role==='user'?'user':'assistant')+'">'+esc(m.content)+'</div>').join('');el.scrollTop=el.scrollHeight}
function coreChatDraw(){
 coreChatHistory();
 $('#body').innerHTML='<div class="chatShell"><div class="row"><button class="btn secondary" id="chatNew">＋ 新しい会話</button><button class="btn secondary" id="chatHistory">履歴</button></div><div class="muted" id="chatStatus">バックエンド未設定。設定画面でAPIサーバーURLを登録してください。</div><div id="chatMessages" class="chatMessages"></div><div class="chatComposer"><textarea id="chatInput" class="field" rows="2" placeholder="メッセージを入力"></textarea><button class="btn" id="chatSend">送信</button></div><div id="chatHistoryPanel" class="card hide"></div><p class="muted">ChatAIは設定したバックエンドにのみ通信します。APIキーはCOREに保存しません。</p></div>';
 coreChatRender();
 $('#chatNew').onclick=()=>{const c={id:'chat-'+Date.now(),title:'新しい会話',messages:[]};S.chatHistory.unshift(c);S.activeChatId=c.id;save();coreChatDraw()};
 $('#chatHistory').onclick=()=>{const p=$('#chatHistoryPanel');p.classList.toggle('hide');p.innerHTML=S.chatHistory.map(c=>'<div class="listitem"><button class="btn secondary" data-chat-open="'+esc(c.id)+'">'+esc(c.title||'新しい会話')+'</button><button class="btn danger" data-chat-delete="'+esc(c.id)+'">削除</button></div>').join('')||'履歴はありません'};
 $('#chatHistoryPanel').onclick=e=>{const o=e.target.closest('[data-chat-open]'),d=e.target.closest('[data-chat-delete]');if(d){S.chatHistory=S.chatHistory.filter(c=>c.id!==d.dataset.chatDelete);if(S.activeChatId===d.dataset.chatDelete)S.activeChatId='';save();coreChatDraw()}else if(o){S.activeChatId=o.dataset.chatOpen;save();coreChatDraw()}};
 $('#chatSend').onclick=coreChatSend;$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();coreChatSend()}};
}
async function coreChatSend(){
 const input=$('#chatInput'),status=$('#chatStatus'),textValue=input.value.trim();if(!textValue)return;
 const endpoint=String(S.chatEndpoint||'').trim();if(!endpoint){status.textContent='通信先が未設定です。設定画面でバックエンドURLを登録してください。';return}
 let url;try{url=new URL(endpoint)}catch(e){status.textContent='バックエンドURLの形式が正しくありません。';return}
 if(url.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){status.textContent='公開環境ではHTTPSのバックエンドURLが必要です。';return}
 const chat=coreChatHistory();chat.messages.push({role:'user',content:textValue});if(chat.messages.length===1)chat.title=textValue.slice(0,24);save();input.value='';coreChatRender();status.textContent='AIに接続中…';
 try{
  const response=await fetch(url.href,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}))})});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json(),reply=data.reply||data.message||data.text||data.choices?.[0]?.message?.content;
  if(typeof reply!=='string'||!reply.trim())throw new Error('応答形式が不正です。{reply:"..."} またはOpenAI互換形式が必要です。');
  chat.messages.push({role:'assistant',content:reply});save();coreChatRender();status.textContent='接続済み · '+url.host;
 }catch(e){chat.messages.push({role:'system',content:'通信エラー：'+String(e.message||e)});save();coreChatRender();status.textContent='通信に失敗しました。URL・CORS・サーバー状態を確認してください。'}
}
const coreChatDrawBefore=draw;
draw=function(id){if(id==='chatai'){coreChatDraw();return}coreChatDrawBefore(id)};

 if(id==='settings'){

  const chatbox=document.createElement('div');chatbox.className='card';chatbox.innerHTML='<h3>🤖 ChatAI 接続設定</h3><p class="muted">自分で用意したHTTPSバックエンドのURLを登録します。APIキーはここに入力しないでください。</p><input id="coreChatEndpoint" class="field" type="url" placeholder="https://your-server.example/chat"><button id="coreChatSave" class="btn">接続先を保存</button><p class="muted">サーバーはPOST /chat形式でJSONのmessagesを受け取り、{reply:"AIの返答"}またはOpenAI互換のchoices形式を返す必要があります。</p>';$('#body').append(chatbox);$('#coreChatEndpoint').value=S.chatEndpoint||'';
  $('#coreChatSave').onclick=()=>{const v=$('#coreChatEndpoint').value.trim();if(v){try{const u=new URL(v);if(u.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')throw 0}catch(e){return alert('有効なHTTPS URLを入力してください')}}S.chatEndpoint=v;save();alert('接続先を保存しました。通信テストはChatAIから行えます。')};
  const wallbox=document.createElement('div');wallbox.className='card';wallbox.innerHTML='<h3>🖼️ 壁紙の表示方法</h3><select id="coreWallMode" class="field"><option value="cover">画面全体に合わせる</option><option value="contain">画像全体を表示</option><option value="stretch">画面に合わせて伸縮</option></select><p class="muted">新しい画像はIndexedDBに保存します。既存の壁紙データもそのまま利用できます。</p>';$('#body').append(wallbox);$('#coreWallMode').value=S.wallpaperMode||'cover';$('#coreWallMode').onchange=e=>{S.wallpaperMode=e.target.value;save();wall()};
  const upload=$('#coreWallpaperFile');
  if(upload)upload.onchange=async e=>{
