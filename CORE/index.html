<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#dce5ff"><title>CORE</title><style>
:root{--bg:#e9edfa;--s:#f7f8ff;--s2:#dce3f5;--ink:#171b27;--muted:#626a7b;--a:#5369b5;--line:#cbd2e5}*{box-sizing:border-box}body{margin:0;background:#101522;font-family:system-ui,"Noto Sans JP",sans-serif;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,430px);height:min(100dvh,920px);min-height:600px;background:var(--bg);position:relative;overflow:hidden;border-radius:30px;box-shadow:0 0 0 7px #252b38}@media(max-width:500px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100dvh;min-height:0;border-radius:0;box-shadow:none}}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#f9d7e7,transparent 42%),radial-gradient(ellipse at 80% 75%,#a9c5ed,transparent 46%),linear-gradient(145deg,#c5d7f5,#e8d9ef 55%,#c8d9ed)}.status{height:38px;position:absolute;z-index:20;top:0;left:0;right:0;padding:9px 20px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#263047}.home{position:absolute;inset:38px 0 0;padding:28px 22px 12px;display:flex;flex-direction:column}.date{font-size:14px;font-weight:600}.bigclock{font-size:64px;font-weight:300;letter-spacing:-4px;margin-top:8px}.widget{margin:20px 0 auto;padding:16px;border-radius:24px;background:#ffffff75;backdrop-filter:blur(16px)}.widget p{font-size:12px;color:#50596c}.icons,.dock,.gridapps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 7px}.dock{padding:14px 8px;border-radius:24px;background:#ffffff75}.appicon{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer}.glyph{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:#f9f9ff;box-shadow:0 3px 8px #28345318}.nav{height:27px;display:flex;justify-content:center;align-items:center}.nav:after{content:"";width:108px;height:4px;border-radius:9px;background:#35405a88}.panel{position:absolute;z-index:25;inset:0;background:var(--s);display:none;flex-direction:column}.panel.show{display:flex}.apphead{height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:23px;color:var(--ink)}.apptitle{font-weight:700;flex:1}.appbody{padding:17px;overflow:auto;flex:1;color:var(--ink)}.btn{border:0;border-radius:22px;padding:11px 16px;background:var(--a);color:white;font-weight:650;cursor:pointer}.secondary{background:var(--s2);color:var(--ink)}.danger{background:#b64252}.field,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--s);color:var(--ink);font:inherit;margin:6px 0}.card{padding:14px;border-radius:18px;background:var(--s2);margin:9px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:12px}.gridapps{padding:20px 10px}.drawer{position:absolute;inset:0;z-index:30;background:#18203688;display:none;align-items:flex-end}.drawer.show{display:flex}.drawerbox{width:100%;padding:22px 20px 28px;border-radius:28px 28px 0 0;background:var(--s);max-height:90%;overflow:auto}.quick{position:absolute;inset:0;z-index:40;background:#e9edfaee;display:none;padding:55px 20px}.quick.show{display:block}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:17px;border-radius:20px;background:var(--s2);border:0;text-align:left;font-weight:650}.tile.active{background:var(--a);color:white}.lock{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(145deg,#b8c9ed,#ead7e9)}.lock.show{display:flex}.locktime{font-size:76px;font-weight:250}.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kbd button{padding:16px 5px;border:0;border-radius:14px;background:var(--s2);font-size:18px;color:var(--ink)}canvas{width:100%;height:300px;background:white;border-radius:15px;touch-action:none}.listitem{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.listitem span:first-child{flex:1}.hide{display:none!important}iframe{width:100%;height:65vh;border:0;background:white}
</style></head><body><main class="phone" id="phone"><div class="wall" id="wall"></div><div class="status" id="status"><span id="st">--:--</span><span>● ▮▮ ▰</span></div><section class="home" id="home"><div class="date" id="date"></div><div class="bigclock" id="clock"></div><div>CORE • Your space, your rules.</div><div class="widget"><b>COREへようこそ</b><p>自分だけのスマートフォン環境。</p></div><div class="icons" id="homeIcons"></div><div style="text-align:center;padding:8px">● ○ ○</div><div class="dock" id="dock"></div><div class="nav" id="nav"></div></section><section class="panel" id="panel"><header class="apphead"><button class="back" id="back">‹</button><div class="apptitle" id="appTitle">CORE</div><button class="back" id="more">⋮</button></header><div class="appbody" id="body"></div></section><section class="drawer" id="drawer"><div class="drawerbox"><div class="row"><b style="font-size:20px">アプリ</b><button class="btn secondary" id="closeDrawer">閉じる</button></div><input class="field" id="search" placeholder="アプリを検索"><div class="gridapps" id="allApps"></div></div></section><section class="quick" id="quick"><div class="row"><b style="font-size:24px">クイック設定</b><button class="btn secondary" id="closeQuick">閉じる</button></div><p id="qdate"></p><div class="tiles"><button class="tile active">◉ Wi-Fi（表示のみ）</button><button class="tile active">ᛒ Bluetooth（表示のみ）</button><button class="tile" id="darkQuick">◐ ダークテーマ</button><button class="tile" id="airplane">✈ 機内モード表示</button></div><div class="card">明るさ <input type="range" min="40" max="100" value="100" id="brightness" style="width:100%"></div><p class="muted">無線機能はブラウザから制御できません。</p></section><section class="lock" id="lock"><div class="locktime" id="locktime"></div><div id="lockdate"></div><p>CORE</p><button class="btn secondary" id="unlock">タップして解除</button></section></main><script>
(function(){
const $=s=>document.querySelector(s), key='core-v1';
const base=[['calculator','電卓','🧮'],['memo','メモ帳','📝'],['files','ファイル','📁'],['clock','時計','⏰'],['calendar','カレンダー','🗓️'],['drawing','お絵描き','🎨'],['music','音楽プレイヤー','🎵'],['settings','設定','⚙️'],['store','CORE Store','🛍️'],['browser','ブラウザ','🌐']];
let S;try{S=Object.assign({installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]},JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){S={installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]}}
let current='',calc='',sw=0,swStart=0,swOn=false,interval=null,files=[];

function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function apps(){return base.filter(x=>S.installed.includes(x[0])).map(x=>({id:x[0],name:x[1],icon:x[2]})).concat((S.custom||[]).filter(x=>S.installed.includes(x.id)))}
function tile(a){return '<button class="appicon" data-open="'+a.id+'"><span class="glyph">'+a.icon+'</span>'+esc(a.name)+'</button>'}
function render(){let a=apps();if(S.homeOrder)a.sort((x,y)=>{let i=S.homeOrder.indexOf(x.id),j=S.homeOrder.indexOf(y.id);return (i<0?999:i)-(j<0?999:j)});$('#allApps').innerHTML=a.map(tile).join('');$('#homeIcons').innerHTML=a.filter(x=>!['settings','store','browser','memo'].includes(x.id)).slice(0,8).map(tile).join('');$('#dock').innerHTML=['browser','memo','store','settings'].map(id=>a.find(x=>x.id===id)).filter(Boolean).map(tile).join('')}
function tick(){let d=new Date(),t=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('#clock').textContent=$('#st').textContent=$('#locktime').textContent=t;$('#date').textContent=$('#qdate').textContent=$('#lockdate').textContent=d.toLocaleDateString('ja-JP',{dateStyle:'full'})}
function open(id){let a=apps().find(x=>x.id===id);if(!a)return;current=id;$('#home').classList.add('hide');$('#panel').classList.add('show');$('#appTitle').textContent=a.name;draw(id)}

function draw(id){let b=$('#body');b.innerHTML='';
if(id==='calculator'){b.innerHTML='<div class="card" style="text-align:right"><small id="prev">計算</small><div id="out" style="font-size:36px;min-height:48px">'+(calc||'0')+'</div></div><div class="kbd">'+['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','履歴','0','.','='].map(x=>'<button data-c="'+x+'">'+x+'</button>').join('')+'</div><button class="btn secondary" id="copy">結果をコピー</button><div id="ch" class="muted"></div>'}
if(id==='memo'){let m=S.data.memos||[];b.innerHTML='<button class="btn" id="new">＋ 新しいメモ</button><div>'+m.map((x,i)=>'<div class="card"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div><div class="row"><button class="btn secondary" data-edit="'+i+'">編集</button><button class="btn danger" data-del="'+i+'">削除</button></div></div>').join('')+'</div>'}
if(id==='files'){b.innerHTML='<p class="muted">ファイルはこの端末内で選択して閲覧・保存できます。</p><input type="file" id="pick" multiple class="field"><div id="fl"></div>'}
if(id==='clock'){b.innerHTML='<div class="card"><div class="muted">現在時刻</div><div style="font-size:38px" id="now"></div></div><h3>ストップウォッチ</h3><div id="sw" style="font-size:32px">00:00.0</div><div class="row"><button class="btn" id="swbtn">開始</button><button class="btn secondary" id="swreset">リセット</button></div><h3>タイマー</h3><div class="row"><input class="field" id="mins" type="number" placeholder="分"><input class="field" id="secs" type="number" placeholder="秒"></div><div id="timer" class="card">停止中</div><button class="btn" id="timerstart">開始</button><h3>アラーム</h3><input class="field" id="alarm" type="time"><button class="btn" id="alarmadd">追加</button><div id="alarms"></div><p class="muted">アラームはCOREを開いている間のみ動作します。</p>';$('#now').textContent=new Date().toLocaleTimeString('ja-JP')}
if(id==='calendar'){let d=new Date(),date=d.toISOString().slice(0,10),ev=S.data.events||[];b.innerHTML='<h2>'+d.getFullYear()+'年 '+(d.getMonth()+1)+'月</h2><div class="card">今日：'+date+'</div><input class="field" type="date" id="edate" value="'+date+'"><input class="field" id="etitle" placeholder="予定のタイトル"><textarea class="field" id="enote" placeholder="メモ"></textarea><button class="btn" id="addEvent">予定を追加</button><h3>予定一覧</h3>'+ev.map((x,i)=>'<div class="listitem"><span><b>'+esc(x.date)+'</b><br>'+esc(x.title)+'<br><small>'+esc(x.note)+'</small></span><button class="btn danger" data-evdel="'+i+'">削除</button></div>').join('')}
if(id==='drawing'){b.innerHTML='<div class="row"><input type="color" id="color" value="#222222"><select id="size"><option>3</option><option>6</option><option>12</option><option>20</option></select><button class="btn secondary" id="eraser">消しゴム</button></div><canvas id="paint" width="900" height="650"></canvas><div class="row"><button class="btn secondary" id="clear">全消去</button><button class="btn" id="png">PNG保存</button></div>';let c=$('#paint'),ctx=c.getContext('2d'),drawing=false,erase=false;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p[0],p[1])};c.onpointermove=e=>{if(!drawing)return;let p=point(e);ctx.strokeStyle=erase?'white':$('#color').value;ctx.lineWidth=Number($('#size').value)*c.width/c.clientWidth;ctx.lineCap='round';ctx.lineTo(p[0],p[1]);ctx.stroke()};c.onpointerup=()=>drawing=false;$('#eraser').onclick=()=>erase=!erase;$('#clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('#png').onclick=()=>{let a=document.createElement('a');a.download='CORE-drawing.png';a.href=c.toDataURL();a.click()}}
if(id==='music'){b.innerHTML='<input type="file" id="musicfile" accept="audio/*" class="field"><div class="card" id="musicname">音声ファイルを選択</div><audio id="player" controls style="width:100%"></audio><p class="muted">端末内の音声ファイルを再生します。</p>'}
if(id==='settings'){b.innerHTML='<h3>壁紙</h3><div class="row"><button class="btn secondary" data-wall="0">1</button><button class="btn secondary" data-wall="1">2</button><button class="btn secondary" data-wall="2">3</button></div><h3>テーマ</h3><button class="btn secondary" id="theme">'+(S.dark?'ライト':'ダーク')+'テーマ</button><h3>インストール済みアプリ</h3><div id="manageApps">'+apps().map(x=>'<div class="listitem"><span>'+x.icon+' '+esc(x.name)+'<br><small class="muted">'+esc(x.id)+'</small></span>'+(!base.some(z=>z[0]===x.id)?'<button class="btn danger" data-uninstall="'+x.id+'">削除</button>':'<small class="muted">標準</small>')+'</div>').join('')+'</div><h3>データ</h3><div class="row"><button class="btn secondary" id="backup">バックアップ</button><label class="btn secondary">復元<input type="file" id="restore" accept="application/json" hidden></label></div><button class="btn danger" id="reset" style="margin-top:16px">データ初期化</button>'}
if(id==='store'){let cat=[{id:'counter',name:'カウンター',icon:'🔢',version:'1.0.0',desc:'数字を数えるアプリ',html:'<!doctype html><meta charset=utf-8><style>body{font:20px system-ui;text-align:center;padding:30px}button{padding:15px}</style><h2>カウンター</h2><h1 id=n>0</h1><button onclick="n.textContent=+n.textContent+1">＋1</button><button onclick="n.textContent=+n.textContent-1">−1</button>'},{id:'notepad-plus',name:'メモ帳+',icon:'📒',version:'1.0.0',desc:'追加のシンプルメモ',html:'<!doctype html><meta charset=utf-8><style>body{font:16px system-ui;padding:20px}textarea{width:100%;height:60vh}</style><h2>メモ帳+</h2><textarea placeholder="メモ..."></textarea>'},{id:'mini-timer',name:'ミニタイマー',icon:'⏳',version:'1.0.0',desc:'30秒タイマー',html:'<!doctype html><meta charset=utf-8><style>body{font:20px system-ui;text-align:center;padding:30px}</style><h2>ミニタイマー</h2><h1 id=t>30</h1><button onclick="let n=30;clearInterval(window.i);window.i=setInterval(()=>{t.textContent=--n;if(n<=0)clearInterval(i)},1000)">開始</button>'}];S.catalog=cat;b.innerHTML='<input class="field" id="storesearch" placeholder="アプリ検索">'+cat.map(x=>'<div class="card"><div class="row"><span style="font-size:28px">'+x.icon+'</span><span><b>'+x.name+'</b><br><small class="muted">Version '+x.version+'</small></span><button class="btn" data-install="'+x.id+'">'+(S.installed.includes(x.id)?'起動':'インストール')+'</button></div><p>'+x.desc+'</p><button class="btn secondary" data-detail-app="'+x.id+'">詳細</button></div>').join('')+'<p class="muted">アプリ本体を保存し、制限付きiframe内で実行します。インストール済みアプリの削除は「設定」から行えます。</p>'}
if(id==='browser'){b.innerHTML='<div class="row"><input class="field" id="url" placeholder="https://example.com"><button class="btn" id="go">移動</button></div><div class="row"><button class="btn secondary" id="bookmark">保存</button><button class="btn secondary" id="bookmarks">ブックマーク</button><button class="btn secondary" id="hist">履歴</button></div><div id="notice" class="muted">サイトによっては埋め込み表示が拒否されます。</div><iframe id="web"></iframe><div id="bl"></div>'}
let custom=(S.custom||[]).find(x=>x.id===id);if(custom)b.innerHTML='<iframe sandbox="allow-scripts allow-forms allow-downloads" srcdoc="'+esc(custom.html)+'"></iframe>';
}
function click(e){let t=e.target.closest('[data-uninstall]');if(t){uninstall(t.dataset.uninstall);return}t=e.target.closest('[data-open]');if(t){$('#drawer').classList.remove('show');open(t.dataset.open);return}t=e.target.closest('[data-c]');if(t){calcPress(t.dataset.c);return}t=e.target.closest('[data-wall]');if(t){S.wall=+t.dataset.wall;save();wall();return}t=e.target.closest('[data-install]');if(t){install(t.dataset.install);return}t=e.target.closest('[data-del]');if(t){let a=S.data.memos||[];a.splice(+t.dataset.del,1);S.data.memos=a;save();draw('memo');return}t=e.target.closest('[data-edit]');if(t){let a=S.data.memos||[],i=+t.dataset.edit,x=a[i],title=prompt('タイトル',x.title),text=prompt('内容',x.text);if(title!==null&&text!==null){a[i]={title,text};S.data.memos=a;save();draw('memo')}return}t=e.target.closest('[data-evdel]');if(t){let a=S.data.events||[];a.splice(+t.dataset.evdel,1);S.data.events=a;save();draw('calendar')}}
function calcPress(x){if(x==='AC')calc='';else if(x==='⌫')calc=calc.slice(0,-1);else if(x==='='){try{let s=calc.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().% -]+$/.test(s))throw 0;let n=Function('"use strict";return ('+s+')')();if(!Number.isFinite(n))throw 0;$('#prev').textContent=calc+' =';calc=String(n);S.data.calc=(S.data.calc||[]);S.data.calc.unshift($('#prev').textContent+' '+calc);S.data.calc=S.data.calc.slice(0,15);save()}catch(e){$('#out').textContent='エラー';return}}else calc+=x;$('#out').textContent=calc||'0';$('#ch').textContent=(S.data.calc||[]).slice(0,5).join(' / ')}
function install(id){let x=(S.catalog||[]).find(a=>a.id===id);if(!x)return;if(S.installed.includes(id)){open(id);return}S.custom=S.custom||[];let saved=S.custom.find(a=>a.id===id);if(!saved)S.custom.push(x);S.installed.push(id);save();render();draw('store');alert(x.name+' をインストールしました')}
function uninstall(id){if(base.some(x=>x[0]===id))return alert('標準アプリは削除できません');let a=apps().find(x=>x.id===id);if(!a||!confirm(a.name+' をアンインストールしますか？'))return;S.installed=S.installed.filter(x=>x!==id);if(current===id)close();save();render();if(current==='settings')draw('settings');else if(current==='store')draw('store')}
document.addEventListener('click',click);
$('#back').onclick=close;$('#more').onclick=()=>alert('CORE • '+current);$('#nav').onclick=()=>$('#drawer').classList.add('show');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('show');$('#status').onclick=()=>$('#quick').classList.add('show');$('#closeQuick').onclick=()=>$('#quick').classList.remove('show');$('#unlock').onclick=()=>$('#lock').classList.remove('show');
$('#search').oninput=e=>document.querySelectorAll('#allApps .appicon').forEach(x=>x.classList.toggle('hide',!x.textContent.toLowerCase().includes(e.target.value.toLowerCase())));

/* CORE v6: app usage dashboard */
S.usage=S.usage||{};
let usageCurrent='',usageStarted=0,usageLastSaved=0;
function usageCommit(){
 if(!usageCurrent||!usageStarted)return;
 const now=Date.now(),delta=Math.max(0,Math.floor((now-usageStarted)/1000));
 if(delta>0){S.usage[usageCurrent]=(Number(S.usage[usageCurrent])||0)+delta;usageStarted=now;save()}
}
const usageBaseOpen=open;
open=function(id){
 if(usageCurrent!==id){usageCommit();usageCurrent=id;usageStarted=Date.now()}
 usageBaseOpen(id);
};
const usageBaseClose=close;
close=function(){usageCommit();usageCurrent='';usageStarted=0;usageBaseClose()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)usageCommit();else if(usageCurrent)usageStarted=Date.now()});
function usageDuration(sec){
 sec=Math.max(0,Math.floor(Number(sec)||0));
 const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 return h? h+'時間'+m+'分' : m? m+'分'+s+'秒' : s+'秒';
}
function usageDashboard(){
 const el=$('#coreUsageDashboard');if(!el)return;
 const list=apps().map(a=>({id:a.id,name:a.name,icon:a.icon,sec:(Number(S.usage[a.id])||0)+(usageCurrent===a.id&&usageStarted?Math.floor((Date.now()-usageStarted)/1000):0)})).sort((a,b)=>b.sec-a.sec);
 const max=Math.max(1,...list.map(x=>x.sec));
 el.innerHTML=list.length?list.map(x=>'<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>'+x.icon+' '+esc(x.name)+'</span><b>'+usageDuration(x.sec)+'</b></div><div style="height:8px;border-radius:9px;background:var(--s2);overflow:hidden;margin-top:6px"><div style="height:100%;width:'+Math.round(x.sec/max*100)+'%;background:var(--a);border-radius:9px"></div></div></div>').join(''):'<p class="muted">利用データはありません。</p>';
}

usageCard.className='card';
usageCard.innerHTML='<h3>⏱️ アプリの利用状況</h3><p class="muted">CORE内で各アプリを開いていた時間の目安です。このブラウザ内に保存されます。</p><div id="coreUsageDashboard"></div><div class="row" style="margin-top:12px"><button class="btn secondary" id="usageRefresh">更新</button><button class="btn danger" id="usageReset">利用時間をリセット</button></div><small class="muted">※実際の端末全体のスクリーンタイムではありません。COREを閉じている間や別アプリの利用時間は計測しません。</small>';

  $('#body').append(usageCard);
  usageDashboard();
  $('#usageRefresh').onclick=usageDashboard;
  $('#usageReset').onclick=()=>{if(confirm('CORE内のアプリ利用時間をすべてリセットしますか？')){S.usage={};save();usageDashboard()}};
 }
};
setInterval(()=>{if(usageCurrent&&usageStarted){usageDashboard();if(Date.now()-usageLastSaved>10000){usageCommit();usageLastSaved=Date.now()}}},1000);

 $('#noticeContent').innerHTML=ns.length?ns.map((n,i)=>'<div class="extraCard" style="position:relative"><div class="row" style="justify-content:space-between;align-items:flex-start"><b>'+esc(n.title)+'</b><button class="btn secondary" data-notice-delete="'+i+'" style="padding:5px 9px">削除</button></div><p>'+esc(n.body)+'</p><small>'+esc(n.time||'')+'</small><div style="font-size:11px;color:var(--muted);margin-top:5px">'+(n.read?'既読':'🔵 未読')+'</div></div>').join(''):'<p class="muted">新しい通知はありません。</p>';
 paintNotificationButton();
}
noticeButton.onclick=()=>{
 S.notifications=(S.notifications||[]).map(n=>({...n,read:true}));
 save();renderNotificationCenter();notice.classList.add('show');
};
$('#noticeClear').onclick=()=>{S.notifications=[];save();renderNotificationCenter()};
$('#noticeContent').onclick=e=>{
 const b=e.target.closest('[data-notice-delete]');
 if(!b)return;
 const i=Number(b.dataset.noticeDelete);
 if(Number.isInteger(i)&&i>=0){S.notifications.splice(i,1);save();renderNotificationCenter()}
};
const pushNotificationV6=pushCoreNotification;
pushCoreNotification=function(title,body){
 pushNotificationV6(title,body);
 if(S.notifications?.[0])S.notifications[0].read=false;
 save();paintNotificationButton();
};
window.CORE.notify=pushCoreNotification;
const notificationSettingsCard=document.createElement('div');
notificationSettingsCard.className='card';
notificationSettingsCard.innerHTML='<h3>🔔 通知の管理</h3><p class="muted">CORE内の通知を確認・テストできます。</p><div class="row"><button class="btn secondary" id="openNotificationsSettings">通知センターを開く</button><button class="btn secondary" id="sendTestNotification">テスト通知</button></div><p class="muted" id="notificationCountText"></p>';

/* CORE v8: custom wallpaper studio */
const stockWall=wall;
wall=function(){
 stockWall();
 if(S.customWallpaper)$('#wall').style.backgroundImage='url("'+S.customWallpaper+'")';
};
const wallpaperStudio=document.createElement('div');
wallpaperStudio.className='card';
wallpaperStudio.innerHTML='<h3>🖼️ オリジナル壁紙</h3><p class="muted">端末の画像をCOREの壁紙に設定できます。画像は縮小してこのブラウザ内に保存します。</p><input type="file" id="coreWallpaperFile" accept="image/*" class="field"><div id="coreWallpaperPreview" style="height:125px;border-radius:16px;background:var(--s2);background-size:cover;background-position:center;margin:10px 0;display:grid;place-items:center;color:var(--muted)">壁紙プレビュー</div><div class="row"><button class="btn secondary" id="applyCustomWallpaper">壁紙を適用</button><button class="btn danger" id="clearCustomWallpaper">削除</button></div><small class="muted">※画像は最大1200px程度に縮小してJPEG形式で保存します。大きな画像は画質が変わる場合があります。</small>';
let pendingWallpaper='';
const wallpaperDrawBase=draw;
draw=function(id){
 wallpaperDrawBase(id);
 if(id==='settings'){
  $('#body').append(wallpaperStudio);
  const preview=$('#coreWallpaperPreview');
  if(S.customWallpaper){preview.style.backgroundImage='url("'+S.customWallpaper+'")';preview.textContent=''}
  $('#coreWallpaperFile').onchange=e=>{
   const file=e.target.files&&e.target.files[0];if(!file)return;
   if(!file.type.startsWith('image/')){alert('画像ファイルを選択してください');return}
   const reader=new FileReader();
   reader.onerror=()=>alert('画像を読み込めませんでした');
   reader.onload=()=>{
    const img=new Image();
    img.onerror=()=>alert('この画像形式には対応できません');
    img.onload=()=>{
     const scale=Math.min(1,1200/Math.max(img.width,img.height));
     const canvas=document.createElement('canvas');
     canvas.width=Math.max(1,Math.round(img.width*scale));
     canvas.height=Math.max(1,Math.round(img.height*scale));
     const ctx=canvas.getContext('2d');
     ctx.drawImage(img,0,0,canvas.width,canvas.height);
     pendingWallpaper=canvas.toDataURL('image/jpeg',0.78);
     preview.style.backgroundImage='url("'+pendingWallpaper+'")';
     preview.textContent='';
    };
    img.src=reader.result;
   };
   reader.readAsDataURL(file);
  };
  $('#applyCustomWallpaper').onclick=()=>{
   if(!pendingWallpaper&&!S.customWallpaper)return alert('先に画像を選択してください');
   if(pendingWallpaper)S.customWallpaper=pendingWallpaper;
   save();wall();alert('オリジナル壁紙を設定しました！');
  };
  $('#clearCustomWallpaper').onclick=()=>{
   if(!S.customWallpaper&&!pendingWallpaper)return;
   if(confirm('オリジナル壁紙を削除して標準壁紙に戻しますか？')){
    delete S.customWallpaper;pendingWallpaper='';save();wall();
    preview.style.backgroundImage='';preview.textContent='壁紙プレビュー';
    $('#coreWallpaperFile').value='';
   }
  };
 }
};


/* CORE v9: app drawer live search and category filters */
const drawerBox=document.querySelector('#drawer .drawerbox');
const drawerSearch=document.querySelector('#search');
const drawerGrid=document.querySelector('#allApps');
const filterBar=document.createElement('div');
filterBar.className='row';
filterBar.style.cssText='gap:7px;margin:4px 0 10px;flex-wrap:wrap';
filterBar.innerHTML='<button class="btn" data-filter="all">すべて</button><button class="btn secondary" data-filter="builtin">標準</button><button class="btn secondary" data-filter="custom">追加</button>';
const drawerCount=document.createElement('div');
drawerCount.className='muted';
drawerCount.style.padding='0 4px 5px';
drawerSearch.insertAdjacentElement('afterend',filterBar);
filterBar.insertAdjacentElement('afterend',drawerCount);
let drawerFilter='all';
function updateDrawer(){
 const q=drawerSearch.value.trim().toLocaleLowerCase('ja-JP');
 const builtins=new Set(base.map(x=>x[0]));
 const list=apps().filter(a=>{
  const builtin=builtins.has(a.id);
  const category=drawerFilter==='all'||(drawerFilter==='builtin'&&builtin)||(drawerFilter==='custom'&&!builtin);
  return category&&(a.name+' '+a.icon).toLocaleLowerCase('ja-JP').includes(q);
 });
 drawerGrid.innerHTML=list.map(tile).join('');
 drawerCount.textContent=list.length+'件のアプリ';
 filterBar.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('secondary',b.dataset.filter!==drawerFilter));
}
drawerSearch.oninput=updateDrawer;
filterBar.onclick=e=>{
 const b=e.target.closest('[data-filter]');
 if(!b)return;
 drawerFilter=b.dataset.filter;
 updateDrawer();
};
const oldDrawerOpen=document.querySelector('#nav').onclick;
document.querySelector('#nav').onclick=()=>{
 if(oldDrawerOpen)oldDrawerOpen();
 updateDrawer();
};


/* CORE v1.0.0 foundation: versioning, startup identity and management center */
const CORE_VERSION='1.0.0';
if(!base.some(a=>a[0]==='admin'))base.push(['admin','CORE管理センター','🛠️']);
S.installed=Array.isArray(S.installed)?S.installed:[];
if(!S.installed.includes('admin'))S.installed.push('admin');
S.errorLog=Array.isArray(S.errorLog)?S.errorLog:[];
S.coreVersion=CORE_VERSION;
save();
document.title='CORE OS | ver.'+CORE_VERSION;
const coreAdminStyle=document.createElement('style');
coreAdminStyle.textContent='#coreBoot{position:absolute;inset:0;z-index:100;background:linear-gradient(145deg,#182848,#5369b5 58%,#d8b7dc);display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;transition:opacity .35s ease}#coreBoot.hide{opacity:0;pointer-events:none}.coreLogo{font-size:48px;font-weight:800;letter-spacing:8px}.coreBootSub{font-size:12px;letter-spacing:3px;opacity:.8;margin-top:8px}.coreVersionCard{border:1px solid var(--line)}.adminMetric{padding:12px;border-radius:15px;background:var(--s);min-width:0}.adminMetric b{display:block;font-size:21px;margin-top:5px;overflow-wrap:anywhere}.adminLog{padding:9px;border-bottom:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}';
document.head.append(coreAdminStyle);
const coreBoot=document.createElement('section');
coreBoot.id='coreBoot';
coreBoot.innerHTML='<div class="coreLogo">CORE</div><div class="coreBootSub">CORE OS</div><small style="margin-top:24px;opacity:.8">ver.'+CORE_VERSION+'</small>';
$('#phone').append(coreBoot);
setTimeout(()=>{coreBoot.classList.add('hide');setTimeout(()=>coreBoot.remove(),400)},850);
function coreBytes(value){try{return new Blob([JSON.stringify(value)]).size}catch(e){return 0}}
function coreFormatBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB'}
function coreAdminDraw(){
 const installed=apps();
 const storageText=(()=>{try{return coreFormatBytes(new Blob([localStorage.getItem(key)||'']).size)}catch(e){return '取得不可'}})();
 const custom=(S.custom||[]).map(a=>({name:a.name||a.id,id:a.id,size:coreBytes(a.html||'')}));
 const usage=installed.map(a=>({name:a.name,icon:a.icon,time:Number((S.usage||{})[a.id])||0})).sort((a,b)=>b.time-a.time);
 const fmt=s=>{s=Math.max(0,Math.floor(s));return s>=3600?Math.floor(s/3600)+'時間'+Math.floor(s%3600/60)+'分':Math.floor(s/60)+'分'+s%60+'秒'};
 const logs=S.errorLog.slice(-15).reverse();
 $('#body').innerHTML='<div class="card"><h3>🛠️ CORE管理センター</h3><p class="muted">CORE OSの内部情報と保存データを確認します。</p><div class="gridapps" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:5px 0"><div class="adminMetric"><small>バージョン</small><b>1.0.0</b></div><div class="adminMetric"><small>インストール済み</small><b>'+installed.length+'本</b></div><div class="adminMetric"><small>CORE保存データ</small><b>'+storageText+'</b></div><div class="adminMetric"><small>記録エラー</small><b>'+S.errorLog.length+'件</b></div></div></div><div class="card"><h3>📱 システム情報</h3><div class="muted" id="coreAdminSystem"></div><button class="btn secondary" id="coreAdminRefresh">情報を更新</button></div><div class="card"><h3>⏱️ アプリ利用時間</h3>'+(usage.length?usage.map(a=>'<div class="listitem"><span>'+a.icon+' '+esc(a.name)+'</span><b>'+fmt(a.time)+'</b></div>').join(''):'<p class="muted">記録なし</p>')+'</div><div class="card"><h3>📦 アプリデータ</h3>'+(custom.length?custom.map(a=>'<div class="listitem"><span>'+esc(a.name)+'<br><small>'+esc(a.id)+' · '+coreFormatBytes(a.size)+'</small></span><button class="btn danger" data-admin-uninstall="'+esc(a.id)+'">削除</button></div>').join(''):'<p class="muted">追加アプリはありません。</p>')+'<p class="muted">標準アプリの内部データ容量は個別に分離されていないため、正確な個別容量は取得不可です。</p></div><div class="card"><h3>🧾 エラー履歴</h3>'+(logs.length?logs.map(x=>'<div class="adminLog"><b>'+esc(x.type)+'</b> · '+esc(x.time)+'<br>'+esc(x.message)+'</div>').join(''):'<p class="muted">記録されたエラーはありません。</p>')+'<button class="btn secondary" id="coreAdminClearLogs">エラー履歴を消去</button></div><div class="card"><h3>💾 データ保護</h3><p class="muted">現在のCOREデータをJSON形式で書き出します。既存データは自動削除しません。</p><button class="btn" id="coreAdminBackup">バックアップを書き出す</button></div><div class="card"><h3>ℹ️ COREについて</h3><b>CORE OS ver.1.0.0</b><p class="muted">正式公開に向けた基盤アップデートを適用中です。クラウド同期・全機能の実装と総合テストはまだ完了していません。</p><p class="muted">更新内容：起動ロゴ、バージョン管理、管理センター、エラー記録。</p></div>';
 coreAdminSystem();
 $('#coreAdminRefresh').onclick=coreAdminSystem;
 $('#coreAdminClearLogs').onclick=()=>{if(confirm('記録されたエラー履歴を消去しますか？')){S.errorLog=[];save();coreAdminDraw()}};
 $('#coreAdminBackup').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CORE-backup-'+CORE_VERSION+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('#body').onclick=e=>{const b=e.target.closest('[data-admin-uninstall]');if(b)uninstall(b.dataset.adminUninstall)};
}
function coreAdminSystem(){
 const el=$('#coreAdminSystem');if(!el)return;
 const memory=Number(navigator.deviceMemory);
 const cores=Number(navigator.hardwareConcurrency);
 el.innerHTML='<p>ブラウザ：'+esc(navigator.userAgent.slice(0,180))+'</p><p>画面解像度：'+screen.width+' × '+screen.height+'</p><p>表示領域：'+innerWidth+' × '+innerHeight+'</p><p>論理CPU数：'+(cores>0?cores+'（ブラウザ報告値）':'取得不可')+'</p><p>メモリ：'+(memory>0?memory+'GB（概算報告値）':'取得不可')+'</p><p>ネットワーク：'+(navigator.onLine?'オンライン':'オフライン')+'</p><p>バッテリー残量：取得不可</p><p>端末ストレージ総容量：取得不可</p>';
}
const coreDrawBeforeAdmin=draw;
draw=function(id){coreDrawBeforeAdmin(id);if(id==='admin')coreAdminDraw()};
window.addEventListener('error',e=>{
 try{S.errorLog.push({type:'JavaScript',message:String(e.message||'不明なエラー').slice(0,300),time:new Date().toLocaleString('ja-JP')});S.errorLog=S.errorLog.slice(-50);save()}catch(_){}
});
window.addEventListener('unhandledrejection',e=>{
 try{S.errorLog.push({type:'Promise',message:String(e.reason?.message||e.reason||'不明な非同期エラー').slice(0,300),time:new Date().toLocaleString('ja-JP')});S.errorLog=S.errorLog.slice(-50);save()}catch(_){}
});

theme();wall();render();tick();
})();
</script></body></html>
