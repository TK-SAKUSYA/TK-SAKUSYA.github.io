<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#dce5ff"><title>CORE</title><style>
:root{--bg:#e9edfa;--s:#f7f8ff;--s2:#dce3f5;--ink:#171b27;--muted:#626a7b;--a:#5369b5;--line:#cbd2e5}*{box-sizing:border-box}body{margin:0;background:#101522;font-family:system-ui,"Noto Sans JP",sans-serif;display:grid;place-items:center;min-height:100dvh}.phone{width:min(100vw,430px);height:min(100dvh,920px);min-height:600px;background:var(--bg);position:relative;overflow:hidden;border-radius:30px;box-shadow:0 0 0 7px #252b38}@media(max-width:500px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100dvh;min-height:0;border-radius:0;box-shadow:none}}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#f9d7e7,transparent 42%),radial-gradient(ellipse at 80% 75%,#a9c5ed,transparent 46%),linear-gradient(145deg,#c5d7f5,#e8d9ef 55%,#c8d9ed)}.status{height:38px;position:absolute;z-index:20;top:0;left:0;right:0;padding:9px 20px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#263047}.home{position:absolute;inset:38px 0 0;padding:28px 22px 12px;display:flex;flex-direction:column}.date{font-size:14px;font-weight:600}.bigclock{font-size:64px;font-weight:300;letter-spacing:-4px;margin-top:8px}.widget{margin:20px 0 auto;padding:16px;border-radius:24px;background:#ffffff75;backdrop-filter:blur(16px)}.widget p{font-size:12px;color:#50596c}.icons,.dock,.gridapps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 7px}.dock{padding:14px 8px;border-radius:24px;background:#ffffff75}.appicon{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer}.glyph{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:#f9f9ff;box-shadow:0 3px 8px #28345318}.nav{height:27px;display:flex;justify-content:center;align-items:center}.nav:after{content:"";width:108px;height:4px;border-radius:9px;background:#35405a88}.panel{position:absolute;z-index:25;inset:0;background:var(--s);display:none;flex-direction:column}.panel.show{display:flex}.apphead{height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid var(--line)}.back{border:0;background:none;font-size:23px;color:var(--ink)}.apptitle{font-weight:700;flex:1}.appbody{padding:17px;overflow:auto;flex:1;color:var(--ink)}.btn{border:0;border-radius:22px;padding:11px 16px;background:var(--a);color:white;font-weight:650;cursor:pointer}.secondary{background:var(--s2);color:var(--ink)}.danger{background:#b64252}.field,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--s);color:var(--ink);font:inherit;margin:6px 0}.card{padding:14px;border-radius:18px;background:var(--s2);margin:9px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:12px}.gridapps{padding:20px 10px}.drawer{position:absolute;inset:0;z-index:30;background:#18203688;display:none;align-items:flex-end}.drawer.show{display:flex}.drawerbox{width:100%;padding:22px 20px 28px;border-radius:28px 28px 0 0;background:var(--s);max-height:90%;overflow:auto}.quick{position:absolute;inset:0;z-index:40;background:#e9edfaee;display:none;padding:55px 20px}.quick.show{display:block}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:17px;border-radius:20px;background:var(--s2);border:0;text-align:left;font-weight:650}.tile.active{background:var(--a);color:white}.lock{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(145deg,#b8c9ed,#ead7e9)}.lock.show{display:flex}.locktime{font-size:76px;font-weight:250}.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kbd button{padding:16px 5px;border:0;border-radius:14px;background:var(--s2);font-size:18px;color:var(--ink)}canvas{width:100%;height:300px;background:white;border-radius:15px;touch-action:none}.listitem{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.listitem span:first-child{flex:1}.hide{display:none!important}iframe{width:100%;height:65vh;border:0;background:white}
</style></head><body><main class="phone" id="phone"><div class="wall" id="wall"></div><div class="status" id="status"><span id="st">--:--</span><span>● ▮▮ ▰</span></div><section class="home" id="home"><div class="date" id="date"></div><div class="bigclock" id="clock"></div><div>CORE • Your space, your rules.</div><div class="widget"><b>COREへようこそ</b><p>自分だけのスマートフォン環境。</p></div><div class="icons" id="homeIcons"></div><div style="text-align:center;padding:8px">● ○ ○</div><div class="dock" id="dock"></div><div class="nav" id="nav"></div></section><section class="panel" id="panel"><header class="apphead"><button class="back" id="back">‹</button><div class="apptitle" id="appTitle">CORE</div><button class="back" id="more">⋮</button></header><div class="appbody" id="body"></div></section><section class="drawer" id="drawer"><div class="drawerbox"><div class="row"><b style="font-size:20px">アプリ</b><button class="btn secondary" id="closeDrawer">閉じる</button></div><input class="field" id="search" placeholder="アプリを検索"><div class="gridapps" id="allApps"></div></div></section><section class="quick" id="quick"><div class="row"><b style="font-size:24px">クイック設定</b><button class="btn secondary" id="closeQuick">閉じる</button></div><p id="qdate"></p><div class="tiles"><button class="tile active">◉ Wi-Fi（表示のみ）</button><button class="tile active">ᛒ Bluetooth（表示のみ）</button><button class="tile" id="darkQuick">◐ ダークテーマ</button><button class="tile" id="airplane">✈ 機内モード表示</button></div><div class="card">明るさ <input type="range" min="40" max="100" value="100" id="brightness" style="width:100%"></div><p class="muted">無線機能はブラウザから制御できません。</p></section><section class="lock" id="lock"><div class="locktime" id="locktime"></div><div id="lockdate"></div><p>CORE</p><button class="btn secondary" id="unlock">タップして解除</button></section></main><script>
(function(){
const $=s=>document.querySelector(s), key='core-v1';
const base=[['calculator','電卓','🧮'],['memo','メモ帳','📝'],['files','ファイル','📁'],['clock','時計','⏰'],['calendar','カレンダー','🗓️'],['drawing','お絵描き','🎨'],['music','音楽プレイヤー','🎵'],['settings','設定','⚙️'],['store','CORE Store','🛍️'],['browser','ブラウザ','🌐']];
let S;try{S=Object.assign({installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]},JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){S={installed:base.map(x=>x[0]),wall:0,dark:false,data:{},bookmarks:[],history:[]}}
let current='',calc='',sw=0,swStart=0,swOn=false,interval=null,files=[];
function save(){localStorage.setItem(key,JSON.stringify(S))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function apps(){return base.filter(x=>S.installed.includes(x[0])).map(x=>({id:x[0],name:x[1],icon:x[2]})).concat((S.custom||[]).filter(x=>S.installed.includes(x.id)))}
function tile(a){return '<button class="appicon" data-open="'+a.id+'"><span class="glyph">'+a.icon+'</span>'+esc(a.name)+'</button>'}
function render(){let a=apps();$('#allApps').innerHTML=a.map(tile).join('');$('#homeIcons').innerHTML=a.filter(x=>!['settings','store','browser','memo'].includes(x.id)).slice(0,8).map(tile).join('');$('#dock').innerHTML=['browser','memo','store','settings'].map(id=>a.find(x=>x.id===id)).filter(Boolean).map(tile).join('')}
function tick(){let d=new Date(),t=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('#clock').textContent=$('#st').textContent=$('#locktime').textContent=t;$('#date').textContent=$('#qdate').textContent=$('#lockdate').textContent=d.toLocaleDateString('ja-JP',{dateStyle:'full'})}
function open(id){let a=apps().find(x=>x.id===id);if(!a)return;current=id;$('#home').classList.add('hide');$('#panel').classList.add('show');$('#appTitle').textContent=a.name;draw(id)}
function close(){current='';clearInterval(interval);interval=null;$('#panel').classList.remove('show');$('#home').classList.remove('hide')}
function draw(id){let b=$('#body');b.innerHTML='';
if(id==='calculator'){b.innerHTML='<div class="card" style="text-align:right"><small id="prev">計算</small><div id="out" style="font-size:36px;min-height:48px">'+(calc||'0')+'</div></div><div class="kbd">'+['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','履歴','0','.','='].map(x=>'<button data-c="'+x+'">'+x+'</button>').join('')+'</div><button class="btn secondary" id="copy">結果をコピー</button><div id="ch" class="muted"></div>'}
if(id==='memo'){let m=S.data.memos||[];b.innerHTML='<button class="btn" id="new">＋ 新しいメモ</button><div>'+m.map((x,i)=>'<div class="card"><b>'+esc(x.title)+'</b><div>'+esc(x.text)+'</div><div class="row"><button class="btn secondary" data-edit="'+i+'">編集</button><button class="btn danger" data-del="'+i+'">削除</button></div></div>').join('')+'</div>'}
if(id==='files'){b.innerHTML='<p class="muted">ファイルはこの端末内で選択して閲覧・保存できます。</p><input type="file" id="pick" multiple class="field"><div id="fl"></div>'}
if(id==='clock'){b.innerHTML='<div class="card"><div class="muted">現在時刻</div><div style="font-size:38px" id="now"></div></div><h3>ストップウォッチ</h3><div id="sw" style="font-size:32px">00:00.0</div><div class="row"><button class="btn" id="swbtn">開始</button><button class="btn secondary" id="swreset">リセット</button></div><h3>タイマー</h3><div class="row"><input class="field" id="mins" type="number" placeholder="分"><input class="field" id="secs" type="number" placeholder="秒"></div><div id="timer" class="card">停止中</div><button class="btn" id="timerstart">開始</button><h3>アラーム</h3><input class="field" id="alarm" type="time"><button class="btn" id="alarmadd">追加</button><div id="alarms"></div><p class="muted">アラームはCOREを開いている間のみ動作します。</p>';$('#now').textContent=new Date().toLocaleTimeString('ja-JP')}
if(id==='calendar'){let d=new Date(),date=d.toISOString().slice(0,10),ev=S.data.events||[];b.innerHTML='<h2>'+d.getFullYear()+'年 '+(d.getMonth()+1)+'月</h2><div class="card">今日：'+date+'</div><input class="field" type="date" id="edate" value="'+date+'"><input class="field" id="etitle" placeholder="予定のタイトル"><textarea class="field" id="enote" placeholder="メモ"></textarea><button class="btn" id="addEvent">予定を追加</button><h3>予定一覧</h3>'+ev.map((x,i)=>'<div class="listitem"><span><b>'+esc(x.date)+'</b><br>'+esc(x.title)+'<br><small>'+esc(x.note)+'</small></span><button class="btn danger" data-evdel="'+i+'">削除</button></div>').join('')}
if(id==='drawing'){b.innerHTML='<div class="row"><input type="color" id="color" value="#222222"><select id="size"><option>3</option><option>6</option><option>12</option><option>20</option></select><button class="btn secondary" id="eraser">消しゴム</button></div><canvas id="paint" width="900" height="650"></canvas><div class="row"><button class="btn secondary" id="clear">全消去</button><button class="btn" id="png">PNG保存</button></div>';let c=$('#paint'),ctx=c.getContext('2d'),drawing=false,erase=false;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p[0],p[1])};c.onpointermove=e=>{if(!drawing)return;let p=point(e);ctx.strokeStyle=erase?'white':$('#color').value;ctx.lineWidth=Number($('#size').value)*c.width/c.clientWidth;ctx.lineCap='round';ctx.lineTo(p[0],p[1]);ctx.stroke()};c.onpointerup=()=>drawing=false;$('#eraser').onclick=()=>erase=!erase;$('#clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('#png').onclick=()=>{let a=document.createElement('a');a.download='CORE-drawing.png';a.href=c.toDataURL();a.click()}}
if(id==='music'){b.innerHTML='<input type="file" id="musicfile" accept="audio/*" class="field"><div class="card" id="musicname">音声ファイルを選択</div><audio id="player" controls style="width:100%"></audio><p class="muted">端末内の音声ファイルを再生します。</p>'}
if(id==='settings'){b.innerHTML='<h3>壁紙</h3><div class="row"><button class="btn secondary" data-wall="0">1</button><button class="btn secondary" data-wall="1">2</button><button class="btn secondary" data-wall="2">3</button></div><h3>テーマ</h3><button class="btn secondary" id="theme">'+(S.dark?'ライト':'ダーク')+'テーマ</button><h3>インストール済みアプリ</h3><div id="manageApps">'+apps().map(x=>'<div class="listitem"><span>'+x.icon+' '+esc(x.name)+'<br><small class="muted">'+esc(x.id)+'</small></span>'+(!base.some(z=>z[0]===x.id)?'<button class="btn danger" data-uninstall="'+x.id+'">削除</button>':'<small class="muted">標準</small>')+'</div>').join('')+'</div><h3>データ</h3><div class="row"><button class="btn secondary" id="backup">バックアップ</button><label class="btn secondary">復元<input type="file" id="restore" accept="application/json" hidden></label></div><button class="btn danger" id="reset" style="margin-top:16px">データ初期化</button>'}
if(id==='store'){let cat=[{id:'counter',name:'カウンター',icon:'🔢',version:'1.0.0',desc:'数字を数えるアプリ',html:'<!doctype html><meta charset=utf-8><style>body{font:20px system-ui;text-align:center;padding:30px}button{padding:15px}</style><h2>カウンター</h2><h1 id=n>0</h1><button onclick="n.textContent=+n.textContent+1">＋1</button><button onclick="n.textContent=+n.textContent-1">−1</button>'},{id:'notepad-plus',name:'メモ帳+',icon:'📒',version:'1.0.0',desc:'追加のシンプルメモ',html:'<!doctype html><meta charset=utf-8><style>body{font:16px system-ui;padding:20px}textarea{width:100%;height:60vh}</style><h2>メモ帳+</h2><textarea placeholder="メモ..."></textarea>'},{id:'mini-timer',name:'ミニタイマー',icon:'⏳',version:'1.0.0',desc:'30秒タイマー',html:'<!doctype html><meta charset=utf-8><style>body{font:20px system-ui;text-align:center;padding:30px}</style><h2>ミニタイマー</h2><h1 id=t>30</h1><button onclick="let n=30;clearInterval(window.i);window.i=setInterval(()=>{t.textContent=--n;if(n<=0)clearInterval(i)},1000)">開始</button>'}];S.catalog=cat;b.innerHTML='<input class="field" id="storesearch" placeholder="アプリ検索">'+cat.map(x=>'<div class="card"><div class="row"><span style="font-size:28px">'+x.icon+'</span><span><b>'+x.name+'</b><br><small class="muted">Version '+x.version+'</small></span><button class="btn" data-install="'+x.id+'">'+(S.installed.includes(x.id)?'起動':'インストール')+'</button></div><p>'+x.desc+'</p></div>').join('')+'<p class="muted">アプリ本体を保存し、制限付きiframe内で実行します。インストール済みアプリの削除は「設定」から行えます。</p>'}
if(id==='browser'){b.innerHTML='<div class="row"><input class="field" id="url" placeholder="https://example.com"><button class="btn" id="go">移動</button></div><div class="row"><button class="btn secondary" id="bookmark">保存</button><button class="btn secondary" id="bookmarks">ブックマーク</button><button class="btn secondary" id="hist">履歴</button></div><div id="notice" class="muted">サイトによっては埋め込み表示が拒否されます。</div><iframe id="web"></iframe><div id="bl"></div>'}
let custom=(S.custom||[]).find(x=>x.id===id);if(custom)b.innerHTML='<iframe sandbox="allow-scripts allow-forms allow-downloads" srcdoc="'+esc(custom.html)+'"></iframe>';
}
function click(e){let t=e.target.closest('[data-uninstall]');if(t){uninstall(t.dataset.uninstall);return}t=e.target.closest('[data-open]');if(t){$('#drawer').classList.remove('show');open(t.dataset.open);return}t=e.target.closest('[data-c]');if(t){calcPress(t.dataset.c);return}t=e.target.closest('[data-wall]');if(t){S.wall=+t.dataset.wall;save();wall();return}t=e.target.closest('[data-install]');if(t){install(t.dataset.install);return}t=e.target.closest('[data-del]');if(t){let a=S.data.memos||[];a.splice(+t.dataset.del,1);S.data.memos=a;save();draw('memo');return}t=e.target.closest('[data-edit]');if(t){let a=S.data.memos||[],i=+t.dataset.edit,x=a[i],title=prompt('タイトル',x.title),text=prompt('内容',x.text);if(title!==null&&text!==null){a[i]={title,text};S.data.memos=a;save();draw('memo')}return}t=e.target.closest('[data-evdel]');if(t){let a=S.data.events||[];a.splice(+t.dataset.evdel,1);S.data.events=a;save();draw('calendar')}}
function calcPress(x){if(x==='AC')calc='';else if(x==='⌫')calc=calc.slice(0,-1);else if(x==='='){try{let s=calc.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().% -]+$/.test(s))throw 0;let n=Function('"use strict";return ('+s+')')();if(!Number.isFinite(n))throw 0;$('#prev').textContent=calc+' =';calc=String(n);S.data.calc=(S.data.calc||[]);S.data.calc.unshift($('#prev').textContent+' '+calc);S.data.calc=S.data.calc.slice(0,15);save()}catch(e){$('#out').textContent='エラー';return}}else calc+=x;$('#out').textContent=calc||'0';$('#ch').textContent=(S.data.calc||[]).slice(0,5).join(' / ')}
function install(id){let x=(S.catalog||[]).find(a=>a.id===id);if(!x)return;if(S.installed.includes(id)){open(id);return}S.custom=S.custom||[];let saved=S.custom.find(a=>a.id===id);if(!saved)S.custom.push(x);S.installed.push(id);save();render();draw('store');alert(x.name+' をインストールしました')}
function uninstall(id){if(base.some(x=>x[0]===id))return alert('標準アプリは削除できません');let a=apps().find(x=>x.id===id);if(!a||!confirm(a.name+' をアンインストールしますか？'))return;S.installed=S.installed.filter(x=>x!==id);if(current===id)close();save();render();if(current==='settings')draw('settings');else if(current==='store')draw('store')}
document.addEventListener('click',click);
$('#back').onclick=close;$('#more').onclick=()=>alert('CORE • '+current);$('#nav').onclick=()=>$('#drawer').classList.add('show');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('show');$('#status').onclick=()=>$('#quick').classList.add('show');$('#closeQuick').onclick=()=>$('#quick').classList.remove('show');$('#unlock').onclick=()=>$('#lock').classList.remove('show');
$('#search').oninput=e=>document.querySelectorAll('#allApps .appicon').forEach(x=>x.classList.toggle('hide',!x.textContent.toLowerCase().includes(e.target.value.toLowerCase())));
$('#body').addEventListener('click',e=>{let id=e.target.id;if(id==='new'){let title=prompt('タイトル');if(title===null)return;let text=prompt('内容')||'',a=S.data.memos||[];a.unshift({title,text});S.data.memos=a;save();draw('memo')}if(id==='copy')navigator.clipboard?.writeText(calc).then(()=>alert('コピーしました')).catch(()=>alert('コピーできません'));if(id==='theme'){S.dark=!S.dark;save();theme();draw('settings')}if(id==='backup'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='CORE-backup.json';a.click();URL.revokeObjectURL(u)}if(id==='reset'&&confirm('保存データを初期化しますか？')){localStorage.removeItem(key);location.reload()}if(id==='addEvent'){let date=$('#edate').value,title=$('#etitle').value;if(!date||!title)return alert('日付とタイトルを入力');let a=S.data.events||[];a.push({date,title,note:$('#enote').value});a.sort((x,y)=>x.date.localeCompare(y.date));S.data.events=a;save();draw('calendar')}if(id==='go'){let v=$('#url').value.trim();if(!v)return;let u=/^https?:\/\//i.test(v)?v:'https://'+v;$('#web').src=u;S.history.unshift(u);save();$('#notice').innerHTML='<a target="_blank" rel="noopener" href="'+esc(u)+'">別タブで開く</a>'}if(id==='bookmark'){if($('#url').value){S.bookmarks.push($('#url').value);save();alert('保存しました')}}if(id==='bookmarks')$('#bl').textContent=S.bookmarks.join(' • ');if(id==='hist')$('#bl').textContent=S.history.slice(0,20).join(' • ');if(id==='swbtn'){if(!swOn){swStart=Date.now()-sw;swOn=true;$('#swbtn').textContent='停止';interval=setInterval(()=>{sw=Date.now()-swStart;$('#sw').textContent=new Date(sw).toISOString().slice(14,19)+'.'+Math.floor(sw%1000/100)},100)}else{swOn=false;clearInterval(interval);$('#swbtn').textContent='再開'}}if(id==='swreset'){sw=0;swOn=false;clearInterval(interval);$('#sw').textContent='00:00.0';$('#swbtn').textContent='開始'}if(id==='timerstart'){let n=(+$('#mins').value||0)*60+(+$('#secs').value||0);if(!n)return alert('時間を入力');clearInterval(interval);$('#timer').textContent=n+'秒';interval=setInterval(()=>{n--;$('#timer').textContent=n+'秒';if(n<=0){clearInterval(interval);$('#timer').textContent='終了';alert('タイマー終了')}},1000)}if(id==='alarmadd'){let v=$('#alarm').value;if(v){S.alarms=S.alarms||[];S.alarms.push(v);save();$('#alarms').textContent=S.alarms.join(' • ')}}});
$('#body').addEventListener('input',e=>{if(e.target.id==='storesearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#body [data-install]').forEach(btn=>{let card=btn.closest('.card');card.classList.toggle('hide',!card.textContent.toLowerCase().includes(q))})}});
$('#body').addEventListener('change',e=>{if(e.target.id==='pick'){files=[...e.target.files];$('#fl').innerHTML=files.map(f=>'<div class="listitem"><span>'+esc(f.name)+' ('+Math.round(f.size/1024)+'KB)</span><button class="btn secondary" data-file="'+esc(f.name)+'">開く</button></div>').join('')}if(e.target.id==='musicfile'){let f=e.target.files[0];if(f){$('#musicname').textContent=f.name;$('#player').src=URL.createObjectURL(f)}}if(e.target.id==='restore'){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){alert('ファイルを読み込めません')}};r.readAsText(f)}});
$('#body').addEventListener('click',e=>{let t=e.target.closest('[data-file]');if(t){let f=files.find(x=>x.name===t.dataset.file);if(!f)return;let u=URL.createObjectURL(f);if(f.type.startsWith('image/')||f.type==='application/pdf')window.open(u,'_blank');else{let r=new FileReader();r.onload=()=>{let w=window.open();w.document.write('<pre></pre>');w.document.querySelector('pre').textContent=r.result};r.readAsText(f)}}});
function theme(){let d=S.dark;document.documentElement.style.setProperty('--bg',d?'#171b27':'#e9edfa');document.documentElement.style.setProperty('--s',d?'#242a39':'#f7f8ff');document.documentElement.style.setProperty('--s2',d?'#343d52':'#dce3f5');document.documentElement.style.setProperty('--ink',d?'#f0f2fa':'#171b27');document.documentElement.style.setProperty('--muted',d?'#b0b8cb':'#626a7b');document.documentElement.style.setProperty('--line',d?'#48536b':'#cbd2e5')}
function wall(){let a=['radial-gradient(ellipse at 20% 20%,#f9d7e7,transparent 42%),radial-gradient(ellipse at 80% 75%,#a9c5ed,transparent 46%),linear-gradient(145deg,#c5d7f5,#e8d9ef 55%,#c8d9ed)','linear-gradient(145deg,#182848,#4b6cb7)','radial-gradient(circle at 20% 30%,#ffcf9f,transparent 35%),linear-gradient(135deg,#845ec2,#d65db1,#ff9671)'];$('#wall').style.background=a[S.wall||0]}
$('#darkQuick').onclick=()=>{S.dark=!S.dark;save();theme();$('#darkQuick').classList.toggle('active',S.dark)};$('#airplane').onclick=e=>e.target.classList.toggle('active');$('#brightness').oninput=e=>$('#phone').style.filter='brightness('+e.target.value/100+')';
setInterval(()=>{tick();if(current==='clock'&&$('#now'))$('#now').textContent=new Date().toLocaleTimeString('ja-JP');if(S.alarms&&S.alarms.includes(new Date().toTimeString().slice(0,5))&&new Date().getSeconds()===0)alert('アラーム '+new Date().toTimeString().slice(0,5))},1000);
$('#phone').addEventListener('touchstart',e=>window.sy=e.touches[0].clientY,{passive:true});$('#phone').addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-window.sy;if(window.sy<45&&dy>65)$('#quick').classList.add('show');else if(dy< -100&&!current)$('#drawer').classList.add('show')},{passive:true});
theme();wall();render();tick();
})();
