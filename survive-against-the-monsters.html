<div id="overlay"><div id="panel"><h1>House Explorer<br><span style="color:#d6e7ff">3F HOME</span></h1><p>広くなった3階建ての家を自由に探索しよう。リビング、キッチン、寝室、書斎、浴室など、たくさんの部屋と家具を追加！</p><p>PC：WASDで移動／マウスで視点操作／Eで調べる／Shiftで走る<br>スマホ：左のボタンで移動／右側をスワイプして視点操作</p><button id="start">探索を開始する</button></div></div>

const floors=[0,4.2,8.4];
const doors=[];
function makeDoor(axis,x,y,z,label){
 const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
 const leaf=new THREE.Mesh(new THREE.BoxGeometry(axis==='z'?.12:1.12,2.5,axis==='z'?1.12:.12),mats.wood);leaf.position.set(axis==='z'?0:.56,1.25,axis==='z'?.56:0);leaf.castShadow=true;leaf.receiveShadow=true;g.add(leaf);
 const handle=new THREE.Mesh(new THREE.SphereGeometry(.065,10,8),mats.metal);handle.position.set(axis==='z'?.07:.98,1.2,axis==='z'?.98:.07);g.add(handle);
 const collider={x:axis==='z'?x:x+.56,z:axis==='z'?z+.56:z,w:axis==='z'?.18:1.12,d:axis==='z'?1.12:.18,door:true,open:false};colliders.push(collider);
 const d={group:g,collider,open:false,angle:0,target:0,axis,label};doors.push(d);
 interactables.push({mesh:g,label,action:()=>{d.open=!d.open;d.target=d.open?(axis==='z'?-Math.PI/2:Math.PI/2):0;collider.open=d.open;toast(label+(d.open?'を開けた':'を閉めた'))}});

}
function partitionZ(x,y,z1,z2,doorZ,label){const width=1.12;const lo=Math.min(z1,z2),hi=Math.max(z1,z2),a=doorZ-width/2,b=doorZ+width/2;wall(x,y+1.7,(lo+a)/2,.22,3.4,a-lo);wall(x,y+1.7,(b+hi)/2,.22,3.4,hi-b);makeDoor('z',x-.02,y,lo,label)}
function partitionX(x1,x2,y,z,doorX,label){const width=1.12;const lo=Math.min(x1,x2),hi=Math.max(x1,x2),a=doorX-width/2,b=doorX+width/2;wall((lo+a)/2,y+1.7,z,a-lo,3.4,.22);wall((b+hi)/2,y+1.7,z,hi-b,3.4,.22);makeDoor('x',lo,y,z-.02,label)}
for(let f=0;f<3;f++){
 const y=floors[f];roomFloor(y);
 wall(0,y+1.7,-17,44,3.4,.35);wall(-22,y+1.7,0,.35,3.4,34);wall(22,y+1.7,0,.35,3.4,34);wall(0,y+1.7,17,44,3.4,.35);
 partitionZ(-8,y,-17,1,-8,'寝室のドア');partitionZ(8,y,-1,17,8,'書斎のドア');partitionX(-8,4,y,2,-2,'部屋のドア');
 for(const x of [-15,-5,5,15]){box(x,y+2.05,-16.78,3.2,2.05,.07,mats.glass,false);for(const dx of [-1.62,1.62])box(x+dx,y+2.05,-16.7,.09,2.2,.12,mats.white,false);for(const yy of [y+1,y+3.1])box(x,yy,-16.7,3.35,.09,.12,mats.white,false);box(x,y+2.05,-16.68,.07,2.05,.13,mats.white,false)}
 for(const x of [-14,0,14])lamp(x,y+3.12,-5);
 // Small everyday objects make each room feel lived-in.
 for(const [px,pz] of [[-14,10],[0,-5],[11,10]]){cyl(px,y+.88,pz,.12,.12,.12,mats.white);cyl(px+.32,y+.88,pz,.09,.09,.12,mats.metal)}
 furn(-13.2,y+.91,7,.38,.12,.3,mats.cream);
 for(const z of [-15,0,15])box(0,y+.22,z,43.5,.16,.13,mats.wood,false);
 for(const x of [-14,-7,0,7,14])box(x,y+3.38,0,.08,.1,32,mats.white,false);
 if(f<2){for(let i=0;i<14;i++){const z=10-i*.52,stepY=y+.15+i*.3;box(17.4,stepY,z,3.15,.3,.62,mats.wood,false);box(17.4,stepY+.16,z-.25,3.15,.06,.12,mats.white,false)}box(17.4,y+4.25,2.55,3.5,.16,2.1,mats.wood,false);for(const side of [-1,1]){for(let i=0;i<8;i++){const post=new THREE.Mesh(new THREE.BoxGeometry(.09,.95,.09),mats.wood);post.position.set(17.4+side*1.48,y+.65+i*.52,9.7-i*.52);scene.add(post)}const rail=box(17.4+side*1.48,y+1.12,7.9, .12,.12,4.2,mats.wood,false);rail.rotation.x=-.52}}
 if(f===0){rug(-14,y+.03,7,9,7);sofa(-14,y,7);table(-14,y,10,2.2,1.2);furn(-14,y+1.1,3,3.4,1.5,.5,mats.dark);box(-14,y+1.1,2.72,2.8,1.15,.04,mats.glass,false);plant(-18,y,3);plant(-10,y,11);rug(0,y+.03,-7,10,8,0x88714f);kitchen(0,y,-14);table(0,y,-5,3.5,1.6);chair(-1.5,y,-3.8);chair(1.5,y,-3.8);bed(-14,y,-10);bookshelf(-8,y,-4);plant(10,y,-12);furn(12,y+1.1,-10,2.2,1.5,.7,mats.white);furn(12,y+.55,-8.8,2,.1,1.2,mats.wood)}
 else if(f===1){bed(-14,y,-8);bed(-14,y,8);bookshelf(-8,y,-7);table(0,y,-6,2.4,1.2);chair(-1,y,-4.9);chair(1,y,-4.9);sofa(11,y,8,mats.cream);table(11,y,10,2,1);plant(19,y,-12);furn(12,y+1.2,-8,2.4,2.4,.7,mats.white);for(let i=0;i<4;i++)furn(0,y+.35+i*.55,12,2.2,.08,1.1,mats.wood)}
 else{bed(-14,y,-8);bookshelf(-8,y,-7);table(0,y,-7,3,1.4);chair(0,y,-5.7);furn(0,y+1.2,-12,3,2.4,.6,mats.dark);bathroom(12,y,-8);sofa(11,y,8);plant(19,y,12);furn(-14,y+1.2,8,2.4,2.4,.7,mats.white)}
 for(const x of [-18,-3,12]){box(x,y+2.1,16.78,1.3,1.7,.08,mats.wood,false);box(x,y+2.1,16.72,1.12,1.5,.03,new THREE.MeshStandardMaterial({color:0x7c9a9b}),false)}
}
box(0,-.4,0,52,.3,42,new THREE.MeshStandardMaterial({color:0x4c6348}),false);box(0,.02,18.2,8,.16,4.8,new THREE.MeshStandardMaterial({color:0x9a9588}),false);
const front=box(0,1.25,16.72,2.3,2.5,.18,mats.wood,true);interactables.push({mesh:front,label:'玄関ドア',action:()=>toast('玄関ドアは開かない')});
const notes=[];let found=0;
for(let i=0;i<6;i++){const f=i%3,y=floors[f],x=[-14,0,12,-14,0,12][i],z=[0,-12,5,10,8,-2][i];const m=new THREE.Mesh(new THREE.BoxGeometry(.34,.045,.25),new THREE.MeshStandardMaterial({color:0xe8dfb8}));m.position.set(x,y+.9,z);scene.add(m);notes.push(m);interactables.push({mesh:m,label:'メモを読む',action:()=>{if(!m.userData.found){m.userData.found=true;m.material.color.set(0x6e9f74);found++;document.querySelector('#objective').textContent='メモ '+found+'/6';toast(['「ここはリビング」','「キッチンを片付けよう」','「2階の寝室」','「本棚には古い本が並ぶ」','「3階には浴室がある」','「ゆっくり家を見て回ろう」'][i])}}})}
const player={x:0,y:1.65,z:14,yaw:Math.PI,pitch:0,speed:4.4};camera.position.set(player.x,player.y,player.z);
const hand=new THREE.Group();const sleeve=new THREE.Mesh(new THREE.BoxGeometry(.24,.46,.24),new THREE.MeshStandardMaterial({color:0x4c78a8,roughness:.9}));sleeve.position.set(0,-.2,0);hand.add(sleeve);const palm=new THREE.Mesh(new THREE.BoxGeometry(.27,.25,.28),new THREE.MeshStandardMaterial({color:0xd5a078,roughness:.95}));palm.position.set(0,-.52,-.015);hand.add(palm);const thumb=new THREE.Mesh(new THREE.BoxGeometry(.12,.19,.16),palm.material);thumb.position.set(-.17,-.46,-.04);thumb.rotation.z=-.35;hand.add(thumb);hand.position.set(.42,-.42,-.72);camera.add(hand);
const keys={};let started=false,locked=false,run=false,toastTimer=0,last=performance.now();let stairLevel=-1;
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function floorIndex(){return Math.max(0,Math.min(2,Math.round(player.y/4.2)))}
function blocked(x,z){for(const c of colliders){if(c.door&&c.open)continue;if(Math.abs(x-c.x)<c.w/2+.42&&Math.abs(z-c.z)<c.d/2+.42)return true}return false}
function interact(){let best=null,dist=2.7;for(const it of interactables){if(!it.mesh.visible||it.mesh.userData.found)continue;const p=it.mesh.position;const d=Math.hypot(p.x-player.x,p.z-player.z);if(d<dist){dist=d;best=it}}if(best)best.action();else toast('近くに調べられるものはない')}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='ShiftLeft'||e.code==='ShiftRight')run=true});

function update(dt){if(!started)return;
 const forward=(keys.KeyS?1:0)-(keys.KeyW?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);const sp=player.speed*(run?1.55:1);const dx=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*sp*dt,dz=(Math.cos(player.yaw)*forward-Math.sin(player.yaw)*side)*sp*dt;
 if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;
 // stair zones connect the floors
 if(player.x>15.6&&player.x<19.2&&player.z>2.4&&player.z<10.8){if(stairLevel<0&&Math.abs(dz)>.0001){const current=Math.max(0,Math.min(2,Math.round((player.y-1.65)/4.2)));stairLevel=dz<0?current:current-1;if(stairLevel<0||stairLevel>1)stairLevel=-1}if(stairLevel>=0){const t=Math.max(0,Math.min(1,(10.2-player.z)/7.2));player.y=1.65+stairLevel*4.2+t*4.2;if(player.z<=2.9){player.y=1.65+(stairLevel+1)*4.2;stairLevel=-1}else if(player.z>=10.25){player.y=1.65+stairLevel*4.2;stairLevel=-1}}}else stairLevel=-1;
 for(const d of doors){const diff=d.target-d.angle;d.angle+=diff*Math.min(1,dt*5.5);d.group.rotation.y=d.angle;}
 camera.position.set(player.x,player.y,player.z);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');hand.rotation.x=Math.sin(performance.now()*.006)*(Math.abs(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD)?.045:.012);hand.rotation.z=Math.sin(performance.now()*.004)*.025;
 document.querySelector('#floor').textContent='🏠 '+(floorIndex()+1)+'F';
 const near=interactables.some(it=>it.mesh.visible&&!it.mesh.userData.found&&Math.hypot(it.mesh.position.x-player.x,it.mesh.position.z-player.z)<2.7);document.querySelector('#prompt').textContent=near?'[ E ] 調べる':'';
 document.querySelector('#status').textContent='自由探索';
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
