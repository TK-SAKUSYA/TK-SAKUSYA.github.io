<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a27"><title>ブロックワールド VER.3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#f3f6fb;font-family:system-ui,sans-serif}header{padding:14px 4%;background:#0b111b;border-bottom:1px solid #34465c;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:3}.logo{font-weight:900;font-size:22px;letter-spacing:2px}.logo em{color:#ffd36b;font-style:normal}.stats{display:flex;gap:8px}.pill{background:#202e40;border:1px solid #40536a;padding:7px 11px;border-radius:30px;font-size:13px}main{max-width:1150px;margin:auto;padding:16px;display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.panel{background:#192535;border:1px solid #35485e;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0004}.head{padding:13px 16px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:16px;margin:0}.scene{height:340px;position:relative;overflow:hidden;background:linear-gradient(#82b9d5 0 48%,#83b15f 48%)}.scene.city{background:linear-gradient(#828997 0 48%,#514f58 48%)}.scene.snow{background:linear-gradient(#9bc8dd 0 48%,#e7f1f4 48%)}.scene.jungle{background:linear-gradient(#60966e 0 48%,#285039 48%)}.scene.divine{background:linear-gradient(#c6c9e8 0 48%,#8e90bf 48%)}.scene.demon{background:linear-gradient(#252436 0 48%,#39232c 48%)}.sun{position:absolute;right:13%;top:12%;width:58px;height:58px;border-radius:50%;background:#fff1b0;box-shadow:0 0 40px #fff4a0}.cloud{position:absolute;left:12%;top:22%;font-size:42px}.hill{position:absolute;bottom:25%;left:-8%;width:60%;height:30%;border-radius:50% 50% 0 0;background:#527c50}.hill.two{left:55%;background:#638c56}.scene.city .hill{background:#4e505a;border-radius:0;height:50%;width:20%}.scene.city .two{left:73%;height:58%;width:22%}.scene.snow .hill{background:#e8f3f7}.scene.snow .two{background:#d5e9f0}.scene.jungle .hill{background:#244c37}.scene.jungle .two{background:#35643e}.scene.divine .hill{background:#8789b9}.scene.divine .two{background:#a4a6ce}.scene.demon .sun{background:#bd4359;box-shadow:0 0 45px #e33e58}.scene.demon .hill{background:#211b2a}.scene.demon .two{background:#30212b}.label{position:absolute;top:14px;left:14px;background:#111b2bcc;border:1px solid #ffffff35;border-radius:10px;padding:9px 12px}.label b{font-size:20px;display:block}.hero{position:absolute;bottom:22%;left:48%;width:42px;height:42px;background:#4ca5ff;border:4px solid white;border-radius:5px;box-shadow:5px 6px #192331}.hero:before,.hero:after{content:"";position:absolute;top:10px;width:5px;height:7px;background:#17202c}.hero:before{left:7px}.hero:after{right:7px}.caption{position:absolute;bottom:12px;left:14px;right:14px;text-shadow:0 2px 5px #000;font-size:13px}.actions,.tabs,.content{padding:13px 15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;border-top:1px solid #ffffff16;border-bottom:1px solid #ffffff16}.tabs button{padding:7px 10px;font-size:12px}button{background:linear-gradient(#344a63,#223246);color:#fff;border:1px solid #4a607a;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}button:hover{filter:brightness(1.2)}button:disabled{opacity:.45}.actions button{flex:1}.side{display:flex;flex-direction:column;gap:14px}.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:13px}.map button{text-align:left;font-size:13px}.map small{display:block;color:#afbed0}.quest{padding:10px 0;border-bottom:1px solid #ffffff14;font-size:13px}.quest:last-child{border:0}.muted{color:#adbdcf;font-size:12px}.log{font-size:13px;line-height:1.6;max-height:150px;overflow:auto}.log div{padding:4px 0;border-bottom:1px solid #ffffff10}.modal{display:none;position:fixed;inset:0;background:#050910cc;z-index:10;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.dialog{background:#192638;border:1px solid #526980;border-radius:16px;width:min(600px,100%);max-height:88vh;overflow:auto}.dialog header{position:static;border:0;background:transparent}.dialogbody{padding:18px;line-height:1.65}.choices{display:grid;gap:8px}.battle{text-align:center;background:#302d3d;border:1px solid #765b70;border-radius:12px;padding:12px}.enemy{font-size:60px}.bar{height:11px;background:#0b111a;border-radius:20px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:#f36b70}.bar.blue i{background:#5bb6ff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}.small{font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr;padding:9px}.scene{height:290px}.side{display:grid;grid-template-columns:1fr}.stats{font-size:11px}.pill{padding:6px 8px}}@media(max-width:400px){.scene{height:250px}.map{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="logo">🧱 BLOCK <em>WORLD</em></div><div class="muted">VER.3.0 • THE WORLD OF BLOCKS</div></div><div class="stats"><div class="pill">❤️ <b id="hp">100</b>/100</div><div class="pill">🪙 <b id="coins">100</b></div><div class="pill">🌑 <b id="frags">0</b></div></div></header>
<main><section class="panel"><div class="head"><h2>🌍 フィールド</h2><span class="muted" id="status">ムーラ村</span></div><div class="scene" id="scene"><div class="sun"></div><div class="cloud">☁️</div><div class="hill"></div><div class="hill two"></div><div class="label"><b id="areaName">ムーラ村</b><span class="muted" id="areaSub">平和な村</span></div><div class="hero"></div><div class="caption" id="caption">ここが冒険の拠点。村人たちが暮らしている。</div></div><div class="actions"><button id="talk">💬 話す</button><button id="explore">🔎 調べる</button><button id="rest">🛏️ 休む</button><button id="bag">🎒 持ち物</button></div><div class="tabs"><button data-tab="story">📖 ストーリー</button><button data-tab="people">🧑‍🤝‍🧑 村人</button><button data-tab="lore">📚 世界の記録</button></div><div class="content"><div id="log" class="log"></div><div id="tab"></div></div></section>
<aside class="side"><section class="panel"><div class="head"><h2>🗺️ 地域マップ</h2><span class="muted">全7地域</span></div><div class="map" id="map"></div></section><section class="panel"><div class="head"><h2>📜 冒険の記録</h2></div><div class="content"><div class="quest">🧱 <b>世界を知る</b><div class="muted">ムーラ村の住人と話し、世界のことを知ろう。</div></div><div class="quest">🌑 <b>闇の欠片</b><div class="muted">各地に散らばったフードの欠片を探そう。</div></div><div class="quest">👑 <b>魔界への道</b><div class="muted">フードの野望を止める。</div></div></div></section></aside></main>
<div class="modal" id="modal"><div class="dialog"><header><b id="mtitle">タイトル</b><button id="close">✕</button></header><div class="dialogbody" id="mbody"></div></div></div><footer class="muted" style="text-align:center;padding:16px">BLOCK WORLD • この世界に存在するのは、ブロックの住人たちだけ。</footer>
<script>
const areas=[
{id:"village",n:"ムーラ村",sub:"平和な音楽",desc:"冒険の拠点。多くの住人が暮らしている。",icon:"🏘️",tone:""},
{id:"grass",n:"風よそぐ草原",sub:"靡く空",desc:"風が吹き抜ける草原。闇に染まった生物が徘徊している。",icon:"🌿",tone:"",enemy:"ザコ",boss:"ダイン"},
{id:"city",n:"荒廃した街",sub:"無人の街並み",desc:"荒れ果てた街。今は闇に染まった敵しか住んでいない。",icon:"🏙️",tone:"city",enemy:"ザコイン",boss:"アイ"},
{id:"snow",n:"吹雪の雪原",sub:"白銀の大地",desc:"吹雪が吹き荒れる雪原。",icon:"❄️",tone:"snow",enemy:"ザザン",boss:"フブキ"},
{id:"jungle",n:"野蛮なジャングル",sub:"深い緑の奥地",desc:"原始的な武器を持つ敵が潜むジャングル。",icon:"🌴",tone:"jungle",enemy:"ザンコ",boss:"グマル"},
{id:"divine",n:"神聖なる神界",sub:"神々の領域",desc:"神々が存在する領域。レウスとガッドが待ち受ける。",icon:"✨",tone:"divine",enemy:"ザコシン",boss:"ガッド"},
{id:"demon",n:"魔界",sub:"フードの拠点",desc:"枯れた木、腐敗した地面、絶え間ない雷。フードと部下たちの拠点。",icon:"⚡",tone:"demon",enemy:"ザコボス",boss:"フード"}];
const people=[
["ウィリアム","🌾","農家","畑仕事を手伝う。お礼にクワをくれる。"],
["オッホホ","🛒","商店","商店を営んでいる。販売を手伝うと優先券をくれる。"],
["アキラ","🎒","元冒険家","10人の勇者の子孫。勇者の血筋から冒険家になったが、冒険に絶望して今はニート。"],
["ミミヨリ","📡","情報屋","ガタイの良い情報屋。滅びたスパイ組織「スネクーダ」のメンバー。組織謹製の無線機「エレクトロ」を持つ。"],
["ブロッタ","📘","幼馴染","主人公の幼馴染。戦闘力はないが、本に書かれた世界の知識を共有する。"],
["エディット","🎨","スタイリスト","丁寧な口調。「エル・スキン」でブロックの色や衣装を変える。"],
["ウサンクサ","🔮","占い師","怪しげだが嘘はつかない。「占いの館・テンテンランド」を営む。"],
["ザン","⚔️","最強の剣士","孤高主義。修行は日課。10人の勇者の子孫だが血筋は気にしていない。"],
["INYO（インヨー）","🎤","ラッパー","陽気でお気楽。ラップバトルを挑める。"],
["ウオタ","🎣","漁師","江戸っ子口調の熱血漁師。釣りに人生を懸けている。"],
["ホリホリ","⛏️","鉱夫","寡黙なおっさん。採掘場で武器の素材を採れる。"],
["村の子どもたち","🧒","子ども","いたずら好きで純粋。サブクエストを依頼する。"],
["ウラグス","🖤","宗教家","フード再興教の信者だったが、別の信者に洗脳されていた。"],
["コンカチ","🗼","鉄塔職人","頑固な職人。村で日々塔を高くしている。"]];
const S={area:"village",hp:100,coins:100,frags:[],visited:["village"],items:["クワ"],defeated:[],talked:[],battle:null};
const $=id=>document.getElementById(id);function log(t){$("log").innerHTML="<div>"+t+"</div>"+$("log").innerHTML}function save(){localStorage.setItem("bw30",JSON.stringify(S))}function stats(){$("hp").textContent=S.hp;$("coins").textContent=S.coins;$("frags").textContent=S.frags.length}
function area(){return areas.find(a=>a.id===S.area)}function render(){let a=area();$("scene").className="scene "+a.tone;$("areaName").textContent=a.n;$("areaSub").textContent=a.sub;$("caption").textContent=a.desc;$("status").textContent=a.n;$("map").innerHTML=areas.map(x=>"<button data-go='"+x.id+"' "+(x.id===S.area?"disabled":"")+">"+x.icon+" "+x.n+"<small>"+(S.visited.includes(x.id)?"訪問済み":"未訪問")+"</small></button>").join("");$("map").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>travel(b.dataset.go));stats();save()}
function travel(id){S.area=id;if(!S.visited.includes(id))S.visited.push(id);render();log("🗺️ "+area().n+"に到着した。")}
function modal(title,html){$("mtitle").textContent=title;$("mbody").innerHTML=html;$("modal").classList.add("show")}$("close").onclick=()=>$("modal").classList.remove("show");
function talk(){if(S.area!=="village"){let a=area();modal(a.enemy+"が現れた！","<p>闇に染まった敵がいる。どうする？</p><div class='row'><button id='start'>⚔️ 戦う</button><button id='back'>村へ戻る</button></div>");$("start").onclick=()=>battle(a.enemy,false);$("back").onclick=()=>{travel("village");$("modal").classList.remove("show")};return}
modal("ムーラ村の住人","<p>誰と話す？</p><div class='choices'>"+people.map((p,i)=>"<button data-p='"+i+"' style='text-align:left'>"+p[1]+" <b>"+p[0]+"</b> <span class='muted'>— "+p[2]+"</span></button>").join("")+"</div>");$("mbody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>person(+b.dataset.p))}
function person(i){let p=people[i],extra="";if(p[0]==="ウィリアム"&&!S.items.includes("クワ")){S.items.push("クワ");extra="<p>「畑仕事を手伝ってくれたお礼だ。クワを持っていきな！」</p>"}if(p[0]==="ミミヨリ"){if(!S.items.includes("エレクトロ"))S.items.push("エレクトロ");extra="<p>「これが組織謹製の無線機、エレクトロだ。スネクーダは……もう滅びた組織だがな。」</p>"}if(p[0]==="ブロッタ")extra="<p>「この世界にはムーラ村、草原、荒廃した街、雪原、ジャングル、神界、魔界があるんだ。本に書いてあるぞ！」</p>";if(p[0]==="アキラ")extra="<p>「勇者の子孫だから冒険家になったんだけどな……冒険には絶望したよ。」</p>";if(p[0]==="ザン")extra="<p>「修行は日課だ。血筋？そんなものは気にしていない。」</p><button id='train'>一緒に修行する</button>";if(p[0]==="ウラグス")extra="<p>「私は別の信者に洗脳されていたんだ。フードを信じたのは自分の意思じゃなかった。」</p>";if(p[0]==="オッホホ")extra="<p>「いらっしゃい！回復アイテムは30ブロックォーターだよ。」</p><button id='buy'>回復アイテムを買う</button>";if(p[0]==="エディット")extra="<p>「お客様、ブロックの色を変更いたします。」</p><div class='row'><button data-color='#4ca5ff'>青</button><button data-color='#ed7777'>赤</button><button data-color='#82d18c'>緑</button><button data-color='#c59cff'>紫</button></div>";if(p[0]==="ウサンクサ")extra="<p>「ふむ……次に向かうべき場所は、まだ見ぬ地域じゃ。勝率は己の腕次第じゃな。」</p>";if(p[0]==="INYO（インヨー）")extra="<p>「Yo！ラップで勝負しようぜ！」</p><button id='rap'>ラップバトル！</button>";if(p[0]==="ウオタ")extra="<p>「釣りは命懸けよ！今日は大物を狙うぜ！」</p><button id='fish'>釣りをする</button>";if(p[0]==="ホリホリ")extra="<p>「……採掘場なら素材が出る。持っていけ。」</p><button id='mine'>採掘する</button>";if(p[0]==="村の子どもたち")extra="<p>「村の外の敵を解放してきてよ！」</p><button id='kids'>お願いを聞く</button>";if(p[0]==="コンカチ")extra="<p>「塔はまだまだ高くする。手出しは無用だ！」</p>";S.talked.push(p[0]);modal(p[1]+" "+p[0],"<p><b>"+p[2]+"</b></p><p>"+p[3]+"</p>"+extra+"<div class='row'><button id='done'>会話を終える</button></div>");$("done").onclick=()=>$("modal").classList.remove("show");$("mbody").querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{document.querySelector(".hero").style.background=b.dataset.color;log("🎨 ブロックの色を変更した。")});if($("train"))$("train").onclick=()=>{S.hp=100;S.coins+=5;stats();log("⚔️ ザンと修行した。少し経験を積んだ。")};if($("buy"))$("buy").onclick=()=>{if(S.coins>=30){S.coins-=30;S.items.push("回復アイテム");stats();log("🧪 回復アイテムを購入した。")}else log("🪙 ブロックォーターが足りない。")};if($("rap"))$("rap").onclick=()=>{if(Math.random()>.45){S.coins+=15;log("🎤 INYOとのバトルに勝利！タイトルの文字を獲得！")}else log("🎤 INYOに負けてしまった……");stats()};if($("fish"))$("fish").onclick=()=>{let n=1+Math.floor(Math.random()*100);S.coins+=Math.floor(n/10);stats();log("🎣 "+n+"cmの魚が釣れた！")};if($("mine"))$("mine").onclick=()=>{S.items.push("武器の素材");log("⛏️ 武器の素材を採掘した。")};if($("kids"))$("kids").onclick=()=>{S.coins+=20;stats();log("🧒 子どもたちのお願いを聞いた。20ブロックォーター獲得！")};save()}
function explore(){let a=area();if(S.area==="village"){log("🏘️ 村人たちが暮らしている。コンカチの塔は今日も高くなっている。");return}if(S.area==="divine"&&!S.defeated.includes("レウス")){modal("神界の守護者","<p>炎の神レウスが立ちはだかった！</p><button id='reus'>レウスと戦う</button>");$("reus").onclick=()=>battle("レウス",true);return}if(a.boss&&!S.defeated.includes(a.boss)){modal("ボスの気配","<p>"+a.boss+"がこの先にいる。挑戦する？</p><button id='boss'>ボスに挑む</button>");$("boss").onclick=()=>battle(a.boss,true);return}if(S.area==="demon"&&S.frags.length>=6){modal("魔界の奥","<p>全ての闇の欠片が反応し、メガが姿を現した……！</p><button id='mega'>メガに挑む</button>");$("mega").onclick=()=>battle("メガ",true);return}modal("周囲を調べる","<p>"+a.desc+"</p><p>闇に染まった"+a.enemy+"がいる。</p><button id='enemy'>敵と戦う</button>");$("enemy").onclick=()=>battle(a.enemy,false)}
function battle(enemy,boss){let max=boss?150:65;S.battle={enemy:enemy,boss:boss,max:max,hp:max};showBattle()}
function showBattle(){let b=S.battle;if(!b)return;let art=b.enemy==="フード"?"⬛":b.enemy==="メガ"?"⬛👁️":b.enemy==="ダイン"?"🪵⚙️":b.enemy==="アイ"?"🤖":b.enemy==="フブキ"?"❄️⚔️":b.enemy==="グマル"?"🐻":b.enemy==="ガッド"?"⚡":b.enemy==="レウス"?"🔥":"👾";modal("⚔️ バトル！","<div class='battle'><div class='enemy'>"+art+"</div><b>"+b.enemy+"</b><p class='small'>敵 HP "+b.hp+"/"+b.max+"</p><div class='bar'><i style='width:"+(100*b.hp/b.max)+"%'></i></div><p class='small'>主人公 HP "+S.hp+"/100</p><div class='bar blue'><i style='width:"+S.hp+"%'></i></div><p class='small'>闇に染まった生物。倒すことで闇から解放できる。</p></div><div class='row'><button id='atk'>⚔️ 攻撃</button><button id='heavy'>💥 強攻撃</button><button id='heal'>🧪 回復</button><button id='escape'>🏃 逃げる</button></div>");$("atk").onclick=()=>turn(18);$("heavy").onclick=()=>turn(30);$("heal").onclick=()=>{let i=S.items.indexOf("回復アイテム");if(i>=0){S.items.splice(i,1);S.hp=Math.min(100,S.hp+35);enemyTurn();showBattle()}else log("回復アイテムを持っていない。")};$("escape").onclick=()=>{S.battle=null;$("modal").classList.remove("show");log("戦闘から離脱した。")}}
function enemyTurn(){S.hp=Math.max(0,S.hp-(S.battle.boss?15:8));stats();if(S.hp===0){S.hp=50;S.battle=null;modal("力尽きた…","<p>ムーラ村で目を覚ました。HPが50まで回復した。</p><button id='revive'>村に戻る</button>");$("revive").onclick=()=>{travel("village");$("modal").classList.remove("show")};return false}return true}
function turn(d){let b=S.battle;b.hp=Math.max(0,b.hp-d);if(b.hp===0){let name=b.enemy,boss=b.boss;S.battle=null;$("modal").classList.remove("show");if(boss){if(name!=="メガ"&&!S.frags.includes(S.area)){S.frags.push(S.area);log("🌑 闇の欠片を手に入れた！")}log("🏆 "+name+"を撃破！");if(name==="フード")modal("エンディング「おしまい？」","<p>フードを倒した。世界に静けさが戻った……？</p>")}else{S.defeated.push(name);S.coins+=8;log("✨ "+name+"を倒し、闇から解放した！")}stats();save();return}if(enemyTurn())showBattle();save()}
$("talk").onclick=talk;$("explore").onclick=explore;$("rest").onclick=()=>{S.hp=100;stats();log("🛏️ 休息してHPが全回復した。")};$("bag").onclick=()=>modal("🎒 持ち物","<p>"+S.items.join("、")+"</p><p>ブロックォーター："+S.coins+"枚</p><p>闇の欠片："+S.frags.length+"個</p>");
