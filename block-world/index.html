<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f4f6f8;font-family:system-ui,sans-serif}header{height:58px;padding:8px 14px;background:#111923;border-bottom:1px solid #394958;display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950;letter-spacing:2px}.logo span{color:#ffd36b}.stats{font-size:13px;display:flex;gap:12px}.wrap{max-width:1100px;margin:auto;padding:12px}.gamebox{position:relative;background:#172332;border:2px solid #526476;border-radius:12px;overflow:hidden;box-shadow:0 12px 32px #0006}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#7cc3e3;touch-action:none}.hud{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #17202a;font-weight:800;font-size:13px}.message{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#111d;padding:9px 14px;border:1px solid #fff5;border-radius:9px;text-align:center;max-width:90%;font-size:13px;pointer-events:none}.hidden{display:none!important}.bar{height:10px;width:140px;background:#293746;border:1px solid #fff7;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ff626c}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{background:#1a2837;border:1px solid #3c5064;border-radius:12px;padding:12px}.panel h3{font-size:14px;margin:0 0 8px}.muted{font-size:12px;color:#b5c3d0}button{background:#30465b;color:#fff;border:1px solid #60768b;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.buttons{display:flex;gap:7px;flex-wrap:wrap}.stage-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stage-list button{font-size:12px;text-align:left}.quest{padding:8px 0;border-bottom:1px solid #ffffff18;font-size:13px}.quest:last-child{border:0}.controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad,.act{display:flex;gap:8px;pointer-events:auto}.controls button{width:56px;height:56px;border-radius:50%;font-size:20px;background:#152333d9;backdrop-filter:blur(4px);touch-action:none;user-select:none}.act button{width:66px;height:66px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.dialog{width:min(600px,100%);max-height:85vh;overflow:auto;background:#1b2b3b;border:1px solid #71859a;border-radius:14px;padding:16px}.dialog h2{margin:0 0 10px;font-size:19px}.dialog p{line-height:1.65}.dialog .buttons{margin-top:12px}.log{max-height:120px;overflow:auto;font-size:12px;line-height:1.6}.log div{border-bottom:1px solid #ffffff12;padding:3px}.village-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.wrap{padding:7px}.bottom{grid-template-columns:1fr}.stats{gap:7px;font-size:11px}.controls button{width:52px;height:52px}.act button{width:60px;height:60px}.hud{font-size:11px}.bar{width:90px}}
</style></head><body>
<header><div class="logo">🧱 BLOCK <span>WORLD</span> <small style="font-size:10px;color:#9eafbf">VER.3.1</small></div><div class="stats"><b>❤️ <span id="hp">5</span></b><b>🪙 <span id="coins">100</span></b><b>🌑 <span id="frags">0/6</span></b></div></header>
<div class="wrap"><div class="gamebox"><canvas id="game" width="960" height="540"></canvas><div class="hud"><div><span id="stageName">ムーラ村</span><div class="bar"><i id="playerBar" style="width:100%;background:#64d98b"></i></div></div><div id="bossHud" class="hidden">BOSS <span id="bossName"></span><div class="bar"><i id="bossBar"></i></div></div></div><div id="message" class="message">ブロックワールドへようこそ！</div><div id="controls" class="controls hidden"><div class="pad"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="act"><button data-key="jump">⬆</button><button data-key="attack">⚔</button></div></div></div>
<div class="bottom"><section class="panel"><h3>🧭 冒険メニュー</h3><div class="buttons"><button id="villageBtn">🏘️ ムーラ村</button><button id="questBtn">📜 サブクエスト</button><button id="peopleBtn">🧑‍🤝‍🧑 住民と話す</button><button id="inventoryBtn">🎒 持ち物</button><button id="helpBtn">🎮 操作方法</button></div><p class="muted" id="progressText">まずはムーラ村から冒険に出よう。</p></section><section class="panel"><h3>📖 世界の記録</h3><div id="log" class="log"></div></section></div>
<div class="panel" style="margin-top:10px"><h3>🗺️ ステージ進行</h3><div id="stageList" class="stage-list"></div><p class="muted">各ステージのボスを倒すとクリア。次のステージが解放され、ムーラ村に新しい住民がやって来る！</p></div></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="buttons"><button id="modalClose">閉じる</button></div></div></div>
<script>
const $=id=>document.getElementById(id),cv=$("game"),ctx=cv.getContext("2d");
const stages=[
{id:"grass",name:"風よそぐ草原",enemy:"ザコ",boss:"ダイン",bg:"#80c6e5",ground:"#7bba56",desc:"風が吹き抜ける草原。木と機械が融合したダインが待つ。"},
{id:"city",name:"荒廃した街",enemy:"ザコイン",boss:"アイ",bg:"#8b929e",ground:"#68636b",desc:"荒廃した街。暴走したAI・アイが待つ。"},
{id:"snow",name:"吹雪の雪原",enemy:"ザザン",boss:"フブキ",bg:"#b9e0ed",ground:"#eaf4f5",desc:"吹雪の雪原。中ボスのスノーカップルも潜んでいる。"},
{id:"jungle",name:"野蛮なジャングル",enemy:"ザンコ",boss:"グマル",bg:"#579b6a",ground:"#315b3a",desc:"野蛮なジャングル。巨大なクマ、グマルが待つ。"},
{id:"divine",name:"神聖なる神界",enemy:"ザコシン",boss:"ガッド",bg:"#c7c9e8",ground:"#898cba",desc:"炎の神レウスを越え、雷の神ガッドに挑もう。"},
{id:"demon",name:"魔界",enemy:"ザコボス",boss:"フード",bg:"#393243",ground:"#34252e",desc:"フードの拠点。枯れた木、腐敗した地面、絶え間ない雷。"}
];
const residents=[
{name:"草原から来た住民",job:"旅人",request:"ムーラ村の暮らしに慣れるため、草原の敵を3体解放してほしい。",kind:"kills",need:3,reward:35},
{name:"街から来た住民",job:"修理屋",request:"荒廃した街で素材を2つ集めてほしい。",kind:"items",need:2,reward:45},
{name:"雪原から来た住民",job:"雪細工師",request:"雪原の敵を3体解放してほしい。",kind:"kills",need:3,reward:50},
{name:"ジャングルから来た住民",job:"採集家",request:"ジャングルで素材を3つ集めてほしい。",kind:"items",need:3,reward:55},
{name:"神界から来た住民",job:"記録係",request:"神界の敵を3体解放してほしい。",kind:"kills",need:3,reward:70},
{name:"魔界から来た住民",job:"元部下",request:"魔界の敵を5体解放してほしい。",kind:"kills",need:5,reward:100}
];
const people=[["ウィリアム","農家","畑仕事を手伝う。クワをくれる。"],["オッホホ","商店","商店を営む。優先券をくれる。"],["アキラ","元冒険家","10人の勇者の子孫。冒険に絶望してニートになった。"],["ミミヨリ","情報屋","滅びたスパイ組織スネクーダのメンバー。無線機エレクトロを持つ。"],["ブロッタ","幼馴染","主人公の幼馴染。戦闘力はないが、本の世界知識を共有する。"],["エディット","スタイリスト","エル・スキンで色や衣装を変える。"],["ウサンクサ","占い師","怪しいが嘘はつかない。テンテンランドの主。"],["ザン","最強の剣士","孤高主義。修行はルーティン。勇者の子孫だが気にしていない。"],["INYO（インヨー）","ラッパー","陽気でお気楽。ラップバトルが好き。"],["ウオタ","漁師","江戸っ子口調の熱血漁師。"],["ホリホリ","鉱夫","寡黙なおっさん。武器素材を採掘する。"],["村の子どもたち","子ども","いたずら好きで純粋。"],["ウラグス","宗教家","別の信者に洗脳されていた。本人の意思ではなかった。"],["コンカチ","鉄塔職人","頑固。村の塔を日々高くしている。"]];
let S={cleared:[],frags:[],coins:100,hp:5,items:["クワ"],kills:0,materials:0,quests:[],arrivals:[],color:"#4da9ff",area:"village",gameStarted:false};
try{let old=JSON.parse(localStorage.getItem("bw30"));if(old){S.cleared=old.cleared||[];S.frags=old.frags||[];S.coins=old.coins??100;S.items=old.items||["クワ"];S.arrivals=old.arrivals||[];S.quests=old.quests||[];S.color=old.color||"#4da9ff"}}catch(e){}
let mode="village",stageIndex=0,world=null,player=null,boss=null,cam=0,keys={},last=0,toastTimer=0,enemyList=[],particles=[],miniBossDone=false;
const save=()=>localStorage.setItem("bw30",JSON.stringify(S));
function log(t){$("log").innerHTML="<div>"+t+"</div>"+$("log").innerHTML}
function toast(t){$("message").textContent=t;$("message").classList.remove("hidden");toastTimer=170}
function updateHud(){$("hp").textContent=S.hp;$("coins").textContent=S.coins;$("frags").textContent=S.frags.length+"/6";$("playerBar").style.width=(S.hp/5*100)+"%";$("stageName").textContent=mode==="village"?"ムーラ村":stages[stageIndex].name;$("progressText").textContent="クリア "+S.cleared.length+"/6 ステージ";}
function openModal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("show")}
$("modalClose").onclick=()=>$("modal").classList.remove("show");
function village(){mode="village";S.area="village";$("controls").classList.add("hidden");$("bossHud").classList.add("hidden");$("message").classList.add("hidden");$("stageName").textContent="ムーラ村";renderStageList();updateHud();drawVillage();save()}
function renderStageList(){$("stageList").innerHTML=stages.map((s,i)=>{let unlocked=i===0||S.cleared.includes(stages[i-1].id);let done=S.cleared.includes(s.id);return "<button data-stage='"+i+"' "+(!unlocked?"disabled":"")+">"+(done?"✅":unlocked?"🔓":"🔒")+" "+s.name+"</button>"}).join("");$("stageList").querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>startStage(+b.dataset.stage))}
function drawVillage(){ctx.fillStyle="#86c9e7";ctx.fillRect(0,0,960,540);ctx.fillStyle="#75b85a";ctx.fillRect(0,365,960,175);for(let x=0;x<960;x+=48){ctx.fillStyle="#5d9a48";ctx.fillRect(x,365,48,12)}drawTree(120,300);drawTree(800,295);drawHouse(320,245,"#c99b5e");drawHouse(610,270,"#d8bd85");ctx.fillStyle="#f4e0ae";ctx.fillRect(0,460,960,80);ctx.fillStyle="#4da9ff";ctx.fillRect(465,405,44,44);ctx.fillStyle="#16202b";ctx.fillRect(475,417,6,8);ctx.fillRect(494,417,6,8);ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.fillText("ムーラ村",28,45);ctx.font="16px system-ui";ctx.fillText("住民たちが暮らす安全な村",28,74);ctx.font="14px system-ui";ctx.fillText("🏠 新しく来た住民："+S.arrivals.length+"人",28,110);ctx.fillText("ステージ選択は下のボタンから！",28,145);ctx.fillText("コンカチの塔",730,230);for(let y=0;y<6;y++)ctx.fillRect(760+y%2*12,310-y*30,50,30)}
function drawTree(x,y){ctx.fillStyle="#765235";ctx.fillRect(x+18,y+45,18,55);ctx.fillStyle="#327a43";ctx.fillRect(x,y,55,55);ctx.fillRect(x+8,y-20,40,30)}
function drawHouse(x,y,c){ctx.fillStyle=c;ctx.fillRect(x,y,120,115);ctx.fillStyle="#9a5141";ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+60,y-65);ctx.lineTo(x+132,y);ctx.fill();ctx.fillStyle="#583c2c";ctx.fillRect(x+47,y+60,28,55);ctx.fillStyle="#8ed1ed";ctx.fillRect(x+12,y+30,27,25);ctx.fillRect(x+83,y+30,25,25)}
function startStage(i){if(i>0&&!S.cleared.includes(stages[i-1].id)){toast("前のステージをクリアしないと進めない！");return}stageIndex=i;mode="stage";S.area=stages[i].id;miniBossDone=false;const st=stages[i];world={width:3000,ground:450,platforms:[{x:350,y:365,w:150},{x:720,y:320,w:160},{x:1120,y:370,w:160},{x:1500,y:315,w:170},{x:1930,y:365,w:170},{x:2350,y:320,w:160}]};player={x:70,y:350,vx:0,vy:0,w:42,h:42,ground:false,face:1,attack:0,inv:0};cam=0;S.hp=5;boss={x:2660,y:350,hp:stages[i].id==="demon"?22:16,max:stages[i].id==="demon"?22:16,active:false,attack:0,inv:0};enemyList=[];for(let n=0;n<12;n++)enemyList.push({x:260+n*205,y:410,w:36,h:38,hp:2,dir:n%2?1:-1,alive:true,shot:0});particles=[];$("controls").classList.remove("hidden");$("bossHud").classList.add("hidden");$("message").classList.remove("hidden");toast(st.name+" に到着！敵を倒しながら進もう！");updateHud();save()}
function pressed(k){keys[k]=true}function released(k){keys[k]=false}
document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(["arrowleft","arrowright"," ","arrowup"].includes(k))e.preventDefault();if(k==="arrowleft"||k==="a")pressed("left");if(k==="arrowright"||k==="d")pressed("right");if(k===" "||k==="arrowup"||k==="w")pressed("jump");if(k==="j"||k==="z"||k==="x")pressed("attack")});
document.addEventListener("keyup",e=>{let k=e.key.toLowerCase();if(k==="arrowleft"||k==="a")released("left");if(k==="arrowright"||k==="d")released("right");if(k===" "||k==="arrowup"||k==="w")released("jump");if(k==="j"||k==="z"||k==="x")released("attack")});
document.querySelectorAll("[data-key]").forEach(b=>{let k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();pressed(k);b.setPointerCapture(e.pointerId)});b.addEventListener("pointerup",e=>{e.preventDefault();released(k)});b.addEventListener("pointercancel",()=>released(k))});
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function damagePlayer(){if(player.inv>0)return;S.hp--;player.inv=75;updateHud();if(S.hp<=0){S.hp=5;player.x=70;player.y=350;player.vx=player.vy=0;toast("力尽きた！ステージ入口から再挑戦だ。");updateHud()}}
function playerAttack(){if(player.attack>0)return;player.attack=16;let box={x:player.face>0?player.x+player.w:player.x-48,y:player.y+5,w:48,h:34};enemyList.forEach(e=>{if(e.alive&&hit(box,e)){e.hp--;e.x+=player.face*22;if(e.hp<=0){e.alive=false;S.kills++;S.coins+=2;if(Math.random()<.45){S.materials++;S.items.push("武器の素材");}}}});if(boss&&boss.active&&hit(box,{x:boss.x,y:boss.y,w:100,h:100})&&boss.inv<=0){boss.hp--;boss.inv=35;boss.x+=player.face*28;if(boss.hp<=0){if(stages[stageIndex].id==="divine"&&$("bossName").textContent==="レウス"){miniBossDone=true;boss={x:2660,y:350,hp:16,max:16,active:false,attack:0,inv:0};$("bossHud").classList.add("hidden");toast("レウスを撃破！奥にガッドが現れた！");}else clearStage();}} }
function clearStage(){let id=stages[stageIndex].id;if(!S.cleared.includes(id)){S.cleared.push(id);S.frags.push(id);let r=residents[stageIndex];S.arrivals.push({...r,done:false,progress:0});log("🏘️ "+r.name+"がムーラ村にやって来た！");}if(id==="divine"){}if(id==="demon"){S.cleared.push("final");}save();$("controls").classList.add("hidden");$("bossHud").classList.add("hidden");mode="clear";drawVillage();openModal("🏆 ステージクリア！","<p><b>"+stages[stageIndex].name+"</b>をクリアした！</p><p>🌑 闇の欠片を入手！</p><p>🏘️ ムーラ村に新しい住民がやって来た！</p><p>次のステージが解放されたぞ！</p><div class='buttons'><button id='toVillage'>ムーラ村へ戻る</button>"+(stageIndex<5?"<button id='nextStage'>次のステージへ</button>":"")+"</div>");$("toVillage").onclick=()=>{$("modal").classList.remove("show");village()};if($("nextStage"))$("nextStage").onclick=()=>{$("modal").classList.remove("show");startStage(stageIndex+1)};renderStageList();updateHud()}
function bossStart(){boss.active=true;$("bossHud").classList.remove("hidden");$("bossName").textContent=stages[stageIndex].boss;toast("BOSS "+stages[stageIndex].boss+" 出現！！");}
function update(dt){if(mode!=="stage"||!player)return;let p=player,st=stages[stageIndex];if(keys.left){p.vx-=.75;p.face=-1}if(keys.right){p.vx+=.75;p.face=1}p.vx*=.82;p.vx=Math.max(-6,Math.min(6,p.vx));if(keys.jump&&p.ground){p.vy=-13;p.ground=false}if(keys.attack)playerAttack();p.vy+=.62;p.x+=p.vx;p.y+=p.vy;p.x=Math.max(0,Math.min(world.width-p.w,p.x));p.ground=false;if(p.y+p.h>=world.ground){p.y=world.ground-p.h;p.vy=0;p.ground=true}world.platforms.forEach(q=>{if(p.vy>=0&&p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h-p.vy<=q.y){p.y=q.y-p.h;p.vy=0;p.ground=true}});if(p.attack>0)p.attack--;if(p.inv>0)p.inv--;
enemyList.forEach(e=>{if(!e.alive)return;e.x+=e.dir*1.2;if(e.x<100||e.x>world.width-150)e.dir*=-1;if(hit(p,e))damagePlayer()});
if(p.x>2300&&!boss.active)bossStart();if(boss.active){if(boss.inv>0)boss.inv--;boss.attack++;if(boss.attack%100===0){let dx=p.x-boss.x;if(Math.abs(dx)<230)damagePlayer();else boss.x+=Math.sign(dx)*45}if(Math.abs(p.x-boss.x)<100&&Math.abs(p.y-boss.y)<75)damagePlayer();$("bossBar").style.width=(boss.hp/boss.max*100)+"%";}
if(stages[stageIndex].id==="divine"&&!miniBossDone&&p.x>1650){miniBossDone=true;boss.hp=8;boss.max=8;boss.x=1750;boss.active=true;$("bossName").textContent="レウス";$("bossHud").classList.remove("hidden");toast("中ボス・レウスが立ちはだかった！")}

if(p.x>world.width-120&&boss.hp>0){p.x=world.width-140}
cam=Math.max(0,Math.min(world.width-960,p.x-400));}
function block(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x-cam),Math.round(y),w,h);ctx.fillStyle="#ffffff24";ctx.fillRect(Math.round(x-cam),Math.round(y),w,Math.max(4,h*.13));ctx.fillStyle="#00000020";ctx.fillRect(Math.round(x-cam),Math.round(y+h-5),w,5)}
function draw(){if(mode==="village"||mode==="clear"){drawVillage();return}let st=stages[stageIndex];ctx.fillStyle=st.bg;ctx.fillRect(0,0,960,540);ctx.fillStyle="#ffffff25";for(let i=0;i<10;i++)ctx.fillRect((i*137-cam*.25%1200),90+(i%3)*32,80,12);for(let x=0;x<world.width;x+=64){block(x,world.ground,64,90,st.ground);ctx.fillStyle="#00000012";ctx.fillRect(x-cam,world.ground+25,64,3)}world.platforms.forEach(q=>block(q.x,q.y,q.w,18,st.ground));if(st.id==="demon"){ctx.fillStyle="#2b202b";for(let x=200;x<world.width;x+=380){ctx.fillRect(x-cam,300,14,150);ctx.fillRect(x-25-cam,295,65,8)}}
enemyList.forEach(e=>{if(!e.alive)return;block(e.x,e.y,e.w,e.h,st.id==="snow"?"#b6dce8":st.id==="demon"?"#382c42":"#596b7d");ctx.fillStyle="#111";ctx.fillRect(e.x-cam+9,e.y+12,5,7);ctx.fillRect(e.x-cam+23,e.y+12,5,7)});
if(boss&&boss.active){let c=st.id==="demon"?"#17151f":st.id==="city"?"#4d5362":st.id==="snow"?"#b7dce8":st.id==="jungle"?"#5e5037":st.id==="divine"?"#e0a34e":"#78664e";block(boss.x,boss.y,100,100,c);ctx.fillStyle=st.id==="demon"?"#e74a58":"#171b22";ctx.fillRect(boss.x-cam+24,boss.y+30,12,15);ctx.fillRect(boss.x-cam+64,boss.y+30,12,15);if(st.id==="demon"){ctx.fillStyle="#d83f55";ctx.fillRect(boss.x-cam+45,boss.y+30,16,18)}}
