function mobTexture(color){const cv=document.createElement('canvas');cv.width=cv.height=16;const q=cv.getContext('2d');q.fillStyle=color;q.fillRect(0,0,16,16);for(let i=0;i<28;i++){q.fillStyle=i%2?'#ffffff':'#333333';q.globalAlpha=.12;q.fillRect((i*7)%16,(i*11)%16,2,2)}q.globalAlpha=1;q.fillStyle='#222';q.fillRect(4,5,2,2);q.fillRect(10,5,2,2);const tx=new THREE.CanvasTexture(cv);tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:tx})}const mobColors=['#9b7045','#e5e0cf','#9b6250','#f4f4e8','#8a603b','#777777','#777777','#9d8061','#c66b32','#777777','#333333','#c98b43','#6d5140','#f1e5d1','#e8eef0','#c99b55','#8a8274','#777777','#5a9a59','#668b57','#e4a82f','#45a5a1'].map(mobTexture);
function spawnAnimals(cx,cz,owner){const count=1+Math.floor(hash(cx,cz,world.seed+991)*3);for(let n=0;n<count;n++){const ax=cx+2+Math.floor(hash(cx+n,cz,world.seed+992)*12),az=cz+2+Math.floor(hash(cx,cz+n,world.seed+993)*12),ay=terrain(ax,az)+.65,kind=Math.floor(hash(cx+n*7,cz+n*3,world.seed+994)*ANIMALS.length),g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.9,.65,.48),mobColors[kind]);body.position.y=.45;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.35,.38,.35),body.material);head.position.set(.48,.67,0);g.add(head);g.position.set(ax,ay,az);g.userData={animal:true,name:ANIMALS[kind],dir:hash(ax,az,world.seed+kind)*6.28,moveTimer:2};scene.add(g);mobs.push(g);const arr=chunks.get(owner);if(arr)arr.push(g)}}
function buildChunk(cx,cz){const id=cx+','+cz;if(chunks.has(id))return;chunks.set(id,[]);const owner=id;for(let x=cx;x<cx+16;x++)for(let z=cz;z<cz+16;z++){const h=terrain(x,z),bi=biomeAt(x,z),idx=BIOMES.indexOf(bi),top=idx===18||idx===19||idx===51||idx===52?'sand':idx===7||idx===8||idx===32?'snow':idx===22||idx===23?'dirt':'grass';for(let y=-2;y<=h;y++)block(x,y,z,y===h?top:y===h-1?'dirt':'stone',owner)}
const chance=hash(Math.floor(cx/16),Math.floor(cz/16),world.seed+301);if(chance>.73){const kind=Math.floor(hash(cx,cz,world.seed+771)*25);structure(cx,cz,owner,kind)}if(hash(cx,cz,world.seed+998)>.48)spawnAnimals(cx,cz,owner);
for(const [k,v] of Object.entries(edits)){const [x,y,z]=k.split(',').map(Number);if(x>=cx&&x<cx+16&&z>=cz&&z<cz+16){const old=blockMap.get(k);if(old)removeMesh(old);if(v)block(x,y,z,v,owner)}}}
function unloadChunk(id){const arr=chunks.get(id)||[];arr.forEach(removeMesh);chunks.delete(id)}
function updateChunks(){const cx=Math.floor(camera.position.x/16)*16,cz=Math.floor(camera.position.z/16)*16,r=Number(settings.distance);for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++)buildChunk(cx+x*16,cz+z*16);for(const id of [...chunks.keys()]){const [x,z]=id.split(',').map(Number);if(Math.abs(x-cx)>(r+1)*16||Math.abs(z-cz)>(r+1)*16)unloadChunk(id)}}
function save(){if(!world)return;world.player=[camera.position.x,camera.position.y,camera.position.z,yaw,pitch];world.edits=edits;world.gameTime=gameTime;world.health=health;world.hunger=hunger;localStorage.setItem('bc_world_'+world.id,JSON.stringify(world));toast('ワールドを保存しました 💾')}
function loadWorld(w){world=w;edits=w.edits||{};scene=new THREE.Scene();scene.background=new THREE.Color(0x8acdf2);scene.fog=new THREE.Fog(0x8acdf2,28,100);camera=new THREE.PerspectiveCamera(Number(settings.fov)||75,innerWidth/innerHeight,.1,180);const p=w.player||[0,terrain(0,8)+2.12,8,0,0];camera.position.set(p[0],Math.max(terrain(Math.floor(p[0]),Math.floor(p[2]))+2.12,p[1]),p[2]);gameTime=w.gameTime??480;health=w.health??20;hunger=w.hunger??20;yaw=p[3]||0;pitch=p[4]||0;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0,'YXZ');blocks=[];blockMap.clear();chunks.clear();scene.add(new THREE.HemisphereLight(0xd9f3ff,0x596044,1.8));const sun=new THREE.DirectionalLight(0xfff0d0,2);sun.position.set(-20,35,15);sun.castShadow=settings.quality==='high';scene.add(sun);renderer.render(scene,camera);active=true;$('hud').classList.add('show');show('');updateChunks();renderBar();updateInfo();toast('ワールドに参加しました！')}
function updateInfo(){$('worldInfo').textContent='🌍 '+world.name+'　|　'+(world.gameMode||'survival')+'　|　'+Math.floor(camera.position.x)+', '+Math.floor(camera.position.z);const h=Math.floor(gameTime/60)%24,m=Math.floor(gameTime%60);$('timeInfo').textContent=(h>=6&&h<18?'☀':'☾')+' '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+(world.gameMode==='survival'?'　❤'+Math.ceil(health)+'　🍗'+Math.ceil(hunger):'')}
function worlds(){let a=[];try{a=JSON.parse(localStorage.getItem('bc_worlds')||'[]')}catch{}$('worldList').innerHTML='';if(!a.length)$('worldList').innerHTML='<p class="desc">ワールドがありません。新しく作成してください。</p>';a.forEach(w=>{const d=document.createElement('div');d.className='worlditem';const label=document.createElement('span');label.textContent='🌍 '+w.name+' · '+(w.type==='flat'?'平坦':'通常');const play=document.createElement('button');play.textContent='プレイ';play.onclick=()=>{let saved;try{saved=JSON.parse(localStorage.getItem('bc_world_'+w.id)||'null')}catch{}loadWorld(saved||w)};const del=document.createElement('button');del.textContent='削除';del.style.background='#8b3c43';del.style.color='white';del.onclick=()=>{if(confirm('このワールドを削除しますか？')){localStorage.removeItem('bc_world_'+w.id);saveWorldList(a.filter(v=>v.id!==w.id));worlds()}};d.append(label,play,del);$('worldList').append(d)})}
function saveWorldList(a){localStorage.setItem('bc_worlds',JSON.stringify(a))}
function createWorld(){const a=JSON.parse(localStorage.getItem('bc_worlds')||'[]');const seed=$('worldSeed').value.trim()||String(Math.floor(Math.random()*999999999));const w={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:$('worldName').value.trim()||'新しいワールド',gameMode:$('gameMode').value,difficulty:$('difficulty').value,gameTime:480,health:20,hunger:20,seed:Number.isNaN(Number(seed))?Array.from(seed).reduce((n,c)=>n+c.charCodeAt(0),0):Number(seed),type:$('worldType').value,edits:{},player:[0,5,8,0,0]};a.push(w);saveWorldList(a);localStorage.setItem('bc_world_'+w.id,JSON.stringify(w));loadWorld(w)}
function renderInventory(){const g=$('inventoryGrid');g.innerHTML='';types.forEach((t,i)=>{const d=document.createElement('div');d.className='panel';d.style.textAlign='center';d.style.padding='12px 3px';d.innerHTML=icons[i]+'<br>'+t+'<br><b>'+inventory[t]+'</b>';g.append(d)})}function openInventory(){if(!active)return;active=false;$('hud').classList.remove('show');renderInventory();show('inventoryScreen');if(document.pointerLockElement)document.exitPointerLock()}$('closeInventory').onclick=()=>{show('');active=true;$('hud').classList.add('show');begin()};
function renderBar(){const h=$('hotbar');h.innerHTML='';types.forEach((t,i)=>{const s=document.createElement('div');s.className='slot'+(i===selected?' active':'');s.innerHTML='<small>'+(i+1)+'</small>'+icons[i]+'<b>'+inventory[t]+'</b>';s.onclick=()=>{selected=i;renderBar()};h.append(s)})}
function collides(px,py,pz){const r=.29,feet=py-1.62,head=py-.08;for(let x=Math.floor(px-r);x<=Math.floor(px+r);x++)for(let y=Math.floor(feet-.5)+1;y<=Math.floor(head+.5)-1;y++)for(let z=Math.floor(pz-r);z<=Math.floor(pz+r);z++){if(blockMap.has(x+','+y+','+z))return true}return false}function floorY(px,pz,feet){let top=terrain(Math.floor(px),Math.floor(pz))+.5;for(const m of blocks){const d=m.userData;if(d.x===Math.floor(px)&&d.z===Math.floor(pz)&&d.y+.5<=feet+.15)top=Math.max(top,d.y+.5)}return top}
function act(place){if(world.gameMode==='adventure'){toast('アドベンチャーではブロックを変更できません');return}ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(blocks,false)[0];if(!hit||hit.distance>6)return;const d=hit.object.userData,k=d.x+','+d.y+','+d.z;if(place){const n=hit.face.normal,x=d.x+Math.round(n.x),y=d.y+Math.round(n.y),z=d.z+Math.round(n.z),nk=x+','+y+','+z,t=types[selected];if(camera.position.distanceTo(new THREE.Vector3(x,y,z))<1.5||(world.gameMode==='survival'&&inventory[t]<=0)||collides(x+.5,y+1,z+.5))return;edits[nk]=t;const owner=Math.floor(x/16)*16+','+Math.floor(z/16)*16;block(x,y,z,t,owner);if(world.gameMode==='survival')inventory[t]--}else{edits[k]=null;removeMesh(hit.object);if(world.gameMode==='survival')inventory[d.type]=(inventory[d.type]||0)+1}renderBar()}
function init(){if(!window.THREE){toast('3Dエンジンの読み込みに失敗しました');return}renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,settings.quality==='low'?1:1.6));renderer.setSize(innerWidth,innerHeight);$('game').append(renderer.domElement);clock=new THREE.Clock();ray=new THREE.Raycaster();renderer.setClearColor(0x8acdf2);renderer.shadowMap.enabled=settings.quality==='high';}
init();
function begin(){if(!world)return;show('');$('hud').classList.add('show');if(!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()}
$('goWorlds').onclick=()=>{worlds();show('worlds')};$('goCreate').onclick=()=>show('create');$('worldCreate').onclick=()=>show('create');$('goSettings').onclick=()=>show('settings');document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));document.querySelectorAll('[data-worlds]').forEach(b=>b.onclick=()=>{worlds();show('worlds')});$('createWorld').onclick=createWorld;
$('saveSettings').onclick=()=>{settings={distance:+$('distance').value,sensitivity:+$('sensitivity').value,quality:$('quality').value,fov:+$('fov').value,brightness:+$('brightness').value,invertY:$('invertY').value==='true',autoJump:$('autoJump').value==='true',viewBobbing:$('viewBobbing').value==='true'};localStorage.setItem('bc_settings',JSON.stringify(settings));if(camera){camera.fov=settings.fov;camera.updateProjectionMatrix()}if(renderer){renderer.setPixelRatio(Math.min(devicePixelRatio,settings.quality==='low'?1:1.6));renderer.shadowMap.enabled=settings.quality==='high'}toast('設定を保存しました');if(active)show('pause');else show('home')};
function pause(){active=false;save();$('hud').classList.remove('show');show('pause');if(document.pointerLockElement)document.exitPointerLock()}
$('pauseBtn').onclick=pause;$('resume').onclick=()=>{active=true;$('hud').classList.add('show');lastChunk='';updateChunks();begin()};$('saveBtn').onclick=save;$('pauseSave').onclick=save;$('pauseSettings').onclick=()=>show('settings');$('toWorlds').onclick=()=>{active=false;$('hud').classList.remove('show');worlds();show('worlds')};
document.querySelectorAll('[data-m]').forEach(b=>{const k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();touch[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))});
$('mBreak').onpointerdown=()=>act(false);$('mPlace').onpointerdown=()=>act(true);$('mJump').onpointerdown=()=>{if(ground)velocity=8};
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);renderer.domElement.addEventListener('click',()=>{if(world&&!locked&&!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(!locked)return;const s=Number(settings.sensitivity)*.00055;yaw-=e.movementX*s;pitch-=e.movementY*s*(settings.invertY?-1:1);pitch=Math.max(-1.48,Math.min(1.48,pitch));camera.rotation.set(pitch,yaw,0,'YXZ')});
renderer.domElement.addEventListener('mousedown',e=>{if(!active)return;if(e.button===0)act(false);if(e.button===2)act(true)});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('wheel',e=>{if(!active)return;selected=(selected+(e.deltaY>0?1:-1)+types.length)%types.length;renderBar()},{passive:true});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&active){openInventory();return}if(e.code.startsWith('Digit')){const n=e.code==='Digit0'?9:Number(e.code.slice(5))-1;selected=Math.max(0,Math.min(9,n));renderBar()}if(e.code==='Escape'&&active)pause()});document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('touchstart',e=>{if(!active||e.touches.length!==1)return;lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(!lastTouch||e.touches.length!==1)return;const t=e.touches[0],s=Number(settings.sensitivity)*.0012;yaw-=(t.clientX-lastTouch.x)*s;pitch-=(t.clientY-lastTouch.y)*s*(settings.invertY?-1:1);pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.set(pitch,yaw,0,'YXZ');lastTouch={x:t.clientX,y:t.clientY}},{passive:true});renderer.domElement.addEventListener('touchend',()=>lastTouch=null);
let lastChunk='';function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(active&&camera){const f=(keys.KeyW||touch.f?1:0)-(keys.KeyS||touch.b?1:0),s=(keys.KeyD||touch.r?1:0)-(keys.KeyA||touch.l?1:0),dir=new THREE.Vector3(s,0,-f);if(dir.lengthSq()){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),camera.rotation.y);const speed=keys.ControlLeft||keys.ControlRight?8:keys.ShiftLeft||keys.ShiftRight?2.2:4.8,nx=camera.position.x+dir.x*speed*dt,nz=camera.position.z+dir.z*speed*dt;if(world.gameMode==='creative'||!collides(nx,camera.position.y,camera.position.z))camera.position.x=nx;if(world.gameMode==='creative'||!collides(camera.position.x,camera.position.y,nz))camera.position.z=nz}if(keys.Space&&ground){velocity=8;ground=false}velocity-=22*dt;const ny=camera.position.y+velocity*dt;if(!collides(camera.position.x,ny,camera.position.z)){camera.position.y=ny;ground=false}else{if(velocity<0)ground=true;velocity=0}const floor=floorY(camera.position.x,camera.position.z,camera.position.y-1.62);if(world.gameMode==='creative'){if(keys.Space)camera.position.y+=8*dt;if(keys.ShiftLeft||keys.ShiftRight)camera.position.y-=8*dt;velocity=0;ground=true}else if(velocity<=0&&camera.position.y-1.62<=floor+.06){camera.position.y=floor+1.62;velocity=0;ground=true}else if(velocity>0&&collides(camera.position.x,camera.position.y,camera.position.z)){velocity=0}if(clock.elapsedTime-lastMobUpdate>.12){lastMobUpdate=clock.elapsedTime;for(const m of mobs){const u=m.userData;if(!u)continue;u.moveTimer-=dt;if(u.moveTimer<=0){u.dir+=(Math.random()-.5)*2.4;u.moveTimer=1.5+Math.random()*3}const nx=m.position.x+Math.cos(u.dir)*dt*.7,nz=m.position.z+Math.sin(u.dir)*dt*.7;m.position.set(nx,terrain(Math.floor(nx),Math.floor(nz))+.65,nz);m.rotation.y=-u.dir;}}gameTime=(gameTime+dt*2.4)%1440;const daylight=Math.max(.12,Math.sin(gameTime/1440*Math.PI*2-Math.PI/2)*.5+.5);if(scene){scene.background.setHSL(.56,.48,.25+daylight*.42);scene.fog.color.copy(scene.background);scene.traverse(o=>{if(o.isDirectionalLight)o.intensity=daylight*2})}if(world.gameMode==='survival'){if(world.difficulty==='peaceful')health=Math.min(20,health+dt*.5);else hunger=Math.max(0,hunger-dt*.02);if(hunger<=0&&world.difficulty!=='peaceful')health=Math.max(1,health-dt*.08)}const ck=Math.floor(camera.position.x/16)+','+Math.floor(camera.position.z/16);if(ck!==lastChunk){lastChunk=ck;updateChunks()}if(Math.floor(clock.elapsedTime*3)%3===0)updateInfo()}if(scene&&camera)renderer.render(scene,camera)}
loop();addEventListener('resize',()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
