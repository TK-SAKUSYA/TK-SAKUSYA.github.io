function target(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects(blocks,false).find(h=>h.distance<6)||null}function spawnCows(){const white=new THREE.MeshLambertMaterial({color:0xf0eee5}),brown=new THREE.MeshLambertMaterial({color:0x68452e}),pink=new THREE.MeshLambertMaterial({color:0xe9a5a5});for(let i=0;i<5;i++){const x=Math.floor(camera.position.x)+(hash(i+331,77)-.5)*34,z=Math.floor(camera.position.z)+(hash(i+991,33)-.5)*34,g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.9,.55,1.25),white);body.position.y=.9;g.add(body);for(const [a,b] of [[-.27,-.38],[.27,-.38],[-.27,.38],[.27,.38]]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.55,.18),brown);leg.position.set(a,.42,b);g.add(leg)}const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.48,.48),white);head.position.set(0,1.05,.78);g.add(head);const muzzle=new THREE.Mesh(new THREE.BoxGeometry(.3,.2,.18),pink);muzzle.position.set(0,.94,1.08);g.add(muzzle);for(let j=0;j<3;j++){const patch=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.04),brown);patch.position.set(j===0?-.25:j===1?.25:0,1,j===2?-.15:.2);g.add(patch)}g.position.set(x,height(Math.floor(x),Math.floor(z))+.5,z);scene.add(g);const cow={group:g,hp:3,alive:true};cows.push(cow);g.children.forEach(m=>{m.userData.cow=cow;mobMeshes.push(m)})}}function hitCow(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const h=ray.intersectObjects(mobMeshes,false).find(v=>v.distance<4);if(!h)return false;const cow=h.object.userData.cow;if(!cow?.alive)return false;cow.hp--;if(cow.hp<=0){cow.alive=false;scene.remove(cow.group);mobMeshes=mobMeshes.filter(m=>m.userData.cow!==cow);inventory.beef=(inventory.beef||0)+2;inventory.leather=(inventory.leather||0)+1;toast('牛肉×2 🥩 革×1');hotbar()}else toast('モー！');return true}
function mineStep(){if(!active)return;if(hitCow())return;const h=target();if(!h){mineId=null;mineTime=0;return}const d=h.object.userData,k=d.x+','+d.y+','+d.z;if(k!==mineId){mineId=k;mineTime=0}mineTime+=.08;if(world.gameMode!=='survival'||mineTime>=.65){remove(h.object);edits[k]=null;if(world.gameMode==='survival'){inventory[d.type]=(inventory[d.type]||0)+1;hotbar()}mineId=null;mineTime=0}}

function place(){if(!active||world.gameMode==='adventure')return;const h=target();if(!h)return;const d=h.object.userData,n=h.face.normal,x=d.x+Math.round(n.x),y=d.y+Math.round(n.y),z=d.z+Math.round(n.z),k=x+','+y+','+z,t=types[selected];if(map.has(k)||camera.position.distanceTo(new THREE.Vector3(x,y,z))<1.5||(world.gameMode==='survival'&&!inventory[t]))return;const owner=Math.floor(x/16)*16+','+Math.floor(z/16)*16;add(x,y,z,t,owner);edits[k]=t;if(world.gameMode==='survival'){inventory[t]--;hotbar()}}
function inventoryOpen(){if(!active)return;active=false;stopMine();$('hud').classList.remove('show');const g=$('invGrid');g.innerHTML='';types.forEach((t,i)=>{const b=document.createElement('button');b.innerHTML=icons[i]+'<br>'+blockNames[i]+'<br>'+(inventory[t]||0);b.onclick=()=>{selected=i;hotbar()};g.append(b)});const drops=document.createElement('p');drops.textContent='🥩 牛肉 '+(inventory.beef||0)+'　👜 革 '+(inventory.leather||0);g.append(drops);const craft=document.createElement('button');craft.className='primary';craft.textContent='🛠️ クラフト';craft.onclick=craftMenu;g.append(craft);show('inventory')}
function craftMenu(){const g=$('invGrid');g.innerHTML='';const h=document.createElement('h3');h.textContent='クラフトレシピ';g.append(h);[{need:'wood',count:1,out:'planks',amount:4,label:'オークの原木 ×1 → オークの板材 ×4'},{need:'planks',count:4,out:'crafting',amount:1,label:'オークの板材 ×4 → 作業台 ×1'}].forEach(r=>{const b=document.createElement('button');b.textContent=r.label;b.disabled=(inventory[r.need]||0)<r.count;b.onclick=()=>{inventory[r.need]-=r.count;inventory[r.out]=(inventory[r.out]||0)+r.amount;hotbar();craftMenu()};g.append(b)});const back=document.createElement('button');back.textContent='戻る';back.onclick=inventoryOpen;g.append(back)}function inventoryClose(){active=true;$('hud').classList.add('show');show('');if(!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()}
function init(){renderer=new THREE.WebGLRenderer({antialias:settings.quality!=='low'});renderer.setPixelRatio(Math.min(devicePixelRatio,settings.quality==='low'?.65:settings.quality==='high'?1:0.8));renderer.setSize(innerWidth,innerHeight);$('game').append(renderer.domElement);clock=new THREE.Clock();ray=new THREE.Raycaster();renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault())}init();
$('play').onclick=()=>{listWorlds();show('select')};$('options').onclick=()=>show('settings');$('newFromList').onclick=()=>show('create');$('backTitle').onclick=()=>show('title');$('backSelect').onclick=()=>show('select');$('createStart').onclick=create;$('saveSettings').onclick=()=>{settings={distance:+$('distance').value,sensitivity:+$('sensitivity').value,quality:$('quality').value};localStorage.setItem('bc_settings',JSON.stringify(settings));renderer.setPixelRatio(Math.min(devicePixelRatio,settings.quality==='low'?.65:settings.quality==='high'?1:0.8));show(world?'pause':'title')};$('backSettings').onclick=()=>show(world?'pause':'title');$('pauseBtn').onclick=()=>{active=false;save();$('hud').classList.remove('show');show('pause')};$('resume').onclick=()=>{active=true;$('hud').classList.add('show');show('');if(!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()};$('saveExit').onclick=()=>{save();active=false;$('hud').classList.remove('show');show('title')};$('quit').onclick=()=>{save();active=false;$('hud').classList.remove('show');show('title')};$('pauseSettings').onclick=()=>show('settings');$('invBtn').onclick=inventoryOpen;$('closeInv').onclick=inventoryClose;
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);renderer.domElement.addEventListener('click',()=>{if(world&&!locked&&!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(!locked||!active)return;const s=settings.sensitivity*.00055;yaw-=e.movementX*s;pitch=Math.max(-1.48,Math.min(1.48,pitch-e.movementY*s));camera.rotation.set(pitch,yaw,0,'YXZ')});renderer.domElement.addEventListener('mousedown',e=>{if(!active)return;if(e.button===0)startMine();if(e.button===2)place()});document.addEventListener('mouseup',e=>{if(e.button===0)stopMine()});window.addEventListener('blur',stopMine);document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&active)inventoryOpen();if(e.code==='Escape'&&active){active=false;save();$('hud').classList.remove('show');show('pause')}if(e.code.startsWith('Digit')){selected=Math.max(0,Math.min(7,+e.code.slice(5)-1));hotbar()}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('wheel',e=>{if(active){selected=(selected+(e.deltaY>0?1:7))%8;hotbar()}},{passive:true});
document.querySelectorAll('[data-m]').forEach(b=>{const k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();touch[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>touch[k]=false))});$('break').onpointerdown=e=>{e.preventDefault();startMine()};$('break').onpointerup=stopMine;$('break').onpointerleave=stopMine;$('put').onpointerdown=place;$('jump').onpointerdown=()=>{if(ground)velocity=8};$('sneak').onpointerdown=()=>touch.sneak=true;$('sneak').onpointerup=()=>touch.sneak=false;let look=null;renderer.domElement.addEventListener('touchstart',e=>{if(active&&e.touches.length===1)look={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(!look||!active)return;const t=e.touches[0],s=settings.sensitivity*.0012;yaw-=(t.clientX-look.x)*s;pitch=Math.max(-1.45,Math.min(1.45,pitch-(t.clientY-look.y)*s));camera.rotation.set(pitch,yaw,0,'YXZ');look={x:t.clientX,y:t.clientY}},{passive:true});renderer.domElement.addEventListener('touchend',()=>look=null);
let infoTick=0;let renderAccum=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(active&&camera){const f=(keys.KeyW||touch.f?1:0)-(keys.KeyS||touch.b?1:0),s=(keys.KeyD||touch.r?1:0)-(keys.KeyA||touch.l?1:0),v=new THREE.Vector3(s,0,-f);if(v.lengthSq()){v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const speed=keys.ControlLeft?7:keys.ShiftLeft||touch.sneak?2.2:4.5;camera.position.x+=v.x*speed*dt;camera.position.z+=v.z*speed*dt}if(keys.Space&&ground){velocity=8;ground=false}velocity-=22*dt;camera.position.y+=velocity*dt;const fy=floorY();if(camera.position.y-1.62<fy){camera.position.y=fy+1.62;velocity=0;ground=true}else ground=false;if(world.gameMode==='creative'){if(keys.Space)camera.position.y+=8*dt;if(keys.ShiftLeft||touch.sneak)camera.position.y-=8*dt;velocity=0}gameTime=(gameTime+dt*2)%1440;const ck=Math.floor(camera.position.x/16)+','+Math.floor(camera.position.z/16);if(ck!==lastChunk){lastChunk=ck;updateChunks()}if(clock.elapsedTime-infoTick>1){infoTick=clock.elapsedTime;status()}for(const cow of cows){if(cow.alive&&Math.random()<dt*.12){cow.group.position.x+=Math.sin(clock.elapsedTime+cow.group.position.z)*dt*.3;cow.group.position.z+=Math.cos(clock.elapsedTime+cow.group.position.x)*dt*.3}}if(world.gameMode==='survival'){hunger=Math.max(0,hunger-dt*.01);if(world.difficulty==='peaceful')health=Math.min(20,health+dt*.2)}}renderAccum+=dt;if(scene&&camera&&renderAccum>=1/45){renderer.render(scene,camera);renderAccum=0}}loop();addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}renderer.setSize(innerWidth,innerHeight)});
})();
