/* Feature update */
#folderInput{display:none}
.import-progress{position:fixed;z-index:50;left:50%;top:84px;transform:translateX(-50%);width:min(520px,92vw);padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.import-progress progress{width:100%;height:9px;margin-top:8px;accent-color:var(--accent)}
.viewer-actions{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.viewer-zoom-controls{flex-wrap:wrap;min-height:45px}#slideshowControls button{border:1px solid #ffffff30}
.viewer-zoom-controls button{border:1px solid #ffffff30}
.feature-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.feature-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.feature-card:hover{border-color:var(--accent)}
.feature-cover{height:135px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.feature-cover img,.feature-cover video{width:100%;height:100%;object-fit:cover}
.feature-cover .symbol{font-size:38px}
.feature-copy{padding:14px 16px}
.feature-copy strong{display:block;font-size:16px}
.feature-copy small{display:block;color:var(--muted);margin-top:4px}
.collection-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.collection-tags button{padding:8px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.collection-tags button.selected{background:var(--accent-soft);border-color:var(--accent)}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.viewer-stage img{transform-origin:center center;transition:transform .08s linear}
.edit-controls{display:grid;gap:12px}
.edit-controls label{display:grid;gap:5px}
.edit-controls input[type=range]{width:100%}
.info-list{display:grid;grid-template-columns:minmax(120px, .7fr) minmax(0,1.3fr);gap:9px 14px}
.info-list dt{color:var(--muted)}.info-list dd{margin:0;overflow-wrap:anywhere}

<div class="modal-backdrop" id="viewerBackdrop"><section class="viewer" role="dialog" aria-modal="true" aria-label="メディアビューアー">
 <div class="viewer-top"><div class="filename" id="viewerName"></div><div class="viewer-actions"><button id="viewerShare" title="共有">↗</button><button id="viewerInfo" title="情報">ℹ</button><button id="viewerFav" title="お気に入り">♡</button><button id="viewerAlbum" title="アルバムに追加">▣</button><button id="viewerMore" title="その他のオプション">⋮</button><button id="viewerTrash" title="ゴミ箱へ">🗑</button><button id="viewerClose" title="閉じる">✕</button></div></div>
 <div class="viewer-stage" id="viewerStage"><button class="view-nav view-prev" id="viewerPrev" aria-label="前へ">‹</button><button class="view-nav view-next" id="viewerNext" aria-label="次へ">›</button></div>
 <div class="viewer-bottom" id="viewerMeta"></div>
 <div class="viewer-bottom viewer-zoom-controls"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="zoomFit">画面に合わせる</button><button id="viewerEdit">✏️ 編集</button></div><div id="slideshowControls" class="viewer-bottom hidden"><button data-action="slideshow-toggle">⏯ 一時停止／再生</button><button data-action="slideshow-end">終了</button></div>
</section></div>
</div>
<script>
(() => {
'use strict';
const DB_NAME='photo-local-db', DB_VERSION=2, STORE='media', META_STORE='appMeta';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let db, items=[], albums=[], settings={theme:'system',density:'comfortable',showVideoThumbs:true,sortMode:'newest'}, page='photos', activeAlbum=null, viewerId=null, viewerList=[], pendingPickerIds=[], sortMode='newest';
let collectionType=null, zoomLevel=1, slideshowTimer=null, slideshowPaused=false, slideshowMs=4000, editState=null, folderHandle=null, folderScanTimer=null, folderScanBusy=false, lockPassphrase=null, unlockedIds=new Set();
const main=$('#main');
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=d=>{if(!d)return'日付不明';let x=new Date(d);if(Number.isNaN(x.getTime()))return'日付不明';return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`};
const sortDate=x=>new Date(x.date||x.addedAt||0).getTime()||0;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(META_STORE))d.createObjectStore(META_STORE,{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function metaTx(mode='readonly'){return db.transaction(META_STORE,mode).objectStore(META_STORE)}
function getMeta(key){return new Promise((resolve,reject)=>{const r=metaTx().get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function putMeta(key,value){return new Promise((resolve,reject)=>{const r=metaTx('readwrite').put({key,value});r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function getAll(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putItem(x){return new Promise((resolve,reject)=>{const record=(x.locked && x._encryptedRecord)?x._encryptedRecord:x;const r=tx('readwrite').put(record);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function deleteItem(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function saveMeta(){try{settings.sortMode=sortMode;localStorage.setItem('photo-albums',JSON.stringify(albums));localStorage.setItem('photo-settings',JSON.stringify(settings));}catch(e){toast('設定の保存に失敗しました。ブラウザの保存領域を確認してください。')}}
function loadMeta(){try{albums=JSON.parse(localStorage.getItem('photo-albums')||'[]');settings={...settings,...JSON.parse(localStorage.getItem('photo-settings')||'{}')};sortMode=settings.sortMode||'newest';}catch(e){albums=[];}}
function effectiveTheme(){if(settings.theme==='system')return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';return settings.theme}
function applyTheme(){document.documentElement.dataset.theme=effectiveTheme();if($('#themeQuick'))$('#themeQuick').textContent=effectiveTheme()==='dark'?'☾':'☼';}
function toast(s){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),3200)}
function mediaUrl(x){if(!x)return'';if(!x._url)x._url=URL.createObjectURL(x.blob);return x._url}
function revokeUrls(){items.forEach(x=>{if(x._url){URL.revokeObjectURL(x._url);delete x._url}})}
function isVideo(x){return x.type?.startsWith('video/')||x.kind==='video'}
function inTrash(x){return !!x.trashedAt}
function isLocked(x){return !!x.locked}
function visibleItems(){return items.filter(x=>!inTrash(x)&&!x.archived&&!isLocked(x))}
function collectionHas(x,key){return Array.isArray(x.collections)&&x.collections.includes(key)}
function setCollection(x,key,on=true){x.collections=Array.isArray(x.collections)?x.collections:[];x.collections=on?[...new Set([...x.collections,key])]:x.collections.filter(k=>k!==key)}
function captureDate(x){return x.date||x.exifDate||null}
function isRecent(x){return Date.now()-new Date(x.addedAt||0).getTime()<30*86400000}
function collectionLabel(k){return ({albums:'アルバム',documents:'ドキュメント',screenshots:'スクリーンショットと録画',favorites:'お気に入り',people:'人物とペット',places:'場所',videos:'動画',recent:'最近',archive:'アーカイブ',locked:'ロックされたフォルダ',trash:'ゴミ箱'})[k]||k}
function activeItems(){let arr=visibleItems();const q=$('#searchInput').value.trim().toLowerCase();if(q){arr=arr.filter(x=>x.name.toLowerCase().includes(q)||albums.some(a=>a.name.toLowerCase().includes(q)&&a.ids.includes(x.id))||dateLabel(x.date).toLowerCase().includes(q));}return arr.sort((a,b)=>sortMode==='oldest'?sortDate(a)-sortDate(b):sortMode==='name'?a.name.localeCompare(b.name,'ja'):sortDate(b)-sortDate(a))}
function navTo(p){page=p;activeAlbum=null;render();window.scrollTo(0,0)}
function setActiveNav(){const active=page==='collection-detail'?'collections':page==='album-detail'?'albums':page;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===active))}
function heading(title,sub='',actions=''){return `<div class="heading"><div><h1>${title}</h1>${sub?`<div class="subtext">${sub}</div>`:''}</div><div class="toolbar">${actions}</div></div>`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="empty-art" aria-hidden="true"><span>${icon}</span><i></i><b></b></div><h2>${title}</h2><p>${desc}</p>${button}</div>`}
function thumb(x){if(isVideo(x)&&!settings.showVideoThumbs)return `<div class="placeholder">▶</div>`;if(isVideo(x))return `<video muted preload="metadata" src="${mediaUrl(x)}"></video>`;return `<img loading="lazy" src="${mediaUrl(x)}" alt="">`}
function card(x, removableAlbum=null){return `<article class="media-card" data-open="${esc(x.id)}" tabindex="0" role="button" aria-label="${esc(x.name)}">${thumb(x)}${isVideo(x)?'<span class="badge">▶ 動画</span>':''}<button class="fav ${x.favorite?'on':''}" data-fav="${esc(x.id)}" title="お気に入り" aria-label="お気に入り">${x.favorite?'♥':'♡'}</button><div class="card-name">${esc(x.name)}</div>${removableAlbum?`<button class="badge" style="top:auto;bottom:7px;left:7px;right:auto" data-remove-album="${esc(x.id)}" data-album="${esc(removableAlbum)}">アルバムから外す</button><button class="badge" style="top:7px;left:auto;right:7px" data-cover-album="${esc(x.id)}" data-album="${esc(removableAlbum)}">表紙に設定</button>`:''}</article>`}
function grid(arr){return `<div class="grid" style="--tile-size:${settings.density==='compact'?'112px':settings.density==='large'?'190px':'132px'};--mobile-cols:${settings.density==='large'?2:settings.density==='compact'?4:3}">${arr.map(x=>card(x)).join('')}</div>`}
function groupedGrid(arr){if(!arr.length)return empty('▧','写真はまだありません','写真や動画を追加すると、ここに日付ごとに並びます。','<button class="primary empty-add" data-action="add">＋ 写真・動画を追加</button><div class="empty-hint">JPG、PNG、GIF、MP4 などのファイルを選べます。</div>');const groups=new Map();arr.forEach(x=>{const k=dateLabel(x.date||x.addedAt);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});return [...groups.entries()].map(([d,xs])=>`<div class="section-date">${esc(d)} <small>${xs.length}件</small></div>${grid(xs)}`).join('')}
function render(){applyTheme();setActiveNav();const q=$('#searchInput').value.trim();if(q&&page!=='albums'&&page!=='settings'&&page!=='trash'){} 
 if(page==='photos'){const arr=activeItems();main.innerHTML=heading('写真',`${arr.length} 件の写真・動画`,`<label class="sort-label">並べ替え<select id="sortSetting" aria-label="並べ替え"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="name">名前順</option></select></label>`)+groupedGrid(arr);}
 else if(page==='favorites'){const arr=activeItems().filter(x=>x.favorite);main.innerHTML=heading('お気に入り',`${arr.length} 件`)+ (arr.length?grid(arr):empty('♡','お気に入りはまだありません','写真や動画の♡を押すと、ここに表示されます。'))}
 else if(page==='videos'){const arr=activeItems().filter(isVideo);main.innerHTML=heading('動画',`${arr.length} 件の動画`,`<button class="primary" data-action="add">＋ 動画を追加</button>`)+(arr.length?groupedGrid(arr):empty('▷','動画はまだありません','動画ファイルを追加すると、ここで再生できます。'))}
 else if(page==='trash'){const arr=items.filter(x=>inTrash(x)&&!isLocked(x)).sort((a,b)=>sortDate(b)-sortDate(a));main.innerHTML=heading('ゴミ箱',`${arr.length} 件。ゴミ箱内のファイルは通常の一覧に表示されません。`,arr.length?'<button class="smallbtn danger" data-action="empty-trash">ゴミ箱を空にする</button>':'')+(arr.length?`<div class="notice">ゴミ箱から復元するか、完全削除できます。完全削除したファイルは元に戻せません。</div><div class="grid">${arr.map(x=>`<article class="media-card" style="cursor:default">${thumb(x)}<div class="card-name" style="opacity:1">${esc(x.name)}</div><div style="position:absolute;inset:auto 5px 5px;display:flex;gap:4px"><button class="smallbtn" data-restore="${esc(x.id)}">復元</button><button class="smallbtn danger" data-purge="${esc(x.id)}">削除</button></div></article>`).join('')}</div>`:empty('♲','ゴミ箱は空です','削除した写真や動画はここに表示されます。'))}
 else if(page==='albums'){const qAlbum=$('#searchInput').value.trim().toLowerCase();const visibleAlbums=albums.filter(a=>!qAlbum||a.name.toLowerCase().includes(qAlbum));main.innerHTML=heading('アルバム',`${visibleAlbums.length} 個のアルバム`,'<button class="primary" data-action="new-album">＋ アルバムを作成</button>')+(visibleAlbums.length?`<div class="albums-grid">${visibleAlbums.map(a=>{const xs=a.ids.map(id=>items.find(x=>x.id===id)).filter(x=>x&&!inTrash(x)&&!x.archived&&!isLocked(x));const cover=items.find(x=>x.id===a.coverId&&!inTrash(x)&&!x.archived&&!isLocked(x))||xs[0];return `<article class="album-card" data-open-album="${esc(a.id)}" tabindex="0"><div class="album-cover">${cover?thumb(cover):'<span style="font-size:42px">▣</span>'}</div><div class="album-info"><div class="album-title">${esc(a.name)}</div><div class="album-count">${xs.length} 件</div><div class="album-actions"><button data-rename="${esc(a.id)}">名前を変更</button><button data-pick="${esc(a.id)}">写真を追加</button><button data-delete-album="${esc(a.id)}" class="danger">削除</button></div></div></article>`}).join('')}</div>`:empty('▣','アルバムを作成しよう','旅行、家族、思い出など、写真や動画をまとめられます。','<button class="primary" data-action="new-album">＋ アルバムを作成</button>'))}
 else if(page==='album-detail'){const a=albums.find(x=>x.id===activeAlbum);if(!a){navTo('albums');return}const arr=a.ids.map(id=>items.find(x=>x.id===id)).filter(x=>x&&!inTrash(x)&&!x.archived&&!isLocked(x)).sort((x,y)=>sortDate(y)-sortDate(x));main.innerHTML=heading(`▣ ${esc(a.name)}`,`${arr.length} 件`,`<button class="smallbtn" data-action="back-albums">← アルバム</button><button class="smallbtn" data-rename="${esc(a.id)}">名前を変更</button><button class="primary" data-pick="${esc(a.id)}">＋ 写真を追加</button>`)+(arr.length?`<div class="grid">${arr.map(x=>card(x,a.id)).join('')}</div>`:empty('▣','このアルバムは空です','写真を追加して整理しよう。','<button class="primary" data-pick="'+esc(a.id)+'">＋ 写真を追加</button>'))}
 else if(page==='settings'){main.innerHTML=heading('設定','表示とデータを管理します。')+`<div class="settings">
 <div class="notice">🔒 写真・動画はこのブラウザの端末内ストレージに保存します。クラウド同期はありません。ブラウザのデータ消去や端末故障に備えて、定期的にバックアップしてください。</div>
 <div class="setting-card"><h3>🎨 表示</h3><div class="setting-row"><label>テーマ<small>端末の設定に合わせることもできます</small></label><select id="themeSetting"><option value="system">端末の設定に合わせる</option><option value="light">ライトモード</option><option value="dark">ダークモード</option></select></div><div class="setting-row"><label>写真一覧の表示密度</label><select id="densitySetting"><option value="comfortable">標準</option><option value="compact">コンパクト</option><option value="large">大きめ</option></select></div><div class="setting-row"><label>並べ替え方法</label><select id="settingsSort"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="name">名前順</option></select></div><div class="setting-row"><label>動画サムネイル<small>一覧で動画のプレビューを表示</small></label><input id="videoThumbSetting" type="checkbox"></div></div>
 <div class="setting-card"><h3>📥 デバイス連携</h3><div class="setting-row"><label>フォルダ連携<small id="folderStatus">フォルダは未選択です。端末のフォルダを自動監視するには対応ブラウザで許可が必要です。</small></label><button class="smallbtn" data-action="choose-folder">フォルダを選択</button></div><div class="setting-row"><label>再スキャン<small>許可済みフォルダを再確認し、新しい写真・動画を取り込みます。</small></label><button class="smallbtn" data-action="rescan-folder">今すぐ再スキャン</button></div><div class="setting-row"><label>フォルダ連携を解除</label><button class="smallbtn" data-action="disconnect-folder">解除</button></div><div class="notice">フォルダ連携は File System Access API 対応ブラウザで利用できます。非対応環境では「＋ 写真・動画を追加」またはフォルダ選択の代替入力を利用してください。アクセス権限が失効した場合は再許可が必要です。</div></div>
 <div class="setting-card"><h3>💾 データ管理</h3><div class="setting-row"><label>使用容量の目安<small>ブラウザが報告する保存領域。概算値です。</small></label><strong id="storageInfo">計算中…</strong></div><div class="setting-row"><label>データを書き出す<small>写真・動画本体、アルバム、設定を含むJSONバックアップ。ロックされたフォルダの内容は除外されます。</small></label><button class="smallbtn" data-action="export">エクスポート</button></div><div class="setting-row"><label>バックアップを読み込む<small>既存データを上書きせず、追加として取り込みます</small></label><button class="smallbtn" data-action="import">インポート</button></div><div class="setting-row"><label>このブラウザのデータ<small>削除すると元に戻せません。先にバックアップしてください。</small></label><button class="smallbtn danger" data-action="reset">全データを削除</button></div></div>
 <div class="setting-card"><h3>ℹ️ このアプリについて</h3><p class="muted">フォトはHTML・CSS・JavaScriptで動作するローカル写真管理アプリです。画像内容のAI検索、クラウド同期、端末全体の写真への自動アクセスはありません。ファイル形式によってはブラウザでプレビューできない場合があります。</p></div></div>`;
 const sortSelect=$('#sortSetting');if(sortSelect)sortSelect.value=sortMode;$('#themeSetting').value=settings.theme;$('#densitySetting').value=settings.density;$('#videoThumbSetting').checked=settings.showVideoThumbs;const ss=$('#settingsSort');if(ss)ss.value=sortMode;const fs=$('#folderStatus');if(fs)fs.textContent=folderHandle?'フォルダ連携が設定されています。権限状態は再スキャンで確認できます。':'フォルダは未選択です。';refreshStorage();}
}

const baseRender=render;
function featureCard(title,subtitle,symbol,action,cover=null){
 const art=cover?`<div class="feature-cover">${thumb(cover)}</div>`:`<div class="feature-cover"><span class="symbol">${symbol}</span></div>`;
 return `<button class="feature-card" data-feature="${esc(action)}">${art}<div class="feature-copy"><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div></button>`;
}
function renderFeature(){
 applyTheme();setActiveNav();
 const all=visibleItems().sort((a,b)=>sortDate(b)-sortDate(a));
 if(page==='highlights'){
   const recent=all.slice(0,12), favs=all.filter(x=>x.favorite).slice(0,8), album=albums[0];
   const today=all.filter(x=>captureDate(x)&&new Date(captureDate(x)).toDateString()===new Date().toDateString());
   main.innerHTML=heading('ハイライト','最近追加した写真や、お気に入りをまとめて振り返れます。')+
   `<h2 class="section-date">最近追加した写真 <small>${recent.length}件</small></h2>${recent.length?grid(recent):empty('▧','写真はまだありません','写真・動画を追加すると、ここに表示されます。','<button class="primary" data-action="add">＋ 写真・動画を追加</button>')}`+
   `<h2 class="section-date">お気に入り <small>${favs.length}件</small></h2>${favs.length?grid(favs):'<p class="muted">お気に入りに登録した写真は、ここに表示されます。</p>'}`+
   `<div class="feature-cards">${featureCard('思い出','撮影日時が記録された写真を振り返る','🕰️','memories')}${featureCard('コレクション','分類した写真・動画を管理','📚','collections')}${album?featureCard('アルバム：'+album.name,`${album.ids.length}件のメディア`,'📁','album:'+album.id,items.find(x=>x.id===album.coverId)):featureCard('アルバム','写真をまとめて整理','📁','albums')}</div>`;
 } else if(page==='memories'){
   const now=new Date(), matches=all.filter(x=>{const d=captureDate(x);if(!d)return false;const date=new Date(d);return date.getMonth()===now.getMonth()&&date.getDate()===now.getDate()&&date.getFullYear()<now.getFullYear()});
   main.innerHTML=heading('思い出','撮影日時が記録されている写真から、過去の同じ日付を探します。',matches.length?'<button class="primary" data-action="slideshow">▶ スライドショー</button>':'')+
   (matches.length?`<div class="notice">${matches.length}件の写真・動画が、過去の今日と同じ月日で見つかりました。</div>${grid(matches)}`:empty('🕰️','今日はまだ思い出がありません','撮影日時が分かる写真があると、1年前・数年前の同じ日付を表示できます。取り込み日時を撮影日時として扱うことはありません。'))+
   `<h2 class="section-date">関連するアルバム</h2><div class="feature-cards">${albums.length?albums.slice(0,6).map(a=>featureCard(a.name,`${a.ids.length}件`,'📁','album:'+a.id,items.find(x=>x.id===a.coverId))).join(''):'<p class="muted">アルバムはまだありません。</p>'}</div>`;
 } else if(page==='collections'){
   const defs=[
    ['アルバム','albums','📁'],['ドキュメント','documents','📄'],['スクリーンショットと録画','screenshots','📸'],['お気に入り','favorites','❤️'],['人物とペット','people','👥'],['場所','places','📍'],['動画','videos','🎬'],['最近','recent','🕒'],['アーカイブ','archive','📦'],['ロックされたフォルダ','locked','🔒'],['ゴミ箱','trash','🗑️']
   ];
   main.innerHTML=heading('コレクション','写真や動画を種類・目的ごとに整理します。')+`<div class="feature-cards">${defs.map(([name,key,ico])=>featureCard(name,collectionCount(key)+'件',ico,'collection:'+key)).join('')}</div>`;
 } else if(page==='collection-detail'){
   const key=collectionType, title=collectionLabel(key);
   let arr=[];
   if(key==='albums'){navTo('albums');return}
   if(key==='favorites')arr=all.filter(x=>x.favorite);
   else if(key==='videos')arr=all.filter(isVideo);
   else if(key==='recent')arr=all.filter(isRecent);
   else if(key==='archive')arr=items.filter(x=>x.archived&&!inTrash(x)&&!isLocked(x)).sort((a,b)=>sortDate(b)-sortDate(a));
   else if(key==='trash')arr=items.filter(inTrash).sort((a,b)=>sortDate(b)-sortDate(a));
   else if(key==='locked')arr=items.filter(isLocked);
   else arr=all.filter(x=>collectionHas(x,key));
   const actions=key==='locked'?'<button class="primary" data-action="unlock-folder">🔓 ロックを解除</button> <button class="smallbtn" data-action="lock-info">保護について</button>':key==='archive'?'<button class="smallbtn" data-action="restore-archive-all">すべて元に戻す</button>':key==='trash'&&arr.length?'<button class="smallbtn danger" data-action="empty-trash">ゴミ箱を空にする</button>':'';
   main.innerHTML=heading(title,`${arr.length}件`,actions)+

async function handleFiles(files){
 if(!files?.length)return;
 const list=Array.from(files);let added=0,failed=0,dupes=0,unsupported=0;
 const prog=$('#importProgress'),bar=$('#importProgressBar'),txt=$('#importProgressText');
 prog.classList.remove('hidden');bar.value=0;bar.max=list.length;
 try{
  for(let i=0;i<list.length;i++){
   const f=list[i];txt.textContent=`取り込み中 ${i+1}/${list.length}：${f.name}`;
   if(!f.type.startsWith('image/')&&!f.type.startsWith('video/')){unsupported++;bar.value=i+1;continue}
   try{
    const exists=items.some(x=>!isLocked(x)&&x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified);
    if(exists){dupes++;bar.value=i+1;continue}
    const x={id:uid(),name:f.name,type:f.type,kind:f.type.startsWith('video/')?'video':'image',size:f.size,lastModified:f.lastModified,addedAt:new Date().toISOString(),date:null,favorite:false,trashedAt:null,archived:false,collections:[],location:'',blob:f};
    await putItem(x);items.push(x);added++;
   }catch(e){failed++;console.error('Failed to import file',f.name,e)}
   bar.value=i+1;
   if(i%12===0)await new Promise(r=>setTimeout(r,0));
  }
 }finally{setTimeout(()=>prog.classList.add('hidden'),900)}
 render();
 toast(`${added}件を追加${dupes?`・重複 ${dupes}件`:''}${unsupported?`・非対応 ${unsupported}件`:''}${failed?`・失敗 ${failed}件`:''}`);
 if(failed)toast('一部のファイルを保存できませんでした。保存容量・ブラウザの制限・ファイル形式を確認してください。');
}
async function chooseFolder(){
 if(!window.showDirectoryPicker){toast('このブラウザはフォルダ連携に非対応です。フォルダ選択の代替画面を開きます。');$('#folderInput').click();return}
 try{
  folderHandle=await window.showDirectoryPicker({mode:'read'});
  const perm=await folderHandle.requestPermission({mode:'read'});
  if(perm!=='granted'){folderHandle=null;toast('フォルダへのアクセスが許可されませんでした。');return}
  await putMeta('folderHandle',folderHandle);
  await scanFolder();startFolderPolling();toast('フォルダ連携を設定しました');
 }catch(e){if(e.name!=='AbortError')toast('フォルダを開けませんでした。権限やブラウザ対応を確認してください.')}
 if(page==='settings')render();
}
async function* walkDirectory(handle){
 for await(const [name,entry] of handle.entries()){
  if(entry.kind==='file'){const f=await entry.getFile();if(f.type.startsWith('image/')||f.type.startsWith('video/'))yield f}
  else if(entry.kind==='directory'){yield* walkDirectory(entry)}
 }
}
async function scanFolder(){
 if(!folderHandle||folderScanBusy)return;
 folderScanBusy=true;
 try{
  const perm=await folderHandle.queryPermission({mode:'read'});
  if(perm!=='granted'){toast('フォルダへのアクセス権限が失効しました。設定から再許可してください。');return}
  const found=[];for await(const f of walkDirectory(folderHandle)){const known=items.some(x=>!isLocked(x)&&x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified);if(!known)found.push(f)}
  if(found.length)await handleFiles(found);
  if(page==='settings')render();
 }catch(e){console.error(e);toast('フォルダを再スキャンできませんでした。権限を確認してください。')}
 finally{folderScanBusy=false}
}
function startFolderPolling(){if(folderScanTimer)clearInterval(folderScanTimer);folderScanTimer=setInterval(()=>{if(document.visibilityState==='visible')scanFolder()},60000)}
async function restoreFolderHandle(){
 try{folderHandle=await getMeta('folderHandle');if(folderHandle){const p=await folderHandle.queryPermission({mode:'read'});if(p==='granted'){startFolderPolling();scanFolder()}else if(page==='settings')render()}}
 catch(e){console.warn('Folder handle unavailable',e)}
}

async function saveEdit(){if(!editState)return;const x=editState.source,p=currentEditParams();try{const img=new Image();img.src=mediaUrl(x);await img.decode();const angle=p.rotation*Math.PI/180,sw=img.naturalWidth*(1-p.crop/50),sh=img.naturalHeight*(1-p.crop/50);const cw=Math.abs(sw*Math.cos(angle))+Math.abs(sh*Math.sin(angle)),ch=Math.abs(sw*Math.sin(angle))+Math.abs(sh*Math.cos(angle));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cw));c.height=Math.max(1,Math.round(ch));const ctx=c.getContext('2d');ctx.filter=`brightness(${p.brightness}%) saturate(${p.saturation}%)`;ctx.translate(c.width/2,c.height/2);ctx.rotate(angle);const sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,-sw/2,-sh/2,sw,sh);const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',.94));const y={...x,id:uid(),name:x.name.replace(/(\.[^.]+)?$/,'-編集.jpg'),type:'image/jpeg',kind:'image',size:blob.size,addedAt:new Date().toISOString(),blob,_url:null};delete y._encryptedRecord;await putItem(y);items.push(y);closeModal();editState=null;viewerList.push(y.id);viewerId=y.id;render();updateViewer();toast('編集結果を新しい画像として保存しました。元画像は残っています。')}catch(e){console.error(e);toast('編集結果を保存できませんでした')}}

function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(url){const [head,data]=url.split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'application/octet-stream';const bin=atob(data);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime})}

async function importData(file){if(!file)return;try{const pack=JSON.parse(await file.text());if(pack.format!=='photo-local-backup'||!Array.isArray(pack.media)||pack.version!==1)throw new Error('対応するフォトのバックアップではありません');if(!confirm(`${pack.media.length}件のメディアを追加します。既存データは上書きしません。続行しますか？`))return;let count=0,skip=0;for(const raw of pack.media){if(!raw.data||!raw.name) {skip++;continue}const duplicate=items.some(x=>x.name===raw.name&&x.size===raw.size&&x.lastModified===raw.lastModified);if(duplicate){skip++;continue}const x={...raw,id:uid(),blob:dataURLToBlob(raw.data),date:raw.date||null,archived:!!raw.archived,collections:raw.collections||[],location:raw.location||''};delete x.data;delete x._url;try{await putItem(x);items.push(x);count++}catch(e){skip++}}if(Array.isArray(pack.albums)){for(const a0 of pack.albums){const a={...a0,id:uid(),ids:(a0.ids||[]).map(old=>{const src=pack.media.find(m=>m.id===old);const found=src&&items.find(x=>x.name===src.name&&x.size===src.size);return found?.id}).filter(Boolean)};albums.push(a)}}if(pack.settings&&confirm('バックアップの表示設定も取り込みますか？'))settings={...settings,...pack.settings};saveMeta();render();toast(`インポート完了：${count}件追加、${skip}件スキップ`)}catch(e){console.error(e);alert('インポートできませんでした。ファイルが壊れているか、形式が違います。')}}

function bytesToBase64(buf){let binary='';const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary)}
function base64ToBytes(s){const b=atob(s);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveLockKey(pass,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function lockCurrent(){
 const x=items.find(x=>x.id===viewerId);if(!x||isLocked(x)){toast('このファイルはすでにロックされています');return}
 const pass=lockPassphrase||prompt('ロックされたフォルダのパスワードを設定してください。忘れると復元できません。');if(!pass)return;
 if(pass.length<8){toast('パスワードは8文字以上にしてください');return}
 lockPassphrase=pass;
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveLockKey(pass,salt);
  const payload={name:x.name,type:x.type,kind:x.kind,size:x.size,lastModified:x.lastModified,addedAt:x.addedAt,date:x.date,favorite:x.favorite,collections:x.collections||[],location:x.location||'',archived:!!x.archived,blobData:await blobToDataURL(x.blob)};
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));
  x.locked=true;x.lockSalt=bytesToBase64(salt);x.lockIv=bytesToBase64(iv);x.lockCipher=new Blob([encrypted],{type:'application/octet-stream'});x._encryptedRecord={id:x.id,locked:true,name:'ロックされたファイル',type:'application/x-photo-locked',kind:'locked',size:x.lockCipher.size,locked:true,lockSalt:x.lockSalt,lockIv:x.lockIv,lockCipher:x.lockCipher,trashedAt:null,addedAt:new Date().toISOString()};
  x.name='ロックされたファイル';x.type='application/x-photo-locked';x.kind='locked';x.size=x.lockCipher.size;x.blob=x.lockCipher;x.favorite=false;x.collections=[];x.location='';x.archived=false;x._url=null;
  await putItem(x);closeModal();closeViewer();render();toast('暗号化してロックされたフォルダへ移動しました');
 }catch(e){console.error(e);toast('暗号化に失敗しました。このブラウザの暗号化機能を確認してください')}
}
async function unlockFolder(){
 const locked=items.filter(isLocked);if(!locked.length){toast('ロックされたファイルはありません');return}
 const pass=lockPassphrase||prompt('ロックされたフォルダのパスワードを入力してください。');if(!pass)return;
 try{
  for(const x of locked){
   if(x._encryptedRecord)continue;
   const key=await deriveLockKey(pass,base64ToBytes(x.lockSalt));
   const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(x.lockIv)},key,await x.lockCipher.arrayBuffer());
   const payload=JSON.parse(new TextDecoder().decode(plain));const original={...x};
   Object.assign(x,payload,{blob:dataURLToBlob(payload.blobData),locked:true,_encryptedRecord:original});delete x.blobData;
   unlockedIds.add(x.id);
  }
  lockPassphrase=pass;collectionType='locked';page='collection-detail';render();toast('ロックされたフォルダを解除しました。このタブを閉じると再度ロックされます。');
 }catch(e){console.error(e);lockPassphrase=null;toast('パスワードが違うか、ロックデータを復号できませんでした。')}
}
async function reencryptLocked(x){if(!lockPassphrase)throw new Error('locked session is not unlocked');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveLockKey(lockPassphrase,salt);const payload={name:x.name,type:x.type,kind:x.kind,size:x.size,lastModified:x.lastModified,addedAt:x.addedAt,date:x.date,favorite:x.favorite,collections:x.collections||[],location:x.location||'',archived:!!x.archived,blobData:await blobToDataURL(x.blob)};const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));x.lockSalt=bytesToBase64(salt);x.lockIv=bytesToBase64(iv);x.lockCipher=new Blob([cipher],{type:'application/octet-stream'});x._encryptedRecord={id:x.id,locked:true,name:'ロックされたファイル',type:'application/x-photo-locked',kind:'locked',size:x.lockCipher.size,locked:true,lockSalt:x.lockSalt,lockIv:x.lockIv,lockCipher:x.lockCipher,trashedAt:null,addedAt:new Date().toISOString()};await putItem(x)}
async function restoreLocked(id){const x=items.find(x=>x.id===id);if(!x||!unlockedIds.has(id)||!x._encryptedRecord){toast('先にロックを解除してください');return}x.locked=false;delete x._encryptedRecord;delete x.lockSalt;delete x.lockIv;delete x.lockCipher;delete x.kindLocked;unlockedIds.delete(id);await putItem(x);render();toast('ライブラリに戻しました')}
function relockMemory(){for(const x of items.filter(isLocked)){if(x._encryptedRecord){const r=x._encryptedRecord;Object.keys(x).forEach(k=>{if(k!=='_encryptedRecord'&&k!=='_url')delete x[k]});Object.assign(x,r);delete x._encryptedRecord;if(x._url){URL.revokeObjectURL(x._url);delete x._url}}}unlockedIds.clear();lockPassphrase=null}

$('#main').addEventListener('change',e=>{if(e.target.id==='sortSetting'){sortMode=e.target.value;settings.sortMode=sortMode;saveMeta();render()}if(e.target.id==='settingsSort'){sortMode=e.target.value;settings.sortMode=sortMode;saveMeta();render()}if(e.target.id==='themeSetting'){settings.theme=e.target.value;saveMeta();applyTheme()}if(e.target.id==='densitySetting'){settings.density=e.target.value;saveMeta();render()}if(e.target.id==='videoThumbSetting'){settings.showVideoThumbs=e.target.checked;saveMeta();render()}});
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(settings.theme==='system')applyTheme()})}
async function init(){loadMeta();try{db=await openDB();items=await getAll();items.forEach(x=>{if(!x.kind)x.kind=x.type?.startsWith('video/')?'video':'image';if(!x.date)x.date=null;else if(x.addedAt&&Math.abs(new Date(x.date).getTime()-new Date(x.addedAt).getTime())<5000)x.date=null;if(!Array.isArray(x.collections))x.collections=[];if(typeof x.archived!=='boolean')x.archived=false;if(typeof x.location!=='string')x.location='';});render()}catch(e){console.error(e);main.innerHTML=empty('⚠️','保存領域を開けません','このブラウザではIndexedDBが利用できないか、プライベート設定などで制限されています。通常のブラウザ環境で開き直してください。');}}
window.addEventListener('pagehide',()=>{stopSlideshow();relockMemory()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){stopSlideshow();if($('#viewerBackdrop').classList.contains('open'))closeViewer();relockMemory();if(page==='collection-detail'&&collectionType==='locked')render()}});
init().then(()=>restoreFolderHandle());
})();
</script>
</body>
</html>
