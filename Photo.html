<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>フォト</title>
<style>
:root{color-scheme:light;--bg:#f7f8fc;--panel:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#5267df;--accent-soft:#e9edff;--tile:#eef0f5;--danger:#c62828;--shadow:0 8px 30px #16204412}
[data-theme="dark"]{color-scheme:dark;--bg:#15171b;--panel:#202329;--text:#f1f3f4;--muted:#a6abb5;--line:#373b44;--accent:#aab8ff;--accent-soft:#303858;--tile:#2a2e36;--danger:#ff8585;--shadow:0 8px 30px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.app{min-height:100vh}.topbar{height:76px;display:flex;align-items:center;gap:18px;padding:12px 24px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;min-width:205px;font-size:21px;font-weight:700}.brandmark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#8294ff,#b4c7ff);display:grid;place-items:center;color:#20274b;font-size:22px}.search{flex:1;max-width:760px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:0 17px;height:48px}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;min-width:0}.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.iconbtn,.smallbtn{border:1px solid var(--line);background:var(--panel);border-radius:22px;min-height:40px;padding:8px 13px}.iconbtn{width:42px;padding:0;font-size:18px}.primary{background:var(--accent);color:white;border-radius:24px;padding:11px 18px;font-weight:650}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 76px)}.sidebar{padding:24px 14px 20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.navbtn{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 16px;border-radius:24px;color:var(--muted)}.navbtn span:first-child{width:22px;text-align:center;font-size:19px}.navbtn.active{background:var(--accent-soft);color:var(--text);font-weight:650}.side-bottom{margin-top:auto;padding:12px 12px 0;color:var(--muted);font-size:12px}.main{padding:25px clamp(16px,3vw,42px) 90px;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}.heading h1{font-size:27px;font-weight:650;margin:0}.subtext{color:var(--muted);font-size:13px;margin-top:4px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select,.setting-row select,.setting-row input[type=range]{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:var(--text)}.section-date{font-weight:650;margin:27px 0 12px;display:flex;align-items:center;gap:10px}.section-date small{font-weight:400;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-size,165px),1fr));gap:5px}.media-card{position:relative;overflow:hidden;aspect-ratio:1/1;background:var(--tile);border-radius:9px;cursor:pointer;isolation:isolate}.media-card img,.media-card video,.media-card .placeholder{width:100%;height:100%;object-fit:cover;display:block}.media-card .placeholder{display:grid;place-items:center;font-size:42px;color:var(--muted)}.media-card:hover{outline:2px solid var(--accent);outline-offset:1px}.media-card .card-name{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;color:white;background:linear-gradient(transparent,#0009);font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;opacity:0;transition:opacity .15s}.media-card:hover .card-name{opacity:1}.badge{position:absolute;top:8px;right:8px;border-radius:8px;background:#0009;color:#fff;padding:4px 7px;font-size:12px}.fav{position:absolute;top:7px;left:7px;color:#fff;background:#0008;border-radius:50%;width:31px;height:31px;font-size:16px;display:grid;place-items:center}.fav.on{color:#ff6b8a}.empty{border:1px dashed var(--line);border-radius:22px;padding:50px 20px;text-align:center;color:var(--muted);max-width:700px;margin:50px auto}.empty .big{font-size:48px;margin-bottom:12px}.empty h2{color:var(--text);font-size:20px;margin:0 0 8px}.empty p{max-width:430px;margin:0 auto 18px}.albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.album-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}.album-cover{aspect-ratio:1.5;background:var(--tile);display:grid;place-items:center;overflow:hidden}.album-cover img{width:100%;height:100%;object-fit:cover}.album-info{padding:13px 15px}.album-title{font-weight:650}.album-count{color:var(--muted);font-size:13px}.album-actions{display:flex;gap:5px;margin-top:9px}.album-actions button{font-size:12px;border:1px solid var(--line);padding:5px 8px;border-radius:9px}.settings{max-width:760px}.setting-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:17px 19px}.setting-card h3{margin:0 0 13px;font-size:16px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 0;border-top:1px solid var(--line)}.setting-row:first-of-type{border-top:0}.setting-row small{display:block;color:var(--muted);margin-top:3px}.setting-row label{min-width:0}.muted{color:var(--muted)}.danger{color:var(--danger)}.notice{background:var(--accent-soft);padding:12px 14px;border-radius:12px;font-size:13px;margin:12px 0}.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.viewer{width:min(1200px,100%);height:min(92vh,900px);background:#101115;color:#fff;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative}.viewer-top,.viewer-bottom{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:58px}.viewer-top{justify-content:space-between}.viewer-top .filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer button{color:white;border-radius:20px;padding:8px 12px}.viewer button:hover{background:#ffffff20}.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;object-fit:contain}.view-nav{position:absolute;top:50%;transform:translateY(-50%);background:#0007!important;font-size:25px!important}.view-prev{left:12px}.view-next{right:12px}.viewer-bottom{justify-content:center;color:#ddd;font-size:13px}.dialog{width:min(480px,100%);background:var(--panel);color:var(--text);border-radius:20px;padding:23px;box-shadow:var(--shadow)}.dialog h2{margin:0 0 15px;font-size:21px}.dialog input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.album-picker-list{max-height:45vh;overflow:auto}.picker-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.picker-item input{width:18px;height:18px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#24262b;color:#fff;border-radius:25px;padding:12px 18px;z-index:40;box-shadow:var(--shadow);max-width:90vw}.mobile-nav{display:none}.hidden{display:none!important}#fileInput,#importInput{display:none}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.topbar{height:auto;min-height:66px;padding:10px 14px;gap:10px;flex-wrap:wrap}.brand{min-width:auto;font-size:19px}.brandmark{width:34px;height:34px}.search{order:3;flex-basis:100%;max-width:none;height:43px}.top-actions{gap:5px}.top-actions .primary{padding:9px 12px}.layout{display:block;min-height:calc(100vh - 116px)}.sidebar{display:none}.main{padding:20px 12px 100px}.heading h1{font-size:24px}.grid{grid-template-columns:repeat(var(--mobile-cols,3),minmax(0,1fr));gap:3px}.media-card{border-radius:4px}.media-card .card-name{display:none}.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.mobile-nav .navbtn{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:5px 3px;border-radius:14px;font-size:11px;min-width:0}.mobile-nav .navbtn span:first-child{font-size:19px}.mobile-nav .navbtn.active{background:var(--accent-soft)}.side-bottom{display:none}.toolbar{width:100%}.albums-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.album-info{padding:10px}.album-actions{flex-wrap:wrap}.setting-row{align-items:flex-start}.setting-row select{max-width:55%}.viewer{height:calc(100dvh - 20px);border-radius:10px}.viewer-top,.viewer-bottom{padding:8px}.view-nav{padding:7px!important}.empty{margin:30px auto;padding:35px 15px}}@media(max-width:390px){.top-actions .iconbtn{width:36px;min-height:36px}.top-actions .primary{font-size:13px;padding:8px 10px}.brand{font-size:17px}.grid{grid-template-columns:repeat(var(--mobile-cols,3),minmax(0,1fr))}.albums-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">✿</div><span>フォト</span></div>
  <label class="search" aria-label="検索"><span>🔍</span><input id="searchInput" type="search" placeholder="写真やアルバムを検索" autocomplete="off"><button id="clearSearch" class="hidden" aria-label="検索をクリア">✕</button></label>
  <div class="top-actions"><button class="iconbtn" id="themeQuick" title="テーマ切替">☼</button><button class="primary" id="addButton">＋ 追加</button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <button class="navbtn active" data-page="photos"><span>▦</span><span>写真</span></button>
  <button class="navbtn" data-page="albums"><span>▣</span><span>アルバム</span></button>
  <button class="navbtn" data-page="favorites"><span>♡</span><span>お気に入り</span></button>
  <button class="navbtn" data-page="videos"><span>▷</span><span>動画</span></button>
  <button class="navbtn" data-page="trash"><span>♲</span><span>ゴミ箱</span></button>
  <button class="navbtn" data-page="settings"><span>⚙</span><span>設定</span></button>
  <div class="side-bottom">写真はこのブラウザ内に保存されます。<br>クラウド同期はありません。</div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav" id="mobileNav">
  <button class="navbtn active" data-page="photos"><span>▦</span><span>写真</span></button>
  <button class="navbtn" data-page="albums"><span>▣</span><span>アルバム</span></button>
  <button class="navbtn" data-page="favorites"><span>♡</span><span>お気に入り</span></button>
  <button class="navbtn" data-page="videos"><span>▷</span><span>動画</span></button>
  <button class="navbtn" data-page="settings"><span>⚙</span><span>設定</span></button>
</nav>
<input id="fileInput" type="file" accept="image/*,video/*" multiple>
<input id="importInput" type="file" accept=".json,application/json">
<div class="modal-backdrop" id="modalBackdrop"><div class="dialog" id="dialog"></div></div>
<div class="modal-backdrop" id="viewerBackdrop"><section class="viewer" role="dialog" aria-modal="true" aria-label="メディアビューアー">
 <div class="viewer-top"><div class="filename" id="viewerName"></div><div style="display:flex;gap:4px"><button id="viewerFav" title="お気に入り">♡</button><button id="viewerAlbum" title="アルバムに追加">▣</button><button id="viewerTrash" title="ゴミ箱へ">🗑</button><button id="viewerClose" title="閉じる">✕</button></div></div>
 <div class="viewer-stage" id="viewerStage"><button class="view-nav view-prev" id="viewerPrev" aria-label="前へ">‹</button><button class="view-nav view-next" id="viewerNext" aria-label="次へ">›</button></div>
 <div class="viewer-bottom" id="viewerMeta"></div>
</section></div>
</div>
<script>
(() => {
'use strict';
const DB_NAME='photo-local-db', DB_VERSION=1, STORE='media';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let db, items=[], albums=[], settings={theme:'system',density:'comfortable',showVideoThumbs:true}, page='photos', activeAlbum=null, viewerId=null, viewerList=[], pendingPickerIds=[];
const main=$('#main');
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=d=>{if(!d)return'日付不明';let x=new Date(d);if(Number.isNaN(x.getTime()))return'日付不明';return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`};
const sortDate=x=>new Date(x.date||x.addedAt||0).getTime()||0;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putItem(x){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(x);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function deleteItem(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function saveMeta(){try{localStorage.setItem('photo-albums',JSON.stringify(albums));localStorage.setItem('photo-settings',JSON.stringify(settings));}catch(e){toast('設定の保存に失敗しました。ブラウザの保存領域を確認してください。')}}
function loadMeta(){try{albums=JSON.parse(localStorage.getItem('photo-albums')||'[]');settings={...settings,...JSON.parse(localStorage.getItem('photo-settings')||'{}')};}catch(e){albums=[];}}
function effectiveTheme(){if(settings.theme==='system')return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';return settings.theme}
function applyTheme(){document.documentElement.dataset.theme=effectiveTheme();$('#themeQuick').textContent=effectiveTheme()==='dark'?'☾':'☼';}
function toast(s){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),3200)}
function mediaUrl(x){if(!x)return'';if(!x._url)x._url=URL.createObjectURL(x.blob);return x._url}
function revokeUrls(){items.forEach(x=>{if(x._url){URL.revokeObjectURL(x._url);delete x._url}})}
function isVideo(x){return x.type?.startsWith('video/')||x.kind==='video'}
function inTrash(x){return !!x.trashedAt}
function activeItems(){let arr=items.filter(x=>!inTrash(x));const q=$('#searchInput').value.trim().toLowerCase();if(q){arr=arr.filter(x=>x.name.toLowerCase().includes(q)||albums.some(a=>a.name.toLowerCase().includes(q)&&a.ids.includes(x.id))||dateLabel(x.date).toLowerCase().includes(q));}return arr.sort((a,b)=>sortDate(b)-sortDate(a))}
function navTo(p){page=p;activeAlbum=null;render();window.scrollTo(0,0)}
function setActiveNav(){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function heading(title,sub='',actions=''){return `<div class="heading"><div><h1>${title}</h1>${sub?`<div class="subtext">${sub}</div>`:''}</div><div class="toolbar">${actions}</div></div>`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="big">${icon}</div><h2>${title}</h2><p>${desc}</p>${button}</div>`}
function thumb(x){if(isVideo(x)&&!settings.showVideoThumbs)return `<div class="placeholder">▶</div>`;if(isVideo(x))return `<video muted preload="metadata" src="${mediaUrl(x)}"></video>`;return `<img loading="lazy" src="${mediaUrl(x)}" alt="">`}
function card(x, removableAlbum=null){return `<article class="media-card" data-open="${esc(x.id)}" tabindex="0" role="button" aria-label="${esc(x.name)}">${thumb(x)}${isVideo(x)?'<span class="badge">▶ 動画</span>':''}<button class="fav ${x.favorite?'on':''}" data-fav="${esc(x.id)}" title="お気に入り" aria-label="お気に入り">${x.favorite?'♥':'♡'}</button><div class="card-name">${esc(x.name)}</div>${removableAlbum?`<button class="badge" style="top:auto;bottom:7px;left:7px;right:auto" data-remove-album="${esc(x.id)}" data-album="${esc(removableAlbum)}">アルバムから外す</button>`:''}</article>`}
function grid(arr){return `<div class="grid" style="--tile-size:${settings.density==='compact'?'125px':settings.density==='large'?'220px':'165px'};--mobile-cols:${settings.density==='large'?2:settings.density==='compact'?4:3}">${arr.map(x=>card(x)).join('')}</div>`}
function groupedGrid(arr){if(!arr.length)return empty('📸','写真はまだありません','「＋ 追加」から写真や動画を取り込もう。','<button class="primary" data-action="add">＋ 写真・動画を追加</button>');const groups=new Map();arr.forEach(x=>{const k=dateLabel(x.date||x.addedAt);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});return [...groups.entries()].map(([d,xs])=>`<div class="section-date">${esc(d)} <small>${xs.length}件</small></div>${grid(xs)}`).join('')}
function render(){applyTheme();setActiveNav();const q=$('#searchInput').value.trim();if(q&&page!=='albums'&&page!=='settings'&&page!=='trash'){} 
 if(page==='photos'){const arr=activeItems();main.innerHTML=heading('写真',`${arr.length} 件の写真・動画`,`<button class="smallbtn" data-action="sort">日付順 ↓</button><button class="primary" data-action="add">＋ 追加</button>`)+groupedGrid(arr);}
 else if(page==='favorites'){const arr=activeItems().filter(x=>x.favorite);main.innerHTML=heading('お気に入り',`${arr.length} 件`)+ (arr.length?grid(arr):empty('♡','お気に入りはまだありません','写真や動画の♡を押すと、ここに表示されます。'))}
 else if(page==='videos'){const arr=activeItems().filter(isVideo);main.innerHTML=heading('動画',`${arr.length} 件の動画`,`<button class="primary" data-action="add">＋ 動画を追加</button>`)+(arr.length?groupedGrid(arr):empty('▷','動画はまだありません','動画ファイルを追加すると、ここで再生できます。'))}
 else if(page==='trash'){const arr=items.filter(inTrash).sort((a,b)=>sortDate(b)-sortDate(a));main.innerHTML=heading('ゴミ箱',`${arr.length} 件。ゴミ箱内のファイルは通常の一覧に表示されません。`,arr.length?'<button class="smallbtn danger" data-action="empty-trash">ゴミ箱を空にする</button>':'')+(arr.length?`<div class="notice">ゴミ箱から復元するか、完全削除できます。完全削除したファイルは元に戻せません。</div><div class="grid">${arr.map(x=>`<article class="media-card" style="cursor:default">${thumb(x)}<div class="card-name" style="opacity:1">${esc(x.name)}</div><div style="position:absolute;inset:auto 5px 5px;display:flex;gap:4px"><button class="smallbtn" data-restore="${esc(x.id)}">復元</button><button class="smallbtn danger" data-purge="${esc(x.id)}">削除</button></div></article>`).join('')}</div>`:empty('♲','ゴミ箱は空です','削除した写真や動画はここに表示されます。'))}
 else if(page==='albums'){main.innerHTML=heading('アルバム',`${albums.length} 個のアルバム`,'<button class="primary" data-action="new-album">＋ アルバムを作成</button>')+(albums.length?`<div class="albums-grid">${albums.map(a=>{const xs=a.ids.map(id=>items.find(x=>x.id===id)).filter(x=>x&&!inTrash(x));const cover=items.find(x=>x.id===a.coverId&&!inTrash(x))||xs[0];return `<article class="album-card" data-open-album="${esc(a.id)}" tabindex="0"><div class="album-cover">${cover?thumb(cover):'<span style="font-size:42px">▣</span>'}</div><div class="album-info"><div class="album-title">${esc(a.name)}</div><div class="album-count">${xs.length} 件</div><div class="album-actions"><button data-rename="${esc(a.id)}">名前を変更</button><button data-pick="${esc(a.id)}">写真を追加</button><button data-delete-album="${esc(a.id)}" class="danger">削除</button></div></div></article>`}).join('')}</div>`:empty('▣','アルバムを作成しよう','旅行、家族、思い出など、写真や動画をまとめられます。','<button class="primary" data-action="new-album">＋ アルバムを作成</button>'))}
 else if(page==='album-detail'){const a=albums.find(x=>x.id===activeAlbum);if(!a){navTo('albums');return}const arr=a.ids.map(id=>items.find(x=>x.id===id)).filter(x=>x&&!inTrash(x)).sort((x,y)=>sortDate(y)-sortDate(x));main.innerHTML=heading(`▣ ${esc(a.name)}`,`${arr.length} 件`,`<button class="smallbtn" data-action="back-albums">← アルバム</button><button class="smallbtn" data-rename="${esc(a.id)}">名前を変更</button><button class="primary" data-pick="${esc(a.id)}">＋ 写真を追加</button>`)+(arr.length?`<div class="grid">${arr.map(x=>card(x,a.id)).join('')}</div>`:empty('▣','このアルバムは空です','写真を追加して整理しよう。','<button class="primary" data-pick="'+esc(a.id)+'">＋ 写真を追加</button>'))}
 else if(page==='settings'){main.innerHTML=heading('設定','表示とデータを管理します。')+`<div class="settings">
 <div class="notice">🔒 写真・動画はこのブラウザの端末内ストレージに保存します。クラウド同期はありません。ブラウザのデータ消去や端末故障に備えて、定期的にバックアップしてください。</div>
 <div class="setting-card"><h3>🎨 表示</h3><div class="setting-row"><label>テーマ<small>端末の設定に合わせることもできます</small></label><select id="themeSetting"><option value="system">端末の設定に合わせる</option><option value="light">ライトモード</option><option value="dark">ダークモード</option></select></div><div class="setting-row"><label>写真一覧の表示密度</label><select id="densitySetting"><option value="comfortable">標準</option><option value="compact">コンパクト</option><option value="large">大きめ</option></select></div><div class="setting-row"><label>動画サムネイル<small>一覧で動画のプレビューを表示</small></label><input id="videoThumbSetting" type="checkbox"></div></div>
 <div class="setting-card"><h3>💾 データ管理</h3><div class="setting-row"><label>使用容量の目安<small>ブラウザが報告する保存領域。概算値です。</small></label><strong id="storageInfo">計算中…</strong></div><div class="setting-row"><label>データを書き出す<small>写真・動画本体、アルバム、設定を含むJSONバックアップ</small></label><button class="smallbtn" data-action="export">エクスポート</button></div><div class="setting-row"><label>バックアップを読み込む<small>既存データを上書きせず、追加として取り込みます</small></label><button class="smallbtn" data-action="import">インポート</button></div><div class="setting-row"><label>このブラウザのデータ<small>削除すると元に戻せません。先にバックアップしてください。</small></label><button class="smallbtn danger" data-action="reset">全データを削除</button></div></div>
 <div class="setting-card"><h3>ℹ️ このアプリについて</h3><p class="muted">フォトはHTML・CSS・JavaScriptで動作するローカル写真管理アプリです。画像内容のAI検索、クラウド同期、端末全体の写真への自動アクセスはありません。ファイル形式によってはブラウザでプレビューできない場合があります。</p></div></div>`;
 $('#themeSetting').value=settings.theme;$('#densitySetting').value=settings.density;$('#videoThumbSetting').checked=settings.showVideoThumbs;refreshStorage();}
}
function openModal(html){$('#dialog').innerHTML=html;$('#modalBackdrop').classList.add('open');}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function createAlbum(){openModal(`<h2>新しいアルバム</h2><input id="albumNameInput" type="text" maxlength="80" placeholder="アルバム名"><div class="dialog-actions"><button class="smallbtn" data-action="cancel-modal">キャンセル</button><button class="primary" data-action="create-album-confirm">作成</button></div>`);$('#albumNameInput').focus()}
function renameAlbum(id){const a=albums.find(x=>x.id===id);if(!a)return;openModal(`<h2>アルバム名を変更</h2><input id="albumNameInput" type="text" maxlength="80" value="${esc(a.name)}"><div class="dialog-actions"><button class="smallbtn" data-action="cancel-modal">キャンセル</button><button class="primary" data-action="rename-confirm" data-id="${esc(id)}">保存</button></div>`);$('#albumNameInput').focus()}
function pickAlbum(id){const a=albums.find(x=>x.id===id);if(!a)return;const candidates=items.filter(x=>!inTrash(x));openModal(`<h2>アルバムに追加</h2><p class="muted">「${esc(a.name)}」に追加する写真・動画を選択してください。</p><div class="album-picker-list">${candidates.length?candidates.map(x=>`<label class="picker-item"><input type="checkbox" value="${esc(x.id)}" ${a.ids.includes(x.id)?'checked':''}><span>${isVideo(x)?'🎬':'🖼️'} ${esc(x.name)}</span></label>`).join(''):'<p>追加できる写真・動画がありません。</p>'}</div><div class="dialog-actions"><button class="smallbtn" data-action="cancel-modal">キャンセル</button><button class="primary" data-action="pick-confirm" data-id="${esc(id)}">保存</button></div>`)}
async function handleFiles(files){if(!files?.length)return;let added=0,failed=0,dupes=0;for(const f of files){if(!f.type.startsWith('image/')&&!f.type.startsWith('video/')){failed++;continue}try{const exists=items.some(x=>!inTrash(x)&&x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified);if(exists){dupes++;continue}const x={id:uid(),name:f.name,type:f.type,kind:f.type.startsWith('video/')?'video':'image',size:f.size,lastModified:f.lastModified,addedAt:new Date().toISOString(),date:new Date().toISOString(),favorite:false,trashedAt:null,blob:f};await putItem(x);items.push(x);added++}catch(e){failed++;console.error(e)}}render();toast(`${added}件を追加しました${dupes?`・重複 ${dupes}件をスキップ`:''}${failed?`・失敗 ${failed}件`:''}`);if(failed)toast('一部のファイルを保存できませんでした。保存容量や対応形式を確認してください。')}
async function toggleFavorite(id){const x=items.find(x=>x.id===id);if(!x)return;x.favorite=!x.favorite;await putItem(x);render();if(viewerId===id)updateViewer()}
async function trashItem(id){const x=items.find(x=>x.id===id);if(!x)return;x.trashedAt=new Date().toISOString();await putItem(x);if(viewerId===id)closeViewer();render();toast('ゴミ箱に移動しました')}
async function restoreItem(id){const x=items.find(x=>x.id===id);if(!x)return;x.trashedAt=null;await putItem(x);render();toast('元に戻しました')}
async function purgeItem(id){const x=items.find(x=>x.id===id);if(!x)return;if(!confirm(`「${x.name}」を完全に削除します。この操作は取り消せません。`))return;await deleteItem(id);items=items.filter(y=>y.id!==id);albums.forEach(a=>{a.ids=a.ids.filter(z=>z!==id);if(a.coverId===id)a.coverId=a.ids[0]||null});saveMeta();render();toast('完全に削除しました')}
async function emptyTrash(){const arr=items.filter(inTrash);if(!arr.length)return;if(!confirm(`ゴミ箱内の${arr.length}件を完全に削除します。この操作は取り消せません。`))return;for(const x of arr)await deleteItem(x.id);items=items.filter(x=>!inTrash(x));albums.forEach(a=>{a.ids=a.ids.filter(id=>items.some(x=>x.id===id));if(a.coverId&&!items.some(x=>x.id===a.coverId))a.coverId=a.ids[0]||null});saveMeta();render();toast('ゴミ箱を空にしました')}
function openViewer(id,list){viewerList=list||activeItems().map(x=>x.id);viewerId=id;updateViewer();$('#viewerBackdrop').classList.add('open');document.body.style.overflow='hidden'}
function updateViewer(){const x=items.find(x=>x.id===viewerId);if(!x)return;$('#viewerName').textContent=x.name;$('#viewerFav').textContent=x.favorite?'♥':'♡';$('#viewerFav').style.color=x.favorite?'#ff7394':'white';const stage=$('#viewerStage');stage.querySelectorAll('img,video').forEach(el=>el.remove());let el;if(isVideo(x)){el=document.createElement('video');el.controls=true;el.playsInline=true;el.preload='metadata';el.src=mediaUrl(x)}else{el=document.createElement('img');el.alt=x.name;el.src=mediaUrl(x)}stage.insertBefore(el,$('#viewerPrev'));$('#viewerMeta').textContent=`${dateLabel(x.date||x.addedAt)} ・ ${formatSize(x.size)} ・ ${Math.max(0,viewerList.indexOf(x.id)+1)} / ${viewerList.length}`;$('#viewerPrev').disabled=viewerList.indexOf(x.id)<=0;$('#viewerNext').disabled=viewerList.indexOf(x.id)>=viewerList.length-1}
function closeViewer(){$('#viewerBackdrop').classList.remove('open');document.body.style.overflow='';$('#viewerStage').querySelectorAll('img,video').forEach(el=>{if(el.tagName==='VIDEO')el.pause();el.remove()});viewerId=null}
function moveViewer(dir){const i=viewerList.indexOf(viewerId),n=i+dir;if(n<0||n>=viewerList.length)return;viewerId=viewerList[n];updateViewer()}
function formatSize(n){if(!Number.isFinite(n))return'不明';if(n<1024)return n+' B';if(n<1024**2)return(n/1024).toFixed(1)+' KB';if(n<1024**3)return(n/1024**2).toFixed(1)+' MB';return(n/1024**3).toFixed(2)+' GB'}
async function refreshStorage(){try{const est=await navigator.storage?.estimate?.();const el=$('#storageInfo');if(el)el.textContent=est?`${formatSize(est.usage||0)} / ${formatSize(est.quota||0)}`:'取得できません';}catch(e){const el=$('#storageInfo');if(el)el.textContent='取得できません'}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(url){const [head,data]=url.split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'application/octet-stream';const bin=atob(data);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime})}
async function exportData(){try{toast('バックアップを準備中…');const media=[];for(const x of items){media.push({id:x.id,name:x.name,type:x.type,kind:x.kind,size:x.size,lastModified:x.lastModified,addedAt:x.addedAt,date:x.date,favorite:x.favorite,trashedAt:x.trashedAt,data:await blobToDataURL(x.blob)})}const pack={format:'photo-local-backup',version:1,exportedAt:new Date().toISOString(),albums,settings,media};const blob=new Blob([JSON.stringify(pack)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Photo-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを書き出しました')}catch(e){console.error(e);alert('エクスポートに失敗しました。容量が大きすぎる可能性があります。')}}
async function importData(file){if(!file)return;try{const pack=JSON.parse(await file.text());if(pack.format!=='photo-local-backup'||!Array.isArray(pack.media)||pack.version!==1)throw new Error('対応するフォトのバックアップではありません');if(!confirm(`${pack.media.length}件のメディアを追加します。既存データは上書きしません。続行しますか？`))return;let count=0,skip=0;for(const raw of pack.media){if(!raw.data||!raw.name) {skip++;continue}const duplicate=items.some(x=>x.name===raw.name&&x.size===raw.size&&x.lastModified===raw.lastModified);if(duplicate){skip++;continue}const x={...raw,id:uid(),blob:dataURLToBlob(raw.data)};delete x.data;delete x._url;try{await putItem(x);items.push(x);count++}catch(e){skip++}}if(Array.isArray(pack.albums)){for(const a0 of pack.albums){const a={...a0,id:uid(),ids:(a0.ids||[]).map(old=>{const src=pack.media.find(m=>m.id===old);const found=src&&items.find(x=>x.name===src.name&&x.size===src.size);return found?.id}).filter(Boolean)};albums.push(a)}}if(pack.settings&&confirm('バックアップの表示設定も取り込みますか？'))settings={...settings,...pack.settings};saveMeta();render();toast(`インポート完了：${count}件追加、${skip}件スキップ`)}catch(e){console.error(e);alert('インポートできませんでした。ファイルが壊れているか、形式が違います。')}}
function resetAll(){if(!confirm('写真・動画・アルバム・設定をこのブラウザからすべて削除します。バックアップはありますか？'))return;if(!confirm('本当にすべて削除しますか？この操作は取り消せません。'))return;const r=indexedDB.deleteDatabase(DB_NAME);r.onsuccess=()=>{revokeUrls();items=[];albums=[];settings={theme:'system',density:'comfortable',showVideoThumbs:true};saveMeta();location.reload()};r.onerror=()=>alert('データベースを削除できませんでした。')}
$('#addButton').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});
$('#searchInput').addEventListener('input',()=>{$('#clearSearch').classList.toggle('hidden',!$('#searchInput').value);render()});$('#clearSearch').addEventListener('click',()=>{$('#searchInput').value='';$('#clearSearch').classList.add('hidden');render()});
$('#themeQuick').addEventListener('click',()=>{settings.theme=effectiveTheme()==='dark'?'light':'dark';saveMeta();applyTheme();if(page==='settings')render()});
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){navTo(nav.dataset.page);return}
const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();await toggleFavorite(fav.dataset.fav);return}
const open=e.target.closest('[data-open]');if(open){openViewer(open.dataset.open,activeItems().map(x=>x.id));return}
const alb=e.target.closest('[data-open-album]');if(alb){activeAlbum=alb.dataset.openAlbum;page='album-detail';render();return}
const rem=e.target.closest('[data-remove-album]');if(rem){e.stopPropagation();const a=albums.find(a=>a.id===rem.dataset.album);if(a){a.ids=a.ids.filter(id=>id!==rem.dataset.removeAlbum);if(a.coverId===rem.dataset.removeAlbum)a.coverId=a.ids[0]||null;saveMeta();render();toast('アルバムから取り除きました（元の写真は残っています）')}return}
const restore=e.target.closest('[data-restore]');if(restore){await restoreItem(restore.dataset.restore);return}
const purge=e.target.closest('[data-purge]');if(purge){await purgeItem(purge.dataset.purge);return}
const rename=e.target.closest('[data-rename]');if(rename){renameAlbum(rename.dataset.rename);return}
const pick=e.target.closest('[data-pick]');if(pick){pickAlbum(pick.dataset.pick);return}
const delAlb=e.target.closest('[data-delete-album]');if(delAlb){if(confirm('このアルバムを削除しますか？写真・動画そのものは削除されません。')){albums=albums.filter(a=>a.id!==delAlb.dataset.deleteAlbum);saveMeta();render();toast('アルバムを削除しました')}return}
const act=e.target.closest('[data-action]');if(!act)return;const action=act.dataset.action;
if(action==='add')$('#fileInput').click();
if(action==='new-album')createAlbum();
if(action==='cancel-modal')closeModal();
if(action==='create-album-confirm'){const name=$('#albumNameInput').value.trim();if(!name){toast('アルバム名を入力してください');return}albums.push({id:uid(),name,ids:[],coverId:null,createdAt:new Date().toISOString()});saveMeta();closeModal();render();toast('アルバムを作成しました')}
if(action==='rename-confirm'){const name=$('#albumNameInput').value.trim(),a=albums.find(a=>a.id===act.dataset.id);if(!name){toast('アルバム名を入力してください');return}if(a){a.name=name;saveMeta();closeModal();render();toast('名前を変更しました')}}
if(action==='pick-confirm'){const a=albums.find(a=>a.id===act.dataset.id);if(a){const chosen=$$('.album-picker-list input:checked').map(i=>i.value);a.ids=[...new Set(chosen)];if(!a.coverId||!a.ids.includes(a.coverId))a.coverId=a.ids[0]||null;saveMeta();closeModal();render();toast('アルバムを更新しました')}}
if(action==='empty-trash')await emptyTrash();
if(action==='back-albums')navTo('albums');
if(action==='export')await exportData();
if(action==='import')$('#importInput').click();
if(action==='reset')resetAll();
if(action==='sort'){items.sort((a,b)=>sortDate(b)-sortDate(a));render()}
});
$('#importInput').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
$('#viewerClose').addEventListener('click',closeViewer);$('#viewerPrev').addEventListener('click',()=>moveViewer(-1));$('#viewerNext').addEventListener('click',()=>moveViewer(1));
$('#viewerFav').addEventListener('click',()=>viewerId&&toggleFavorite(viewerId));$('#viewerTrash').addEventListener('click',()=>viewerId&&trashItem(viewerId));$('#viewerAlbum').addEventListener('click',()=>{if(!albums.length){toast('先にアルバムを作成してください');return}openModal(`<h2>アルバムを選択</h2><div class="album-picker-list">${albums.map(a=>`<label class="picker-item"><input type="checkbox" value="${esc(a.id)}"><span>${esc(a.name)}</span></label>`).join('')}</div><div class="dialog-actions"><button class="smallbtn" data-action="cancel-modal">キャンセル</button><button class="primary" data-action="viewer-album-confirm">追加</button></div>`);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="viewer-album-confirm"]');if(!b)return;const ids=$$('.album-picker-list input:checked').map(i=>i.value);for(const id of ids){const a=albums.find(a=>a.id===id);if(a&&viewerId&&!a.ids.includes(viewerId)){a.ids.push(viewerId);if(!a.coverId)a.coverId=viewerId}}saveMeta();closeModal();toast('アルバムに追加しました')});
document.addEventListener('keydown',e=>{if($('#viewerBackdrop').classList.contains('open')){if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')moveViewer(-1);if(e.key==='ArrowRight')moveViewer(1)}else if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('.media-card'))e.target.click()});
$('#main').addEventListener('change',e=>{if(e.target.id==='themeSetting'){settings.theme=e.target.value;saveMeta();applyTheme()}if(e.target.id==='densitySetting'){settings.density=e.target.value;saveMeta();render()}if(e.target.id==='videoThumbSetting'){settings.showVideoThumbs=e.target.checked;saveMeta();render()}});
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(settings.theme==='system')applyTheme()})}
async function init(){loadMeta();try{db=await openDB();items=await getAll();items.forEach(x=>{if(!x.kind)x.kind=x.type?.startsWith('video/')?'video':'image';if(!x.date)x.date=x.addedAt||null});render()}catch(e){console.error(e);main.innerHTML=empty('⚠️','保存領域を開けません','このブラウザではIndexedDBが利用できないか、プライベート設定などで制限されています。通常のブラウザ環境で開き直してください。');}}
init();
