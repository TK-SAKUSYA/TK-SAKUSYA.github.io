function rand(a,b){return a+Math.random()*(b-a)}function ri(a,b){return Math.floor(rand(a,b+1))}
function newStage(){checkAchievements();stageStartedAt=Date.now();pausedDurationMs=0;pauseStartedAt=0;bossGateNotified=false;stageNoDamage=true;stageCoins=0;platforms=[];hazards=[];enemies=[];pickups=[];particles=[];boss=null;camera=0;clearLock=false;worldW=stage%10===0?2300:ri(2500,3100);finishX=worldW-100;
// Continuous safe floor; all generated geometry stays inside world bounds.

let x=350,lastY=470;while(stage%10!==0&&x<worldW-430){let gap=ri(55,100),w=ri(100,210),px=Math.min(worldW-460,x+gap);let y=Math.max(320,Math.min(475,lastY+ri(-75,65)));if(px+w>worldW-390)w=Math.max(80,worldW-410-px);platforms.push({x:px,y,w,h:20,kind:Math.random()<.18?'moving':Math.random()<.18?'crumble':'normal',baseX:px,phase:rand(0,6)});
// Spike clusters are deliberately placed only on long, walkable ground segments.
if(Math.random()<.22&&px>430&&px<worldW-470&&gap>65){const sx=Math.max(360,Math.min(worldW-470,px-ri(35,55)));hazards.push({x:sx,y:488,w:ri(24,38),h:12,kind:'spikes'});}
if(Math.random()<.23&&px>500&&px<worldW-500&&px+w*.65<worldW-350)hazards.push({x:Math.max(80,Math.min(worldW-350,px+Math.min(w-48,Math.max(8,w*.45)))),y:Math.max(260,y-42),w:ri(25,40),h:36,kind:'laser',phase:rand(0,100)});
if(Math.random()<.66&&stage%10!==0){let types=['walker','hopper','flyer','charger','splitter','tank','ghost','spitter'];let type=types[ri(0,Math.min(types.length-1,1+Math.floor(stage/2)))];enemies.push({type,x:px+ri(10,Math.max(12,w-35)),y:type==='flyer'?y-80:y-30,w:['charger','tank'].includes(type)?38:type==='ghost'?25:28,h:type==='flyer'?24:type==='tank'?34:28,vx:Math.random()<.5?-1:1,speed:rand(.7,1.2)+stage*.018,minX:px,maxX:px+w,hp:['charger','tank','splitter'].includes(type)?2:1,alive:true,phase:rand(0,7)});}
if(Math.random()<.8){for(let j=0;j<ri(2,4);j++)pickups.push({type:Math.random()<.16?'gem':'coin',x:px+25+j*24,y:y-35-Math.sin(j/3*Math.PI)*9,r:8,got:false})}
// Add springs, crumble ledges and occasional moving hazards.
if(Math.random()<.12)hazards.push({x:px+Math.max(12,w*.55),y:y-15,w:22,h:15,kind:'spring'});x=px+w;lastY=y;
}
