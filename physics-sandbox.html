<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f3f6fb"><title>ソイルボックス</title>
<style>
:root{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--line:#d9e0eb;--text:#1c2738;--muted:#64748b;--accent:#087da8;--button:#eaf0f7;--hud:#ffffffd9}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101522;--panel:#1a2233;--line:#303c52;--text:#edf3ff;--muted:#9eacc4;--accent:#79d7ff;--button:#26334a;--hud:#101522cc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}header{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}.logo{font-weight:900;letter-spacing:1px}.logo span{color:var(--accent)}.sub{font-size:12px;color:var(--muted)}main{height:calc(100dvh - 56px);display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}section{margin-bottom:16px}h3{font-size:12px;letter-spacing:1px;color:var(--muted);margin:4px 0 9px}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:9px;padding:9px;cursor:pointer}button:hover{border-color:var(--accent)}button:active{transform:scale(.97)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{min-height:54px;display:flex;align-items:center;gap:9px;justify-content:center;font-size:12px}.tools b{font-size:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font-size:13px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:40px;height:30px;border:0;background:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#75c9f4;background-image:linear-gradient(#ffffff20 1px,transparent 1px),linear-gradient(90deg,#ffffff20 1px,transparent 1px);background-size:28px 28px}#stage.normal{background:linear-gradient(180deg,#62b9f0 0%,#b8e6ff 72%,#b8e6ff 100%)}#stage.space{background:radial-gradient(ellipse at 50% 120%,#29245d 0%,#10132e 48%,#050817 100%);background-image:radial-gradient(2px 2px at 12% 22%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 72% 18%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 88% 64%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 38% 72%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 56% 42%,#fff 50%,transparent 55%),linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(ellipse at 50% 120%,#29245d 0%,#10132e 48%,#050817 100%);background-size:auto,auto,auto,auto,auto,28px 28px,28px 28px,auto}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;left:12px;top:10px;pointer-events:none;background:var(--hud);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--text)}.hint{position:absolute;z-index:2;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;background:#111a2bbb;padding:7px 12px;border-radius:99px;white-space:nowrap;pointer-events:none}#toast{position:absolute;z-index:3;right:12px;top:10px;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:9px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.world-select{width:100%}
@media(max-width:720px){header{height:50px}.sub{display:none}main{height:calc(100dvh - 50px);grid-template-columns:1fr;grid-template-rows:minmax(180px,1fr) auto}#stage{grid-row:1}aside{grid-row:2;border:0;border-top:1px solid var(--line);padding:8px;max-height:42dvh;display:grid;grid-template-columns:1fr 1fr;gap:8px}section{margin:0}.tools button{min-height:42px}.tools b{font-size:17px}.hint{font-size:9px;bottom:6px}}
</style></head>
<body>
<header><div class="logo">🟫 ソイル<span>ボックス</span></div><div class="sub">物理演算サンドボックス</div><div style="margin-left:auto;font-size:11px;color:var(--muted)">BUILD • 2.1</div></header>
<main><aside>
<section><h3>ステージ</h3><select id="world" class="world-select"><option value="normal">☀️ 通常 — 青空と茶色い地面</option><option value="space">🌌 無重力 — 宇宙</option></select></section>
<section><h3>オブジェクト</h3><div class="tools">
<button data-add="circle"><b>⚪</b>丸</button><button data-add="box"><b>🟦</b>四角</button>
<button data-add="triangle"><b>🔺</b>三角形</button><button data-add="dynamite"><b>🧨</b>ダイナマイト</button>
<button data-add="human"><b>🏃</b>人間</button><button data-add="water"><b>💧</b>水</button>
</div></section>
<section><h3>オブジェクト設定</h3>
<div class="row"><label for="size">大きさ</label><span id="sizeVal">1.0×</span></div><input id="size" type="range" min=".5" max="2.5" step=".1" value="1">
<div class="row"><label for="color">色（丸・四角・三角形）</label><input id="color" type="color" value="#36a9e8"></div>
<div class="row"><label for="gravity">重力</label><span id="gravityVal">1.0</span></div><input id="gravity" type="range" min="0" max="2" step=".1" value="1">
<div class="row"><label for="bounce">反発</label><span id="bounceVal">0.5</span></div><input id="bounce" type="range" min="0" max="1.1" step=".1" value=".5">
</section>
<section><h3>シミュレーション</h3><div class="actions"><button id="pause">Ⅱ 一時停止</button><button id="clear">⌫ 全消去</button><button id="reset">↺ リセット</button><button id="save">↓ 保存</button></div></section>
<section style="font-size:11px;line-height:1.8;color:var(--muted)">物体をドラッグして動かせるよ。水は粒子で表現。人間は走り続ける！</section>
</aside>
<div id="stage" class="normal"><div class="hud"><b id="count">0</b> オブジェクト　·　<span id="state">▶ 動作中</span></div><div id="toast"></div><div class="hint">物体をドラッグ！ 空いている場所をドラッグするとボールを追加</div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(()=> {
const {Engine,Render,Runner,World,Bodies,Body,Mouse,MouseConstraint,Constraint,Events,Composite}=Matter;
const stage=document.getElementById('stage'),engine=Engine.create({enableSleeping:false});
engine.gravity.y=1;
const render=Render.create({element:stage,engine,options:{width:800,height:600,wireframes:false,background:'transparent',pixelRatio:Math.min(devicePixelRatio||1,2),showAngleIndicator:false}});
const runner=Runner.create();let W=800,H=600,paused=false,objects=[],walls=[],humans=[],waterParticles=[],effects=[],ground=null,worldMode='normal',blastLock=new WeakSet();
const $=id=>document.getElementById(id),scale=() => Number($('size').value),color=()=>$('color').value;
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1600)}
function updateCount(){$('count').textContent=objects.length}
function addObj(b,type){b.plugin={kind:type};objects.push(b);World.add(engine.world,b);updateCount();return b}
function rebuildStage(){walls.forEach(b=>World.remove(engine.world,b));walls=[];if(ground)World.remove(engine.world,ground);ground=null;
if(worldMode==='normal'){stage.className='normal';ground=Bodies.rectangle(W/2,H+45,W+300,90,{isStatic:true,friction:.9,render:{fillStyle:'#98602f',strokeStyle:'#75451f',lineWidth:2}});World.add(engine.world,ground);engine.gravity.y=Number($('gravity').value)}
else{stage.className='space';engine.gravity.y=0}
walls=[Bodies.rectangle(-35,H/2,70,H+300,{isStatic:true,render:{visible:false}}),Bodies.rectangle(W+35,H/2,70,H+300,{isStatic:true,render:{visible:false}})];World.add(engine.world,walls)}
function resize(){const r=stage.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(220,r.height);const d=render.options.pixelRatio;render.canvas.width=W*d;render.canvas.height=H*d;render.canvas.style.width=W+'px';render.canvas.style.height=H+'px';render.bounds.max.x=W;render.bounds.max.y=H;render.options.width=W;render.options.height=H;rebuildStage()}
function clear(){objects.forEach(b=>World.remove(engine.world,b));objects=[];humans=[];waterParticles=[];updateCount()}
function add(type,x=W/2,y=55){const s=scale(),c=color(),base={density:.001,restitution:Number($('bounce').value),friction:.35,render:{fillStyle:c,strokeStyle:'#ffffffaa',lineWidth:2}};let b;
if(type==='circle')b=Bodies.circle(x,y,22*s,base);
else if(type==='box')b=Bodies.rectangle(x,y,46*s,46*s,base);
else if(type==='triangle')b=Bodies.polygon(x,y,3,29*s,base);
else if(type==='dynamite'){const spawnX=Math.max(35,Math.min(W-35,x));const spawnY=Math.max(38,Math.min(H-110,y));b=Bodies.rectangle(spawnX,spawnY,20*s,58*s,{density:.003,friction:.35,restitution:.12,render:{fillStyle:'#d83b35',strokeStyle:'#8f211e',lineWidth:2}});b.label='dynamite';}
else if(type==='water'){for(let row=0;row<6;row++)for(let col=0;col<7;col++){const jitter=(Math.random()-.5)*2*s;const p=Bodies.circle(x+(col-3)*9*s+jitter,y+row*9*s,5.2*s,{density:.0005,friction:.015,restitution:.025,render:{visible:false}});addObj(p,'water');waterParticles.push(p)}toast('水の粒子を追加！');return}
else if(type==='human'){createHuman(x,y,s);return}
return addObj(b,type)}
function createHuman(x,y,s){const parts=[],head=Bodies.circle(x,y-31*s,9*s,{density:.001,friction:.4,render:{fillStyle:'#ffd2a1'}}),torso=Bodies.rectangle(x,y-10*s,17*s,31*s,{density:.001,render:{fillStyle:'#2c8bd5'}}),arm1=Bodies.rectangle(x-13*s,y-12*s,7*s,23*s,{render:{fillStyle:'#ffd2a1'}}),arm2=Bodies.rectangle(x+13*s,y-12*s,7*s,23*s,{render:{fillStyle:'#ffd2a1'}}),leg1=Bodies.rectangle(x-6*s,y+15*s,8*s,24*s,{render:{fillStyle:'#263b65'}}),leg2=Bodies.rectangle(x+6*s,y+15*s,8*s,24*s,{render:{fillStyle:'#263b65'}});
parts.push(head,torso,arm1,arm2,leg1,leg2);const links=[[head,torso,0, -17*s],[torso,arm1,-10*s,-8*s],[torso,arm2,10*s,-8*s],[torso,leg1,-5*s,15*s],[torso,leg2,5*s,15*s]];
const cons=links.map(([a,b,ax,ay])=>Constraint.create({bodyA:a,bodyB:b,pointA:{x:ax,y:ay},length:0,stiffness:.85,damping:.15,render:{visible:false}}));
const comp=Composite.create();Composite.add(comp,[...parts,...cons]);World.add(engine.world,comp);const group={parts,comp,torso,legs:[leg1,leg2],phase:Math.random()*6.28,dir:1};humans.push(group);objects.push(...parts);updateCount()}
function explode(b){if(blastLock.has(b))return;blastLock.add(b);const x=b.position.x,y=b.position.y;effects.push({x,y,start:performance.now(),duration:650,particles:Array.from({length:22},(_,i)=>({angle:Math.PI*2*i/22+Math.random()*.16,speed:1.5+Math.random()*3,size:2+Math.random()*3}))});const radius=190,force=0.00016;objects.forEach(o=>{if(o===b||!o.position||o.isStatic)return;const dx=o.position.x-x,dy=o.position.y-y,d=Math.hypot(dx,dy);if(d<radius&&d>1){const power=force*(1-d/radius);Body.applyForce(o,o.position,{x:dx/d*power,y:dy/d*power})}});Body.setStatic(b,true);b.render.fillStyle='#555';toast('💥 ドカーン！！');setTimeout(()=>{World.remove(engine.world,b);objects=objects.filter(o=>o!==b);blastLock.delete(b);updateCount()},220)}
Events.on(engine,'collisionStart',event=>{for(const pair of event.pairs){for(const b of [pair.bodyA,pair.bodyB])if(b.label==='dynamite'||b.plugin?.kind==='dynamite')explode(b)}});
Events.on(render,'afterRender',()=>{const ctx=render.context,pr=render.options.pixelRatio||1,now=performance.now();ctx.save();ctx.setTransform(pr,0,0,pr,0,0);effects=effects.filter(e=>now-e.start<e.duration);for(const e of effects){const t=(now-e.start)/e.duration,fade=1-t;ctx.save();ctx.globalAlpha=fade;ctx.beginPath();ctx.arc(e.x,e.y,12+t*95,0,Math.PI*2);ctx.strokeStyle='#ffd45e';ctx.lineWidth=7*(1-t)+1;ctx.stroke();ctx.beginPath();ctx.arc(e.x,e.y,5+t*45,0,Math.PI*2);ctx.fillStyle='#fff1a8';ctx.fill();for(const p of e.particles){const d=p.speed*48*t,px=e.x+Math.cos(p.angle)*d,py=e.y+Math.sin(p.angle)*d;ctx.beginPath();ctx.arc(px,py,p.size*fade,0,Math.PI*2);ctx.fillStyle='#ff8b35';ctx.fill()}ctx.restore()}for(const p of waterParticles){if(!p.position)continue;const r=p.circleRadius||5;const g=ctx.createRadialGradient(p.position.x-r*.35,p.position.y-r*.4,1,p.position.x,p.position.y,r*1.35);g.addColorStop(0,'#e8fbff');g.addColorStop(.28,'#8de0ff');g.addColorStop(.72,'#25a8e8');g.addColorStop(1,'#0876bd');ctx.beginPath();ctx.arc(p.position.x,p.position.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=.8;ctx.strokeStyle='#d6f7ff';ctx.stroke();ctx.beginPath();ctx.ellipse(p.position.x-r*.25,p.position.y-r*.3,r*.22,r*.12,-.5,0,Math.PI*2);ctx.fillStyle='#ffffffcc';ctx.fill()}ctx.restore()});
Events.on(engine,'beforeUpdate',()=>{const dt=engine.timing.lastDelta||16.67;humans.forEach(h=>{h.phase+=dt*.012;const vx=h.dir*1.6;Body.setVelocity(h.torso,{x:vx,y:h.torso.velocity.y});h.legs.forEach((leg,i)=>Body.setAngle(leg,Math.sin(h.phase+i*Math.PI)*.42));if(h.torso.position.x<30)h.dir=1;if(h.torso.position.x>W-30)h.dir=-1});});
Events.on(engine,'afterUpdate',()=>{for(const b of [...objects]){if(b.position.y>H+450||b.position.x<-500||b.position.x>W+500){World.remove(engine.world,b);objects=objects.filter(o=>o!==b);waterParticles=waterParticles.filter(o=>o!==b)}}updateCount()});
const mouse=Mouse.create(render.canvas);mouse.pixelRatio=render.options.pixelRatio;const mc=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.18,damping:.12,render:{visible:false}}});World.add(engine.world,mc);render.mouse=mouse;
Events.on(mc,'mousedown',e=>{const p=e.mouse.position;const hit=objects.some(b=>Matter.Bounds.contains(b.bounds,p)&&Matter.Vertices.contains(b.vertices,p));if(!hit)add('circle',p.x,p.y)});
function start(){Runner.run(runner,engine);Render.run(render)}function stop(){Runner.stop(runner);Render.stop(render)}
document.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{add(btn.dataset.add);toast('追加しました！')});
$('world').onchange=()=>{worldMode=$('world').value;rebuildStage();toast(worldMode==='space'?'無重力ステージ':'通常ステージ')};
$('gravity').oninput=()=>{$('gravityVal').textContent=Number($('gravity').value).toFixed(1);if(worldMode==='normal')engine.gravity.y=Number($('gravity').value)};
$('bounce').oninput=()=>{$('bounceVal').textContent=Number($('bounce').value).toFixed(1);objects.forEach(b=>b.restitution=Number($('bounce').value))};
$('size').oninput=()=>$('sizeVal').textContent=scale().toFixed(1)+'×';
$('pause').onclick=()=>{paused=!paused;if(paused){stop();$('pause').textContent='▶ 再開';$('state').textContent='Ⅱ 停止中'}else{start();$('pause').textContent='Ⅱ 一時停止';$('state').textContent='▶ 動作中'}};
$('clear').onclick=()=>{clear();toast('全消去しました')};
$('reset').onclick=()=>{clear();$('world').value='normal';worldMode='normal';$('gravity').value=1;$('gravityVal').textContent='1.0';$('bounce').value=.5;$('bounceVal').textContent='0.5';rebuildStage();toast('ステージをリセット！')};
$('save').onclick=()=>{const data={version:2,world:worldMode,gravity:engine.gravity.y,objects:objects.filter(b=>!['human','water'].includes(b.plugin?.kind)).map(b=>({x:b.position.x,y:b.position.y,angle:b.angle,shape:b.plugin?.kind,color:b.render.fillStyle}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='physics-lab-world.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('JSONで保存しました')};
new ResizeObserver(resize).observe(stage);resize();start();
})();
</script></body></html>
