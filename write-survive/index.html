<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>書いて生き残れ！</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff}#game{position:fixed;inset:0}canvas{display:block}
.panel{background:#101827dd;border:1px solid #ffffff26;border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 12px 40px #0005}
#lobby{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#0b1220cc,#182b42aa)}.lobby-card{width:min(560px,100%);padding:26px;text-align:center}.logo{font-size:clamp(34px,8vw,64px);font-weight:1000;letter-spacing:.04em;line-height:1.12;text-shadow:0 5px 0 #26364d}.sub{color:#b8c8da;margin:12px 0 22px}.map-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.map-btn{padding:14px 6px;border:1px solid #ffffff35;background:#ffffff0c;color:white;border-radius:13px;font-weight:800;cursor:pointer}.map-btn.active{border:2px solid #7ee7ff;background:#1d526a88}.primary{border:0;border-radius:14px;background:linear-gradient(100deg,#16a5d8,#3b82f6);color:white;font-weight:900;font-size:18px;padding:15px 24px;width:100%;cursor:pointer}.small{font-size:12px;color:#aab8c8;line-height:1.6;margin-top:14px}
#hud{position:fixed;inset:0;pointer-events:none;display:none}.hud-top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:calc(100% - 20px)}.pill{padding:9px 14px;border-radius:999px;background:#101827d9;border:1px solid #ffffff25;font-weight:800;font-size:14px}.hp-wrap{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(320px,70vw);text-align:center}.hp-bg{height:13px;border-radius:20px;background:#39465a;overflow:hidden;border:1px solid #ffffff55}.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#a3e635);transition:width .15s}.hp-label{font-size:12px;font-weight:900;margin-top:3px;text-shadow:0 2px 4px #000}.help{position:absolute;left:12px;bottom:12px;padding:9px 12px;font-size:12px;color:#d5e0eb;max-width:250px}.center-msg{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,42px);font-weight:1000;text-shadow:0 3px 12px #000;text-align:center;white-space:nowrap}
#writer{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:#050a12a8;z-index:5}.writer-card{width:min(540px,100%);padding:24px}.writer-card h2{margin:0 0 8px;font-size:25px}.writer-card p{color:#bdcadd;margin:0 0 15px}.writer-card input{width:100%;padding:16px;border-radius:12px;border:2px solid #55708e;background:#0b1422;color:white;font-size:20px;outline:none}.writer-card input:focus{border-color:#62d7ff}.writer-actions{display:flex;gap:10px;margin-top:12px}.writer-actions button{flex:1}
#end{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:#050a12bb;z-index:6}.end-card{width:min(440px,100%);padding:28px;text-align:center}.end-card h2{font-size:36px;margin:0 0 8px}
#mobile{position:fixed;inset:0;display:none;pointer-events:none}.stick{position:absolute;left:20px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}.nub{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#d8f5ffcc;border:2px solid white}.mob-btn{position:absolute;right:18px;bottom:26px;display:grid;grid-template-columns:repeat(2,64px);gap:9px;pointer-events:auto}.mob-btn button{height:58px;border-radius:50%;border:1px solid #ffffff70;background:#14243ddd;color:#fff;font-weight:900;touch-action:none}
@media(pointer:coarse){#mobile{display:block}.help{bottom:155px;max-width:190px}}@media(max-width:430px){.lobby-card{padding:20px 16px}.map-btn{font-size:13px}.help{font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="lobby"><div class="lobby-card panel"><div class="logo">書いて<br>生き残れ！</div><div class="sub">書いた言葉が、キミの力になる。<br>最後の1人になるまで生き残れ！</div><div style="font-weight:900">マップを選択</div><div class="map-list"><button class="map-btn active" data-map="arena">🏟️ アリーナ</button><button class="map-btn" data-map="grass">🌿 草原</button><button class="map-btn" data-map="city">🏙️ シティ</button></div><button class="primary" id="start">BATTLE START ▶</button><div class="small">1人プレイ・BOT最大11体 / 3Dサバイバル<br>PC：WASD移動・Spaceジャンプ・クリック攻撃<br>スマホ：左スティック移動・右ボタン操作</div></div></div>
<div id="hud"><div class="hud-top"><div class="pill" id="alive">👥 残り 12人</div><div class="pill" id="phase">📝 次の入力者を選出中</div><div class="pill" id="mapname">🏟️ アリーナ</div></div><div class="hp-wrap"><div class="hp-bg"><div class="hp-fill" id="hpfill"></div></div><div class="hp-label" id="hptext">HP 100 / 100</div></div><div class="help panel">WASD：移動　Space：ジャンプ<br>Shift：ダッシュ　クリック：攻撃<br>文字入力に選ばれたら画面中央に表示！</div><div class="center-msg" id="notice"></div></div>
<div id="writer"><div class="writer-card panel"><h2>✍️ キミの言葉を実体化！</h2><p>単語や短いフレーズを入力しよう（文章・禁止ワード不可）</p><input id="word" maxlength="80" autocomplete="off" placeholder="例：ドラゴン、巨大な岩、炎の魔法"><div class="writer-actions"><button class="primary" id="writeBtn">実体化する！</button><button class="map-btn" id="skipBtn">パス</button></div><div class="small" id="writerTime">残り 30 秒</div></div></div>
<div id="end"><div class="end-card panel"><h2 id="endTitle">🏆 WIN!</h2><p id="endText">最後まで生き残った！</p><button class="primary" id="again">もう一度プレイ</button></div></div>
<div id="mobile"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="mob-btn"><button id="jump">JUMP</button><button id="dash">DASH</button><button id="attack">HIT</button><button id="crouch">LOW</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fc8e8);scene.fog=new THREE.Fog(0x8fc8e8,42,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x536477,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-18,30,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mats={grass:0x63a85a,arena:0x687587,city:0x777d8a};
let selectedMap='arena',players=[],summons=[],running=false,writerTimer=0,writerId=null,turnBusy=false,lastTime=0,roundClock=0,keys={},jumpQueued=false,attackQueued=false,crouch=false,stickVector={x:0,y:0};
const mapNames={arena:'アリーナ',grass:'草原',city:'シティ'};
function box(parent,w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function clearWorld(){for(const p of [...players])scene.remove(p.group);for(const s of [...summons])scene.remove(s.group);players=[];summons=[];while(scene.children.length>0){const o=scene.children[scene.children.length-1];if(o===sun||o.type==='HemisphereLight')break;scene.remove(o)}}
function buildMap(type){const groundColor=mats[type];const ground=box(scene,100,1,100,groundColor,0,-.55,0);ground.receiveShadow=true;
const wallColor=type==='city'?0x586779:0x4b5969;
for(let i=0;i<4;i++){const a=i*Math.PI/2;const w=type==='arena'?1.5:1;const wall=box(scene,100,5,w,wallColor,0,2.2,-49);wall.rotation.y=a}
if(type==='arena'){for(let i=0;i<10;i++){const a=i*Math.PI*2/10;box(scene,2,2,2,0x9aa7b5,Math.cos(a)*20,0.5,Math.sin(a)*20)}}
if(type==='grass'){for(let i=0;i<28;i++){const x=(Math.random()-.5)*78,z=(Math.random()-.5)*78;if(Math.hypot(x,z)<10)continue;const trunk=box(scene,.7,3,.7,0x795331,x,1.5,z);const crown=box(scene,3,3,3,0x267a42,x,4,z);crown.rotation.y=Math.random()*2}}
if(type==='city'){for(let i=0;i<22;i++){const x=(Math.random()-.5)*78,z=(Math.random()-.5)*78;if(Math.hypot(x,z)<11)continue;const h=5+Math.random()*13;box(scene,5,h,5,[0x53677d,0x647b91,0x46586b][i%3],x,h/2,z);for(let y=2;y<h;y+=3)box(scene,3,.25,.15,0x8ed9e8,x,y,z-2.58)}}
}
function makeAvatar(name,color,isBot=false){const g=new THREE.Group();const body=box(g,1.15,1.35,.62,color,0,1.45,0);const head=box(g,.85,.85,.85,0xffd7ad,0,2.55,0);box(g,.16,.13,.06,0x202b3b,-.19,2.6,-.44);box(g,.16,.13,.06,0x202b3b,.19,2.6,-.44);const arm1=box(g,.35,1.15,.38,color,-.78,1.48,0),arm2=box(g,.35,1.15,.38,color,.78,1.48,0);const leg1=box(g,.42,.85,.48,0x27364a,-.3,.43,0),leg2=box(g,.42,.85,.48,0x27364a,.3,.43,0);const tag=document.createElement('div');tag.textContent=name;tag.style.cssText='position:absolute;color:white;font:800 12px system-ui;text-shadow:0 2px 4px #000;white-space:nowrap;pointer-events:none';const p={name,group:g,hp:100,alive:true,isBot,id:Math.random().toString(36).slice(2),speed:7,vy:0,onGround:true,attackCd:0,invuln:0,regen:0,color,tag,spawn:{x:0,z:0},summonCd:0};scene.add(g);return p}
function addPlayers(){const human=makeAvatar('YOU',0x28a9e8,false);human.group.position.set(0,0,0);players.push(human);for(let i=0;i<11;i++){const b=makeAvatar('BOT-'+String(i+1).padStart(2,'0'),[0xe85d5d,0xf0b84c,0x9a7be8,0x4bc6a8,0xe889c4][i%5],true);const a=i/11*Math.PI*2;b.group.position.set(Math.cos(a)*25,0,Math.sin(a)*25);b.spawn={x:Math.cos(a)*25,z:Math.sin(a)*25};players.push(b)}}
function alive(){return players.filter(p=>p.alive)}
function nearestEnemy(p){let best=null,dist=1e9;for(const q of alive()){if(q===p)continue;const d=p.group.position.distanceTo(q.group.position);if(d<dist){dist=d;best=q}}return best}
function damage(p,n){if(!p.alive||p.invuln>0)return;p.hp=Math.max(0,p.hp-n);p.invuln=.5;if(p.hp<=0){p.alive=false;p.group.visible=false;if(p===players[0]){endGame(false)}else{const el=document.createElement('div');el.textContent=p.name+' OUT';el.style.cssText='position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-weight:1000;color:#fff;text-shadow:0 2px 8px #000';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}}}
function spawnThing(owner,word){const key=word.trim().toLowerCase();if(summons.some(s=>s.key===key&&s.hp>0)){if(owner===players[0])showNotice('同じものはすでに存在している！');return}
const color=/炎|火|ドラゴン|竜/.test(word)?0xf06b36:/氷|雪/.test(word)?0x69d5ef:/盾|壁/.test(word)?0x83a4b9:/回復|薬/.test(word)?0x57d68d:0xd6a7ff;
const g=new THREE.Group();const core=box(g,1.4,1.4,1.4,color,0,1,0);const orb=box(g,.55,.55,.55,0xffffff,0,2.1,0);orb.rotation.y=.5;const p=owner.group.position;g.position.set(p.x+(Math.random()-.5)*5,0,p.z+(Math.random()-.5)*5);scene.add(g);summons.push({group:g,owner,key,word,hp:80,damage:/ドラゴン|竜/.test(word)?22:14,cd:0,life:55});showNotice('「'+word+'」が実体化！')}
function showNotice(t){$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},1700)}
const words=['ドラゴン','巨大な岩','炎の魔法','石の壁','回復アイテム','氷のゴーレム','ロボット','風の精霊','光の球体','守護獣'];
function chooseWriter(){const list=alive();if(list.length<2)return;const pick=list[Math.floor(Math.random()*list.length)];writerId=pick.id;writerTimer=30;turnBusy=false;$('phase').textContent='✍️ 入力者：'+pick.name;if(pick===players[0]){$('writer').style.display='grid';$('word').value='';$('word').focus()}else{ $('writer').style.display='none';const delay=900+Math.random()*1800;setTimeout(()=>{if(!running||writerId!==pick.id||!pick.alive)return;spawnThing(pick,words[Math.floor(Math.random()*words.length)]);finishTurn()},delay)}}
function finishTurn(){$('writer').style.display='none';writerId=null;turnBusy=true;setTimeout(()=>{if(running){turnBusy=false;chooseWriter()}},1200)}
function submitWord(){if(!running||writerId!==players[0].id)return;const w=$('word').value.trim();if(!w)return;const bad=['全削除','サーバー破壊','無敵','無制限'];if(bad.some(x=>w.includes(x))||/[。.!?！？\n]/.test(w)||w.length>80){showNotice('その言葉は実体化できない！');return}spawnThing(players[0],w);finishTurn()}
function startGame(){clearWorld();buildMap(selectedMap);addPlayers();$('lobby').style.display='none';$('hud').style.display='block';$('end').style.display='none';running=true;roundClock=0;turnBusy=false;chooseWriter();showNotice('最後の1人を目指せ！')}
function endGame(win){running=false;$('writer').style.display='none';$('end').style.display='grid';$('endTitle').textContent=win?'🏆 YOU WIN!':'💥 YOU OUT!';$('endText').textContent=win?'最後まで生き残った！':'次はもっと強い言葉を実体化させよう！'}
function updateHud(){const me=players[0];if(!me)return;$('alive').textContent='👥 残り '+alive().length+'人';$('hpfill').style.width=me.hp+'%';$('hptext').textContent='HP '+Math.ceil(me.hp)+' / 100';$('mapname').textContent='🗺️ '+mapNames[selectedMap];}
function doAttack(p){if(!p.alive||p.attackCd>0)return;p.attackCd=.65;const target=nearestEnemy(p);if(target&&p.group.position.distanceTo(target.group.position)<3.1){damage(target,13);showNotice(p===players[0]?'HIT!':'');}}
function update(dt){if(!running)return;roundClock+=dt;const me=players[0];for(const p of players){if(!p.alive)continue;p.attackCd=Math.max(0,p.attackCd-dt);p.invuln=Math.max(0,p.invuln-dt);p.hp=Math.min(100,p.hp+dt);if(p.isBot){const t=nearestEnemy(p);if(t){const dx=t.group.position.x-p.group.position.x,dz=t.group.position.z-p.group.position.z,d=Math.hypot(dx,dz)||1;if(d>2.4){p.group.position.x+=dx/d*p.speed*.42*dt;p.group.position.z+=dz/d*p.speed*.42*dt;p.group.rotation.y=Math.atan2(dx,dz)}else if(Math.random()<dt*1.5)doAttack(p)}p.summonCd-=dt;if(p.summonCd<=0&&Math.random()<dt*.12){spawnThing(p,words[Math.floor(Math.random()*words.length)]);p.summonCd=12+Math.random()*12}}}
if(me&&me.alive){let x=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stickVector.x,z=(keys.KeyS?1:0)-(keys.KeyW?1:0)+stickVector.y;const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}const speed=keys.ShiftLeft?11:7;me.group.position.x+=x*speed*dt;me.group.position.z+=z*speed*dt;if(len>.05)me.group.rotation.y=Math.atan2(x,z);if(jumpQueued&&me.onGround){me.vy=8;me.onGround=false}jumpQueued=false;me.vy-=22*dt;me.group.position.y+=me.vy*dt;if(me.group.position.y<=0){me.group.position.y=0;me.vy=0;me.onGround=true}if(attackQueued)doAttack(me);attackQueued=false;me.group.position.x=THREE.MathUtils.clamp(me.group.position.x,-45,45);me.group.position.z=THREE.MathUtils.clamp(me.group.position.z,-45,45)}
for(const s of [...summons]){s.cd-=dt;s.life-=dt;const t=nearestEnemy(s.owner);if(t){const dx=t.group.position.x-s.group.position.x,dz=t.group.position.z-s.group.position.z,d=Math.hypot(dx,dz)||1;if(d>1.9){s.group.position.x+=dx/d*3.2*dt;s.group.position.z+=dz/d*3.2*dt}else if(s.cd<=0){damage(t,s.damage);s.cd=1.7}}s.group.rotation.y+=dt*.8;s.group.position.y=.2+Math.sin(roundClock*2+s.group.position.x)*.16;if(s.life<=0){scene.remove(s.group);summons.splice(summons.indexOf(s),1)}}
if(writerId){writerTimer-=dt;$('writerTime').textContent='残り '+Math.max(0,Math.ceil(writerTimer))+' 秒';if(writerTimer<=0)finishTurn()}
if(alive().length<=1&&running){endGame(alive()[0]===me)}
if(me){const pos=me.group.position;const behind=new THREE.Vector3(0,6,10).applyAxisAngle(new THREE.Vector3(0,1,0),me.group.rotation.y);const desired=new THREE.Vector3(pos.x+behind.x,pos.y+behind.y,pos.z+behind.z);camera.position.lerp(desired,.12);camera.lookAt(pos.x,pos.y+1.2,pos.z)}
updateHud()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-lastTime)/1000||0,.04);lastTime=t;update(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('start').onclick=startGame;$('again').onclick=()=>{$('lobby').style.display='grid';$('end').style.display='none';$('hud').style.display='none';running=false};$('writeBtn').onclick=submitWord;$('skipBtn').onclick=finishTurn;$('word').addEventListener('keydown',e=>{if(e.key==='Enter')submitWord()});
document.querySelectorAll('.map-btn[data-map]').forEach(b=>b.onclick=()=>{selectedMap=b.dataset.map;document.querySelectorAll('.map-btn[data-map]').forEach(x=>x.classList.toggle('active',x===b))});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jumpQueued=true}});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0)attackQueued=true});
$('jump').onclick=()=>jumpQueued=true;$('attack').onclick=()=>attackQueued=true;$('dash').onpointerdown=()=>keys.ShiftLeft=true;$('dash').onpointerup=()=>keys.ShiftLeft=false;$('crouch').onclick=()=>crouch=!crouch;
const stick=$('stick'),nub=$('nub');let activeTouch=null;stick.addEventListener('pointerdown',e=>{activeTouch=e.pointerId;stick.setPointerCapture(activeTouch);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===activeTouch)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=42,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}nub.style.transform='translate('+dx+'px,'+dy+'px)';stickVector={x:dx/max,y:dy/max}}function resetStick(){activeTouch=null;nub.style.transform='';stickVector={x:0,y:0}}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
buildMap('arena');camera.position.set(0,8,13);camera.lookAt(0,0,0);
</script>
</body>
</html>
