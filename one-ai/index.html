<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="description" content="ONE AI — シンプルなAIチャット">
<title>ONE AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--side:#171717;--panel:#2f2f2f;--panel2:#383838;--text:#f5f5f5;--muted:#aaa;--line:#ffffff18;--accent:#10a37f;--danger:#ef6464}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:270px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:12px;gap:12px;transition:transform .2s}.brand{display:flex;align-items:center;justify-content:space-between;padding:7px 5px 12px;font-weight:750;font-size:19px;letter-spacing:-.5px}.brand-mark{display:flex;align-items:center;gap:9px}.logo{width:29px;height:29px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:17px}.iconbtn,.newchat,.history-item,.settings-btn{border:1px solid transparent;background:transparent;border-radius:10px}.iconbtn{width:38px;height:38px;font-size:19px}.iconbtn:hover,.newchat:hover,.history-item:hover,.settings-btn:hover{background:#ffffff12}.newchat{padding:11px;text-align:left;border-color:var(--line);display:flex;gap:10px;align-items:center}.history-label{font-size:12px;color:var(--muted);padding:9px 8px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:3px;flex:1}.history-item{padding:10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.history-item.active{background:#ffffff16}.side-bottom{border-top:1px solid var(--line);padding-top:9px}.settings-btn{width:100%;padding:11px;text-align:left}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.top-left{display:flex;align-items:center;gap:9px}.mobile-menu{display:none}.model-label{font-size:14px;color:#ddd}.chat{flex:1;overflow:auto;padding:28px 18px 18px}.welcome{max-width:720px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px;letter-spacing:-1.2px}.welcome p{color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:34px auto 0;max-width:650px}.suggestion{background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:#ddd;font-size:13px}.suggestion:hover{background:#ffffff0b}.messages{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}.message{display:flex;gap:13px;align-items:flex-start;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:14px}.message.user .avatar{background:#555}.message-body{padding-top:3px;min-width:0;flex:1}.message.assistant .avatar{background:var(--accent)}.message.error .message-body{color:#ffaaaa}.composer-wrap{padding:12px 18px max(18px,env(safe-area-inset-bottom));flex:none}.composer{max-width:760px;margin:auto;background:var(--panel);border:1px solid #ffffff22;border-radius:25px;padding:10px 12px;display:flex;align-items:flex-end;gap:9px;box-shadow:0 5px 25px #0002}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);min-height:28px;max-height:180px;line-height:1.5;padding:5px 2px}.send{width:36px;height:36px;border:0;border-radius:50%;background:var(--text);color:#222;font-size:18px;font-weight:800}.send:disabled{opacity:.4;cursor:not-allowed}.disclaimer{text-align:center;color:#888;font-size:11px;margin:9px auto 0}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.open{display:flex}.modal{width:min(100%,440px);background:#292929;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 20px 70px #0008}.modal h2{font-size:19px;margin:0 0 7px}.modal p{font-size:13px;color:var(--muted);line-height:1.6}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}.field label{font-size:13px;color:#ddd}.field input,.field select{background:#1c1c1c;color:white;border:1px solid #ffffff25;border-radius:9px;padding:11px;outline:none;width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:transparent}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{color:#ffaaaa}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#444;padding:10px 15px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}.toast.show{opacity:1}.empty{color:var(--muted);font-size:13px;padding:12px 8px}
@media(max-width:700px){.sidebar{position:fixed;z-index:4;inset:0 auto 0 0;width:min(82vw,300px);transform:translateX(-105%);box-shadow:15px 0 40px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-grid;place-items:center}.topbar{padding:0 10px}.chat{padding:22px 14px}.composer-wrap{padding:10px 10px max(13px,env(safe-area-inset-bottom))}.welcome{margin-top:13vh}.suggestions{grid-template-columns:1fr;margin-top:25px}.suggestion{padding:12px}.model-label{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><span class="brand-mark"><span class="logo">✦</span>ONE AI</span><button class="iconbtn" id="closeSidebar" aria-label="閉じる">‹</button></div>
 <button class="newchat" id="newChat"><span>＋</span> 新しいチャット</button>
 <div class="history-label">最近のチャット</div><div class="history" id="history"></div>
 <div class="side-bottom"><button class="settings-btn" id="openSettings">⚙️　設定</button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="iconbtn mobile-menu" id="openSidebar" aria-label="メニュー">☰</button><span class="model-label">ONE AI <span style="color:#888">·</span> <span id="modelName">Ollama</span></span></div><button class="iconbtn" id="topSettings" aria-label="設定">⚙</button></header>
 <section class="chat" id="chat" aria-live="polite"><div class="welcome" id="welcome"><h1>今日は何をお手伝いしましょうか？</h1><p>ONE AI と会話を始めましょう。</p><div class="suggestions"><button class="suggestion">💡 新しいアイデアを考えて</button><button class="suggestion">📚 難しいことをわかりやすく説明して</button><button class="suggestion">💻 プログラミングを手伝って</button><button class="suggestion">✍️ 文章を一緒に作って</button></div></div><div class="messages" id="messages"></div></section>
 <div class="composer-wrap"><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="ONE AIにメッセージを送信..." aria-label="メッセージ"></textarea><button class="send" id="send" type="submit" aria-label="送信">↑</button></form><div class="disclaimer">AIの回答は不正確な場合があります。重要な情報は確認してください。</div></div>
</main>
</div>
<div class="overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal"><h2 id="settingsTitle">ONE AI の設定</h2><p>このブラウザから、あなたのPCで動くOllamaに接続します。APIキーは不要です。</p><div class="field"><label for="ollamaUrl">Ollama接続先</label><input id="ollamaUrl" type="url" autocomplete="url" value="http://localhost:11434" placeholder="http://localhost:11434"></div><div class="field"><label for="model">使用モデル</label><select id="model"><option value="qwen2.5-coder:3b">qwen2.5-coder:3b</option></select><button class="btn" type="button" id="refreshModels">モデル一覧を取得</button></div><p id="connectionHelp">Ollamaを起動してください。GitHub Pagesから接続するには、Ollamaの起動環境に OLLAMA_ORIGINS=https://tk-sakusya.github.io を設定して再起動する必要があります。</p><div class="modal-actions"><button class="btn" id="testConnection">接続テスト</button><button class="btn" id="cancelSettings">閉じる</button><button class="btn primary" id="saveSettings">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(()=> {
 const $=id=>document.getElementById(id);
 const URL_KEY='one-ai-ollama-url',MODEL='one-ai-model',STORE='one-ai-chats-v1';
 let chats=loadChats(),currentId=null,busy=false;
 const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
 function loadChats(){try{const data=JSON.parse(localStorage.getItem(STORE)||'[]');let changed=false;data.forEach(chat=>{const before=(chat.messages||[]).length;chat.messages=(chat.messages||[]).filter(m=>!(m.role==='assistant'&&typeof m.text==='string'&&m.text.includes('Gemini APIキー')));if(chat.messages.length!==before)changed=true});if(changed)localStorage.setItem(STORE,JSON.stringify(data));return data}catch{return[]}}
 function save(){localStorage.setItem(STORE,JSON.stringify(chats))}
 function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
 function current(){return chats.find(c=>c.id===currentId)}
 function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function renderHistory(){
  const root=$('history');root.replaceChildren();
  if(!chats.length){const p=document.createElement('div');p.className='empty';p.textContent='チャットはまだありません';root.append(p)}
  [...chats].sort((a,b)=>b.updated-a.updated).forEach(c=>{
   const row=document.createElement('div');row.style.display='flex';row.style.gap='3px';
   const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.style.flex='1';b.textContent=c.title||'新しいチャット';b.onclick=()=>selectChat(c.id);
   const d=document.createElement('button');d.className='iconbtn';d.style.width='34px';d.textContent='⋯';d.title='チャットを削除';d.onclick=()=>{if(confirm('このチャットを削除しますか？')){chats=chats.filter(x=>x.id!==c.id);if(currentId===c.id)currentId=null;save();renderHistory();renderMessages()}};row.append(b,d);root.append(row);
  });
 }
 function selectChat(id){currentId=id;renderHistory();renderMessages();$('sidebar').classList.remove('open')}
 function createChat(){const c={id:newId(),title:'新しいチャット',updated:Date.now(),messages:[]};chats.push(c);currentId=c.id;save();renderHistory();renderMessages();$('prompt').focus();$('sidebar').classList.remove('open')}
 function renderMessages(){
  const box=$('messages');box.replaceChildren();$('welcome').style.display=current()&&current().messages.length?'none':'block';
  const c=current();if(!c)return;
  c.messages.forEach(m=>{
   const row=document.createElement('div');row.className='message '+m.role+(m.error?' error':'');
   const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'人':'✦';
   const body=document.createElement('div');body.className='message-body';body.textContent=m.text;row.append(av,body);box.append(row);
  });
  $('chat').scrollTop=$('chat').scrollHeight;
 }
 function openSettings(){ $('ollamaUrl').value=localStorage.getItem(URL_KEY)||'http://localhost:11434';$('settingsModal').classList.add('open');loadModels().catch(()=>{});}
 function closeSettings(){$('settingsModal').classList.remove('open')}
 function ollamaBase(){return (localStorage.getItem(URL_KEY)||'http://localhost:11434').trim().replace(/\/+$/,'')}
 async function loadModels(){
  const select=$('model'),previous=localStorage.getItem(MODEL)||'qwen2.5-coder:3b';
  const response=await fetch(ollamaBase()+'/api/tags');if(!response.ok)throw new Error('Ollamaに接続できません ('+response.status+')');
  const data=await response.json();const models=data.models||[];select.replaceChildren();
  if(!models.length){const o=document.createElement('option');o.value=previous;o.textContent=previous+'（未検出）';select.append(o);return models}
  models.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;select.append(o)});
  if([...select.options].some(o=>o.value===previous))select.value=previous;else select.selectedIndex=0;
  $('modelName').textContent=select.value;return models;
 }
 async function testConnection(){try{const models=await loadModels();toast('Ollamaに接続しました（'+models.length+'モデル）')}catch(e){toast('接続できません：'+e.message)}}
 async function askOllama(history){
  const model=localStorage.getItem(MODEL)||'qwen2.5-coder:3b';
  const messages=history.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
  const response=await fetch(ollamaBase()+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages,stream:false})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Ollamaエラー ('+response.status+')');
  if(!data.message?.content)throw new Error('Ollamaから回答が返りませんでした。モデルがダウンロード済みか確認してください。');
  return data.message.content;
 }
 async function sendMessage(text){
  if(busy||!text.trim())return;
  if(!currentId)createChat();const c=current();c.messages.push({role:'user',text:text.trim()});if(c.messages.length===1)c.title=text.trim().slice(0,26);c.updated=Date.now();save();renderHistory();renderMessages();$('prompt').value='';$('prompt').style.height='auto';busy=true;$('send').disabled=true;
  const pending={role:'assistant',text:'考え中…'};c.messages.push(pending);renderMessages();
  try{const history=c.messages.slice(0,-1);const answer=await askOllama(history);pending.text=answer}
  catch(e){pending.text='エラー：'+e.message;pending.error=true}
  finally{busy=false;$('send').disabled=false;c.updated=Date.now();save();renderHistory();renderMessages()}
 }
 $('newChat').onclick=createChat;$('openSettings').onclick=openSettings;$('topSettings').onclick=openSettings;$('cancelSettings').onclick=closeSettings;
 $('saveSettings').onclick=()=>{const url=$('ollamaUrl').value.trim().replace(/\/+$/,'');if(!/^https?:\/\//i.test(url)){toast('接続先URLを確認してください');return}localStorage.setItem(URL_KEY,url);localStorage.setItem(MODEL,$('model').value);$('modelName').textContent=$('model').selectedOptions[0]?.textContent||$('model').value;closeSettings();toast('Ollama設定を保存しました')};
 $('refreshModels').onclick=async()=>{try{localStorage.setItem(URL_KEY,$('ollamaUrl').value.trim().replace(/\/+$/,''));const models=await loadModels();toast('モデル一覧を更新しました（'+models.length+'件）')}catch(e){toast('取得失敗：'+e.message)}};
 $('testConnection').onclick=async()=>{localStorage.setItem(URL_KEY,$('ollamaUrl').value.trim().replace(/\/+$/,''));await testConnection()};
 $('composer').addEventListener('submit',e=>{e.preventDefault();sendMessage($('prompt').value)});
 $('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});
 $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});
 document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>sendMessage(b.textContent.replace(/^\S+\s/,'')));
 $('openSidebar').onclick=()=>$('sidebar').classList.add('open');$('closeSidebar').onclick=()=>$('sidebar').classList.remove('open');
 $('modelName').textContent=localStorage.getItem(MODEL)||'qwen2.5-coder:3b';
 localStorage.removeItem('one-ai-api-key');
 renderHistory();renderMessages();
 setTimeout(()=>loadModels().catch(()=>{}),400);
})();
</script>
</body>
</html>
