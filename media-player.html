<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube風 PLAYBOX</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--soft:#272727;--line:#303030;--text:#f1f1f1;--muted:#aaa;--red:#f03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,"Noto Sans JP",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}
header{height:58px;position:sticky;top:0;z-index:10;background:#0f0f0ff2;display:flex;align-items:center;gap:22px;padding:0 22px}.brand{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;white-space:nowrap}.ytmark{width:31px;height:22px;border-radius:7px;background:#f03;display:grid;place-items:center;font-size:13px;color:white}.search{display:flex;max-width:650px;width:100%;margin:auto}.search input{height:44px;min-width:0;flex:1;background:#121212;border:1px solid #303030;border-radius:22px 0 0 22px;padding:0 18px;color:white}.search button{width:64px;min-height:44px;border:1px solid #303030;background:#222;border-radius:0 22px 22px 0;font-size:18px}.upload{background:var(--soft);border-radius:22px;padding:12px 18px;min-height:44px;white-space:nowrap;font-size:14px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}nav{padding:14px 12px;border-right:1px solid #222}nav button{width:100%;min-height:50px;display:flex;align-items:center;gap:22px;padding:14px 16px;border-radius:12px;background:transparent;text-align:left;font-size:15px}nav button:hover,nav button.active{background:#272727}nav .navicon{width:22px;text-align:center;font-size:19px}nav hr{border:0;border-top:1px solid #303030;margin:14px 4px}.navcaption{font-size:12px;color:var(--muted);padding:8px 14px}
main{min-width:0;padding:24px clamp(14px,3vw,42px) 50px;max-width:1500px;width:100%;margin:auto}.chips{display:flex;gap:10px;overflow:auto;padding:0 0 20px}.chip{background:#272727;border-radius:9px;padding:12px 18px;font-size:14px;min-height:44px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}
.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.watch{min-width:0}.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center}.screen video{width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#ddd;text-align:center;padding:20px;background:radial-gradient(ellipse,#252525,#080808 70%)}.empty .playmark{font-size:56px;color:#f03}.empty span{font-size:13px;color:#aaa}.screen.loaded .empty{display:none}
h1{font-size:20px;line-height:1.4;margin:16px 0 7px}.sub{color:var(--muted);font-size:13px}.playerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.transport button,.actions button{background:#272727;border-radius:22px;padding:13px 17px;min-height:48px;font-size:15px}.transport .play{background:#f1f1f1;color:#111;font-weight:900;min-width:58px;min-height:52px;font-size:19px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button.on{background:#39304a;color:#d6c8ff}.seekrow{display:flex;align-items:center;gap:9px;margin-top:14px;color:#aaa;font-size:11px;font-variant-numeric:tabular-nums}.seekrow input{flex:1;min-width:0;accent-color:#f03}.lower{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:14px}.volume{display:flex;align-items:center;gap:8px;min-width:120px;max-width:180px;flex:1}.volume input{width:100%;accent-color:#f03}.notice{font-size:12px;color:#aaa;min-height:20px;margin-top:10px}
.playlist{background:#181818;border:1px solid #303030;border-radius:12px;padding:14px;min-width:0}.plhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.plhead strong{font-size:15px}.plhead span{font-size:12px;color:#aaa}.pickers{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pickers button{background:#272727;border-radius:20px;padding:11px 14px;min-height:44px;font-size:14px}.list{display:flex;flex-direction:column;gap:5px;max-height:360px;overflow:auto}.item{display:flex;align-items:center;gap:11px;padding:13px 10px;min-height:50px;border-radius:9px;cursor:pointer;min-width:0}.item:hover{background:#292929}.item.active{background:#343434}.item .num{color:#aaa;font-size:11px;width:17px}.item .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item .remove{background:transparent;color:#aaa;font-size:18px;padding:2px 6px}.emptylist{font-size:12px;color:#999;padding:12px 4px}.urlbox{border-top:1px solid #333;margin-top:14px;padding-top:14px}.urlbox label{display:block;color:#aaa;font-size:12px;margin-bottom:8px}.urlrow{display:flex;gap:6px}.urlrow input{min-width:0;flex:1;background:#101010;border:1px solid #444;border-radius:8px;padding:9px;color:white}.urlrow button{background:#333;border-radius:9px;padding:0 16px;min-height:44px;font-size:14px}.hint{font-size:11px;color:#999;line-height:1.6;margin:8px 0 0}.drop{margin-top:12px;border:1px dashed #555;border-radius:9px;padding:13px;text-align:center;color:#aaa;font-size:11px}.drop.over{background:#292929;border-color:#f03}.footer{text-align:center;color:#777;font-size:11px;margin-top:25px}
@media(max-width:1050px){.content{grid-template-columns:minmax(0,1fr) 300px}.shell{grid-template-columns:76px minmax(0,1fr)}nav button{justify-content:center;padding:13px 4px}nav .navtext,.navcaption{display:none}nav hr{margin:12px 0}}
@media(max-width:720px){header{padding:0 12px;gap:12px}.brand{font-size:17px}.search{max-width:none}.search button{width:46px}.upload{display:none}.shell{display:block}nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#111;z-index:12;border:0;border-top:1px solid #333;display:flex;justify-content:space-around;padding:3px 5px}nav button{width:auto;flex:1;display:flex;flex-direction:column;gap:2px;padding:4px;font-size:10px}nav .navicon{font-size:18px}nav .navtext{display:block}nav hr,.navcaption{display:none}main{padding:15px 12px 78px}.content{grid-template-columns:1fr}.playlist{order:2}.list{max-height:230px}.chips{padding-bottom:14px}}
@media(max-width:420px){header{height:52px}.brand{font-size:0}.ytmark{width:30px}.search input{height:36px;font-size:13px;padding:0 12px}.search button{height:36px}.transport button,.actions button{padding:9px 11px;font-size:12px}.playerbar{align-items:flex-start}.actions{width:100%}h1{font-size:18px}}
</style>
</head>
<body>
<header><div class="brand"><span class="ytmark">▶</span> PLAYBOX</div><div class="search"><input id="search" type="search" placeholder="再生リスト内を検索"><button id="searchBtn" aria-label="検索">⌕</button></div><button class="upload" id="pickFiles">＋ 作成</button></header>
<div class="shell">
<nav>
<button class="active" id="homeNav"><span class="navicon">⌂</span><span class="navtext">ホーム</span></button>
<button id="libraryNav"><span class="navicon">▤</span><span class="navtext">ライブラリ</span></button>
<hr><div class="navcaption">PLAYBOX</div>
<button id="videoNav"><span class="navicon">▣</span><span class="navtext">動画</span></button>
<button id="audioNav"><span class="navicon">♫</span><span class="navtext">音楽</span></button>
</nav>
<main>
<div class="chips"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="video">動画</button><button class="chip" data-filter="audio">音楽</button><button class="chip" data-filter="recent">最近追加</button></div>
<div class="content">
<section class="watch">
<div class="screen" id="screen"><video id="video" playsinline preload="metadata"></video><div class="empty" id="empty"><div class="playmark">▶</div><strong>動画や音楽を再生しよう</strong><span>「＋ 作成」からファイルを選択できます</span></div></div>
<h1 id="track">再生するメディアがありません</h1><div class="sub" id="kind">PLAYBOX メディアプレーヤー</div>
<div class="seekrow"><span id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><span id="duration">0:00</span></div>
<div class="playerbar"><div class="transport"><button id="back">↶ 10秒</button><button class="play" id="play">▶</button><button id="forward">10秒 ↷</button></div><div class="actions"><button id="loop">🔁 OFF</button><button id="pip">▣ PiP</button><button id="speed">1.0×</button><button id="fullscreen">⛶</button></div></div>
<div class="lower"><div class="volume"><span id="volIcon">🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="音量"></div></div><div class="notice" id="notice" role="status"></div>
</section>
<aside class="playlist"><div class="plhead"><strong>再生リスト</strong><span id="count">0 件</span></div>
<div class="pickers"><button id="pickVideo">🎬 動画</button><button id="pickAudio">♫ 音声</button><button id="clear">リストを空にする</button></div>
<input id="files" type="file" accept="video/*,audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple hidden><input id="videos" type="file" accept="video/*" multiple hidden><input id="audios" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple hidden>
<div class="list" id="list"><div class="emptylist">ファイルを追加すると、ここに表示されます。</div></div>
<div class="urlbox"><label for="url">動画・音声のURLから再生</label><div class="urlrow"><input id="url" type="url" placeholder="https://example.com/video.mp4"><button id="loadUrl">開く</button></div><p class="hint">配信元が外部再生を許可しているURLに対応します。</p></div>
<div class="drop" id="drop">ファイルをここにドロップして追加</div>
</aside>
</div>
<div class="footer">PLAYBOX · ファイルはブラウザ内で再生され、サーバーへアップロードされません。</div>
</main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const v=$('video'),screen=$('screen'),files=$('files'),videos=$('videos'),audios=$('audios');
let queue=[],index=-1,speedIndex=2,objectUrls=[],loopMode=0,filter='all';
const DB_NAME='playbox-media-library',DB_VERSION=1,STORE='items';
let dbPromise;
function openDB(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB非対応'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
function dbRequest(mode,action){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let req;try{req=action(store)}catch(e){reject(e);return}req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}))}
function persistItem(item,file){return dbRequest('readwrite',s=>s.put({id:item.id,name:item.name,type:item.type,added:item.added,src:item.src.startsWith('blob:')?'':item.src,file:file||null}))}
function deleteSavedItem(id){return dbRequest('readwrite',s=>s.delete(id))}
function clearSavedItems(){return dbRequest('readwrite',s=>s.clear())}
async function restoreItems(){try{const saved=await dbRequest('readonly',s=>s.getAll());saved.sort((a,b)=>a.added-b.added);saved.forEach(x=>{const src=x.file?URL.createObjectURL(x.file):x.src;if(!src)return;if(x.file)objectUrls.push(src);queue.push({id:x.id,name:x.name,src,type:x.type,added:x.added})});render();if(queue.length){say(queue.length+'件のファイルを復元しました');playAt(0)}}catch(e){say('保存データを読み込めませんでした: '+(e.message||''))}}
const speeds=[.5,.75,1,1.25,1.5,1.75,2];
const fmt=n=>{if(!Number.isFinite(n)||n<0)return'0:00';const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60).toString().padStart(2,'0');return h?h+':'+m.toString().padStart(2,'0')+':'+s:m+':'+s};
function say(t){$('notice').textContent=t}
function mediaKind(file){const ext=(file.name.split('.').pop()||'').toLowerCase();const audioExt=['mp3','m4a','aac','wav','ogg','oga','flac','opus','wma'];const videoExt=['mp4','m4v','webm','mov','mkv','avi','ogv','3gp','mpeg','mpg'];if(file.type.startsWith('audio/')||audioExt.includes(ext))return'audio';if(file.type.startsWith('video/')||videoExt.includes(ext))return'video';return''}
async function addFiles(fileList){const arr=[...fileList].filter(f=>mediaKind(f));if(!arr.length){say('動画・音声ファイルを選択してください（MP3対応）');return}for(const file of arr){const kind=mediaKind(file),id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());const src=URL.createObjectURL(file);objectUrls.push(src);const item={id,name:file.name,src,type:kind+'/'+(file.type.split('/')[1]||'unknown'),added:Date.now()};queue.push(item);try{await persistItem(item,file)}catch(e){say('保存に失敗しました。ブラウザの保存容量を確認してください');}}render();if(index<0)playAt(0);else say(arr.length+'件を追加・保存しました')}
function visibleItems(){return queue.map((item,i)=>({...item,i})).filter(x=>filter==='all'||filter==='recent'||(filter==='video'?x.type.startsWith('video/'):x.type.startsWith('audio/')))}
function render(){const shown=visibleItems();$('count').textContent=queue.length+' 件';const list=$('list');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="emptylist">表示できるメディアがありません。</div>';return}shown.forEach(item=>{const row=document.createElement('div');row.className='item'+(item.i===index?' active':'');const num=document.createElement('span');num.className='num';num.textContent=String(item.i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=item.name;const del=document.createElement('button');del.className='remove';del.textContent='×';del.title='リストから削除';del.onclick=e=>{e.stopPropagation();removeAt(item.i)};row.onclick=()=>playAt(item.i);row.append(num,name,del);list.append(row)})}
let sourceToken=0;function playAt(i){if(i<0||i>=queue.length)return;const item=queue[i];if(index===i&&v.src===item.src){if(v.paused)v.play().catch(()=>say('再生できませんでした'));return}index=i;const token=++sourceToken;v.pause();v.src=item.src;v.load();$('track').textContent=item.name;$('kind').textContent=item.type.startsWith('audio/')?'♫ 音楽':'▶ 動画';screen.classList.add('loaded');$('current').textContent='0:00';$('duration').textContent='0:00';$('seek').value=0;render();v.play().then(()=>{if(token===sourceToken)$('play').textContent='Ⅱ'}).catch(()=>{if(token===sourceToken){$('play').textContent='▶';say('再生できない場合は形式やブラウザ対応を確認してください')}})}
async function removeAt(i){const was=i===index;const removed=queue[i];if(removed){try{await deleteSavedItem(removed.id)}catch(e){say('保存データの削除に失敗しました')}if(removed.src.startsWith('blob:')){URL.revokeObjectURL(removed.src);objectUrls=objectUrls.filter(x=>x!==removed.src)}}queue.splice(i,1);if(i<index)index--;else if(was)index=-1;if(!queue.length){v.pause();v.removeAttribute('src');v.load();$('track').textContent='再生するメディアがありません';$('kind').textContent='PLAYBOX メディアプレーヤー';screen.classList.remove('loaded')}else if(was)playAt(Math.min(i,queue.length-1));render()}
function toggle(){if(!v.src){say('先にメディアを選択してください');return}if(v.paused)v.play().catch(()=>say('再生できませんでした'));else v.pause()}
$('pickFiles').onclick=()=>files.click();$('pickVideo').onclick=()=>videos.click();$('pickAudio').onclick=()=>audios.click();
[files,videos,audios].forEach(el=>el.addEventListener('change',()=>{addFiles(el.files);el.value=''}));
$('play').onclick=toggle;v.addEventListener('play',()=>$('play').textContent='Ⅱ');v.addEventListener('pause',()=>$('play').textContent='▶');
v.addEventListener('timeupdate',()=>{if(v.duration){$('seek').value=v.currentTime/v.duration*1000;$('current').textContent=fmt(v.currentTime);$('duration').textContent=fmt(v.duration)}});
v.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(v.duration)});
$('seek').addEventListener('input',()=>{if(v.duration)v.currentTime=Number($('seek').value)/1000*v.duration});
$('back').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10)};
$('forward').onclick=()=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(v.duration,v.currentTime+10);else v.currentTime+=10};
$('volume').oninput=()=>{v.volume=Number($('volume').value);v.muted=v.volume===0;$('volIcon').textContent=v.muted?'🔇':'🔊'};
$('volIcon').onclick=()=>{v.muted=!v.muted;$('volIcon').textContent=v.muted?'🔇':'🔊'};
$('speed').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;v.playbackRate=speeds[speedIndex];$('speed').textContent=speeds[speedIndex].toFixed(1)+'×'};
$('pip').onclick=async()=>{try{if(!document.pictureInPictureEnabled||!v.requestPictureInPicture)throw new Error('このブラウザはPiPに対応していません');if(!v.src)throw new Error('先にメディアを選択してください');if(document.pictureInPictureElement)await document.exitPictureInPicture();else await v.requestPictureInPicture()}catch(e){say(e.message||'PiPを開始できませんでした')}};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await screen.requestFullscreen()}catch(e){say('全画面表示を開始できませんでした')}};
function updateLoopButton(){const b=$('loop'),labels=['🔁 OFF','🔂 1曲','🔁 全曲'];b.textContent=labels[loopMode];b.classList.toggle('on',loopMode!==0);b.title=['ループOFF','1曲リピート','全曲リピート'][loopMode]}
$('loop').onclick=()=>{loopMode=(loopMode+1)%3;updateLoopButton();say(['ループOFF','現在の曲をリピート','再生リスト全体をリピート'][loopMode])};updateLoopButton();
v.addEventListener('ended',()=>{if(!queue[index]||!v.src)return;if(loopMode===1){v.currentTime=0;v.play().catch(()=>{});return}if(index<queue.length-1)playAt(index+1);else if(loopMode===2&&queue.length)playAt(0);else $('play').textContent='▶'});
$('loadUrl').onclick=async()=>{const src=$('url').value.trim();if(!src){say('URLを入力してください');return}try{const u=new URL(src);if(!['http:','https:'].includes(u.protocol))throw new Error();const item={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),name:u.pathname.split('/').pop()||u.hostname,src:u.href,type:'video/unknown',added:Date.now()};queue.push(item);try{await persistItem(item,null)}catch(e){}render();playAt(queue.length-1)}catch(e){say('有効なHTTPまたはHTTPSのURLを入力してください')}};
$('clear').onclick=async()=>{if(!queue.length)return;v.pause();v.removeAttribute('src');v.load();queue=[];index=-1;try{await clearSavedItems()}catch(e){say('保存データの削除に失敗しました')}objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];screen.classList.remove('loaded');$('track').textContent='再生するメディアがありません';$('kind').textContent='PLAYBOX メディアプレーヤー';$('current').textContent='0:00';$('duration').textContent='0:00';$('seek').value=0;$('play').textContent='▶';render();say('再生リストと保存データを削除しました')};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('searchBtn').onclick=()=>{const q=$('search').value.trim().toLocaleLowerCase();document.querySelectorAll('.item').forEach(row=>row.style.display=row.querySelector('.name').textContent.toLocaleLowerCase().includes(q)?'flex':'none')};
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
$('homeNav').onclick=()=>{filter='all';document.querySelector('[data-filter="all"]').click()};
$('libraryNav').onclick=()=>{$('list').scrollIntoView({behavior:'smooth',block:'center'})};
$('videoNav').onclick=()=>document.querySelector('[data-filter="video"]').click();
$('audioNav').onclick=()=>document.querySelector('[data-filter="audio"]').click();
const drop=$('drop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowLeft'&&v.src)v.currentTime=Math.max(0,v.currentTime-5);if(e.code==='ArrowRight'&&v.src)v.currentTime+=5});
window.addEventListener('beforeunload',()=>objectUrls.forEach(URL.revokeObjectURL));
restoreItems();
})();
</script>
</body>
</html>
