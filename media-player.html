<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube風 PLAYBOX</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--soft:#272727;--line:#303030;--text:#f1f1f1;--muted:#aaa;--red:#f03}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,"Noto Sans JP",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}
header{height:58px;position:sticky;top:0;z-index:10;background:#0f0f0ff2;display:flex;align-items:center;gap:22px;padding:0 22px}.brand{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;white-space:nowrap}.ytmark{width:31px;height:22px;border-radius:7px;background:#f03;display:grid;place-items:center;font-size:13px;color:white}.search{display:flex;max-width:650px;width:100%;margin:auto}.search input{height:44px;min-width:0;flex:1;background:#121212;border:1px solid #303030;border-radius:22px 0 0 22px;padding:0 18px;color:white}.search button{width:64px;min-height:44px;border:1px solid #303030;background:#222;border-radius:0 22px 22px 0;font-size:18px}.upload{background:var(--soft);border-radius:22px;padding:12px 18px;min-height:44px;white-space:nowrap;font-size:14px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}nav{padding:14px 12px;border-right:1px solid #222}nav button{width:100%;min-height:50px;display:flex;align-items:center;gap:22px;padding:14px 16px;border-radius:12px;background:transparent;text-align:left;font-size:15px}nav button:hover,nav button.active{background:#272727}nav .navicon{width:22px;text-align:center;font-size:19px}nav hr{border:0;border-top:1px solid #303030;margin:14px 4px}.navcaption{font-size:12px;color:var(--muted);padding:8px 14px}
main{min-width:0;padding:24px clamp(14px,3vw,42px) 50px;max-width:1500px;width:100%;margin:auto}.chips{display:flex;gap:10px;overflow:auto;padding:0 0 20px}.chip{background:#272727;border-radius:9px;padding:12px 18px;font-size:14px;min-height:44px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}
.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.watch{min-width:0}.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center}.screen video{width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#ddd;text-align:center;padding:20px;background:radial-gradient(ellipse,#252525,#080808 70%)}.empty .playmark{font-size:56px;color:#f03}.empty span{font-size:13px;color:#aaa}.screen.loaded .empty{display:none}
h1{font-size:20px;line-height:1.4;margin:16px 0 7px}.sub{color:var(--muted);font-size:13px}.playerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.transport button,.actions button{background:#272727;border-radius:22px;padding:13px 17px;min-height:48px;font-size:15px}.transport .play{background:#f1f1f1;color:#111;font-weight:900;min-width:58px;min-height:52px;font-size:19px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button.on{background:#39304a;color:#d6c8ff}.seekrow{display:flex;align-items:center;gap:9px;margin-top:14px;color:#aaa;font-size:11px;font-variant-numeric:tabular-nums}.seekrow input{flex:1;min-width:0;accent-color:#f03}.lower{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:14px}.volume{display:flex;align-items:center;gap:8px;min-width:120px;max-width:180px;flex:1}.volume input{width:100%;accent-color:#f03}.notice{font-size:12px;color:#aaa;min-height:20px;margin-top:10px}
.playlist{background:#181818;border:1px solid #303030;border-radius:12px;padding:14px;min-width:0}.plhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.playlist-tools{display:flex;gap:7px;align-items:center;margin:0 0 12px}.playlist-tools select{flex:1;min-width:0;background:#272727;color:#fff;border:1px solid #444;border-radius:9px;padding:11px 9px;min-height:44px}.playlist-tools button{background:#303030;border-radius:9px;padding:10px 13px;min-height:44px}.playlist-tools .random.on{background:#49351b;color:#ffd27a}.plhead strong{font-size:15px}.plhead span{font-size:12px;color:#aaa}.pickers{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pickers button{background:#272727;border-radius:20px;padding:11px 14px;min-height:44px;font-size:14px}.list{display:flex;flex-direction:column;gap:5px;max-height:360px;overflow:auto}.item{display:flex;align-items:center;gap:9px;padding:10px 8px;min-height:54px;border-radius:9px;cursor:grab;min-width:0}.item.dragging{opacity:.4}.item.dragover{outline:2px solid #3ea6ff}.item:hover{background:#292929}.item.active{background:#343434}.item .num{color:#aaa;font-size:11px;width:17px}.item .handle{color:#888;font-size:18px;padding:5px;cursor:grab;touch-action:none}.item .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item .remove{background:transparent;color:#aaa;font-size:18px;padding:5px 8px;min-width:34px;min-height:38px}.item .move{background:#303030;color:#ddd;border-radius:7px;padding:5px 8px;min-width:34px;min-height:38px}.emptylist{font-size:12px;color:#999;padding:12px 4px}.urlbox{border-top:1px solid #333;margin-top:14px;padding-top:14px}.urlbox label{display:block;color:#aaa;font-size:12px;margin-bottom:8px}.urlrow{display:flex;gap:6px}.urlrow input{min-width:0;flex:1;background:#101010;border:1px solid #444;border-radius:8px;padding:9px;color:white}.urlrow button{background:#333;border-radius:9px;padding:0 16px;min-height:44px;font-size:14px}.hint{font-size:11px;color:#999;line-height:1.6;margin:8px 0 0}.drop{margin-top:12px;border:1px dashed #555;border-radius:9px;padding:13px;text-align:center;color:#aaa;font-size:11px}.drop.over{background:#292929;border-color:#f03}.footer{text-align:center;color:#777;font-size:11px;margin-top:25px}
@media(max-width:1050px){.content{grid-template-columns:minmax(0,1fr) 300px}.shell{grid-template-columns:76px minmax(0,1fr)}nav button{justify-content:center;padding:13px 4px}nav .navtext,.navcaption{display:none}nav hr{margin:12px 0}}
@media(max-width:720px){header{padding:0 12px;gap:12px}.brand{font-size:17px}.search{max-width:none}.search button{width:46px}.upload{display:none}.shell{display:block}nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#111;z-index:12;border:0;border-top:1px solid #333;display:flex;justify-content:space-around;padding:3px 5px}nav button{width:auto;flex:1;display:flex;flex-direction:column;gap:2px;padding:4px;font-size:10px}nav .navicon{font-size:18px}nav .navtext{display:block}nav hr,.navcaption{display:none}main{padding:15px 12px 78px}.content{grid-template-columns:1fr}.playlist{order:2}.list{max-height:230px}.chips{padding-bottom:14px}}
@media(max-width:420px){header{height:52px}.brand{font-size:0}.ytmark{width:30px}.search input{height:36px;font-size:13px;padding:0 12px}.search button{height:36px}.transport button,.actions button{padding:9px 11px;font-size:12px}.playerbar{align-items:flex-start}.actions{width:100%}h1{font-size:18px}}
</style>
</head>
<body>
<header><div class="brand"><span class="ytmark">▶</span> PLAYBOX</div><div class="search"><input id="search" type="search" placeholder="再生リスト内を検索"><button id="searchBtn" aria-label="検索">⌕</button></div><button class="upload" id="pickFiles">＋ 作成</button></header>
<div class="shell">
<nav>
<button class="active" id="homeNav"><span class="navicon">⌂</span><span class="navtext">ホーム</span></button>
<button id="libraryNav"><span class="navicon">▤</span><span class="navtext">ライブラリ</span></button>
<hr><div class="navcaption">PLAYBOX</div>
<button id="videoNav"><span class="navicon">▣</span><span class="navtext">動画</span></button>
<button id="audioNav"><span class="navicon">♫</span><span class="navtext">音楽</span></button>
</nav>
<main>
<div class="chips"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="video">動画</button><button class="chip" data-filter="audio">音楽</button><button class="chip" data-filter="recent">最近追加</button></div>
<div class="content">
<section class="watch">
<div class="screen" id="screen"><video id="video" playsinline preload="metadata"></video><div class="empty" id="empty"><div class="playmark">▶</div><strong>動画や音楽を再生しよう</strong><span>「＋ 作成」からファイルを選択できます</span></div></div>
<h1 id="track">再生するメディアがありません</h1><div class="sub" id="kind">PLAYBOX メディアプレーヤー</div>
<div class="seekrow"><span id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><span id="duration">0:00</span></div>
<div class="playerbar"><div class="transport"><button id="back">↶ 10秒</button><button class="play" id="play">▶</button><button id="forward">10秒 ↷</button></div><div class="actions"><button id="loop">🔁 OFF</button><button id="pip">▣ PiP</button><button id="speed">1.0×</button><button id="fullscreen">⛶</button></div></div>
<div class="lower"><div class="volume"><span id="volIcon">🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="音量"></div></div><div class="notice" id="notice" role="status"></div>
</section>
<aside class="playlist"><div class="plhead"><strong>再生リスト</strong><span id="count">0 件</span></div>
<div class="playlist-tools"><select id="playlistSelect" aria-label="プレイリストを選択"></select><button id="newPlaylist">＋ 新規</button><button id="deletePlaylist">削除</button></div><div class="pickers"><button id="pickVideo">🎬 動画</button><button id="pickAudio">♫ 音声</button><button id="random" class="random">🔀 ランダム</button><button id="clear">このリストを空にする</button></div>
<input id="files" type="file" accept="video/*,audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple hidden><input id="videos" type="file" accept="video/*" multiple hidden><input id="audios" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple hidden>
<div class="list" id="list"><div class="emptylist">ファイルを追加すると、ここに表示されます。</div></div>

<div class="drop" id="drop">ファイルをここにドロップして追加</div>
</aside>
</div>
<div class="footer">PLAYBOX · ファイルはブラウザ内で再生され、サーバーへアップロードされません。</div>
</main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),v=$('video'),screen=$('screen'),files=$('files'),videos=$('videos'),audios=$('audios');
const DB='playbox-media-library',STORE='items';let dbPromise,playlists=[],activePlaylist='default',queue=[],index=-1,objectUrls=[],loopMode=0,speedIndex=2,filter='all',shuffle=false,history=[];
const speeds=[.5,.75,1,1.25,1.5,1.75,2],fmt=n=>{if(!Number.isFinite(n)||n<0)return'0:00';const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60).toString().padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
function say(t){$('notice').textContent=t}
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function allRecords(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function put(record){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function del(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function mediaKind(f){const ext=(f.name.split('.').pop()||'').toLowerCase(),ae=['mp3','m4a','aac','wav','ogg','oga','flac','opus','wma'],ve=['mp4','m4v','webm','mov','mkv','avi','ogv','3gp','mpeg','mpg'];if(f.type.startsWith('audio/')||ae.includes(ext))return'audio';if(f.type.startsWith('video/')||ve.includes(ext))return'video';return''}
function currentItems(){return queue}
async function saveOrder(){for(let i=0;i<queue.length;i++){const item=queue[i];item.order=i;await put({...item,src:item.file?'':item.src,file:item.file||null})}}
function renderPlaylists(){const sel=$('playlistSelect');sel.innerHTML='';playlists.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.append(o)});sel.value=activePlaylist}
function render(){const list=$('list'),shown=queue.map((x,i)=>({...x,i})).filter(x=>filter==='all'||filter==='recent'||(filter==='video'?x.type.startsWith('video/'):x.type.startsWith('audio/')));$('count').textContent=queue.length+' 件';list.innerHTML='';if(!shown.length){list.innerHTML='<div class="emptylist">このプレイリストにはファイルがありません。</div>';return}shown.forEach(item=>{const row=document.createElement('div');row.className='item'+(item.i===index?' active':'');row.draggable=true;const handle=document.createElement('span');handle.className='handle';handle.textContent='⠿';const num=document.createElement('span');num.className='num';num.textContent=String(item.i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=item.name;const up=document.createElement('button');up.className='move';up.textContent='↑';up.onclick=e=>{e.stopPropagation();moveItem(item.i,item.i-1)};const down=document.createElement('button');down.className='move';down.textContent='↓';down.onclick=e=>{e.stopPropagation();moveItem(item.i,item.i+1)};const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.onclick=e=>{e.stopPropagation();removeAt(item.i)};row.addEventListener('dragstart',e=>{row.classList.add('dragging');e.dataTransfer.setData('text/plain',String(item.i))});row.addEventListener('dragend',()=>row.classList.remove('dragging'));row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();moveItem(Number(e.dataTransfer.getData('text/plain')),item.i)});row.onclick=()=>playAt(item.i);row.append(handle,num,name,up,down,remove);list.append(row)})}
async function loadPlaylist(id){activePlaylist=id;queue=[];index=-1;history=[];v.pause();v.removeAttribute('src');v.load();screen.classList.remove('loaded');$('track').textContent='再生するメディアがありません';$('kind').textContent='PLAYBOX メディアプレーヤー';const all=await allRecords();queue=all.filter(x=>!x.isPlaylist&&(x.playlistId||'default')===id).sort((a,b)=>(a.order??a.added)-(b.order??b.added)).map(x=>{const src=x.file?URL.createObjectURL(x.file):x.src;if(x.file)objectUrls.push(src);return{id:x.id,name:x.name,type:x.type,added:x.added,src,file:x.file||null,order:x.order??0}});renderPlaylists();render()}
async function init(){try{const all=await allRecords();playlists=all.filter(x=>x.isPlaylist).map(x=>({id:x.id,name:x.name}));if(!playlists.length){playlists=[{id:'default',name:'再生リスト 1'}];await put({id:'__playlist__default',isPlaylist:true,name:'再生リスト 1',playlistId:'default'});const legacy=all.filter(x=>!x.isPlaylist);for(let i=0;i<legacy.length;i++){legacy[i].playlistId='default';legacy[i].order=i;await put(legacy[i])}}else{playlists=playlists.map(p=>({id:p.playlistId||p.id.replace('__playlist__',''),name:p.name}));}activePlaylist=playlists[0].id;await loadPlaylist(activePlaylist);if(queue.length)say(queue.length+'件のファイルを復元しました')}catch(e){say('保存データを読み込めませんでした: '+e.message)}}
async function addFiles(filesIn){const arr=[...filesIn].filter(mediaKind);if(!arr.length){say('動画・音声ファイルを選択してください（MP3対応）');return}for(const f of arr){const kind=mediaKind(f),id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),src=URL.createObjectURL(f);objectUrls.push(src);const item={id,name:f.name,type:kind+'/'+(f.type.split('/')[1]||'unknown'),added:Date.now(),playlistId:activePlaylist,order:queue.length,src,file:f};queue.push(item);try{await put({...item,src:'',file:f})}catch(e){say('保存容量不足などで保存できませんでした')}}render();if(index<0)playAt(0);else say(arr.length+'件を追加しました')}
let token=0;
function updateMedia(){if(!('mediaSession'in navigator)||index<0)return;try{navigator.mediaSession.metadata=new MediaMetadata({title:queue[index].name,artist:'PLAYBOX',album:playlists.find(p=>p.id===activePlaylist)?.name||'PLAYBOX'});navigator.mediaSession.playbackState=v.paused?'paused':'playing'}catch(e){}}
function playAt(i){if(i<0||i>=queue.length)return;index=i;history.push(i);const t=++token,item=queue[i];v.pause();v.src=item.src;v.load();$('track').textContent=item.name;$('kind').textContent=item.type.startsWith('audio/')?'♫ 音楽':'▶ 動画';screen.classList.add('loaded');$('seek').value=0;$('current').textContent='0:00';$('duration').textContent='0:00';render();updateMedia();v.play().catch(()=>{if(t===token)say('この形式はブラウザで再生できない可能性があります')})}
function nextIndex(){if(!queue.length)return-1;if(shuffle&&queue.length>1){let choices=queue.map((_,i)=>i).filter(i=>i!==index);return choices[Math.floor(Math.random()*choices.length)]}return index+1<queue.length?index+1:(loopMode===2?0:-1)}
function next(){const n=nextIndex();if(n>=0)playAt(n);else $('play').textContent='▶'}
async function removeAt(i){const was=i===index,item=queue[i];if(!item)return;queue.splice(i,1);await del(item.id);if(item.src)URL.revokeObjectURL(item.src);if(i<index)index--;else if(was)index=-1;if(was&&queue.length)playAt(Math.min(i,queue.length-1));else if(!queue.length){v.pause();v.removeAttribute('src');v.load();screen.classList.remove('loaded');$('track').textContent='再生するメディアがありません'}await saveOrder();render()}
function moveItem(from,to){if(from<0||to<0||from>=queue.length||to>=queue.length||from===to)return;const [x]=queue.splice(from,1);queue.splice(to,0,x);if(index===from)index=to;else if(from<index&&to>=index)index--;else if(from>index&&to<=index)index++;render();saveOrder();say('並び順を保存しました')}
function toggle(){if(!v.src){say('先にファイルを追加してください');return}if(v.paused)v.play().catch(()=>say('再生できませんでした'));else v.pause()}
$('pickFiles').onclick=()=>files.click();$('pickVideo').onclick=()=>videos.click();$('pickAudio').onclick=()=>audios.click();[files,videos,audios].forEach(el=>el.onchange=()=>{addFiles(el.files);el.value=''});
$('play').onclick=toggle;v.onplay=()=>{$('play').textContent='Ⅱ';updateMedia()};v.onpause=()=>{$('play').textContent='▶';updateMedia()};v.ontimeupdate=()=>{if(v.duration){$('seek').value=v.currentTime/v.duration*1000;$('current').textContent=fmt(v.currentTime);$('duration').textContent=fmt(v.duration)}};v.onloadedmetadata=()=>{$('duration').textContent=fmt(v.duration)};v.onended=()=>{if(loopMode===1){v.currentTime=0;v.play();return}next()};$('seek').oninput=()=>{if(v.duration)v.currentTime=Number($('seek').value)/1000*v.duration};
$('back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-10);$('forward').onclick=()=>v.currentTime=Math.min(v.duration||Infinity,v.currentTime+10);$('volume').oninput=()=>v.volume=Number($('volume').value);$('speed').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;v.playbackRate=speeds[speedIndex];$('speed').textContent=speeds[speedIndex].toFixed(1)+'×'};
$('pip').onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await v.requestPictureInPicture()}catch(e){say('PiPに対応していないか、再生中ではありません')}};$('fullscreen').onclick=()=>screen.requestFullscreen?.();
$('loop').onclick=()=>{loopMode=(loopMode+1)%3;$('loop').textContent=['🔁 OFF','🔂 1曲','🔁 全曲'][loopMode]};$('random').onclick=()=>{shuffle=!shuffle;$('random').classList.toggle('on',shuffle);say(shuffle?'ランダム再生 ON':'ランダム再生 OFF');if(shuffle&&queue.length>1){const n=nextIndex();if(n>=0)playAt(n)}};
$('playlistSelect').onchange=e=>loadPlaylist(e.target.value);
$('newPlaylist').onclick=async()=>{const name=prompt('新しいプレイリスト名');if(!name||!name.trim())return;const id='pl-'+(crypto.randomUUID?crypto.randomUUID():Date.now());const p={id,name:name.trim()};playlists.push(p);await put({id:'__playlist__'+id,playlistId:id,isPlaylist:true,name:p.name});await loadPlaylist(id)};
$('deletePlaylist').onclick=async()=>{if(playlists.length<=1){say('最後のプレイリストは削除できません');return}if(!confirm('このプレイリストと中のファイルを削除しますか？'))return;for(const item of queue)await del(item.id);await del('__playlist__'+activePlaylist);playlists=playlists.filter(p=>p.id!==activePlaylist);await loadPlaylist(playlists[0].id)};
$('clear').onclick=async()=>{if(!queue.length)return;if(!confirm('このプレイリスト内のファイルだけを削除しますか？'))return;for(const item of queue)await del(item.id);queue=[];index=-1;v.pause();v.removeAttribute('src');v.load();screen.classList.remove('loaded');$('track').textContent='再生するメディアがありません';$('kind').textContent='PLAYBOX メディアプレーヤー';render();say('このプレイリストを空にしました。他のプレイリストは残っています')};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});$('searchBtn').onclick=()=>{const q=$('search').value.toLowerCase();document.querySelectorAll('.item').forEach(row=>row.style.display=row.querySelector('.name').textContent.toLowerCase().includes(q)?'flex':'none')};$('search').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click()};
$('homeNav').onclick=()=>document.querySelector('[data-filter="all"]').click();$('libraryNav').onclick=()=>$('list').scrollIntoView({behavior:'smooth'});$('videoNav').onclick=()=>document.querySelector('[data-filter="video"]').click();$('audioNav').onclick=()=>document.querySelector('[data-filter="audio"]').click();
const drop=$('drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>addFiles(e.dataTransfer.files);
if('mediaSession'in navigator){const handlers={play:()=>v.play(),pause:()=>v.pause(),nexttrack:next,previoustrack:()=>playAt(Math.max(0,index-1)),seekbackward:()=>v.currentTime=Math.max(0,v.currentTime-10),seekforward:()=>v.currentTime=Math.min(v.duration||Infinity,v.currentTime+10)};Object.entries(handlers).forEach(([k,fn])=>{try{navigator.mediaSession.setActionHandler(k,fn)}catch(e){}})}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowLeft'&&v.src)v.currentTime=Math.max(0,v.currentTime-5);if(e.code==='ArrowRight'&&v.src)v.currentTime+=5});
init();
})();
</script>
</body>
</html>
