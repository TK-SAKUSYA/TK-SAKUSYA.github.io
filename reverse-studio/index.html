<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逆再生スタジオ</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--line:#2a3551;--text:#f4f7ff;--muted:#a7b3cc;--a:#7c5cff;--b:#24d6b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182342,#0b1020 60%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:24px 16px 44px}.head{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{font-size:28px;background:linear-gradient(135deg,var(--a),#bd5cff);padding:12px;border-radius:15px}.head h1{font-size:clamp(24px,5vw,34px);margin:0}.muted{color:var(--muted);font-size:13px;line-height:1.7}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.drop{background:#0e1629;border:2px dashed #465477;border-radius:14px;text-align:center;padding:25px 12px}.drop strong{display:block;margin:8px}.btn{border:0;border-radius:11px;padding:12px 15px;background:#293653;color:var(--text);font-weight:750;cursor:pointer;margin:4px}.primary{background:linear-gradient(120deg,var(--a),#a24bff)}.green{background:linear-gradient(120deg,#13a98c,var(--b));color:#041c19}button:disabled{opacity:.4;cursor:not-allowed}video,canvas.preview{width:100%;max-height:460px;object-fit:contain;background:#05070d;border-radius:12px;display:block}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{min-height:24px;font-size:14px;line-height:1.6}.good{color:#69efd2}.error{color:#ff9cac}.bar{height:9px;background:#0b1120;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}a{color:inherit;text-decoration:none}.hidden{display:none!important}input{display:none}.note{border-left:3px solid #f0b84b;background:#2a2418;padding:10px;border-radius:0 8px 8px 0;color:#f6dfaa;font-size:13px}.foot{text-align:center;color:#7887a5;font-size:12px;margin-top:22px}@media(max-width:560px){.panel{padding:13px}.row{flex-direction:column}.btn{width:100%;margin:4px 0}}
</style></head><body><main>
<header class="head"><div class="logo">🔄</div><div><h1>逆再生スタジオ</h1><div class="muted">動画を逆順にしてWebM形式で保存</div></div></header>
<section class="panel"><div class="drop" id="drop"><div style="font-size:38px">🎬</div><strong>動画を選択してスタート</strong><div class="muted">動画はブラウザ内で処理され、外部には送信されません。</div><button id="choose" class="btn primary">📁 動画を選択</button></div><input id="file" type="file" accept="video/*"><p class="muted">※まずは短い動画で試してください。音声は出力されません。長い動画はメモリを多く使用します。</p></section>
<section id="vp" class="panel hidden"><strong>📺 元の動画</strong><p id="meta" class="muted"></p><video id="src" controls playsinline></video><div class="row"><button id="normal" class="btn">▶️ 通常プレビュー</button><button id="prev" class="btn">⏪ 逆再生プレビュー</button></div><canvas id="pc" class="preview hidden"></canvas></section>
<section id="ep" class="panel hidden"><strong>🛠️ 逆再生動画を作成</strong><p class="muted">映像フレームを逆順にしてWebMへ書き出します。音声は含まれません。</p><button id="make" class="btn primary" disabled>🔄 逆再生動画を作成</button><button id="cancel" class="btn hidden">中止</button><div class="bar"><span id="prog"></span></div><div id="status" class="status">動画を選択してください。</div><div id="dw" class="hidden"><a id="dl" class="btn green" download="reverse-video.webm">⬇️ 逆再生動画を保存</a></div><div id="warning" class="note hidden"></div></section><div class="foot">Reverse Studio · HTML単体 / 外部ライブラリ不要</div>
</main><script>
(()=>{const $=id=>document.getElementById(id),f=$('file'),v=$('src'),s=$('status');let url=null,out=null,cancel=false,busy=false,frames=[];
const say=(t,k='')=>{s.textContent=t;s.className='status '+k},pct=n=>$('prog').style.width=Math.max(0,Math.min(100,n))+'%',fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'—';
$('choose').onclick=()=>f.click();$('drop').onclick=e=>{if(e.target.tagName!=='BUTTON')f.click()};$('drop').ondragover=e=>{e.preventDefault();$('drop').style.borderColor='#24d6b5'};$('drop').ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0]);$('drop').style.borderColor=''};
f.onchange=()=>{if(f.files[0])load(f.files[0]);f.value=''};
function clear(){frames.forEach(c=>{c.width=0;c.height=0});frames=[];if(out)URL.revokeObjectURL(out);out=null;$('dw').classList.add('hidden')}
function load(file){if(!file.type.startsWith('video/'))return say('動画ファイルを選択してください。','error');if(url)URL.revokeObjectURL(url);clear();v.src='';url=URL.createObjectURL(file);v.src=url;$('vp').classList.remove('hidden');$('ep').classList.remove('hidden');$('make').disabled=true;say('動画情報を読み込み中…');v.onloadedmetadata=()=>{$('meta').textContent=file.name+' · '+fmt(v.duration)+' · '+v.videoWidth+'×'+v.videoHeight;$('make').disabled=false;say('準備完了。逆再生動画を作成できます。','good')};v.onerror=()=>say('この動画形式は読み込めませんでした。別の動画で試してください。','error')}
$('normal').onclick=()=>{$('pc').classList.add('hidden');v.classList.remove('hidden');v.currentTime=0;v.play();say('通常再生中','good')};
function seek(t){return new Promise((resolve,reject)=>{let done=false;const cleanup=()=>{v.removeEventListener('seeked',ok);v.removeEventListener('error',bad)};const ok=()=>{if(done)return;done=true;cleanup();resolve()};const bad=()=>{if(done)return;done=true;cleanup();reject(Error('動画フレームを読み込めません'))};v.addEventListener('seeked',ok);v.addEventListener('error',bad);v.currentTime=Math.min(Math.max(0,t),Math.max(0,v.duration-.001));if(v.readyState>=2&&Math.abs(v.currentTime-t)<.0005)ok()})}
async function capture(){clear();const count=Math.ceil(v.duration*12);if(!Number.isFinite(count)||count<1)throw Error('動画の長さを確認できません');if(count>1200)throw Error('動画が長すぎます。100秒以下の動画で試してください。');const scale=Math.min(1,960/v.videoWidth,540/v.videoHeight),w=Math.max(1,Math.round(v.videoWidth*scale)),h=Math.max(1,Math.round(v.videoHeight*scale));for(let i=0;i<count;i++){if(cancel)throw Error('処理を中止しました');await seek(i/12);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(v,0,0,w,h);frames.push(c);pct((i+1)/count*35);say('フレーム読み込み中… '+(i+1)+'/'+count)}return frames}
$('prev').onclick=async()=>{cancel=false;$('prev').disabled=true;$('make').disabled=true;try{const list=await capture(),pc=$('pc'),ctx=pc.getContext('2d');pc.width=list[0].width;pc.height=list[0].height;pc.classList.remove('hidden');v.classList.add('hidden');let i=list.length-1;const draw=()=>{if(i<0){say('逆再生プレビュー終了','good');list.forEach(c=>{c.width=0;c.height=0});frames=[];pc.classList.add('hidden');v.classList.remove('hidden');return}ctx.drawImage(list[i--],0,0);requestAnimationFrame(draw)};say('逆再生プレビュー中（無音）','good');draw()}catch(e){say(e.message,'error')}finally{$('prev').disabled=false;$('make').disabled=false}};
$('make').onclick=async()=>{if(busy)return;busy=true;cancel=false;$('make').disabled=true;$('prev').disabled=true;$('cancel').classList.remove('hidden');try{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw Error('動画書き出しに非対応です。最新版のChromeまたはEdgeで試してください。');const list=await capture();if(cancel)throw Error('処理を中止しました');const c=document.createElement('canvas');c.width=list[0].width;c.height=list[0].height;const ctx=c.getContext('2d'),stream=c.captureStream(12);let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2500000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise((res,rej)=>{rec.onstop=res;rec.onerror=()=>rej(Error('書き出しに失敗しました'))});rec.start(250);for(let i=list.length-1;i>=0;i--){if(cancel){rec.stop();await done;throw Error('処理を中止しました')}ctx.drawImage(list[i],0,0);pct(35+(list.length-i)/list.length*65);say('逆順に書き出し中… '+(list.length-i)+'/'+list.length);await new Promise(r=>setTimeout(r,1000/12))}await new Promise(r=>setTimeout(r,150));rec.stop();await done;stream.getTracks().forEach(t=>t.stop());if(cancel)throw Error('処理を中止しました');out=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('dl').href=out;$('dl').download=(f.files[0]?.name||'video').replace(/\.[^.]+$/,'')+'-reverse.webm';$('dw').classList.remove('hidden');say('完成！ '+(new Blob(chunks).size/1048576).toFixed(1)+' MB。音声は含まれません。','good')}catch(e){say(e.message||'エラーが発生しました','error')}finally{frames.forEach(c=>{c.width=0;c.height=0});frames=[];busy=false;$('make').disabled=false;$('prev').disabled=false;$('cancel').classList.add('hidden')}}
$('cancel').onclick=()=>{cancel=true;say('中止しています…')};window.addEventListener('beforeunload',()=>{if(url)URL.revokeObjectURL(url);if(out)URL.revokeObjectURL(out)});
})();
</script></body></html>
